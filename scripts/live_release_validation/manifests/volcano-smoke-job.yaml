apiVersion: batch/v1
kind: Job
metadata:
  name: gco-live-volcano-__RUN_TOKEN__
  namespace: gco-jobs
  annotations:
    # The cluster-managed gco-jobs/default-deny-ingress policy selects all pods.
    checkov.io/skip1: CKV2_K8S_6=Protected by the cluster-managed gco-jobs default-deny-ingress NetworkPolicy
  labels:
    app.kubernetes.io/name: gco-live-release-validation
    gco.aws/validation-run: __RUN_TOKEN__
    gco.aws/validation-path: volcano
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  # Two pods so Volcano's gang plugin admits a real (if small) group; the
  # default scheduler ignores pods whose schedulerName it does not own, so
  # completion is itself proof that the Volcano scheduler bound these pods.
  completions: 2
  parallelism: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gco-live-release-validation
        gco.aws/validation-run: __RUN_TOKEN__
        gco.aws/validation-path: volcano
    spec:
      schedulerName: volcano
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          # BusyBox 1.38.0 multi-platform index from the official Docker Hub tag API:
          # https://hub.docker.com/v2/repositories/library/busybox/tags/1.38.0
          image: docker.io/library/busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo GCO_LIVE_VOLCANO___RUN_TOKEN__"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
