apiVersion: batch/v1
kind: Job
metadata:
  name: gco-live-sqs-__RUN_TOKEN__
  namespace: gco-jobs
  annotations:
    # The cluster-managed gco-jobs/default-deny-ingress policy selects all pods.
    checkov.io/skip1: CKV2_K8S_6=Protected by the cluster-managed gco-jobs default-deny-ingress NetworkPolicy
  labels:
    app.kubernetes.io/name: gco-live-release-validation
    gco.aws/validation-run: __RUN_TOKEN__
    gco.aws/validation-path: sqs
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gco-live-release-validation
        gco.aws/validation-run: __RUN_TOKEN__
        gco.aws/validation-path: sqs
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          # BusyBox 1.38.0 multi-platform index from the official Docker Hub tag API:
          # https://hub.docker.com/v2/repositories/library/busybox/tags/1.38.0
          image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo GCO_LIVE_SQS___RUN_TOKEN__"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
