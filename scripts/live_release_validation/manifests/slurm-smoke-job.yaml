apiVersion: batch/v1
kind: Job
metadata:
  name: gco-live-slurm-__RUN_TOKEN__
  namespace: gco-jobs
  annotations:
    # The cluster-managed gco-jobs/default-deny-ingress policy selects all pods.
    checkov.io/skip1: CKV2_K8S_6=Protected by the cluster-managed gco-jobs default-deny-ingress NetworkPolicy
  labels:
    app.kubernetes.io/name: gco-live-release-validation
    gco.aws/validation-run: __RUN_TOKEN__
    gco.aws/validation-path: slurm
spec:
  backoffLimit: 0
  # A node drain is not a workload failure. EKS Auto Mode consolidates nodes
  # while the harness runs (the inference matrix leaves spare capacity behind
  # it), and a pod evicted through the Eviction API carries the
  # DisruptionTarget condition; with a zero backoff limit that eviction alone
  # failed the Job even though the container had already exited 0. Let the
  # Job replace a disrupted pod instead — a real non-zero exit still fails it
  # on the spot.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gco-live-release-validation
        gco.aws/validation-run: __RUN_TOKEN__
        gco.aws/validation-path: slurm
        # Grants NetworkPolicy access to the Slurm REST API port (see
        # allow-slurm-client-* in post-helm-slurm-network.yaml).
        gco.aws/slurm-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          # Python 3.14.7-slim multi-platform index from the official Docker Hub tag API:
          # https://hub.docker.com/v2/repositories/library/python/tags/3.14.7-slim
          image: docker.io/library/python:3.14.8-slim@sha256:f85c5697265c178cc6887276c55fe16cf3d14ca35c3df6a5eab3b360534a55d2
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c"]
          args:
            - |
              # Strict Slurm REST probe: submit a real batch job through the
              # Slinky slurmrestd Service, require COMPLETED, then require
              # slurmdbd to have recorded it with its comment. Any failure
              # exits nonzero so the validation Job fails; the marker prints
              # only after Slurm itself ran the work to completion.
              import json, sys, time
              import urllib.error, urllib.request
              RESTAPI = "http://slinky-slurm-restapi.gco-jobs.svc.cluster.local:6820"
              API_VER = "v0.0.44"
              # The credential is the client token the slurm-operator mints
              # and rotates for in-cluster clients (Secret
              # slinky-slurm-client-token, from the Token in
              # post-helm-slurm-api-access.yaml). The probe never sees the
              # cluster's JWT signing key; re-reading the projected file on
              # every call picks up a rotation mid-run.
              def token() -> str:
                  with open("/etc/slurm-client/auth-token") as handle:
                      return handle.read().strip()
              def api_call(path, data=None, method="GET", base="slurm"):
                  request = urllib.request.Request(
                      f"{RESTAPI}/{base}/{API_VER}/{path}",
                      data=data,
                      headers={
                          "X-SLURM-USER-NAME": "slurm",
                          "X-SLURM-USER-TOKEN": token(),
                          "Content-Type": "application/json",
                      },
                      method=method,
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read())
                  if payload.get("errors"):
                      raise RuntimeError(f"{path}: {payload['errors']}")
                  return payload
              def fail(message: str) -> None:
                  print(f"SLURM PROBE FAILED: {message}")
                  sys.exit(1)
              submission = json.dumps({
                  "job": {
                      "name": "gco-live-validation",
                      # The slurm user's home on the shared filesystem: the
                      # default working directory of API submissions, so the
                      # probe also proves the worker mounts it.
                      "current_working_directory": "/home/slurm",
                      "environment": ["PATH=/usr/local/bin:/usr/bin:/bin"],
                      "time_limit": {"set": True, "number": 10},
                      "comment": "gco:live-release-validation",
                  },
                  "script": "#!/bin/bash\nhostname\necho slurm-ran-this\n",
              }).encode()
              # Fresh clusters take a while to register slurmd nodes; retry the
              # submission window before declaring the control plane unreachable.
              job_id = None
              submit_error = "no submission attempted"
              for attempt in range(10):
                  try:
                      result = api_call("job/submit", data=submission, method="POST")
                      job_id = result.get("job_id")
                      if job_id:
                          break
                      submit_error = f"submit response missing job_id: {result}"
                  except Exception as exc:  # noqa: BLE001 - report the last failure
                      submit_error = str(exc)
                  time.sleep(30)
              if not job_id:
                  fail(f"job submission never succeeded: {submit_error}")
              print(f"submitted slurm job {job_id}")
              # The default partition scales from zero: KEDA adds a worker and
              # Karpenter provisions its node first. Allow the queue that time.
              state: list = []
              deadline = time.time() + 720
              while time.time() < deadline:
                  time.sleep(10)
                  try:
                      status = api_call(f"job/{job_id}")
                  except Exception:  # noqa: BLE001 - transient poll errors are retried
                      continue
                  jobs = status.get("jobs", [])
                  state = jobs[0].get("job_state", []) if jobs else []
                  if any(terminal in state for terminal in ("COMPLETED", "FAILED", "CANCELLED", "TIMEOUT")):
                      break
              if "COMPLETED" not in state:
                  fail(f"slurm job {job_id} finished in state {state or 'unknown'}")
              print(f"slurm job {job_id} COMPLETED")
              # Accounting (on by default) must hold the record with its
              # comment intact: gco slurm accounting and the GCO API's caller
              # attribution both rest on that.
              record = None
              for attempt in range(12):
                  try:
                      rows = api_call("jobs", base="slurmdb").get("jobs", [])
                  except Exception:  # noqa: BLE001 - slurmdbd may lag the controller
                      rows = []
                  record = next((row for row in rows if row.get("job_id") == job_id), None)
                  if record and "COMPLETED" in record.get("state", {}).get("current", []):
                      break
                  time.sleep(5)
              if record is None:
                  fail(f"slurm job {job_id} has no accounting record")
              comment = record.get("comment", {}).get("job")
              if comment != "gco:live-release-validation":
                  fail(f"slurm job {job_id} accounting comment is {comment!r}")
              print(f"slurm job {job_id} accounted (comment {comment!r})")
              print("GCO_LIVE_SLURM___RUN_TOKEN__")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: slurm-client-token
              mountPath: /etc/slurm-client
              readOnly: true
      volumes:
        - name: slurm-client-token
          secret:
            secretName: slinky-slurm-client-token
