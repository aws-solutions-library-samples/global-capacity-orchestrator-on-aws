apiVersion: batch/v1
kind: Job
metadata:
  # The network-posture action re-names and re-namespaces this Job per target
  # (one listener in gco-system, one in gco-jobs); the file fixes the pod shape.
  name: gco-live-netpol-target-__RUN_TOKEN__
  namespace: gco-jobs
  annotations:
    # The listener exists to be selected by the cluster-managed default-deny
    # policies; whether they admit or refuse a client is the verdict under test.
    checkov.io/skip1: CKV2_K8S_6=Protected by the cluster-managed default-deny-ingress NetworkPolicy
  labels:
    app.kubernetes.io/name: gco-live-release-validation
    gco.aws/validation-run: __RUN_TOKEN__
    gco.aws/validation-path: network-posture
spec:
  backoffLimit: 0
  # Safety nets for a harness that dies mid-run: the listener is killed after
  # 30 minutes and the Job is garbage-collected 10 minutes later.
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gco-live-release-validation
        gco.aws/validation-run: __RUN_TOKEN__
        gco.aws/validation-path: network-posture
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: listener
          # BusyBox 1.38.0 multi-platform index from the official Docker Hub tag API:
          # https://hub.docker.com/v2/repositories/library/busybox/tags/1.38.0
          image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          # A static one-line document behind BusyBox httpd on the port every
          # probe dials. The root filesystem is read-only, so the document lives
          # on the emptyDir below.
          command:
            - sh
            - -c
            - printf 'netpol-target-ready\n' > /www/index.html && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Loopback, not an httpGet from the kubelet: a node-originated probe
          # would itself be subject to the policy under test, and a target that
          # never turns Ready would look exactly like a broken listener.
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "-T", "2", "http://127.0.0.1:8080/"]
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: www
              mountPath: /www
      volumes:
        - name: www
          emptyDir:
            sizeLimit: 1Mi
