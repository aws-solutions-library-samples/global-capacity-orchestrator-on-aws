# GCO (Global Capacity Orchestrator on AWS) - Python Project Configuration

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli", "cli.*", "gco", "gco.*", "gco_mcp", "gco_mcp.*"]
# gco_mcp ships as a PEP 420 namespace package (no root __init__.py) so its
# modules import each other bare (e.g. `from server import mcp`) off sys.path,
# exactly as they did under the old mcp/ name; namespaces=true lets find()
# still discover and package it.
namespaces = true

[tool.setuptools.data-files]
"share/gco" = ["cdk.json"]

[tool.setuptools.dynamic]
version = {attr = "gco._version.__version__"}

[project]
name = "gco-cli"
dynamic = ["version"]
description = "CLI for managing GCO multi-region EKS clusters"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [
    {name = "Jacob Mevorach (@Jmevorach)"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "boto3==1.43.38",
    "click==8.4.2",
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "constructs==10.6.0",
    "kubernetes==36.0.2",
    "fastapi==0.138.2",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "prometheus-client==0.25.0",
    "httpx==0.28.1",
    "urllib3==2.7.0",
    # FastMCP powers the in-tree MCP server (gco_mcp/run_mcp.py). The ``tasks``
    # extra pulls in the protocol-native background task support
    # (SEP-1686) used by the long-running stack lifecycle and image
    # build/push tools. The ``code-mode`` extra pulls in the
    # ``fastmcp.experimental.transforms.code_mode`` dependencies (the
    # MontySandboxProvider runtime + the GetTags/Search/GetSchemas
    # discovery tools) used when GCO_MCP_TOOL_SEARCH=code_mode.
    "fastmcp[tasks,code-mode]==3.4.2",
    # BM25 ranking backend for FastMCP's tool-search transform when
    # GCO_MCP_TOOL_SEARCH=bm25.
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
cdk = [
    "aws-cdk-lib==2.260.0",
    "cdk-nag==3.0.1",
    "constructs==10.6.0",
]
diagrams = [
    # Dependencies for ``diagrams/code_diagrams/generate.py``. Pinned to
    # match the reproducibility policy used by the rest of this project.
    # ``pyflowchart`` turns Python source into flowchart.js DSL; we emit
    # interactive HTML via its ``output_html`` helper. ``playwright``
    # drives a headless Chromium to rasterise each flowchart.js SVG to
    # a PNG — run ``playwright install chromium`` once to fetch the
    # browser binary. ``ruff`` is invoked by the generator's marker
    # inserter to normalise whitespace around the injected
    # ``# Flowchart:`` comment block so the result is formatter-stable
    # under ``ruff format --check`` (kept at the same pin as the
    # ``lint`` extra to avoid version-drift between the generator and
    # the CI lint gate).
    "pyflowchart==0.6.0",
    "playwright==1.60.0",
    "ruff==0.15.21",
]
# Direct runtime roots for the five production service images. Their Dockerfiles
# read exactly one group with Python 3.14's tomllib and use requirements-lock.txt
# only as the shared transitive constraint; they never install the project extra.
image-health-monitor = [
    "boto3==1.43.38",
    "botocore==1.43.38",
    "fastapi==0.138.2",
    "httpx==0.28.1",
    "kubernetes==36.0.2",
    "prometheus-client==0.25.0",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
]
image-manifest-processor = [
    "boto3==1.43.38",
    "botocore==1.43.38",
    "fastapi==0.138.2",
    "httpx==0.28.1",
    "kubernetes==36.0.2",
    "prometheus-client==0.25.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
]
image-inference-proxy = [
    "boto3==1.43.38",
    "botocore==1.43.38",
    "fastapi==0.138.2",
    "httpx==0.28.1",
    "prometheus-client==0.25.0",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
]
image-inference-monitor = [
    "boto3==1.43.38",
    "botocore==1.43.38",
    "kubernetes==36.0.2",
    "prometheus-client==0.25.0",
    "pyyaml==6.0.3",
]
image-queue-processor = [
    "boto3==1.43.38",
    "kubernetes==36.0.2",
    "pyyaml==6.0.3",
]
# Optional metric-reader file formats. The readers in
# gco_mcp/metric_readers/files.py lazy-import these and, when they are
# absent, return a FORMAT_DEPENDENCY_UNAVAILABLE envelope instead of
# crashing -- so they are deliberately opt-in, NOT base dependencies.
# Install only the format(s) you actually read.
metrics-parquet = [
    # Parquet metric files (pandas.read_parquet + its pyarrow engine).
    "pandas==3.0.3",
    "pyarrow==25.0.0",
]
metrics-tfevents = [
    # TensorBoard ``tfevents`` metric files. ``tbparse`` pulls in
    # ``tensorboard`` (grpcio / protobuf / werkzeug / pillow / ...), a large
    # transitive tree kept out of the base install and the lighter
    # ``metrics-parquet`` extra on purpose.
    "tbparse==0.0.9",
]
metrics = [
    # Umbrella: every optional metric-reader file format at once.
    "gco-cli[metrics-parquet,metrics-tfevents]",
]
mcp = [
    # Kept as an alias of the base ``fastmcp[tasks,code-mode]`` dependency
    # so the documented ``pip install -e ".[mcp]"`` install path keeps
    # working. Pinned to match the base ``dependencies`` entry exactly to
    # avoid resolver thrash.
    "fastmcp[tasks,code-mode]==3.4.2",
]
lint = [
    "ruff==0.15.21",
    "yamllint==1.38.0",
]
typecheck = [
    "mypy==2.1.0",
    "types-requests==2.33.0.20260518",
    "types-PyYAML==6.0.12.20260518",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist[psutil]==3.8.0",
    "moto==5.2.2",
    # moto==5.1.22 lazy-imports its API Gateway backend whenever
    # ``cloudformation.create_stack`` is called (even if the stack template
    # contains no API Gateway resources), and that backend requires
    # ``openapi-spec-validator``. The dependency is declared as "optional"
    # by moto and is not pulled in by ``moto==5.1.22`` alone, so CI
    # environments that install only the core moto wheel blow up with
    # ``ModuleNotFoundError: openapi_spec_validator`` the first time a
    # test seeds a CloudFormation stack for output discovery. Pinning it
    # explicitly keeps test environments reproducible.
    "openapi-spec-validator==0.9.0",
    "hypothesis==6.155.7",
]
security = [
    "bandit==1.9.4",
    "pip-tools==7.5.3",
]
dev = [
    "gco-cli[cdk,diagrams,lint,typecheck,test,security]",
    "pre-commit==4.6.0",
]

[project.scripts]
gco = "cli.main:main"
# MCP server entry point (launches the in-tree gco_mcp/run_mcp.py, shipped as gco_mcp)
# so the server can be installed straight from a Git tag with uv/uvx.
gco-mcp = "gco_mcp.run_mcp:main"

[project.urls]
Documentation = "https://github.com/awslabs/global-capacity-orchestrator-on-aws/blob/main/docs/CLI.md"
Repository = "https://github.com/awslabs/global-capacity-orchestrator-on-aws"

# =============================================================================
# Tool Configurations
# =============================================================================

# Ruff handles both formatting (``ruff format``) and linting, covering
# pycodestyle, Pyflakes, bugbear, comprehensions, pyupgrade, simplify,
# and isort-style import sorting via the rule selectors below.

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "cdk.out",
    "dist",
    "build",
    "lambda/kubectl-applier-simple-build",
    "lambda/helm-installer-build",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
    "ARG002", # unused method argument
]

[tool.ruff.lint.isort]
known-first-party = ["gco", "cli"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"lambda/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
# --strict equivalent: every option enabled except "warn_unreachable" which has
# false positives on platform-conditional branches. Keep these in sync with CI.
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_redundant_casts = true
warn_unused_ignores = true
# Ignore missing imports from untyped third-party libraries (boto3, kubernetes,
# aws_cdk, etc. don't ship type stubs we can rely on). This is NOT a license
# to skip annotating our own code — it only suppresses errors from imports.
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]
exclude = [
    "cdk\\.out",
    "\\.venv",
    "dist",
    "build",
    "lambda/kubectl-applier-simple-build",
    "lambda/helm-installer-build",
    "scripts/mcp_install_smoke\\.py",
]

# gco/stacks/ is type-checked separately by lint:mypy:stacks (with CDK
# installed). When the strict job runs without CDK, aws_cdk.Stack resolves
# to Any, which triggers disallow_subclassing_any, and the type: ignore
# comments that suppress Cluster→ICluster mismatches become "unused"
# because the types are all Any. Relaxing these two flags here avoids
# false positives in the strict job while the stacks job still enforces
# them with real CDK stubs.
[[tool.mypy.overrides]]
module = "gco.stacks.*"
disallow_subclassing_any = false
warn_unused_ignores = false

# Tests can use looser rules — the test runner resolves fixtures at runtime so
# `disallow_untyped_defs` creates too much noise for little real-world benefit.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = true

[tool.pytest.ini_options]
# Single source of truth for pytest configuration. This block previously
# coexisted with a top-level pytest.ini, which took precedence and caused the
# two to silently drift (pytest printed "ignoring pytest config in
# pyproject.toml"). pytest.ini has been removed and its settings merged here.
minversion = "7.0"
# -v + short tracebacks match the prior effective (pytest.ini) behavior;
# --strict-markers turns a typo'd/unregistered marker into an error instead of
# a silent skip (every marker used in the suite is registered below).
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Async tests run under pytest-asyncio's auto mode — an async def test_* needs
# no explicit marker. Required by the ~400 async tests in the suite.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as async (pytest-asyncio auto mode)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mission_e2e: mark test as a Mission end-to-end test (full session through the engine)",
    "mooncake_image: Mooncake vLLM image contract test (opt-in via GCO_MOONCAKE_IMAGE_TEST=1; pulls/runs the ~9GB image)",
    "helm_online: Helm chart resolve/render check (opt-in via GCO_HELM_CHART_VALIDATION=1; needs helm + network)",
    "kubeconform_online: K8s manifest schema validation (opt-in via GCO_KUBECONFORM_VALIDATION=1; needs kubeconform + network)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["gco", "cli", "gco_mcp"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/cdk.out/*",
    "*/.venv/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
fail_under = 90
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", "cdk.out", ".venv"]
skips = ["B101", "B104", "B113", "B311"]
# B101: assert used in tests and CDK constructs (harmless)
# B104: bind to 0.0.0.0 required for container services
# B113: false positives on dict.get() calls named "requests" (all HTTP calls have timeouts)
# B311: random not used for security purposes
