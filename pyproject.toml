# =============================================================================
# Tool Configurations
# =============================================================================

# Ruff handles both formatting (``ruff format``) and linting, covering
# pycodestyle, Pyflakes, bugbear, comprehensions, pyupgrade, simplify,
# and isort-style import sorting via the rule selectors below.

[tool.ruff]
line-length = 100
target-version = "py314"
# CI runs ``ruff check .`` / ``ruff format --check .`` from the repository
# root, so every Python file we author is linted (app.py, .github/, diagrams/,
# dockerfiles/, docs/client-examples/, lambda/, scripts/, ...). Generated and
# vendored trees are excluded here, in one place, rather than by hand-listing
# source directories in the workflow.
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".worktrees",
    "__pycache__",
    "cdk.out",
    "dist",
    "build",
    "lambda/kubectl-applier-simple-build",
    "lambda/helm-installer-build",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    # Rules whose whole value is that they are boring: each one catches a
    # specific mistake that is invisible in review and cheap to prevent.
    "T10",    # flake8-debugger: a forgotten breakpoint() would hang CI
    "PGH",    # pygrep-hooks: blanket `# type: ignore` / `# noqa` with no code
    "YTT",    # flake8-2020: version checks that break on Python 3.10+/4.x
    "PLE",    # Pylint errors: only the genuinely-broken subset
    "LOG",    # flake8-logging: misuse of the logging API itself
    "EXE",    # flake8-executable: a shebang that cannot be executed
    "PIE",    # flake8-pie: dead placeholders and reimplemented builtins
    "RUF",    # Ruff's own rules, incl. RUF100: a `# noqa` that suppresses nothing
    # Test-quality rules. PT011/PT012/PT017 are the ones with teeth: a broad
    # `pytest.raises(ValueError)` passes on the wrong ValueError, a multi-line
    # raises block passes when the *setup* raises, and `assert` inside `except`
    # passes when nothing is raised at all.
    "PT",     # flake8-pytest-style
    "PLW1510",  # subprocess.run without an explicit check= (say which you meant)
    "PLW2901",  # loop variable overwritten inside the loop
    # Naive datetimes mean "whatever zone this process happens to run in"; the
    # services stamp records that cross regions and containers, so every
    # datetime carries a tzinfo. A test that needs a naive value to exercise a
    # naive-input branch says so with a per-line noqa.
    "DTZ",    # flake8-datetimez
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    # `assert a and b` is one assertion of one invariant; pytest's assertion
    # rewriting already shows which operand was false, so splitting it buys
    # nothing and doubles the assertion count on ~280 sites.
    "PT018",
]
# Typography this project uses on purpose in prose, plus one glyph it prints.
# RUF001-003 exist to catch a homoglyph smuggled into an identifier or a string
# comparison; an en dash in a sentence, a multiplication sign in
# "3 × g5.4xlarge", and the ℹ prefix on informational CLI lines are none of
# those. Every other confusable stays reported.
allowed-confusables = ["–", "×", "ℹ"]

[tool.ruff.lint.isort]
known-first-party = ["gco", "cli"]

[tool.ruff.lint.per-file-ignores]
# RUF012 (mutable class default) guards production classes against shared
# state between instances. Test classes are pytest containers that are never
# instantiated twice, and their class-level fixtures/tables are the readable
# way to share data between cases, so the rule is noise there. S101 (assert)
# is not in the enabled set, so it needs no exemption.
"tests/*" = ["ARG", "RUF012"]
"lambda/*" = ["ARG"]

[tool.mypy]
python_version = "3.14"
# --strict plus warn_unreachable. Keep these in sync with CI.
#
# warn_unreachable fails the build on code the types say can never run: a
# guard on a value whose type rules the guarded case out, an `or {}` fallback
# on a value that is always truthy, a branch after an always-taken return.
# Each is either dead code or a type annotation that is lying about what the
# function accepts; both are worth a build break. Platform-conditional code is
# exempt as long as it is written as `if sys.platform ...: ... else: ...`
# (mypy skips the branch that does not apply to the checking platform without
# calling it unreachable); only code *after* a platform-conditional return is
# flagged. A check that mypy genuinely cannot model, such as a flag another
# task flips while this one awaits, carries a per-line
# `# type: ignore[unreachable]` that says so.
warn_unreachable = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_redundant_casts = true
warn_unused_ignores = true
# gco_mcp ships as a PEP 420 namespace package whose modules import each other
# bare off sys.path (`from server import mcp`, `from mission.state import ...`),
# so `mission`, `server`, and `cli_runner` are top-level modules that only
# resolve when gco_mcp/ is on the search path. Without this, the result of a
# mypy run depends on which paths you pass it: CI's
# `mypy gco/ cli/ gco_mcp/ scripts/` resolves them to real types and is clean,
# while a narrower `mypy cli/` leaves them Any and reports four *spurious*
# unused-ignore/no-any-return errors in cli/commands/swarm_cmd.py — whose
# `type: ignore[arg-type]` comments are in fact required. Pinning the path here
# makes every invocation agree with CI, so nobody "fixes" a real suppression
# and breaks the build.
mypy_path = "gco_mcp"
# Ignore missing imports from untyped third-party libraries (boto3, kubernetes,
# aws_cdk, etc. don't ship type stubs we can rely on). This is NOT a license
# to skip annotating our own code — it only suppresses errors from imports.
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]
exclude = [
    "cdk\\.out",
    "\\.venv",
    "\\.worktrees",
    "dist",
    "build",
    "lambda/kubectl-applier-simple-build",
    "lambda/helm-installer-build",
]

# gco_mcp is checked under its bare on-disk module names (see mypy_path above).
# scripts/mcp_install_smoke.py deliberately imports the *installed* package by
# its dotted name (`import gco_mcp.cli_runner`) — that is the whole point of
# the smoke test. Following that spelling would load the same files a second
# time under a second name and abort with "Source file found twice under
# different module names", so the dotted spelling is treated as opaque here;
# the modules themselves are still fully checked via their bare names.
[[tool.mypy.overrides]]
module = "gco_mcp.*"
follow_imports = "skip"

# gco/stacks/ is type-checked separately by lint:mypy:stacks (with CDK
# installed). When the strict job runs without CDK, aws_cdk.Stack resolves
# to Any, which triggers disallow_subclassing_any, and the type: ignore
# comments that suppress Cluster→ICluster mismatches become "unused"
# because the types are all Any. Relaxing these two flags here avoids
# false positives in the strict job while the stacks job still enforces
# them with real CDK stubs.
[[tool.mypy.overrides]]
module = "gco.stacks.*"
disallow_subclassing_any = false
warn_unused_ignores = false

# Tests can use looser rules — the test runner resolves fixtures at runtime so
# `disallow_untyped_defs` creates too much noise for little real-world benefit.
#
# This override IS live, despite appearances. No mypy job passes tests/ on the
# command line, so a narrow run like `mypy cli/` reports it as an unused section
# — but lint:mypy:strict reaches test modules by following imports out of the
# packages it does check, and without this it fails on them (e.g.
# tests/test_nag_compliance.py under disallow_untyped_decorators). Do not delete
# it on the strength of that note: confirm against the real CI command,
# `mypy gco/ cli/ gco_mcp/ scripts/ --exclude 'gco/stacks/'`, which does not
# report the section as unused. Typechecking tests/ wholesale is a separate
# project — it currently reports ~3.3k errors across 229 modules.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = true

[tool.pytest.ini_options]
# Single source of truth for pytest configuration. This block previously
# coexisted with a top-level pytest.ini, which took precedence and caused the
# two to silently drift (pytest printed "ignoring pytest config in
# pyproject.toml"). pytest.ini has been removed and its settings merged here.
minversion = "7.0"
# -v + short tracebacks match the prior effective (pytest.ini) behavior;
# --strict-markers turns a typo'd/unregistered marker into an error instead of
# a silent skip (every marker used in the suite is registered below);
# --strict-config does the same for this block, so a misspelled option here
# fails the run instead of being ignored.
addopts = "-v --tb=short --strict-markers --strict-config"
# An xfail that starts passing is news: either the bug it tracked is fixed and
# the marker must go, or the test no longer exercises the bug. Fail the run
# rather than reporting XPASS and moving on. (The suite currently carries no
# xfails; this is the fence for the first one.)
xfail_strict = true
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Async tests run under pytest-asyncio's auto mode — an async def test_* needs
# no explicit marker. Required by the ~400 async tests in the suite.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as async (pytest-asyncio auto mode)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mission_e2e: mark test as a Mission end-to-end test (full session through the engine)",
    "floci: Floci emulated-AWS integration test (opt-in via GCO_FLOCI_ENDPOINT=http://127.0.0.1:4566; see docs/FLOCI_TESTING.md)",
    "mooncake_image: Mooncake vLLM image contract test (opt-in via GCO_MOONCAKE_IMAGE_TEST=1; pulls/runs the ~9GB image)",
    "helm_online: Helm chart resolve/render check (opt-in via GCO_HELM_CHART_VALIDATION=1; needs helm + network)",
    "kubeconform_online: K8s manifest schema validation (opt-in via GCO_KUBECONFORM_VALIDATION=1; needs kubeconform + network)",
]
# Deprecation warnings fail the test that raised them. A DeprecationWarning is
# a library telling us an API we call is going away; ignoring the whole
# category (the previous setting) meant the first place it got noticed was the
# upgrade that removed the API. Two were hiding under the old blanket ignore:
# botocore's internal endpoint-resolver component fetched via get_component()
# (cli/_image_uri.py, cli/aws_client.py) and class-scoped fixtures defined as
# instance methods (PytestRemovedIn10Warning, twelve test classes). Both are
# fixed; the filter keeps the next one from hiding. Third-party warnings that
# are not ours to fix go below as narrow ignores — match on message and
# module, never the bare category — with a note on where upstream stands.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # fastmcp 4.0.x still sends MCP log notifications through the SDK's
    # deprecated logging capability (SEP-2577) "per compat directive"; the
    # warning is raised inside fastmcp, and ctx.info()/ctx.debug() callers
    # cannot avoid it. UserWarning subclass, so it never failed a test; the
    # ignore keeps the summary clean so a new warning stands out.
    "ignore:The logging capability is deprecated:mcp.shared.exceptions.MCPDeprecationWarning",
]

[tool.coverage.run]
# Every Python file we author is measured — application packages (gco/, cli/,
# gco_mcp/), the CDK entry point (app.py), Lambda handlers (lambda/), repo
# tooling (scripts/, diagrams/, dockerfiles/, .github/) and the client
# examples under docs/. Measuring the repository root (rather than a hand-kept
# package list) means a new directory is covered by default instead of
# silently escaping the 100% floor; anything that must not count is spelled
# out in ``omit`` below. CI passes a bare ``--cov`` so pytest-cov inherits this
# list rather than overriding it.
source = ["."]
branch = true
omit = [
    # The test-suite measures; it is not measured.
    "tests/*",
    "*/tests/*",
    # Package markers carry no logic.
    "*/__init__.py",
    # Generated trees, vendored wheels and third-party code that can appear
    # inside the checkout.
    "*/__pycache__/*",
    "cdk.out/*",
    "*/cdk.out/*",
    ".venv/*",
    "*/.venv/*",
    ".worktrees/*",
    "*/node_modules/*",
    "build/*",
    "dist/*",
    "htmlcov/*",
    "site/*",
    "lambda/*-build/*",
    # Byte-identical copies of the shared Lambda sources (kept in lockstep by
    # tests/test_lambda_shared_sources.py). Only the canonical file counts:
    # lambda/proxy-shared/proxy_utils.py and lambda/tls-shared/backend_tls.py.
    "lambda/api-gateway-proxy/backend_tls.py",
    "lambda/api-gateway-proxy/proxy_utils.py",
    "lambda/regional-api-proxy/backend_tls.py",
    "lambda/regional-api-proxy/proxy_utils.py",
    "lambda/proxy-shared/backend_tls.py",
    # Nothing else. Every authored Python file is at 100%, and
    # tests/test_coverage_omit_policy.py fails if an entry added here would
    # excuse a source file — that is how the floor stays a floor.
]

[tool.coverage.report]
precision = 2
# Lambda handlers (lambda/*/), .github/scripts/, dockerfiles/ and
# docs/client-examples/ have no __init__.py. Without this, coverage's
# unexecuted-file scan stops at any directory that is not a regular package,
# so a handler no test imports would be invisible and 0% would read as 100%.
include_namespace_packages = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
fail_under = 100
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
# CI runs ``bandit -r .`` so every authored Python file is scanned. bandit
# treats each entry as a *substring* of the scanned path (as well as a glob),
# so the patterns are anchored with slashes: "/tests/" skips the test-suite
# without also skipping scripts/split_tests.py.
exclude_dirs = [
    "/tests/",
    "/cdk.out/",
    "/.venv/",
    "/.worktrees/",
    "/node_modules/",
    "/htmlcov/",
    "/site/",
    "/build/",
    "/dist/",
    "/lambda/kubectl-applier-simple-build/",
    "/lambda/helm-installer-build/",
    "/lambda/inference-streaming-proxy-build/",
]
# CI runs at --severity-level low, so every finding bandit can raise fails
# the build unless the line carries a `# nosec Bxxx  # <why>` that names the
# rule and says why it does not apply. The second `#` matters: bandit reads
# every word after `nosec` up to the next `#` as a test name, so a reason
# written after a plain dash is parsed as ids and logged as noise. The low
# threshold is deliberate: a hard-coded credential or a shell=True call added
# tomorrow trips the gate on the first push instead of hiding below a
# threshold. The only rules skipped outright
# are the ones that fire on *every* use of a feature the project is built on
# (a CLI that orchestrates kubectl / helm / docker / the AWS CLI) and carry no
# signal of their own:
skips = ["B101", "B104", "B113", "B311", "B404", "B603", "B607"]
# B101: assert used in tests and CDK constructs (harmless)
# B104: bind to 0.0.0.0 required for container services
# B113: false positives on dict.get() calls named "requests" (all HTTP calls have timeouts)
# B311: random not used for security purposes
# B404: "consider the implications of importing subprocess" — every subprocess import
# B603: "subprocess call, check for untrusted input" — every argv-list call without a
#       shell. The dangerous variant, shell=True (B602), is NOT skipped.
# B607: "partial executable path" — running `kubectl` / `helm` from PATH is the
#       intended behaviour of a CLI; pinning absolute paths would break it.
