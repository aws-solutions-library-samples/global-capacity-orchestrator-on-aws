# GCO (Global Capacity Orchestrator on AWS) - Python Project Configuration

[build-system]
# The build backend is pinned exactly, like every other dependency in this
# file: with a floating ``>=`` the version resolved inside pip's build
# isolation changes whenever setuptools releases, so two builds of the same
# commit could package differently. The dependency scanner enforces the
# exact-pin shape and reports when a newer setuptools release is available
# (see extract_build_system_pins in .github/scripts/lib_dependency_scan.sh).
# ``wheel`` is deliberately NOT listed: setuptools >= 70.1 vendors its own
# wheel support, and the setuptools docs say not to declare it.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli", "cli.*", "gco", "gco.*", "gco_mcp", "gco_mcp.*"]
# gco_mcp ships as a PEP 420 namespace package (no root __init__.py) so its
# modules import each other bare (e.g. `from server import mcp`) off sys.path,
# exactly as they did under the old mcp/ name; namespaces=true lets find()
# still discover and package it.
namespaces = true

[tool.setuptools.data-files]
"share/gco" = ["cdk.json"]

[tool.setuptools.dynamic]
version = {attr = "gco._version.__version__"}

[project]
name = "gco-cli"
dynamic = ["version"]
description = "CLI for managing GCO multi-region EKS clusters"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [
    {name = "Jacob Mevorach (@Jmevorach)"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "boto3==1.43.93",
    "click==8.5.0",
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "constructs==10.8.1",
    "kubernetes==36.0.3",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "prometheus-client==0.26.0",
    "httpx==0.28.1",
    "urllib3==2.7.0",
    # FastMCP powers the in-tree MCP server (gco_mcp/run_mcp.py). The ``tasks``
    # extra pulls in ``fastmcp-tasks``, the io.modelcontextprotocol/tasks
    # extension (SEP-2663) used by the long-running stack lifecycle and image
    # build/push tools (registered via ``mcp.add_extension(TasksExtension())``
    # in gco_mcp/server.py). The ``code-mode`` extra pulls in the
    # ``fastmcp.experimental.transforms.code_mode`` dependencies (the
    # MontySandboxProvider runtime + the GetTags/Search/GetSchemas
    # discovery tools) used when GCO_MCP_TOOL_SEARCH=code_mode.
    "fastmcp[tasks,code-mode]==4.0.3",
    # BM25 ranking backend for FastMCP's tool-search transform when
    # GCO_MCP_TOOL_SEARCH=bm25.
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
cdk = [
    "aws-cdk-lib==2.269.0",
    "cdk-nag==3.0.2",
    "constructs==10.8.1",
]
diagrams = [
    # Dependencies for ``diagrams/code_diagrams/generate.py``. Pinned to
    # match the reproducibility policy used by the rest of this project.
    # ``pyflowchart`` turns Python source into flowchart.js DSL; we emit
    # interactive HTML via its ``output_html`` helper. ``playwright``
    # drives a headless Chromium to rasterise each flowchart.js SVG to
    # a PNG — run ``playwright install chromium`` once to fetch the
    # browser binary. ``ruff`` is invoked by the generator's marker
    # inserter to normalise whitespace around the injected
    # ``# Flowchart:`` comment block so the result is formatter-stable
    # under ``ruff format --check`` (kept at the same pin as the
    # ``lint`` extra to avoid version-drift between the generator and
    # the CI lint gate).
    "pyflowchart==0.6.0",
    "playwright==1.62.0",
    "ruff==0.16.7",
]
# Direct runtime roots for the six production service images. Their Dockerfiles
# read exactly one group with Python 3.14's tomllib and use requirements-lock.txt
# only as the shared transitive constraint; they never install the project extra.
