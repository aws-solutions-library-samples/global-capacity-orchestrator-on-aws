# =============================================================================
# mkdocs.yml — the GCO orientation wiki (GitHub Pages site root)
# =============================================================================
#
# Builds the wiki under wiki/ (plus the injected API spec sheets) into the site served at
# https://aws-solutions-library-samples.github.io/global-capacity-orchestrator-on-aws/. The wiki is
# an orientation and routing layer ABOVE the reference docs: pages summarize
# and link to README/docs/package READMEs on GitHub, never restate them
# (duplicated reference content rots; the deep docs carry the CI freshness
# guards). The coverage reports are NOT built here — pages.yml drops the
# three report trees into site/python-coverage/, site/bash-coverage/ and
# site/nodejs-coverage/ after this build, which is why the nav's "Coverage
# reports" entries are full external URLs rather than local pages.
#
# Constraints honored by this file (guarded by tests/test_wiki.py):
#   - yaml.safe_load-able: no custom YAML tags (guard tests read the nav
#     without importing MkDocs — rules out !!python/name: emoji config).
#   - Self-contained site: font: false keeps Material off Google Fonts; no
#     analytics, no external CSS/JS; search is the built-in client-side index.
#   - strict: true — broken links and nav entries fail every build (local,
#     lint:mkdocs:strict on PRs, and the pages.yml deploy).
#   - Images are served from the site itself: scripts/mkdocs_hooks.py injects
#     the tracked images/ directory as assets/images/ (no binary copies, no
#     raw.githubusercontent.com).
# =============================================================================

site_name: Global Capacity Orchestrator on AWS
site_description: >-
  Orientation wiki for GCO — intelligent global capacity orchestration for
  GPU/accelerated workloads on AWS.
site_url: https://aws-solutions-library-samples.github.io/global-capacity-orchestrator-on-aws/
repo_url: https://github.com/aws-solutions-library-samples/global-capacity-orchestrator-on-aws
repo_name: aws-solutions-library-samples/global-capacity-orchestrator-on-aws
edit_uri: ""

docs_dir: wiki
strict: true
# wiki/README.md documents the directory for contributors browsing GitHub
# (every page, and how the site is assembled and published). It is not a
# page: index.md is the home page, and MkDocs would otherwise treat the
# README.md/index.md pair as a conflict and fail the strict build.
# tests/test_wiki.py pins the exclusion and keeps the README out of the nav.
exclude_docs: |
  /README.md

theme:
  name: material
  # No Google Fonts fetch: the built site must make zero third-party
  # requests. Material falls back to a system font stack.
  font: false
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - toc.integrate
    - search.suggest

plugins:
  - search

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - For users:
      - Get started: get-started.md
      - Evaluating & deploying: evaluating-and-deploying.md
      - What you can run: what-you-can-run.md
  - For developers:
      - Repo tour: repo-tour.md
      - How we build & test: build-and-test.md
  - Contributing: contributing.md
  # The API spec sheets are generated by diagrams/api_specs/generate.py from
  # the committed OpenAPI documents (the FastAPI services' own exports, the two
  # API Gateway documents read out of the synthesized CDK stacks, and the
  # cluster gateway document composed from the HTTPRoute) and injected here as
  # api/<name>.md by scripts/mkdocs_hooks.py (README.md serves /api/ and embeds
  # the interaction diagram). The Swagger UI consoles are built into the Pages
  # artifact by pages.yml at /swagger/ — outside this build, hence the external URL.
  - API reference:
      - Overview: api/README.md
      - Global API Gateway: api/api-gateway-global.md
      - Regional API Gateway: api/api-gateway-regional.md
      - Cluster gateway (internal ALB): api/cluster-gateway.md
      - Manifest processor: api/manifest-processor.md
      - Health monitor: api/health-monitor.md
      - Inference proxy: api/inference-proxy.md
      - Cost monitor: api/cost-monitor.md
      - Swagger UI consoles: https://aws-solutions-library-samples.github.io/global-capacity-orchestrator-on-aws/swagger/
  # The coverage reports are merged into the Pages artifact by pages.yml at
  # /python-coverage/, /bash-coverage/ and /nodejs-coverage/ — outside this
  # MkDocs build — so the nav entries must be full external URLs (a local
  # path would trip strict link validation).
  - Coverage reports:
      - Python: https://aws-solutions-library-samples.github.io/global-capacity-orchestrator-on-aws/python-coverage/
      - Bash: https://aws-solutions-library-samples.github.io/global-capacity-orchestrator-on-aws/bash-coverage/
      - Node.js: https://aws-solutions-library-samples.github.io/global-capacity-orchestrator-on-aws/nodejs-coverage/
