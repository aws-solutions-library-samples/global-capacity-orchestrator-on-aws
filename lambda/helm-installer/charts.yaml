# Helm Charts Configuration for GCO
# This file defines the Helm charts to be installed by the helm-installer Lambda
#
# Charts are installed in the order they appear below.
#
# IMPORTANT: The "enabled" flag in each chart below is the default value.
# It can be overridden by the "helm" section in cdk.json. For example,
# to enable Slurm, set "helm": { "slurm": { "enabled": true } } in cdk.json.
# The cdk.json setting always takes precedence over the value here.
#
# Last updated: 2026-07-26
# Version check sources:
#   - KEDA: https://artifacthub.io/packages/helm/kedacore/keda
#   - OpenCost: https://github.com/opencost/opencost-helm-chart/releases
#   - Volcano: https://github.com/volcano-sh/volcano/releases
#   - KubeRay: https://github.com/ray-project/kuberay/releases
#   - Kueue: https://github.com/kubernetes-sigs/kueue/releases
#   - Neuron Helm Chart: https://github.com/aws-neuron/neuron-helm-charts/releases
#   - Slinky Slurm Operator: https://github.com/SlinkyProject/slurm-operator/tags
#   - cert-manager: https://github.com/cert-manager/cert-manager/releases
#   - trust-manager: https://github.com/cert-manager/trust-manager/releases
#   - Apache YuniKorn: https://github.com/apache/yunikorn-release/releases
#   - Kubeflow Trainer: https://github.com/kubeflow/trainer/releases
#   - MLflow: https://mlflow.org/docs/latest/self-hosting/kubernetes-helm/
#   - Argo CD (argo-cd chart): https://github.com/argoproj/argo-helm/releases
#   - Crossplane: https://github.com/crossplane/crossplane/releases
#   - Crossview: https://github.com/crossplane-contrib/crossview/releases

charts:
  # AWS Load Balancer Controller - mandatory Gateway API data plane
  # Installed first so it remains alive until every Gateway-owned ALB and
  # finalizer has been removed during reverse-order teardown.
  # https://kubernetes-sigs.github.io/aws-load-balancer-controller/
  aws-load-balancer-controller:
    enabled: true
    repo_name: eks
    repo_url: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    # 3.5.0 requires Gateway API CRDs v1.6.0 installed BEFORE the controller
    # (its release notes; upgrading the controller first silently stops
    # gateway reconciliation — the 2026-08 live validation caught exactly
    # that under the older v1.5.0 CRD bundle). Bump this version only in
    # lockstep with PINNED_GATEWAY_CRD_BUNDLES in
    # lambda/helm-installer/handler.py.
    version: "3.6.0"
    namespace: kube-system
    create_namespace: false
    wait: true
    wait_timeout: "8m"
    values:
      # Required by the upstream chart during static validation. The regional
      # stack always overrides this placeholder with the real EKS cluster name.
      clusterName: gco-runtime-injected
      # The real cluster name, region, VPC, and IRSA annotation are injected by
      # the regional stack because they contain deployment-specific tokens.
      serviceAccount:
        create: true
        name: aws-load-balancer-controller
      createIngressClassResource: false
      ingressClassParams:
        create: false
      ingressClass: gco-unused-lbc-ingress
      disableIngressClassAnnotation: true
      webhookConfig:
        disableIngressValidation: true
      enableServiceMutatorWebhook: false
      defaultTargetType: ip
      defaultLoadBalancerScheme: internal
      controllerConfig:
        featureGates:
          ALBGatewayAPI: true
          NLBGatewayAPI: false
          EnableServiceController: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 512Mi
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

  # KEDA - Kubernetes Event-Driven Autoscaling
  # Enables autoscaling based on external metrics (SQS, Kafka, Prometheus, etc.)
  # https://keda.sh/
  keda:
    enabled: true
    repo_name: kedacore
    repo_url: https://kedacore.github.io/charts
    chart: keda
    version: "2.21.0"
    namespace: keda
    create_namespace: true
    values:
      # Use GitHub Container Registry (ghcr.io) - official KEDA images
      image:
        keda:
          registry: ghcr.io
          repository: kedacore/keda
          # tag defaults to chart appVersion
        metricsApiServer:
          registry: ghcr.io
          repository: kedacore/keda-metrics-apiserver
        webhooks:
          registry: ghcr.io
          repository: kedacore/keda-admission-webhooks
      # Watch all namespaces (empty string = all namespaces)
      watchNamespace: ""
      # Service account configuration for IRSA (IAM Roles for Service Accounts)
      # The operator service account needs IAM permissions to access SQS for scaling
      serviceAccount:
        operator:
          create: true
          name: keda-operator
      # Resource configuration
      resources:
        operator:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        metricServer:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      # Prometheus metrics
      prometheus:
        metricServer:
          enabled: true
        operator:
          enabled: true
      # Prevent Karpenter from evicting KEDA pods during node consolidation
      podAnnotations:
        keda:
          karpenter.sh/do-not-disrupt: "true"
        metricsApiServer:
          karpenter.sh/do-not-disrupt: "true"
        webhooks:
          karpenter.sh/do-not-disrupt: "true"

  # AWS EFA Kubernetes Device Plugin - Manages EFA devices in EKS clusters
  # Enables high-performance inter-node communication for distributed training
  # and high-performance inference (NIXL + EFA for KV-cache transfer)
  # https://github.com/aws/eks-charts/tree/master/stable/aws-efa-k8s-device-plugin
  aws-efa-device-plugin:
    enabled: false  # Toggled on by cdk.json aws_efa_device_plugin.enabled (enabled by default)
    repo_name: eks
    repo_url: https://aws.github.io/eks-charts
    chart: aws-efa-k8s-device-plugin
    version: "v0.5.33"
    namespace: kube-system
    create_namespace: false
    values:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: vpc.amazonaws.com/efa
          operator: Exists
          effect: NoSchedule
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule

  # AWS Neuron Device Plugin - Manages Neuron devices for Trainium/Inferentia
  # Advertises aws.amazon.com/neuron and aws.amazon.com/neuroncore resources
  # https://github.com/aws-neuron/aws-neuron-sdk
  aws-neuron-device-plugin:
    enabled: true
    repo_name: neuron-oci
    repo_url: oci://public.ecr.aws/neuron
    chart: neuron-helm-chart
    version: "1.10.0"
    namespace: kube-system
    create_namespace: false
    use_oci: true
    values:
      npd:
        enabled: false
      scheduler:
        enabled: false
      devicePlugin:
        tolerations:
          - key: aws.amazon.com/neuron
            operator: Exists
            effect: NoSchedule
          - key: vpc.amazonaws.com/efa
            operator: Exists
            effect: NoSchedule

  # Volcano - Kubernetes-native batch scheduler for AI/ML workloads
  # Provides gang scheduling, fair-share, and queue management for batch jobs
  # https://volcano.sh/
  volcano:
    enabled: true
    repo_name: volcano-sh
    repo_url: https://volcano-sh.github.io/helm-charts
    chart: volcano
    version: "1.15.3"
    namespace: volcano-system
    create_namespace: true
    # Per-chart readiness gate (honored by handler.install_chart):
    #   wait:         map to `helm --wait` when true. Default true.
    #   wait_timeout: map to `helm --timeout`. Default "10m".
    # Volcano is the only chart that pulls exclusively from docker.io
    # (volcanosh/vc-*). On a cold cluster those pulls are slow / rate-limited
    # and a blocking `--wait` cannot finish inside the installer Lambda's
    # wall-clock guard (HELM_CMD_TIMEOUT_SECONDS, default 780s), which made the
    # whole add-on batch loop on Volcano. We therefore let Volcano converge
    # asynchronously: helm returns once the manifests are applied and the
    # scheduler/controller/admission pods come up in the background. The durable
    # fix for the pull speed itself is the Docker Hub ECR pull-through cache,
    # which (when enabled in cdk.json) overrides basic.image_registry below.
    wait: false
    wait_timeout: "8m"
    values:
      # Basic configuration - Volcano works well with defaults
      basic:
        controller_image_name: volcanosh/vc-controller-manager
        scheduler_image_name: volcanosh/vc-scheduler
        admission_image_name: volcanosh/vc-webhook-manager
        # Pin the image tag explicitly (matches the chart's v1.15.0 appVersion)
        # rather than relying on the chart default. This is the tag
        # `gco images mirror` mirrors into ECR and the tag helm
        # requests, so the two can never drift. Bump in lockstep with the chart
        # `version` above, then re-run the mirror (or just redeploy).
        image_tag_version: "v1.15.2"
        controller_podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
        scheduler_podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
        admission_podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      # Enable all plugins for comprehensive scheduling
      custom:
        scheduler_config:
          actions: "enqueue, allocate, backfill"
          tiers:
            - plugins:
                - name: priority
                - name: gang
                - name: conformance
            - plugins:
                - name: drf
                - name: predicates
                - name: proportion
                - name: nodeorder
                - name: binpack

  # KubeRay - Kubernetes operator for Ray distributed computing
  # Enables distributed training, hyperparameter tuning, and model serving with Ray
  # https://ray-project.github.io/kuberay/
  kuberay-operator:
    enabled: true
    repo_name: kuberay
    repo_url: https://ray-project.github.io/kuberay-helm
    chart: kuberay-operator
    version: "1.7.1"
    namespace: ray-system
    create_namespace: true
    values:
      # Use Quay.io images (official KubeRay images)
      image:
        repository: quay.io/kuberay/operator
        tag: v1.7.1
      # Resource configuration
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Watch all namespaces for RayCluster CRs
      watchNamespace: ""
      # Prevent Karpenter from evicting the operator during node consolidation
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

  # cert-manager - Automatic TLS certificate management for Kubernetes
  # Required by the Slinky Slurm Operator webhook for TLS certificates.
  # Also useful for any workload that needs automated certificate issuance.
  # https://cert-manager.io/
  cert-manager:
    enabled: true
    repo_name: jetstack
    repo_url: https://charts.jetstack.io
    chart: cert-manager
    version: "v1.21.2"
    namespace: cert-manager
    create_namespace: true
    values:
      # Install CRDs with the chart
      crds:
        enabled: true
      # Disable the post-install startupapicheck hook. It runs as a Helm
      # post-install hook Job that `helm --wait` blocks on (a *separate* wait
      # from the main resources, each bounded by --timeout). In this
      # private EKS Auto Mode cluster that hook wait runs past the installer
      # Lambda's HELM_CMD_TIMEOUT_SECONDS (780s) guard, so helm gets SIGKILLed
      # and the release is left wedged in `pending-install` even though the
      # controller/webhook/cainjector Deployments are all healthy in ~2m.
      # startupapicheck is only a best-effort post-install API probe — cert-manager
      # is fully functional without it — so disabling it lets `helm --wait`
      # return as soon as the (healthy) Deployments are Ready. See docs/IMAGE_MIRROR.md
      # discussion of the 780s wait guard.
      startupapicheck:
        enabled: false
      # Prevent Karpenter from evicting cert-manager pods during node consolidation
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      # Resource configuration
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      webhook:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      cainjector:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

  # trust-manager - CA bundle distribution (a cert-manager project)
  # Publishes the GCO internal CA's certificate as the ConfigMap
  # gco-jobs/gco-internal-ca, which MLflow's clients mount to verify the
  # tracking server's HTTPS listener (mlflow-tls.monitoring:5443). The regional
  # stack installs it only while MLflow deploys, like opencost and mlflow
  # below; the Bundle and its source are post-Helm manifests
  # (post-helm-mlflow-tls.yaml).
  #
  # Its own namespace is also its trust namespace, the only one it reads
  # Secrets from. trust-manager can read every Secret there, so the source is
  # a leaf that exists only to carry the CA certificate
  # (trust-manager/gco-internal-ca-source), not the CA Secret in cert-manager,
  # and trust-manager never gets read access to the CA's private key.
  # targetNamespaces limits the ConfigMaps it may write to gco-jobs (plus its
  # own namespace), instead of every namespace in the cluster. The default
  # public-CA package and Secret targets stay off: the bundle carries the
  # internal CA and nothing else. Depends on cert-manager (its webhook
  # certificate is issued by cert-manager), which installs earlier.
  # https://cert-manager.io/docs/trust/trust-manager/
  trust-manager:
    enabled: false
    repo_name: jetstack
    repo_url: https://charts.jetstack.io
    chart: trust-manager
    version: "v0.25.0"
    namespace: trust-manager
    create_namespace: true
    values:
      crds:
        enabled: true
      defaultPackage:
        enabled: false
      secretTargets:
        enabled: false
      app:
        trust:
          namespace: trust-manager
        targetNamespaces:
          - gco-jobs
        # Prevent Karpenter from evicting trust-manager during node consolidation
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

  # Slinky Slurm Operator - Run Slurm on Kubernetes
  # Deploys the Kubernetes operator for managing Slurm cluster lifecycles (creation,
  # upgrade, graceful shutdown). Enables HPC-style batch scheduling alongside
  # Kubernetes-native workloads on the same cluster.
  # https://github.com/SlinkyProject/slurm-operator
  slinky-slurm-operator:
    enabled: false
    repo_name: slinky-oci
    repo_url: oci://ghcr.io/slinkyproject/charts
    chart: slurm-operator
    version: "1.2.3"
    namespace: slurm-operator
    create_namespace: true
    use_oci: true
    values:
      # CRD management — let the chart install and upgrade CRDs
      crds:
        enabled: true
      # Operator configuration
      operator:
        enabled: true
        replicas: 1
        image:
          repository: ghcr.io/slinkyproject/slurm-operator
          tag: "1.2.3"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        tolerations: []
        # Prevent Karpenter from evicting the operator during node consolidation
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      # Webhook for validation and defaulting of Slurm CRDs
      webhook:
        enabled: true
        image:
          repository: ghcr.io/slinkyproject/slurm-operator-webhook
          tag: "1.2.3"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      # cert-manager is required for webhook TLS certificates
      certManager:
        enabled: true

  # Slinky Slurm Cluster - Deploys a ready-to-use Slurm cluster on Kubernetes
  # Installs after the operator and creates controller, workers, login, and REST API pods.
  # Users can immediately submit jobs via sbatch/srun from the login pod.
  # https://github.com/SlinkyProject/slurm-operator/tree/main/helm/slurm
  slinky-slurm:
    enabled: false
    repo_name: slinky-oci
    repo_url: oci://ghcr.io/slinkyproject/charts
    chart: slurm
    version: "1.2.3"
    namespace: gco-jobs
    create_namespace: false
    use_oci: true
    values:
      # Slurm cluster name
      clusterName: gco-slurm
      # Controller (slurmctld) — head node
      controller:
        # Use the pre-provisioned EFS PVC for controller state persistence.
        # This avoids dynamic EFS provisioning which requires additional IAM permissions.
        persistence:
          existingClaim: gco-shared-storage
        slurmctld:
          image:
            repository: ghcr.io/slinkyproject/slurmctld
            tag: "26.05.4-ubuntu24.04"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        podSpec:
          nodeSelector:
            kubernetes.io/os: linux
      # Worker nodes (slurmd). The chart's schema is a lowercase ``nodesets``
      # MAP keyed by NodeSet name — a camelCase ``nodeSets`` list is silently
      # ignored by Helm and the cluster comes up with zero workers (caught by
      # the live release validation ``schedulers`` action; see
      # tests/test_helm_charts_validation.py for the shape guard).
      nodesets:
        workers:
          replicas: 2
          slurmd:
            image:
              repository: ghcr.io/slinkyproject/slurmd
              tag: "26.05.4-ubuntu24.04"
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                cpu: "2"
                memory: 4Gi
          podSpec:
            nodeSelector:
              kubernetes.io/os: linux
      # Slurm partitions. Without an enabled partition carrying
      # ``Default: "YES"`` slurmctld has no default partition and every
      # partition-less submission (sbatch --wrap, the REST probe,
      # examples/slurm-cluster-job.yaml) fails with rc 2001
      # ("No partition specified or system default partition").
      partitions:
        all:
          enabled: true
          nodesets:
            - ALL
          configMap:
            Default: "YES"
            State: UP
            MaxTime: UNLIMITED
      # Login pods are disabled by default. GCO submits Slurm jobs via the
      # Kubernetes API (gco jobs submit-direct), not via SSH. Enabling the
      # login set creates a separate LoadBalancer (NLB), which adds cost and is
      # not part of the GCO API path; GA registration explicitly ignores it.
      # For interactive access, use: kubectl exec -it <controller-pod> -- bash
      loginsets:
        slinky:
          enabled: false
      # REST API (slurmrestd) — used by operator for lifecycle management
      restapi:
        slurmrestd:
          image:
            repository: ghcr.io/slinkyproject/slurmrestd
            tag: "26.05.4-ubuntu24.04"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        podSpec:
          nodeSelector:
            kubernetes.io/os: linux
      # Disable accounting (MariaDB) by default
      accounting:
        enabled: false

  # Apache YuniKorn - Universal resource scheduler for Kubernetes
  # Provides app-aware scheduling, hierarchical queues, resource quotas,
  # fair-sharing, and preemption for multi-tenant AI/ML clusters.
  # https://yunikorn.apache.org/
  yunikorn:
    enabled: false
    repo_name: yunikorn
    repo_url: https://apache.github.io/yunikorn-release
    chart: yunikorn
    version: "1.10.0"
    namespace: yunikorn
    create_namespace: true
    values:
      # Disable the admission controller — YuniKorn only schedules pods that
      # explicitly set schedulerName: yunikorn. This prevents interference with
      # other schedulers (Volcano, Kueue) and system pods (keda, cert-manager).
      embedAdmissionController: false
      admissionController:
        replicaCount: 0
      # Prevent Karpenter from evicting the scheduler during node consolidation
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      # YuniKorn scheduler configuration
      yunikornDefaults:
        # Default queue configuration with a root queue and child queues
        # for GPU and CPU workloads with resource quotas
        queues.yaml: |
          partitions:
            - name: default
              placementrules:
                - name: tag
                  value: namespace
                  create: true
              queues:
                - name: root
                  submitacl: '*'
                  queues:
                    - name: gpu-workloads
                      resources:
                        guaranteed:
                          memory: 64G
                          vcore: 32
                        max:
                          memory: 256G
                          vcore: 128
                    - name: cpu-workloads
                      resources:
                        guaranteed:
                          memory: 32G
                          vcore: 16
                        max:
                          memory: 128G
                          vcore: 64
                    - name: default
                      resources:
                        max:
                          memory: 64G
                          vcore: 32

  # kube-prometheus-stack - self-hosted in-cluster observability
  # Bundles Prometheus, Alertmanager, Grafana, kube-state-metrics, node-exporter,
  # and the Prometheus Operator. Installed on every regional cluster when
  # cdk.json cluster_observability.enabled = true (the default). Inclusion and
  # the dynamic values (persistence sizes, retention, gp3 storageClassName,
  # GPU/Neuron node-exporter tolerations, and Grafana's grafana-tls-proxy
  # sidecar — verified TLS on 3443 for the admin-password rotator, run from
  # the manifest-processor image, with its optional grafana-tls Secret volume
  # and an amd64 nodeSelector) are driven by GCORegionalStack, not by
  # the helm block above, so the default here is enabled: false. Grafana uses
  # native auth (no self sign-up, no anonymous) and a ClusterIP service; access
  # is via `gco monitoring open` (kubectl port-forward). The admin password is
  # auto-generated by the Grafana subchart into the <release>-grafana Secret and
  # is never templated here. See docs/MONITORING.md.
  # wait: false because a cold first pull of the six component images can exceed
  # the installer's per-chart wall-clock guard (same rationale as Volcano).
  # https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
  kube-prometheus-stack:
    enabled: false
    repo_name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: "92.1.1"
    namespace: monitoring
    create_namespace: true
    wait: false
    wait_timeout: "8m"
    values:
      # Grafana: native auth only, private ClusterIP, dashboards imported by the
      # sidecar from ConfigMaps labeled grafana_dashboard="1".
      grafana:
        service:
          type: ClusterIP
        # Private only: no Ingress/ALB. Access is via `gco monitoring open`
        # (kubectl port-forward) against the PRIVATE EKS endpoint.
        ingress:
          enabled: false
        # The Grafana subchart auto-generates the <release>-grafana Secret
        # (admin-user/admin-password) because admin.existingSecret is unset.
        grafana.ini:
          users:
            allow_sign_up: false
          auth:
            disable_login_form: false
          auth.anonymous:
            enabled: false
          security:
            cookie_secure: true
            cookie_samesite: lax
        persistence:
          enabled: true
          type: pvc
          accessModes:
            - ReadWriteOnce
        # Recreate, not the subchart's RollingUpdate: the single replica owns a
        # ReadWriteOnce EBS volume, so a surge pod scheduled onto another node
        # can never attach it while the old pod still holds it, and the rollout
        # would wait on a Multi-Attach error forever. The amd64 nodeSelector
        # GCORegionalStack adds for the grafana-tls-proxy sidecar makes that
        # the common case for a pod that ran on a Graviton node. A rollout
        # therefore costs a brief Grafana restart instead of a stall.
        deploymentStrategy:
          type: Recreate
        # Scheduling weight for the two stateful singletons the chart ships
        # with no resource requests (Grafana here, Prometheus below; the
        # Prometheus Operator already defaults Alertmanager to a 200Mi memory
        # request). With no requests the scheduler counts them as free and
        # packs them onto whichever general-purpose node already has the most
        # pods. Two consecutive EKS 1.37 live release validations failed that
        # way: the densest 2-vCPU/4 GiB node (19 pods, Grafana in one run and
        # Prometheus in the other) spent ~1-1.5 cores in kernel time with
        # ~23k major page faults/s at node level, so Grafana's readiness
        # probes timed out (context deadline exceeded, sqlite "database is
        # locked") and Prometheus answered OpenCost with 503s, surfacing as
        # cost-monitor /api/v1/cost/status 504s. Requests make the scheduler
        # account for the memory these pods actually use (measured ~0.8 GiB
        # for Prometheus an hour into a run, ~0.4 GiB for Grafana) and lift
        # them from BestEffort to Burstable QoS, so they are no longer the
        # first eviction candidates under node pressure. Requests only, no
        # limits: Prometheus' heap scales with the series count and a memory
        # limit would turn a busy scrape set into an OOM crash loop, while a
        # CPU limit on Grafana would stretch the first-boot migrations the
        # liveness budget below is sized for.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
        # First-boot tolerance: Grafana runs its full database migration set
        # (plus the unified-storage search index build) against the fresh PVC
        # before it listens on 3000. A live deployment measured 7+ minutes,
        # which the subchart's default liveness budget (60s initial delay +
        # 10 failures x 10s) cut short: kubelet killed Grafana mid-migration,
        # every restart redid the work, and the pod crash-looped. Allow ~11
        # minutes before liveness kills it; readiness stays on the subchart
        # default so traffic only flows once /api/health actually answers.
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 60
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: monitoring
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      # EKS manages the control plane: etcd, the scheduler, and the controller
      # manager are not reachable as pods, and EKS Auto Mode runs no kube-proxy
      # DaemonSet and provides DNS as a built-in capability (no CoreDNS pods in
      # kube-system for the k8s-app=kube-dns selector to match). Their exporters
      # would render kube-system Services whose selectors can never have ready
      # endpoints, so release validation (and scraping) disables them.
      kubeEtcd:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeControllerManager:
        enabled: false
      kubeProxy:
        enabled: false
      coreDns:
        enabled: false
      # Prometheus: discover ServiceMonitors/PodMonitors cluster-wide (not just
      # ones labeled with this release) so GCO component monitors are scraped.
      prometheus:
        service:
          type: ClusterIP
        prometheusSpec:
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
          # Scheduling weight; see the grafana.resources comment above.
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
          podMetadata:
            annotations:
              karpenter.sh/do-not-disrupt: "true"
      alertmanager:
        service:
          type: ClusterIP
        alertmanagerSpec:
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
          # No resources override here: the Prometheus Operator already gives
          # Alertmanager a 200Mi memory request when none is set (see the
          # grafana.resources comment above), and the pod's measured working
          # set is ~25Mi.
          podMetadata:
            annotations:
              karpenter.sh/do-not-disrupt: "true"
      # node-exporter tolerations are injected by GCORegionalStack so the
      # DaemonSet schedules on tainted GPU/Neuron/EFA nodes.
      #
      # Intentionally NO karpenter.sh/do-not-disrupt on node-exporter. Unlike the
      # singleton/stateful components above, node-exporter is a DaemonSet that runs
      # on EVERY node, so the annotation would pin every node against graceful
      # termination until the NodePool terminationGracePeriod (24h) elapses —
      # Karpenter/EKS Auto Mode holds the node the whole time, blocking
      # consolidation, scale-down, spot reclaim, and even manual NodeClaim
      # deletion. do-not-disrupt belongs only on singleton pods you don't want
      # voluntarily consolidated, never on a DaemonSet. The upstream chart still
      # sets cluster-autoscaler.kubernetes.io/safe-to-evict=true, which is correct.
      kube-state-metrics:
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      prometheusOperator:
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"

  # OpenCost - Kubernetes cost allocation and monitoring
  # Reads usage data from the in-cluster Prometheus (kube-prometheus-stack)
  # and AWS list prices, and exposes per-namespace/-controller/-pod cost
  # allocation via its API (9003), UI (9090), and Prometheus metrics that the
  # Grafana cost dashboard renders. Installed on every regional cluster when
  # cdk.json cost_monitoring.enabled = true (the default) AND
  # cluster_observability.enabled = true. Inclusion and the dynamic values
  # (cluster id, Prometheus service wiring, and the opencost-tls-proxy
  # sidecar — verified TLS on 9443 for the cost-monitor, run from the
  # cost-monitor image, with its optional opencost-tls Secret volume and an
  # amd64 nodeSelector) are driven by GCORegionalStack,
  # so the default here is enabled: false — mirroring kube-prometheus-stack.
  # Must install AFTER kube-prometheus-stack: the ServiceMonitor below needs
  # the Prometheus Operator CRDs that chart applies.
  # Access is via `gco monitoring open --service opencost` or
  # `gco costs dashboard` (kubectl port-forward over the PRIVATE EKS
  # endpoint); there is no public endpoint. See docs/COST_MONITORING.md.
  # wait: false for the same cold-image-pull rationale as kube-prometheus-stack.
  # https://github.com/opencost/opencost-helm-chart
  opencost:
    enabled: false
    repo_name: opencost
    repo_url: https://opencost.github.io/opencost-helm-chart
    chart: opencost
    version: "2.5.32"
    namespace: monitoring
    create_namespace: false
    wait: false
    wait_timeout: "8m"
    values:
      # NOTE: the chart's root-level ``clusterName`` is the Kubernetes DNS
      # zone (default ``cluster.local``) used to build the Prometheus URL —
      # overriding it with the EKS cluster name breaks DNS resolution and
      # crash-loops the cost model. The cluster's *identity* is
      # ``opencost.exporter.defaultClusterId`` below, injected by the
      # regional stack because it carries deployment tokens
      # (<project>-<region>).
      # Never voluntarily consolidate the singleton cost model pod.
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      # NetworkPolicies stay off: the monitoring namespace has no restrictive
      # default-deny policy, and enabling the chart's policy would require
      # keeping its Prometheus pod selector in lockstep with
      # kube-prometheus-stack's labels for no isolation gain today.
      networkPolicies:
        enabled: false
      opencost:
        # The MCP (Model Context Protocol) server is an additional
        # unauthenticated HTTP surface aimed at AI-agent integrations. GCO
        # exposes cost data through the authenticated GCO API and Athena
        # instead, so the extra listener stays off.
        mcp:
          enabled: false
        exporter:
          # Injected by the regional stack (<project>-<region>).
          defaultClusterId: gco-runtime-injected
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
        metrics:
          serviceMonitor:
            # kube-prometheus-stack discovers ServiceMonitors cluster-wide
            # (serviceMonitorSelectorNilUsesHelmValues: false), so the
            # chart-created monitor is scraped without extra wiring. This is
            # what feeds the node_*_hourly_cost series the Grafana cost
            # dashboard renders.
            enabled: true
        prometheus:
          external:
            enabled: false
          internal:
            enabled: true
            serviceName: kube-prometheus-stack-prometheus
            namespaceName: monitoring
            port: 9090
        ui:
          # No securityContext override: upstream ships ``{}`` because the UI
          # image's entrypoint rewrites /var/www assets (BASE_URL sed) and
          # hands off to nginx itself — forcing runAsUser breaks that startup
          # rewrite (sed: can't create temp file ... Permission denied) and
          # crash-loops the container.
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 55Mi
            limits:
              memory: 256Mi

  # MLflow - experiment tracking server (official MLflow chart, OCI)
  # enabled:false here because inclusion is driven by GCORegionalStack:
  # cluster_observability.mlflow.enabled (default true) AND
  # cluster_observability.enabled — MLflow lives in the monitoring namespace
  # kube-prometheus-stack creates, keeps run metadata on the observability
  # gp3 StorageClass, and is reached through the same tunnel commands.
  # Deployment tokens (S3 artifact destination, IRSA role ARN, PVC size)
  # are injected by the regional stack via value overrides; everything
  # static lives here.
  # Access posture: ClusterIP only, no Ingress, no app-level auth — the
  # authenticated SSM/port-forward tunnel (`gco monitoring open --service
  # mlflow`) is the security boundary, the same posture as the OpenCost UI.
  # (The chart supports MLflow's basic-auth plugin via server options and a
  # Secret-backed CSRF key if app-level auth is ever wanted.)
  # Run ARTIFACTS go to the cluster-shared S3 bucket via IRSA (durable,
  # server-proxied so client pods never need S3 credentials); run METADATA
  # is SQLite on the chart-managed gp3 PVC below. helm uninstall never
  # deletes chart PVCs, so the applier's feature inventory prunes the claim
  # (monitoring/mlflow) when the feature is disabled — deliberately
  # discarding metadata while artifacts stay in S3.
  # The chart's pod security defaults are already hardened (runAsNonRoot +
  # fsGroup 1000, readOnlyRootFilesystem, drop-ALL, RuntimeDefault seccomp)
  # and it auto-selects the Recreate strategy for SQLite/ReadWriteOnce
  # setups, so surge replicas can never deadlock on the EBS attach.
  # wait: false for the same cold-image-pull rationale as kube-prometheus-stack.
  # https://mlflow.org/docs/latest/self-hosting/kubernetes-helm/
  mlflow:
    enabled: false
    repo_name: mlflow-oci
    repo_url: oci://ghcr.io/mlflow/charts
    chart: mlflow
    version: "3.17.0"
    namespace: monitoring
    create_namespace: false
    use_oci: true
    wait: false
    wait_timeout: "8m"
    values:
      # Every resource keeps the bare release name — service DNS
      # mlflow.monitoring:5000, ServiceAccount monitoring/mlflow (the IRSA
      # trust condition), tunnel target svc/mlflow — instead of the chart's
      # default <release>-<chart> doubling (mlflow-mlflow).
      fullnameOverride: mlflow
      image:
        repository: ghcr.io/mlflow/mlflow
        # Pin the -full server build explicitly (the chart defaults the tag
        # to v<appVersion>-full) so the monthly deps-drift report covers
        # it. -full carries the server extras (SQLAlchemy backend, boto3
        # for the S3 artifact proxy) the tracking server needs.
        tag: "v3.17.0-full"
      # SQLite run-metadata store on the chart's own gp3 PVC (first-class
      # storage support; mounted at /mlflow). The claim size is a
      # deployment token (cluster_observability.mlflow.persistence_size).
      # The observability StorageClass always exists here — the mlflow
      # conjunction requires cluster_observability.
      storage:
        enabled: true
        storageClassName: gco-observability-gp3
      mlflow:
        backendStoreUri: "sqlite:////mlflow/mlflow.db"
      # One gunicorn worker, deliberately (chart default is 4): the metadata
      # store is single-writer SQLite so extra workers only add lock
      # contention, and four workers importing the full MLflow server under
      # the CPU request starved startup past the chart's fixed liveness
      # window (probe kills at ~100s, observed live 2026-08-14 as an exit
      # 137 crash-loop; chart 0.1.x exposed no probe knobs — 3.17.0 adds a
      # probes.* block with a startup probe that gates liveness, but the
      # single worker stays right for the single-writer store).
      # allowed_hosts: MLflow 3.x ships host-validation middleware that
      # 403s API requests whose Host header it does not recognize ("possible
      # DNS rebinding attack detected"), and setting the flag REPLACES the
      # built-in localhost/private-IP allowance rather than extending it.
      # Two live incidents came from that replacement: Prometheus scrapes
      # the pod IP directly and got 403 until the pod CIDR was listed
      # (2026-08-14), and `gco monitoring open --service mlflow` forwards to
      # loopback, so the UI answered 403 until the localhost/127.0.0.1
      # spellings were listed (2026-08-15) — the in-cluster DNS names
      # returned 200 through the very same tunnel.
      # Static spellings live here (a DNS-name Host carries the port, hence
      # both forms); at deploy time the regional stack REPLACES this value
      # with the complete list, appending wildcard patterns derived from
      # cdk.json's vpc_endpoint_cidrs (single source of truth — see
      # _mlflow_allowed_hosts in gco/stacks/regional_stack.py) so the
      # allow-list follows the VPC range with no edit here. The mlflow-tls
      # spellings are the HTTPS front door gco-jobs clients dial
      # (mlflow-tls.monitoring.svc.cluster.local:5443): the TLS sidecar
      # forwards their Host header unchanged. Arbitrary DNS names stay
      # rejected; /health is exempt so probes never depended on this.
      # Verified against the pinned image. The escaped line breaks join the
      # list without spaces.
      server:
        value_options:
          workers: 1
          allowed_hosts: "mlflow.monitoring,mlflow.monitoring:5000,\
            mlflow-tls,mlflow-tls:5443,mlflow-tls.monitoring,mlflow-tls.monitoring:5443,\
            mlflow-tls.monitoring.svc,mlflow-tls.monitoring.svc:5443,\
            mlflow-tls.monitoring.svc.cluster.local,mlflow-tls.monitoring.svc.cluster.local:5443,\
            localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
      # Never voluntarily consolidate the singleton tracking server.
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      service:
        type: ClusterIP
      ingress:
        enabled: false
      # Anonymized usage tracking stays off (posture, not just default).
      # The official chart has no telemetry toggle, so pin the env pair the
      # server honors — same effect the community chart's telemetry.enabled
      # false had.
      env:
        - name: MLFLOW_DISABLE_TELEMETRY
          value: "true"
        - name: DO_NOT_TRACK
          value: "true"
      # Chart NetworkPolicy stays OFF; GCO ships the server's policy itself
      # (mlflow-server in post-helm-mlflow-network.yaml, which also carries
      # the gco-jobs client egress allow).
      #
      # The chart's own policy restricts ingress to POD sources
      # (podSelector/namespaceSelector only), which silently drops the
      # kubelet's health probes — those arrive from the node's host network.
      # A supplemental allow fixes the steady state, but not the startup
      # race: the VPC CNI programs a pod's policy when the pod starts, so a
      # pod created in the window before the permissive rule has propagated
      # is left with only the restrictive one, and nothing re-triggers the
      # programming. Caught live 2026-08-15: the mlflow pod started 2s after
      # the supplemental policy was applied and then crash-looped through 11
      # containers, never receiving a single probe, while Prometheus (a pod)
      # scraped /metrics 200 the whole time.
      #
      # Owning the policy removes the failure mode instead of narrowing it:
      # before GCO's policy lands the pod is simply unisolated (probes work),
      # and after it lands probes are explicitly allowed (they work). There is
      # no ordering in which the server ends up unreachable by its own
      # kubelet. It also puts the server's whole network posture in one
      # reviewable manifest that CI exercises under a NetworkPolicy-enforcing
      # CNI (integration:kind:examples-smoke).
      networkPolicy:
        enabled: false
      resources:
        requests:
          # A full guaranteed core (requests == limits), measured, not
          # guessed: against the pinned image, /health first answers
          # within the probes' 1-second budget at ~16s of server start
          # with 1.0 CPU but only at ~62s with 0.5 CPU — past the chart's
          # fixed liveness window (15s delay + 3 probes x 20s), which is
          # exactly the 18-restart crash-loop observed live 2026-08-14 on
          # a contended node with a smaller request. Chart 0.1.x exposed
          # no probe knobs, so the guaranteed share was the only lever;
          # 3.17.0's default startup probe (30 x 10s, gating liveness)
          # adds headroom on top, and the measured core stays.
          cpu: "1"
          # 2Gi requested / 3Gi limit, measured: the v3.16.0-full server
          # ramps to ~1.5GiB steady state during startup (server + job
          # schedulers) — the previous 1Gi limit OOM-killed the container
          # at ~25s every cycle (kernel TaskOOM, caught live 2026-08-14
          # after the CPU fix let startup get far enough to hit it).
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 3Gi
      # /metrics + ServiceMonitor: kube-prometheus-stack discovers
      # ServiceMonitors cluster-wide and is guaranteed present (the mlflow
      # conjunction requires observability), so the tracking server's
      # health lands in the same Prometheus as OpenCost.
      # path stays explicit alongside enabled: chart 0.1.0 rendered the
      # ServiceMonitor endpoint path as null without it, which the API
      # server rejects and every helm upgrade then fails (caught live,
      # 2026-08-14; upstream default bug — the chart docs always pair
      # enabled with path). 3.17.0 defaults the path to /metrics, so the
      # explicit value is now belt-and-braces rather than load-bearing.
      metrics:
        enabled: true
        path: /metrics
      serviceMonitor:
        enabled: true

  # Kubeflow Trainer v2 - distributed training operator (TrainJob CRD)
  # Runs multi-node training through TrainJob CRs against ClusterTrainingRuntime
  # blueprints; supersedes the legacy training-operator (PyTorchJob/TFJob/
  # MPIJob). Installs the trainer controller plus its JobSet dependency (the
  # replicated-Job engine TrainJobs compile to; nothing else in the platform
  # ships JobSet). Webhooks are self-scoped — the trainer CRD group plus
  # jobset-owned pods via an objectSelector on jobset.sigs.k8s.io/jobset-name —
  # so installing before kueue is safe (kueue stays last).
  # https://github.com/kubeflow/trainer
  kubeflow-trainer:
    enabled: true
    repo_name: kubeflow-oci
    repo_url: oci://ghcr.io/kubeflow/charts
    chart: kubeflow-trainer
    version: "2.3.0"
    namespace: kubeflow-trainer
    create_namespace: true
    use_oci: true
    wait: true
    wait_timeout: "8m"
    values:
      # CRDs (TrainJob, TrainingRuntime, ClusterTrainingRuntime) are chart
      # templates in Trainer 2.x, so install AND upgrade keep them current
      # (no crds/-directory install-only gap). JobSet's own CRD still ships
      # from the subchart's crds/ directory (install-time only).
      crds:
        enabled: true
      jobset:
        install: true
        # Let cert-manager own the JobSet webhook certificate instead of the
        # JobSet controller.
        #
        # With this false (the chart default) JobSet templates an EMPTY
        # webhook-cert Secret and its controller self-signs into it at
        # runtime. Helm 4 applies server-side, so the NEXT `helm upgrade`
        # tries to apply that empty Secret and collides with the controller
        # over the fields it filled in:
        #
        #   conflict occurred while applying object
        #   kubeflow-trainer/jobset-webhook-server-cert /v1, Kind=Secret:
        #   Apply failed with 4 conflicts: conflicts with "jobset" using v1:
        #   .data.ca.crt .data.ca.key .data.tls.crt .data.tls.key
        #
        # That fails the chart task, so the convergence state machine never
        # reaches its post-Helm apply — i.e. re-deploying an existing
        # deployment breaks, and takes every post-Helm manifest with it.
        # Caught live 2026-08-15 on the second `gco stacks deploy` of the
        # same cluster; fresh deploys never hit it, which is why the
        # shakeouts didn't.
        #
        # Setting this true flips both halves of the conflict off at once:
        # the chart stops templating the Secret (its
        # templates/internalcert/secret.yaml is gated on
        # `not .Values.certManager.enable`) and the controller stops managing
        # the cert (its ConfigMap sets internalCertManagement.enable to
        # `not .Values.certManager.enable`). cert-manager creates and owns
        # the Secret through a Certificate + self-signed Issuer, and the
        # webhook configurations get its inject-ca-from annotation.
        #
        # Depends on cert-manager, which GCO installs unconditionally and
        # EARLIER in this file (charts install in file order) — the same
        # dependency the Slinky Slurm operator already declares. The
        # upgrade-idempotency contract is exercised by the install-then-
        # upgrade step in integration:kind:examples-smoke.
        certManager:
          enable: true
      image:
        registry: ghcr.io
        repository: kubeflow/trainer/trainer-controller-manager
        # Pin the tag explicitly (the chart defaults it to the chart version)
        # so the monthly deps-drift report covers it. Bump in lockstep with
        # `version` above and with the runtime manifest extracted from this
        # chart (post-helm-kubeflow-trainer-runtimes.yaml) — the extraction
        # side is CI-enforced by the trainer runtime lockstep in
        # .github/scripts/validate_helm_charts.py.
        tag: "v2.3.0"
      manager:
        replicas: 1
        # Never voluntarily consolidate the training control plane.
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      # Built-in ClusterTrainingRuntimes stay OFF here on purpose: the chart
      # delivers them via a post-install/post-upgrade hook Job that downloads
      # kubectl into an alpine pod at run time (an unpinned network fetch)
      # and burns helm --wait budget (the cert-manager startupapicheck
      # lesson). GCO applies the torch-distributed runtime through the
      # post-Helm kubectl pass instead — same bytes, pinned and reviewable,
      # pruned when this chart is disabled. See
      # lambda/kubectl-applier-simple/manifests/post-helm-kubeflow-trainer-runtimes.yaml.
      runtimes:
        defaultEnabled: false
        torchDistributed:
          enabled: false

  # Argo CD - self-managed GitOps controller (opt-in: cdk.json helm.argocd).
  # Release name "argocd" so every object carries the upstream names
  # (argocd-server, argocd-initial-admin-secret, ...). Namespaced install:
  # createClusterRoles is off, so no Argo CD component holds a ClusterRole, and
  # the in-cluster destination below is registered for the two tenant
  # namespaces only, with no cluster-scoped resources. GCO adds the tenant
  # RBAC, the fenced gco-tenants AppProject and the optional root Application
  # in the post-Helm pass (post-helm-argocd-*.yaml). The UI is reached through
  # `gco gitops open` (a kubectl port-forward, so server.insecure serves plain
  # HTTP inside the tunnel); `gco gitops password` reads the generated admin
  # password. See docs/GITOPS.md.
  # https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
  argocd:
    enabled: false
    repo_name: argo
    repo_url: https://argoproj.github.io/argo-helm
    chart: argo-cd
    version: "10.10.1"
    namespace: argocd
    create_namespace: true
    wait: true
    wait_timeout: "8m"
    values:
      createClusterRoles: false
      crds:
        install: true
        # Upstream default: helm uninstall leaves the CRDs, so disabling Argo
        # CD can never cascade-delete a CRD out from under the cluster. The
        # installer deletes every argoproj.io object before it uninstalls.
        keep: true
      global:
        # The chart's per-component NetworkPolicies admit only pod sources on
        # the probe ports; under the VPC CNI policy agent kubelet probes arrive
        # from the node's host network and would be dropped (the mlflow lesson,
        # post-helm-mlflow-network.yaml). Argo CD's namespace gets no GCO
        # policy either, like the other add-on namespaces.
        networkPolicy:
          create: false
        # Prevent Karpenter / Auto Mode consolidation from evicting the
        # controllers mid-sync.
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      configs:
        params:
          # TLS terminates at the kubectl port-forward tunnel (API server
          # TLS); the Service is ClusterIP-only with no ingress.
          server.insecure: true
        cm:
          admin.enabled: true
          exec.enabled: false
          statusbadge.enabled: false
          # Skip resource types the controller's namespaced RBAC does not let
          # it list instead of failing the cluster cache.
          resource.respectRBAC: normal
        clusterCredentials:
          # The in-cluster destination, fenced to the tenant namespaces: the
          # controller watches and deploys into gco-jobs / gco-inference only
          # (the gco-tenants AppProject names the same pair).
          in-cluster:
            server: https://kubernetes.default.svc
            namespaces: gco-jobs,gco-inference
            config:
              tlsClientConfig:
                insecure: false
      dex:
        enabled: false
      notifications:
        enabled: false
      # The chart always renders the ApplicationSet controller; GCO does not
      # use it, so it runs zero replicas.
      applicationSet:
        replicas: 0
      controller:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      server:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      repoServer:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      redis:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

  # Crossplane - self-managed control plane for platform APIs (opt-in:
  # cdk.json helm.crossplane, which installs the Crossview dashboard below with
  # it). Crossplane v2 composes any Kubernetes resource through namespaced
  # composite resources (XRs); GCO installs the go-templating composition
  # function, aggregates the tenant workload kinds into Crossplane's role and
  # grants Crossview a read-only view in the post-Helm pass
  # (post-helm-crossplane.yaml). No provider packages ship: AWS resources come
  # from the ACK EKS Capability (docs/EKS_CAPABILITIES.md) or providers an
  # operator adds. See docs/CROSSPLANE.md.
  # https://github.com/crossplane/crossplane/tree/main/cluster/charts/crossplane
  crossplane:
    enabled: false
    repo_name: crossplane-stable
    repo_url: https://charts.crossplane.io/stable
    chart: crossplane
    version: "2.4.2"
    namespace: crossplane-system
    create_namespace: true
    wait: true
    wait_timeout: "8m"
    values:
      replicas: 1
      # Rendered onto the Crossplane and RBAC manager pods.
      customAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      resourcesCrossplane:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1024Mi
      resourcesRBACManager:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 512Mi

  # Crossview - the crossplane-contrib Crossplane dashboard, installed with
  # Crossplane (helm.crossplane). Reached only through `gco crossplane open`
  # (a kubectl port-forward to a ClusterIP Service; no ingress), so it runs
  # with auth mode none and no PostgreSQL: whoever can port-forward into
  # crossplane-system already holds cluster access. The chart's own
  # ClusterRole (get/list/watch on every resource, Secrets included) is
  # replaced by GCO's read-only binding to crossplane-view plus the tenant
  # workload kinds (post-helm-crossplane.yaml).
  # https://github.com/crossplane-contrib/crossview
  crossview:
    enabled: false
    repo_name: crossview
    repo_url: https://crossplane-contrib.github.io/crossview
    chart: crossview
    version: "4.6.0"
    namespace: crossplane-system
    create_namespace: false
    wait: true
    wait_timeout: "5m"
    values:
      image:
        repository: ghcr.io/crossplane-contrib/crossview
        tag: "v4.6.0"
        pullPolicy: IfNotPresent
      app:
        replicas: 1
        automountServiceAccountToken: true
      global:
        namespace: crossplane-system
        createNamespace: false
      database:
        enabled: false
      config:
        database:
          enabled: false
        server:
          auth:
            mode: none
          cors:
            origin: http://localhost:3001
      # No chart-created Secret: with auth none and no database there is
      # nothing to hold, and the chart's defaults would store a literal
      # admin/password pair.
      secrets:
        adminUsername: ""
        adminPassword: ""
      rbac:
        create: false
      serviceAccount:
        create: true
        name: crossview
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

  # Kueue - Kubernetes-native job queueing for batch workloads
  # Provides quota management, fair sharing, and priority scheduling
  # IMPORTANT: Kueue must be installed LAST because its mutating webhook
  # intercepts all Job and Deployment creates/updates cluster-wide. If Kueue
  # installs before other charts, its webhook can block their upgrades when
  # the webhook pod is temporarily unavailable during rollouts.
  # https://kueue.sigs.k8s.io/
  kueue:
    enabled: true
    repo_name: kueue-oci
    repo_url: oci://registry.k8s.io/kueue/charts
    chart: kueue
    version: "0.20.1"
    namespace: kueue-system
    create_namespace: true
    use_oci: true
    values:
      # The chart reads pod-level settings only under controllerManager.manager
      # and silently drops keys outside its own layout. Its one workload, the
      # kueue-controller-manager Deployment, also serves the admission
      # webhooks (kueue-webhook-service), so there is no separate webhook pod
      # to size or annotate.
      #
      # Everything not set here is the chart default. The integrations, plain
      # Pods and batch Jobs among them, come from its default managerConfig.
      # Resources stay at its 500m CPU / 512Mi requests and 2 CPU / 512Mi
      # limits, the sizing every live validation has run: the webhooks sit in
      # the path of every Pod create outside kube-system and kueue-system, so a
      # lower CPU limit would slow admission across the cluster.
      controllerManager:
        manager:
          # Keep Karpenter (EKS Auto Mode) from evicting the single replica
          # during consolidation or drift. The chart registers its Job and Pod
          # mutating webhooks with failurePolicy Fail for every namespace but
          # kube-system and kueue-system, so while the pod is gone Job and Pod
          # creates elsewhere in the cluster are rejected.
          podAnnotations:
            karpenter.sh/do-not-disrupt: "true"
