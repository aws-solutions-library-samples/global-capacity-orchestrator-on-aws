# Helm Charts Configuration for GCO
# This file defines the Helm charts to be installed by the helm-installer Lambda
#
# Charts are installed in the order they appear below.
#
# IMPORTANT: The "enabled" flag in each chart below is the default value.
# It can be overridden by the "helm" section in cdk.json. For example,
# to enable Slurm, set "helm": { "slurm": { "enabled": true } } in cdk.json.
# The cdk.json setting always takes precedence over the value here.
#
# Last updated: 2026-07-26
# Version check sources:
#   - KEDA: https://artifacthub.io/packages/helm/kedacore/keda
#   - OpenCost: https://github.com/opencost/opencost-helm-chart/releases
#   - Volcano: https://github.com/volcano-sh/volcano/releases
#   - KubeRay: https://github.com/ray-project/kuberay/releases
#   - Kueue: https://github.com/kubernetes-sigs/kueue/releases
#   - Neuron Helm Chart: https://github.com/aws-neuron/neuron-helm-charts/releases
#   - Slinky Slurm Operator: https://github.com/SlinkyProject/slurm-operator/tags
#   - cert-manager: https://github.com/cert-manager/cert-manager/releases
#   - Apache YuniKorn: https://github.com/apache/yunikorn-release/releases

charts:
  # AWS Load Balancer Controller - mandatory Gateway API data plane
  # Installed first so it remains alive until every Gateway-owned ALB and
  # finalizer has been removed during reverse-order teardown.
  # https://kubernetes-sigs.github.io/aws-load-balancer-controller/
  aws-load-balancer-controller:
    enabled: true
    repo_name: eks
    repo_url: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    version: "3.5.0"
    namespace: kube-system
    create_namespace: false
    wait: true
    wait_timeout: "8m"
    values:
      # Required by the upstream chart during static validation. The regional
      # stack always overrides this placeholder with the real EKS cluster name.
      clusterName: gco-runtime-injected
      # The real cluster name, region, VPC, and IRSA annotation are injected by
      # the regional stack because they contain deployment-specific tokens.
      serviceAccount:
        create: true
        name: aws-load-balancer-controller
      createIngressClassResource: false
      ingressClassParams:
        create: false
      ingressClass: gco-unused-lbc-ingress
      disableIngressClassAnnotation: true
      webhookConfig:
        disableIngressValidation: true
      enableServiceMutatorWebhook: false
      defaultTargetType: ip
      defaultLoadBalancerScheme: internal
      controllerConfig:
        featureGates:
          ALBGatewayAPI: true
          NLBGatewayAPI: false
          EnableServiceController: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 512Mi
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

  # KEDA - Kubernetes Event-Driven Autoscaling
  # Enables autoscaling based on external metrics (SQS, Kafka, Prometheus, etc.)
  # https://keda.sh/
  keda:
    enabled: true
    repo_name: kedacore
    repo_url: https://kedacore.github.io/charts
    chart: keda
    version: "2.20.2"
    namespace: keda
    create_namespace: true
    values:
      # Use GitHub Container Registry (ghcr.io) - official KEDA images
      image:
        keda:
          registry: ghcr.io
          repository: kedacore/keda
          # tag defaults to chart appVersion
        metricsApiServer:
          registry: ghcr.io
          repository: kedacore/keda-metrics-apiserver
        webhooks:
          registry: ghcr.io
          repository: kedacore/keda-admission-webhooks
      # Watch all namespaces (empty string = all namespaces)
      watchNamespace: ""
      # Service account configuration for IRSA (IAM Roles for Service Accounts)
      # The operator service account needs IAM permissions to access SQS for scaling
      serviceAccount:
        operator:
          create: true
          name: keda-operator
      # Resource configuration
      resources:
        operator:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        metricServer:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      # Prometheus metrics
      prometheus:
        metricServer:
          enabled: true
        operator:
          enabled: true
      # Prevent Karpenter from evicting KEDA pods during node consolidation
      podAnnotations:
        keda:
          karpenter.sh/do-not-disrupt: "true"
        metricsApiServer:
          karpenter.sh/do-not-disrupt: "true"
        webhooks:
          karpenter.sh/do-not-disrupt: "true"

  # AWS EFA Kubernetes Device Plugin - Manages EFA devices in EKS clusters
  # Enables high-performance inter-node communication for distributed training
  # and high-performance inference (NIXL + EFA for KV-cache transfer)
  # https://github.com/aws/eks-charts/tree/master/stable/aws-efa-k8s-device-plugin
  aws-efa-device-plugin:
    enabled: false  # Toggled on by cdk.json aws_efa_device_plugin.enabled (enabled by default)
    repo_name: eks
    repo_url: https://aws.github.io/eks-charts
    chart: aws-efa-k8s-device-plugin
    version: "v0.5.30"
    namespace: kube-system
    create_namespace: false
    values:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: vpc.amazonaws.com/efa
          operator: Exists
          effect: NoSchedule
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule

  # AWS Neuron Device Plugin - Manages Neuron devices for Trainium/Inferentia
  # Advertises aws.amazon.com/neuron and aws.amazon.com/neuroncore resources
  # https://github.com/aws-neuron/aws-neuron-sdk
  aws-neuron-device-plugin:
    enabled: true
    repo_name: neuron-oci
    repo_url: oci://public.ecr.aws/neuron
    chart: neuron-helm-chart
    version: "1.9.0"
    namespace: kube-system
    create_namespace: false
    use_oci: true
    values:
      npd:
        enabled: false
      scheduler:
        enabled: false
      devicePlugin:
        tolerations:
          - key: aws.amazon.com/neuron
            operator: Exists
            effect: NoSchedule
          - key: vpc.amazonaws.com/efa
            operator: Exists
            effect: NoSchedule

  # Volcano - Kubernetes-native batch scheduler for AI/ML workloads
  # Provides gang scheduling, fair-share, and queue management for batch jobs
  # https://volcano.sh/
  volcano:
    enabled: true
    repo_name: volcano-sh
    repo_url: https://volcano-sh.github.io/helm-charts
    chart: volcano
    version: "1.15.1"
    namespace: volcano-system
    create_namespace: true
    # Per-chart readiness gate (honored by handler.install_chart):
    #   wait:         map to `helm --wait` when true. Default true.
    #   wait_timeout: map to `helm --timeout`. Default "10m".
    # Volcano is the only chart that pulls exclusively from docker.io
    # (volcanosh/vc-*). On a cold cluster those pulls are slow / rate-limited
    # and a blocking `--wait` cannot finish inside the installer Lambda's
    # wall-clock guard (HELM_CMD_TIMEOUT_SECONDS, default 780s), which made the
    # whole add-on batch loop on Volcano. We therefore let Volcano converge
    # asynchronously: helm returns once the manifests are applied and the
    # scheduler/controller/admission pods come up in the background. The durable
    # fix for the pull speed itself is the Docker Hub ECR pull-through cache,
    # which (when enabled in cdk.json) overrides basic.image_registry below.
    wait: false
    wait_timeout: "8m"
    values:
      # Basic configuration - Volcano works well with defaults
      basic:
        controller_image_name: volcanosh/vc-controller-manager
        scheduler_image_name: volcanosh/vc-scheduler
        admission_image_name: volcanosh/vc-webhook-manager
        # Pin the image tag explicitly (matches the chart's v1.15.0 appVersion)
        # rather than relying on the chart default. This is the tag
        # `gco images mirror` mirrors into ECR and the tag helm
        # requests, so the two can never drift. Bump in lockstep with the chart
        # `version` above, then re-run the mirror (or just redeploy).
        image_tag_version: "v1.15.1"
        controller_podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
        scheduler_podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
        admission_podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      # Enable all plugins for comprehensive scheduling
      custom:
        scheduler_config:
          actions: "enqueue, allocate, backfill"
          tiers:
            - plugins:
                - name: priority
                - name: gang
                - name: conformance
            - plugins:
                - name: drf
                - name: predicates
                - name: proportion
                - name: nodeorder
                - name: binpack

  # KubeRay - Kubernetes operator for Ray distributed computing
  # Enables distributed training, hyperparameter tuning, and model serving with Ray
  # https://ray-project.github.io/kuberay/
  kuberay-operator:
    enabled: true
    repo_name: kuberay
    repo_url: https://ray-project.github.io/kuberay-helm
    chart: kuberay-operator
    version: "1.6.2"
    namespace: ray-system
    create_namespace: true
    values:
      # Use Quay.io images (official KubeRay images)
      image:
        repository: quay.io/kuberay/operator
        tag: v1.6.2
      # Resource configuration
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Watch all namespaces for RayCluster CRs
      watchNamespace: ""
      # Prevent Karpenter from evicting the operator during node consolidation
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"

  # cert-manager - Automatic TLS certificate management for Kubernetes
  # Required by the Slinky Slurm Operator webhook for TLS certificates.
  # Also useful for any workload that needs automated certificate issuance.
  # https://cert-manager.io/
  cert-manager:
    enabled: true
    repo_name: jetstack
    repo_url: https://charts.jetstack.io
    chart: cert-manager
    version: "v1.21.1"
    namespace: cert-manager
    create_namespace: true
    values:
      # Install CRDs with the chart
      crds:
        enabled: true
      # Disable the post-install startupapicheck hook. It runs as a Helm
      # post-install hook Job that `helm --wait` blocks on (a *separate* wait
      # from the main resources, each bounded by --timeout). In this
      # private EKS Auto Mode cluster that hook wait runs past the installer
      # Lambda's HELM_CMD_TIMEOUT_SECONDS (780s) guard, so helm gets SIGKILLed
      # and the release is left wedged in `pending-install` even though the
      # controller/webhook/cainjector Deployments are all healthy in ~2m.
      # startupapicheck is only a best-effort post-install API probe — cert-manager
      # is fully functional without it — so disabling it lets `helm --wait`
      # return as soon as the (healthy) Deployments are Ready. See docs/IMAGE_MIRROR.md
      # discussion of the 780s wait guard.
      startupapicheck:
        enabled: false
      # Prevent Karpenter from evicting cert-manager pods during node consolidation
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      # Resource configuration
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      webhook:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      cainjector:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

  # Slinky Slurm Operator - Run Slurm on Kubernetes
  # Deploys the Kubernetes operator for managing Slurm cluster lifecycles (creation,
  # upgrade, graceful shutdown). Enables HPC-style batch scheduling alongside
  # Kubernetes-native workloads on the same cluster.
  # https://github.com/SlinkyProject/slurm-operator
  slinky-slurm-operator:
    enabled: false
    repo_name: slinky-oci
    repo_url: oci://ghcr.io/slinkyproject/charts
    chart: slurm-operator
    version: "1.2.1"
    namespace: slurm-operator
    create_namespace: true
    use_oci: true
    values:
      # CRD management — let the chart install and upgrade CRDs
      crds:
        enabled: true
      # Operator configuration
      operator:
        enabled: true
        replicas: 1
        image:
          repository: ghcr.io/slinkyproject/slurm-operator
          tag: "1.2.1"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        tolerations: []
        # Prevent Karpenter from evicting the operator during node consolidation
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      # Webhook for validation and defaulting of Slurm CRDs
      webhook:
        enabled: true
        image:
          repository: ghcr.io/slinkyproject/slurm-operator-webhook
          tag: "1.2.1"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      # cert-manager is required for webhook TLS certificates
      certManager:
        enabled: true

  # Slinky Slurm Cluster - Deploys a ready-to-use Slurm cluster on Kubernetes
  # Installs after the operator and creates controller, workers, login, and REST API pods.
  # Users can immediately submit jobs via sbatch/srun from the login pod.
  # https://github.com/SlinkyProject/slurm-operator/tree/main/helm/slurm
  slinky-slurm:
    enabled: false
    repo_name: slinky-oci
    repo_url: oci://ghcr.io/slinkyproject/charts
    chart: slurm
    version: "1.2.1"
    namespace: gco-jobs
    create_namespace: false
    use_oci: true
    values:
      # Slurm cluster name
      clusterName: gco-slurm
      # Controller (slurmctld) — head node
      controller:
        # Use the pre-provisioned EFS PVC for controller state persistence.
        # This avoids dynamic EFS provisioning which requires additional IAM permissions.
        persistence:
          existingClaim: gco-shared-storage
        slurmctld:
          image:
            repository: ghcr.io/slinkyproject/slurmctld
            tag: "25.11-ubuntu24.04"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        podSpec:
          nodeSelector:
            kubernetes.io/os: linux
      # Worker nodes (slurmd)
      nodeSets:
        - name: workers
          replicas: 2
          slurmd:
            image:
              repository: ghcr.io/slinkyproject/slurmd
              tag: "25.11-ubuntu24.04"
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                cpu: "2"
                memory: 4Gi
          podSpec:
            nodeSelector:
              kubernetes.io/os: linux
      # Login pods are disabled by default. GCO submits Slurm jobs via the
      # Kubernetes API (gco jobs submit-direct), not via SSH. Enabling the
      # login set creates a separate LoadBalancer (NLB), which adds cost and is
      # not part of the GCO API path; GA registration explicitly ignores it.
      # For interactive access, use: kubectl exec -it <controller-pod> -- bash
      loginsets:
        slinky:
          enabled: false
      # REST API (slurmrestd) — used by operator for lifecycle management
      restapi:
        slurmrestd:
          image:
            repository: ghcr.io/slinkyproject/slurmrestd
            tag: "25.11-ubuntu24.04"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        podSpec:
          nodeSelector:
            kubernetes.io/os: linux
      # Disable accounting (MariaDB) by default
      accounting:
        enabled: false

  # Apache YuniKorn - Universal resource scheduler for Kubernetes
  # Provides app-aware scheduling, hierarchical queues, resource quotas,
  # fair-sharing, and preemption for multi-tenant AI/ML clusters.
  # https://yunikorn.apache.org/
  yunikorn:
    enabled: false
    repo_name: yunikorn
    repo_url: https://apache.github.io/yunikorn-release
    chart: yunikorn
    version: "1.9.0"
    namespace: yunikorn
    create_namespace: true
    values:
      # Disable the admission controller — YuniKorn only schedules pods that
      # explicitly set schedulerName: yunikorn. This prevents interference with
      # other schedulers (Volcano, Kueue) and system pods (keda, cert-manager).
      embedAdmissionController: false
      admissionController:
        replicaCount: 0
      # Prevent Karpenter from evicting the scheduler during node consolidation
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      # YuniKorn scheduler configuration
      yunikornDefaults:
        # Default queue configuration with a root queue and child queues
        # for GPU and CPU workloads with resource quotas
        queues.yaml: |
          partitions:
            - name: default
              placementrules:
                - name: tag
                  value: namespace
                  create: true
              queues:
                - name: root
                  submitacl: '*'
                  queues:
                    - name: gpu-workloads
                      resources:
                        guaranteed:
                          memory: 64G
                          vcore: 32
                        max:
                          memory: 256G
                          vcore: 128
                    - name: cpu-workloads
                      resources:
                        guaranteed:
                          memory: 32G
                          vcore: 16
                        max:
                          memory: 128G
                          vcore: 64
                    - name: default
                      resources:
                        max:
                          memory: 64G
                          vcore: 32

  # kube-prometheus-stack - self-hosted in-cluster observability
  # Bundles Prometheus, Alertmanager, Grafana, kube-state-metrics, node-exporter,
  # and the Prometheus Operator. Installed on every regional cluster when
  # cdk.json cluster_observability.enabled = true (the default). Inclusion and
  # the dynamic values (persistence sizes, retention, gp3 storageClassName, and
  # GPU/Neuron node-exporter tolerations) are driven by GCORegionalStack, not by
  # the helm block above, so the default here is enabled: false. Grafana uses
  # native auth (no self sign-up, no anonymous) and a ClusterIP service; access
  # is via `gco monitoring open` (kubectl port-forward). The admin password is
  # auto-generated by the Grafana subchart into the <release>-grafana Secret and
  # is never templated here. See docs/MONITORING.md.
  # wait: false because a cold first pull of the six component images can exceed
  # the installer's per-chart wall-clock guard (same rationale as Volcano).
  # https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
  kube-prometheus-stack:
    enabled: false
    repo_name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: "88.2.0"
    namespace: monitoring
    create_namespace: true
    wait: false
    wait_timeout: "8m"
    values:
      # Grafana: native auth only, private ClusterIP, dashboards imported by the
      # sidecar from ConfigMaps labeled grafana_dashboard="1".
      grafana:
        service:
          type: ClusterIP
        # Private only: no Ingress/ALB. Access is via `gco monitoring open`
        # (kubectl port-forward) against the PRIVATE EKS endpoint.
        ingress:
          enabled: false
        # The Grafana subchart auto-generates the <release>-grafana Secret
        # (admin-user/admin-password) because admin.existingSecret is unset.
        grafana.ini:
          users:
            allow_sign_up: false
          auth:
            disable_login_form: false
          auth.anonymous:
            enabled: false
          security:
            cookie_secure: true
            cookie_samesite: lax
        persistence:
          enabled: true
          type: pvc
          accessModes:
            - ReadWriteOnce
        # First-boot tolerance: Grafana runs its full database migration set
        # (plus the unified-storage search index build) against the fresh PVC
        # before it listens on 3000. A live deployment measured 7+ minutes,
        # which the subchart's default liveness budget (60s initial delay +
        # 10 failures x 10s) cut short: kubelet killed Grafana mid-migration,
        # every restart redid the work, and the pod crash-looped. Allow ~11
        # minutes before liveness kills it; readiness stays on the subchart
        # default so traffic only flows once /api/health actually answers.
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 60
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: monitoring
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      # EKS manages the control plane: etcd, the scheduler, and the controller
      # manager are not reachable as pods, and EKS Auto Mode runs no kube-proxy
      # DaemonSet and provides DNS as a built-in capability (no CoreDNS pods in
      # kube-system for the k8s-app=kube-dns selector to match). Their exporters
      # would render kube-system Services whose selectors can never have ready
      # endpoints, so release validation (and scraping) disables them.
      kubeEtcd:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeControllerManager:
        enabled: false
      kubeProxy:
        enabled: false
      coreDns:
        enabled: false
      # Prometheus: discover ServiceMonitors/PodMonitors cluster-wide (not just
      # ones labeled with this release) so GCO component monitors are scraped.
      prometheus:
        service:
          type: ClusterIP
        prometheusSpec:
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
          podMetadata:
            annotations:
              karpenter.sh/do-not-disrupt: "true"
      alertmanager:
        service:
          type: ClusterIP
        alertmanagerSpec:
          storage:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
          podMetadata:
            annotations:
              karpenter.sh/do-not-disrupt: "true"
      # node-exporter tolerations are injected by GCORegionalStack so the
      # DaemonSet schedules on tainted GPU/Neuron/EFA nodes.
      #
      # Intentionally NO karpenter.sh/do-not-disrupt on node-exporter. Unlike the
      # singleton/stateful components above, node-exporter is a DaemonSet that runs
      # on EVERY node, so the annotation would pin every node against graceful
      # termination until the NodePool terminationGracePeriod (24h) elapses —
      # Karpenter/EKS Auto Mode holds the node the whole time, blocking
      # consolidation, scale-down, spot reclaim, and even manual NodeClaim
      # deletion. do-not-disrupt belongs only on singleton pods you don't want
      # voluntarily consolidated, never on a DaemonSet. The upstream chart still
      # sets cluster-autoscaler.kubernetes.io/safe-to-evict=true, which is correct.
      kube-state-metrics:
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
      prometheusOperator:
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"

  # OpenCost - Kubernetes cost allocation and monitoring
  # Reads usage data from the in-cluster Prometheus (kube-prometheus-stack)
  # and AWS list prices, and exposes per-namespace/-controller/-pod cost
  # allocation via its API (9003), UI (9090), and Prometheus metrics that the
  # Grafana cost dashboard renders. Installed on every regional cluster when
  # cdk.json cost_monitoring.enabled = true (the default) AND
  # cluster_observability.enabled = true. Inclusion and the dynamic values
  # (cluster id, Prometheus service wiring) are driven by GCORegionalStack,
  # so the default here is enabled: false — mirroring kube-prometheus-stack.
  # Must install AFTER kube-prometheus-stack: the ServiceMonitor below needs
  # the Prometheus Operator CRDs that chart applies.
  # Access is via `gco monitoring open --service opencost` or
  # `gco costs dashboard` (kubectl port-forward over the PRIVATE EKS
  # endpoint); there is no public endpoint. See docs/COST_MONITORING.md.
  # wait: false for the same cold-image-pull rationale as kube-prometheus-stack.
  # https://github.com/opencost/opencost-helm-chart
  opencost:
    enabled: false
    repo_name: opencost
    repo_url: https://opencost.github.io/opencost-helm-chart
    chart: opencost
    version: "2.5.29"
    namespace: monitoring
    create_namespace: false
    wait: false
    wait_timeout: "8m"
    values:
      # NOTE: the chart's root-level ``clusterName`` is the Kubernetes DNS
      # zone (default ``cluster.local``) used to build the Prometheus URL —
      # overriding it with the EKS cluster name breaks DNS resolution and
      # crash-loops the cost model. The cluster's *identity* is
      # ``opencost.exporter.defaultClusterId`` below, injected by the
      # regional stack because it carries deployment tokens
      # (<project>-<region>).
      # Never voluntarily consolidate the singleton cost model pod.
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      # NetworkPolicies stay off: the monitoring namespace has no restrictive
      # default-deny policy, and enabling the chart's policy would require
      # keeping its Prometheus pod selector in lockstep with
      # kube-prometheus-stack's labels for no isolation gain today.
      networkPolicies:
        enabled: false
      opencost:
        # The MCP (Model Context Protocol) server is an additional
        # unauthenticated HTTP surface aimed at AI-agent integrations. GCO
        # exposes cost data through the authenticated GCO API and Athena
        # instead, so the extra listener stays off.
        mcp:
          enabled: false
        exporter:
          # Injected by the regional stack (<project>-<region>).
          defaultClusterId: gco-runtime-injected
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
        metrics:
          serviceMonitor:
            # kube-prometheus-stack discovers ServiceMonitors cluster-wide
            # (serviceMonitorSelectorNilUsesHelmValues: false), so the
            # chart-created monitor is scraped without extra wiring. This is
            # what feeds the node_*_hourly_cost series the Grafana cost
            # dashboard renders.
            enabled: true
        prometheus:
          external:
            enabled: false
          internal:
            enabled: true
            serviceName: kube-prometheus-stack-prometheus
            namespaceName: monitoring
            port: 9090
        ui:
          # No securityContext override: upstream ships ``{}`` because the UI
          # image's entrypoint rewrites /var/www assets (BASE_URL sed) and
          # hands off to nginx itself — forcing runAsUser breaks that startup
          # rewrite (sed: can't create temp file ... Permission denied) and
          # crash-loops the container.
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 55Mi
            limits:
              memory: 256Mi

  # Kueue - Kubernetes-native job queueing for batch workloads
  # Provides quota management, fair sharing, and priority scheduling
  # IMPORTANT: Kueue must be installed LAST because its mutating webhook
  # intercepts all Job and Deployment creates/updates cluster-wide. If Kueue
  # installs before other charts, its webhook can block their upgrades when
  # the webhook pod is temporarily unavailable during rollouts.
  # https://kueue.sigs.k8s.io/
  kueue:
    enabled: true
    repo_name: kueue-oci
    repo_url: oci://registry.k8s.io/kueue/charts
    chart: kueue
    version: "0.19.0"
    namespace: kueue-system
    create_namespace: true
    use_oci: true
    values:
      # Enable integration with common job types
      enablePlainPod: true
      # Prevent Karpenter from evicting Kueue pods during node consolidation
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      # Controller configuration
      controller:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      # Webhook configuration
      webhook:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
