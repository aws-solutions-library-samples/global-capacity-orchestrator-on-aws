# GCO Ingress — routes external traffic to health-monitor and manifest-processor
# EKS Auto Mode creates and manages the ALB automatically when this Ingress is applied.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gco-ingress
  namespace: gco-system
  labels:
    app: gco
    project: gco
  annotations:
    # The ALB terminates deployment-local authenticated TLS. There is no HTTP
    # listener; pod targets remain HTTP-only inside the cluster boundary.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: "{{BACKEND_TLS_CERTIFICATE_ARN}}"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service:
                name: health-monitor
                port:
                  number: 80
          - path: /api/v1/manifests
            pathType: Prefix
            backend:
              service:
                name: manifest-processor
                port:
                  number: 80
          # All inference traffic terminates at the authenticated manifest
          # processor proxy. Per-endpoint Ingresses are deliberately forbidden:
          # they exposed model servers directly through Global Accelerator and
          # bypassed API Gateway IAM authentication.
          - path: /inference
            pathType: Prefix
            backend:
              service:
                name: manifest-processor
                port:
                  number: 80
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: health-monitor
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: manifest-processor
                port:
                  number: 80
