# Cost Monitor — writes scheduled OpenCost allocation reports (Parquet) to the
# central cost report bucket and serves ad-hoc report generation for the
# /api/v1/cost/* GCO API surface (proxied by the manifest processor).
# ServiceAccount + Deployment + Service consolidated in one file so the whole
# feature is gated on {{COST_MONITORING_ENABLED}}: when cost monitoring is
# disabled the placeholders stay unreplaced, the applier skips this file, and
# the prune inventory removes any previously-applied resources.
#
# Deliberately a single replica: the scheduled reporter is a singleton writer.
# Report object keys are deterministic per window, so even a rollout overlap
# cannot double-count in Athena — concurrent writers converge on the same key.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gco-cost-monitor-sa
  namespace: gco-system
  labels:
    app: cost-monitor
    project: gco
  annotations:
    eks.amazonaws.com/role-arn: "{{COST_MONITOR_ROLE_ARN}}"
    gco.aws/feature-gate: "{{COST_MONITORING_ENABLED}}"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-monitor
  namespace: gco-system
  labels:
    app: cost-monitor
    component: api
    project: gco
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # A new pod counts as available only after staying Ready this long, so a
  # container that passes its readiness probe and then crashes cannot let
  # the rollout retire a healthy old pod.
  minReadySeconds: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cost-monitor
  template:
    metadata:
      labels:
        app: cost-monitor
        component: api
        project: gco
      annotations:
        gco.aws/deployment-timestamp: "{{DEPLOYMENT_TIMESTAMP}}"
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: gco-cost-monitor-sa
      priorityClassName: gco-platform-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cost-monitor
          image: {{COST_MONITOR_IMAGE}}
          # CDK publishes every service image under a content-hash tag, so a
          # cached layer is always the right layer; IfNotPresent lets a pod
          # restart even while the registry is unreachable.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTER_NAME
              value: "{{CLUSTER_NAME}}"
            - name: REGION
              value: "{{REGION}}"
            - name: PROJECT_NAME
              value: "{{PROJECT_NAME}}"
            # The central cost report bucket has a CloudFormation-generated
            # name published by the monitoring stack, which deploys after this
            # region. The service resolves it from this SSM parameter (in the
            # monitoring region) on every scheduled pass until it exists. An
            # explicit COST_REPORT_BUCKET, if set, bypasses discovery (kind/CI).
            - name: COST_REPORT_BUCKET_PARAMETER
              value: "{{COST_REPORT_BUCKET_PARAMETER}}"
            - name: COST_REPORT_BUCKET_PARAMETER_REGION
              value: "{{COST_REPORT_BUCKET_PARAMETER_REGION}}"
            - name: COST_REPORT_INTERVAL_MINUTES
              value: "{{COST_REPORT_INTERVAL_MINUTES}}"
            # Uvicorn drains in-flight report requests for this long after
            # SIGTERM; the pod grace period covers preStop + this value.
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
              value: "20"
            - name: OPENCOST_BASE_URL
              value: "http://opencost.monitoring.svc.cluster.local:9003"
            - name: AWS_ROLE_ARN
              value: "{{COST_MONITOR_ROLE_ARN}}"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # Probes run inside the container over loopback, like every other
          # GCO API container. The pod's only ingress rule admits the manifest
          # processor, so a network probe would depend on the CNI exempting
          # the kubelet's node address from that rule — loopback never does.
          startupProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',8080),3);
                  s.settimeout(3);
                  s.sendall(b'GET /healthz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 5
            periodSeconds: 5
            # See 30-health-monitor.yaml: the probe forks the interpreter, so it
            # starts lean and gets the same 10s the liveness probe gets; a busy
            # node must not turn a healthy server into a restart.
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',8080),3);
                  s.settimeout(3);
                  s.sendall(b'GET /healthz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',8080),3);
                  s.settimeout(3);
                  s.sendall(b'GET /readyz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # The distroless image has no shell; python is the only
                # executable, so the drain sleep runs through it.
                command: ["python", "-c", "import time; time.sleep(5)"]
          volumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cost-monitor
  namespace: gco-system
  labels:
    app: cost-monitor
    project: gco
spec:
  type: ClusterIP
  ports:
    # Same number as the container port on purpose: the VPC CNI's network
    # policy enforcement admits Service traffic reliably only when the
    # Service port equals the container port (EKS network policy
    # considerations), and the manifest processor reaches this Service
    # through an egress rule that names port 8080.
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: cost-monitor
---
# gco-system runs default-deny ingress: admit only the manifest processor
# (the authenticated /api/v1/cost/* proxy) into the cost monitor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-manifest-processor-to-cost-monitor-ingress
  namespace: gco-system
  labels:
    project: gco
  annotations:
    gco.aws/feature-gate: "{{COST_MONITORING_ENABLED}}"
spec:
  podSelector:
    matchLabels:
      app: cost-monitor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: manifest-processor
      ports:
        - protocol: TCP
          port: 8080
---
# The project=gco egress policy limits gco-system platform pods to 443 + DNS.
# The cost monitor additionally needs the OpenCost API (monitoring ns, 9003).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cost-monitor-to-opencost
  namespace: gco-system
  labels:
    project: gco
  annotations:
    gco.aws/feature-gate: "{{COST_MONITORING_ENABLED}}"
spec:
  podSelector:
    matchLabels:
      app: cost-monitor
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9003
---
# ...and the manifest processor needs egress to the cost monitor pod port to
# serve the /api/v1/cost/* proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-manifest-processor-to-cost-monitor-egress
  namespace: gco-system
  labels:
    project: gco
  annotations:
    gco.aws/feature-gate: "{{COST_MONITORING_ENABLED}}"
spec:
  podSelector:
    matchLabels:
      app: manifest-processor
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: cost-monitor
      ports:
        - protocol: TCP
          port: 8080
