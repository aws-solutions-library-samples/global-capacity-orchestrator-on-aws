# Egress for MLflow clients in gco-jobs. The namespace's zero-trust posture
# (03-network-policies.yaml) limits job pods to DNS + 443-to-VPC-endpoints,
# so tracking calls to the in-cluster server need an explicit allow. Scoped
# to pods that opt in with the gco.io/mlflow-client label (see
# examples/mlflow-tracking-job.yaml) and to the tracking server's pods only.
# Port 5000 is both the mlflow Service port and the container port (the
# official chart exposes the server 1:1), so one entry covers CNIs that
# evaluate egress rules before and after the Service DNAT alike.
#
# The tracking server's own metadata claim is chart-managed (storage.enabled
# in lambda/helm-installer/charts.yaml) — nothing to ship here. helm
# uninstall never deletes chart PVCs, so the applier's feature inventory
# still prunes the claim (monitoring/mlflow) alongside this policy when the
# feature is disabled. Pruning DELETES run metadata (deliberate: disabling
# the feature discards the tracking database); run artifacts live in S3 and
# survive.
#
# Only applied when the MLflow conjunction holds (cdk.json
# cluster_observability.enabled AND cluster_observability.mlflow.enabled).
# GCORegionalStack substitutes {{MLFLOW_ENABLED}} only then; otherwise the
# placeholder stays unreplaced, the applier skips this file, and
# _FEATURE_RESOURCE_INVENTORY prunes previously created resources.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mlflow-clients
  namespace: gco-jobs
  labels:
    project: gco
  annotations:
    gco.io/mlflow-enabled: "{{MLFLOW_ENABLED}}"
spec:
  podSelector:
    matchLabels:
      gco.io/mlflow-client: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow
      ports:
        - protocol: TCP
          port: 5000
