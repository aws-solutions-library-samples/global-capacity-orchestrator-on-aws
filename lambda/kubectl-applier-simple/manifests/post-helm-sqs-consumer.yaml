# SQS Queue Processor — Automatically processes manifests submitted via gco jobs submit-sqs
#
# How it works:
#   1. User runs: gco jobs submit-sqs manifest.yaml --region us-east-1
#   2. CLI sends the manifest(s) as JSON to the regional SQS queue
#   3. KEDA detects the message and creates a queue-processor Job pod
#   4. The pod reads the message, validates manifests, applies them via K8s API
#   5. On success → message deleted. On failure → message returns to queue after
#      visibility timeout (5 min), then moves to DLQ after 3 failed attempts.
#
# Scaling: KEDA ScaledJob creates one pod per message batch (configurable).
#   Scales to zero when the queue is empty, up to max_concurrent_jobs when busy.
#   This is NOT an HPA — each pod is a short-lived Job, not a long-running Deployment.
#
# Disabling: Set queue_processor.enabled = false in cdk.json, then redeploy.
#   The applier prunes only the exact built-in gco-system/sqs-queue-processor
#   ScaledJob; unrelated KEDA resources are left untouched. See
#   examples/keda-scaled-job.yaml for a safe, non-consuming scaling example.
#
# Configuration (cdk.json):
#   queue_processor.enabled:                true/false — toggle the built-in consumer
#   queue_processor.polling_interval:       how often KEDA checks the queue (seconds)
#   queue_processor.max_concurrent_jobs:    max consumer pods running in parallel
#   queue_processor.messages_per_job:       target queued messages per active Job
#
# Validation policy (shared with the REST manifest processor, cdk.json →
# job_validation_policy):
#   allowed_namespaces:        namespaces the consumer will apply manifests to
#   resource_quotas.max_*:     max CPU / memory / GPU per submitted manifest
#   trusted_registries/orgs:   image registry allowlist
#   manifest_security_policy:  block_privileged, block_host_network, etc.
#
# Template variables are replaced by the kubectl-applier Lambda
# during CDK deployment using values from the regional stack.

---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: sqs-queue-processor
  namespace: gco-system
  labels:
    app: queue-processor
    project: gco
spec:
  jobTargetRef:
    parallelism: 1                  # One worker per pod
    completions: 1                  # Process one message batch and exit
    backoffLimit: 2                 # Allow at most 2 Job-level retries via replacement Pods
    activeDeadlineSeconds: 300      # Bound the complete Job lifetime, including every retry
    template:
      metadata:
        labels:
          app: queue-processor
          project: gco
      spec:
        # Uses the manifest-processor SA (dedicated IRSA role for SQS + K8s access)
        # Keep ambient Kubernetes credentials disabled. The worker receives
        # only the two explicitly projected tokens below.
        automountServiceAccountToken: false
        enableServiceLinks: false
        serviceAccountName: gco-manifest-processor-sa
        priorityClassName: gco-platform-critical
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: queue-processor
          image: {{QUEUE_PROCESSOR_IMAGE}}
          # CDK publishes every service image under a content-hash tag, so a
          # cached layer is always the right layer; IfNotPresent lets a pod
          # restart even while the registry is unreachable.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          env:
          - name: JOB_QUEUE_URL
            value: "{{JOB_QUEUE_URL}}"
          - name: AWS_REGION
            value: "{{REGION}}"
          - name: AWS_DEFAULT_REGION
            value: "{{REGION}}"
          # IRSA credentials — EKS Auto Mode doesn't auto-inject these
          - name: AWS_ROLE_ARN
            value: "{{MANIFEST_PROCESSOR_ROLE_ARN}}"
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
          # Jobs-table failure recording. A message whose runs cannot be
          # applied (and any message drained after a fatal configuration
          # failure) is surfaced as a terminal FAILED record in the
          # centralized jobs table instead of only a dead-lettered message.
          # DYNAMODB_REGION points JobStore at the global region that hosts
          # the table. The manifest-processor role already grants
          # dynamodb:PutItem/UpdateItem on this table.
          - name: JOBS_TABLE_NAME
            value: "{{JOBS_TABLE_NAME}}"
          - name: DYNAMODB_REGION
            value: "{{DYNAMODB_REGION}}"
          # Lets startup failures name the ServiceAccount whose disabled
          # token automount is being compensated by the projected volume
          # below — the diagnostic that identifies a cluster where the two
          # halves of that pairing came from different releases.
          - name: SERVICE_ACCOUNT_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.serviceAccountName
          - name: ALLOWED_NAMESPACES
            value: "{{QP_ALLOWED_NAMESPACES}}"
          - name: ALLOWED_KINDS
            value: "{{QP_ALLOWED_KINDS}}"
          - name: MAX_GPU_PER_MANIFEST
            value: "{{QP_MAX_GPU_PER_MANIFEST}}"
          - name: MAX_CPU_PER_MANIFEST
            value: "{{QP_MAX_CPU_PER_MANIFEST}}"
          - name: MAX_MEMORY_PER_MANIFEST
            value: "{{QP_MAX_MEMORY_PER_MANIFEST}}"
          - name: TRUSTED_REGISTRIES
            value: "{{QP_TRUSTED_REGISTRIES}}"
          - name: TRUSTED_DOCKERHUB_ORGS
            value: "{{QP_TRUSTED_DOCKERHUB_ORGS}}"
          # Security policy toggles — mirrored from
          # cdk.json::job_validation_policy.manifest_security_policy so the SQS
          # path enforces the same policy as the REST manifest_processor.
          # Keep in sync with gco/services/queue_processor.py::BLOCK_* and
          # gco/stacks/regional_stack.py image_replacements.
          - name: BLOCK_PRIVILEGED
            value: "{{QP_BLOCK_PRIVILEGED}}"
          - name: BLOCK_PRIVILEGE_ESCALATION
            value: "{{QP_BLOCK_PRIVILEGE_ESCALATION}}"
          - name: BLOCK_HOST_NETWORK
            value: "{{QP_BLOCK_HOST_NETWORK}}"
          - name: BLOCK_HOST_PID
            value: "{{QP_BLOCK_HOST_PID}}"
          - name: BLOCK_HOST_IPC
            value: "{{QP_BLOCK_HOST_IPC}}"
          - name: BLOCK_HOST_PATH
            value: "{{QP_BLOCK_HOST_PATH}}"
          - name: BLOCK_ADDED_CAPABILITIES
            value: "{{QP_BLOCK_ADDED_CAPABILITIES}}"
          - name: BLOCK_RUN_AS_ROOT
            value: "{{QP_BLOCK_RUN_AS_ROOT}}"
          # Require accelerator jobs to carry a matching toleration — mirrored
          # from cdk.json::job_validation_policy.require_accelerator_toleration
          # so the SQS path enforces the same policy as the REST path.
          - name: REQUIRE_ACCELERATOR_TOLERATION
            value: "{{QP_REQUIRE_ACCELERATOR_TOLERATION}}"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: aws-iam-token
            mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
            readOnly: true
          # The service account disables ambient token automount. Project a
          # separate Kubernetes-audience token at the standard client path;
          # the STS-audience token above cannot authenticate to kube-apiserver.
          - name: kubernetes-api-token
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
        volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
        - name: kubernetes-api-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        restartPolicy: Never

  # KEDA scaling configuration
  pollingInterval: {{QP_POLLING_INTERVAL}}                    # Seconds between SQS checks
  successfulJobsHistoryLimit: {{QP_SUCCESSFUL_JOBS_HISTORY}}  # Completed pods to keep
  failedJobsHistoryLimit: {{QP_FAILED_JOBS_HISTORY}}          # Failed pods to keep
  maxReplicaCount: {{QP_MAX_CONCURRENT_JOBS}}                 # Max parallel consumer pods
  minReplicaCount: 0                                          # Scale to zero when idle

  # SQS trigger — KEDA operator polls the queue using its own IRSA role
  # (no TriggerAuthentication CRD needed; identityOwner: operator tells KEDA
  # to use its service account's IAM role for SQS access)
  triggers:
  - type: aws-sqs-queue
    metadata:
      queueURL: "{{JOB_QUEUE_URL}}"
      # KEDA target queue depth per active Job. Each queue-processor Job still
      # receives and processes at most one SQS message before exiting.
      queueLength: "{{QP_MESSAGES_PER_JOB}}"
      awsRegion: "{{REGION}}"
      identityOwner: operator
