# Grafana admin credential rotation (cluster observability, post-Helm pass)
#
# The kube-prometheus-stack Grafana subchart auto-generates a strong random
# admin password into the kube-prometheus-stack-grafana Secret on install.
# This CronJob rotates it on a schedule so the standing credential is refreshed
# rather than living unchanged for the cluster's lifetime.
#
# It runs an existing GCO service image (via {{MANIFEST_PROCESSOR_IMAGE}}, which
# already ships the gco package + the Kubernetes client + requests) so no extra
# container image is introduced; the entrypoint is gco/services/grafana_rotator.py.
# The rotator resets the password through Grafana's admin HTTP API and patches
# the Secret, so the ServiceAccount only needs get/patch on that one Secret — no
# pods/exec, no AWS/IRSA.
#
# Everything here lives in the chart-created monitoring namespace and is gated on
# {{CLUSTER_OBSERVABILITY_ENABLED}}: when observability is disabled the gate stays
# unresolved and the kubectl-applier skips the whole file. The schedule is driven
# by cdk.json cluster_observability.grafana.admin_password_rotation_schedule via
# {{GRAFANA_ADMIN_PASSWORD_ROTATION_SCHEDULE}}.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gco-grafana-rotator
  namespace: monitoring
  labels:
    project: gco
    app: gco-observability
  annotations:
    gco.io/cluster-observability-enabled: "{{CLUSTER_OBSERVABILITY_ENABLED}}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gco-grafana-rotator
  namespace: monitoring
  labels:
    project: gco
    app: gco-observability
  annotations:
    gco.io/cluster-observability-enabled: "{{CLUSTER_OBSERVABILITY_ENABLED}}"
rules:
  # Least privilege: read + patch only the one chart-generated Grafana Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kube-prometheus-stack-grafana"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gco-grafana-rotator
  namespace: monitoring
  labels:
    project: gco
    app: gco-observability
  annotations:
    gco.io/cluster-observability-enabled: "{{CLUSTER_OBSERVABILITY_ENABLED}}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gco-grafana-rotator
subjects:
  - kind: ServiceAccount
    name: gco-grafana-rotator
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gco-grafana-admin-password-rotation
  namespace: monitoring
  labels:
    project: gco
    app: gco-observability
  annotations:
    gco.io/cluster-observability-enabled: "{{CLUSTER_OBSERVABILITY_ENABLED}}"
spec:
  schedule: "{{GRAFANA_ADMIN_PASSWORD_ROTATION_SCHEDULE}}"
  # Skip a run if a previous one is still going; never overlap rotations.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            project: gco
            app: gco-observability
          annotations:
            karpenter.sh/do-not-disrupt: "true"
        spec:
          serviceAccountName: gco-grafana-rotator
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: "{{MANIFEST_PROCESSOR_IMAGE}}"
              imagePullPolicy: Always
              command: ["python", "-m", "gco.services.grafana_rotator"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: GRAFANA_NAMESPACE
                  value: "monitoring"
                - name: GRAFANA_ADMIN_SECRET
                  value: "kube-prometheus-stack-grafana"
                - name: GRAFANA_SERVICE_URL
                  value: "http://kube-prometheus-stack-grafana.monitoring.svc"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
