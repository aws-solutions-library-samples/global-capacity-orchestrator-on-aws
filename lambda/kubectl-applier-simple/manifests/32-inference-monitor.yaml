# Inference Monitor — reconciliation controller for inference endpoints
# Polls DynamoDB for desired state and syncs K8s Deployments/Services/Ingress/HPA.
# Deployment + PodDisruptionBudget consolidated in one file.
#
# Replica model: the reconciler is leader-elected through the
# inference-monitor-leader Lease in gco-inference (see inference_monitor.py),
# so the second replica is a hot standby that takes over within one lease
# duration. Adding replicas adds no throughput; two are for availability.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-monitor
  namespace: gco-system
  labels:
    app: inference-monitor
    component: controller
    project: gco
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inference-monitor
  template:
    metadata:
      labels:
        app: inference-monitor
        component: controller
        project: gco
      annotations:
        gco.aws/deployment-timestamp: "{{DEPLOYMENT_TIMESTAMP}}"
    spec:
      serviceAccountName: gco-inference-monitor-sa
      priorityClassName: gco-platform-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      # One reconcile pass may be mid-flight when SIGTERM arrives; the handler
      # in main() finishes the cycle before exiting, and a pass is bounded by
      # the Kubernetes/DynamoDB request timeouts (30s each).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inference-monitor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inference-monitor
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inference-monitor
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inference-monitor
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: inference-monitor
          image: {{INFERENCE_MONITOR_IMAGE}}
          # CDK publishes every service image under a content-hash tag, so a
          # cached layer is always the right layer; IfNotPresent lets a pod
          # restart even while the registry is unreachable.
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: CLUSTER_NAME
              value: "{{CLUSTER_NAME}}"
            - name: REGION
              value: "{{REGION}}"
            - name: AWS_ROLE_ARN
              value: "{{SERVICE_ACCOUNT_ROLE_ARN}}"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
            - name: INFERENCE_ENDPOINTS_TABLE_NAME
              value: "{{INFERENCE_ENDPOINTS_TABLE_NAME}}"
            - name: DYNAMODB_REGION
              value: "{{DYNAMODB_REGION}}"
            - name: PROJECT_NAME
              value: "{{PROJECT_NAME}}"
            - name: INFERENCE_NAMESPACE
              value: "gco-inference"
            - name: RECONCILE_INTERVAL_SECONDS
              value: "15"
            # Prometheus metrics port scraped by the cluster-observability
            # PodMonitor (gco-inference-monitor). Matches METRICS_PORT read by
            # gco/services/service_metrics.start_metrics_server.
            - name: METRICS_PORT
              value: "9090"
            # Default image for the shared per-region Mooncake master
            # StatefulSet. This upstream vLLM image bundles the
            # mooncake-transfer-engine, so the mooncake_master binary is on
            # PATH. A per-endpoint spec.mooncake.store.master_image overrides it.
            - name: MOONCAKE_MASTER_IMAGE
              value: "{{MOONCAKE_MASTER_IMAGE}}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The controller has no request path; the Prometheus endpoint that
          # start_metrics_server binds on :9090 is the process's one network
          # surface, so it is the honest liveness signal. A stuck reconcile
          # loop is visible in the exported seconds_since_last_pass gauge.
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
            - name: kubernetes-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
        # Explicit, short-lived API token: the ServiceAccount disables
        # automount, so the reconciler's Kubernetes client is fed by this
        # projection (same shape as health-monitor and manifest-processor).
        - name: kubernetes-api-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
      restartPolicy: Always
---
# maxUnavailable rather than minAvailable: one voluntary disruption at a
# time, whatever the replica count, so the standby can always take the Lease.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference-monitor-pdb
  namespace: gco-system
  labels:
    app: inference-monitor
    project: gco
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: inference-monitor
