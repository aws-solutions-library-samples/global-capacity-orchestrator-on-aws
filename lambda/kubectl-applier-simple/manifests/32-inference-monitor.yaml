# Inference Monitor — reconciliation controller for inference endpoints
# Polls DynamoDB for desired state and syncs K8s Deployments/Services/Ingress/HPA.
# Deployment + PodDisruptionBudget consolidated in one file.
#
# Replica model: the reconciler is leader-elected through the
# inference-monitor-leader Lease in gco-inference (see inference_monitor.py),
# so the second replica is a hot standby that takes over within one lease
# duration. Adding replicas adds no throughput; two are for availability.
#
# Metrics: the Prometheus endpoint binds pod loopback (127.0.0.1:9090) and the
# metrics-tls-proxy sidecar serves it on 9443 with the inference-monitor-tls
# leaf (post-helm-api-workload-certificates.yaml), which Prometheus verifies
# against the GCO internal CA. The leaf is a post-Helm object, so on a fresh
# cluster these pods wait in ContainerCreating until cert-manager issues it,
# as the API workloads wait for theirs.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-monitor
  namespace: gco-system
  labels:
    app: inference-monitor
    component: controller
    project: gco
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # A new pod counts as available only after staying Ready this long, so a
  # container that passes its readiness probe and then crashes cannot let
  # the rollout retire a healthy old pod.
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inference-monitor
  template:
    metadata:
      labels:
        app: inference-monitor
        component: controller
        project: gco
      annotations:
        gco.aws/deployment-timestamp: "{{DEPLOYMENT_TIMESTAMP}}"
        eks.amazonaws.com/skip-containers: "metrics-tls-proxy"
    spec:
      serviceAccountName: gco-inference-monitor-sa
      priorityClassName: gco-platform-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      # One reconcile pass may be mid-flight when SIGTERM arrives; the handler
      # in main() finishes the cycle before exiting, and a pass is bounded by
      # the Kubernetes/DynamoDB request timeouts (30s each).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inference-monitor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inference-monitor
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inference-monitor
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inference-monitor
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: inference-monitor
          image: {{INFERENCE_MONITOR_IMAGE}}
          # CDK publishes every service image under a content-hash tag, so a
          # cached layer is always the right layer; IfNotPresent lets a pod
          # restart even while the registry is unreachable.
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: CLUSTER_NAME
              value: "{{CLUSTER_NAME}}"
            - name: REGION
              value: "{{REGION}}"
            - name: AWS_ROLE_ARN
              value: "{{SERVICE_ACCOUNT_ROLE_ARN}}"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
            - name: INFERENCE_ENDPOINTS_TABLE_NAME
              value: "{{INFERENCE_ENDPOINTS_TABLE_NAME}}"
            - name: DYNAMODB_REGION
              value: "{{DYNAMODB_REGION}}"
            - name: PROJECT_NAME
              value: "{{PROJECT_NAME}}"
            - name: INFERENCE_NAMESPACE
              value: "gco-inference"
            - name: RECONCILE_INTERVAL_SECONDS
              value: "15"
            # The plaintext Prometheus listener
            # (gco/services/service_metrics.start_metrics_server) binds pod
            # loopback only; the metrics-tls-proxy sidecar below serves it on
            # 9443 over TLS, which is what the gco-inference-monitor PodMonitor
            # scrapes and the only port the pod admits.
            - name: METRICS_HOST
              value: "127.0.0.1"
            - name: METRICS_PORT
              value: "9090"
            # Default image for the shared per-region Mooncake master
            # StatefulSet. This upstream vLLM image bundles the
            # mooncake-transfer-engine, so the mooncake_master binary is on
            # PATH. A per-endpoint spec.mooncake.store.master_image overrides it.
            - name: MOONCAKE_MASTER_IMAGE
              value: "{{MOONCAKE_MASTER_IMAGE}}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The controller has no request path; the Prometheus endpoint that
          # start_metrics_server serves on 127.0.0.1:9090 is the process's one
          # listener, so it is the honest liveness signal. A stuck reconcile
          # loop is visible in the exported seconds_since_last_pass gauge. The
          # kubelet cannot reach pod loopback, so these are exec probes built
          # like 30-health-monitor.yaml's: a lean interpreter and a bare-socket
          # request, with the same timeouts and the one-minute liveness window.
          startupProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9090),3);
                  s.settimeout(3);
                  s.sendall(b'GET /metrics HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9090),3);
                  s.settimeout(3);
                  s.sendall(b'GET /metrics HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9090),3);
                  s.settimeout(3);
                  s.sendall(b'GET /metrics HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
            - name: kubernetes-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        # TLS front for the metrics endpoint, the same hot-reloading proxy the
        # API pods run (gco/services/tls_proxy.py) from this pod's own image.
        # It holds no AWS credentials (skip-containers above) and mounts the
        # inference-monitor-tls leaf, which only it can read. The kubelet
        # probes it directly: 9443 admits any source
        # (allow-metrics-to-inference-monitor). No preStop: nothing routes
        # traffic here through an endpoint list that must drain first.
        - name: metrics-tls-proxy
          image: {{INFERENCE_MONITOR_IMAGE}}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "gco.services.tls_proxy"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: https-metrics
              containerPort: 9443
              protocol: TCP
          env:
            - name: GCO_TLS_CERT_FILE
              value: /var/run/gco/tls/tls.crt
            - name: GCO_TLS_KEY_FILE
              value: /var/run/gco/tls/tls.key
            - name: TLS_PROXY_PORT
              value: "9443"
            - name: TLS_PROXY_UPSTREAM_PORT
              value: "9090"
            # A scrape lasts milliseconds; drain briefly and let the pod's
            # grace period belong to the reconcile pass.
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
              value: "10"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: https-metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: https-metrics
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: https-metrics
              scheme: HTTPS
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: metrics-tls
              mountPath: /var/run/gco/tls
              readOnly: true
      volumes:
        - name: metrics-tls
          secret:
            secretName: inference-monitor-tls
            defaultMode: 288
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
        # Explicit, short-lived API token: the ServiceAccount disables
        # automount, so the reconciler's Kubernetes client is fed by this
        # projection (same shape as health-monitor and manifest-processor).
        - name: kubernetes-api-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
      restartPolicy: Always
---
# maxUnavailable rather than minAvailable: one voluntary disruption at a
# time, whatever the replica count, so the standby can always take the Lease.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference-monitor-pdb
  namespace: gco-system
  labels:
    app: inference-monitor
    project: gco
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: inference-monitor
