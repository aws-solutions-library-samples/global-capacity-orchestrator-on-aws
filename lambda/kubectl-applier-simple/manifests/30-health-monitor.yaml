# Health Monitor — monitors cluster resource utilization and exposes /api/v1/health
# Deployment + PodDisruptionBudget + Service consolidated in one file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  namespace: gco-system
  labels:
    app: health-monitor
    component: api
    project: gco
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: health-monitor
  template:
    metadata:
      labels:
        app: health-monitor
        component: api
        project: gco
      annotations:
        gco.aws/deployment-timestamp: "{{DEPLOYMENT_TIMESTAMP}}"
        eks.amazonaws.com/skip-containers: "api-tls-proxy"
    spec:
      serviceAccountName: gco-health-monitor-sa
      priorityClassName: gco-platform-critical
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: health-monitor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: health-monitor
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: health-monitor
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: health-monitor
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: health-monitor
          image: {{HEALTH_MONITOR_IMAGE}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: app-http
              containerPort: 9000
              protocol: TCP
          env:
            - name: HOST
              value: "127.0.0.1"
            - name: PORT
              value: "9000"
            - name: CLUSTER_NAME
              value: "{{CLUSTER_NAME}}"
            - name: REGION
              value: "{{REGION}}"
            # Stable, replica-unique identity and namespace for Kubernetes
            # Lease leader election. Followers continue serving health checks.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ALB_SYNC_LEASE_NAME
              value: "gco-health-monitor-alb-sync"
            - name: ALB_SYNC_LEASE_DURATION
              value: "90"
            - name: AUTH_SECRET_ARN
              value: "{{AUTH_SECRET_ARN}}"
            - name: DYNAMODB_REGION
              value: "{{DYNAMODB_REGION}}"
            # Deployment prefix + global region so the ALB-hostname sync writes
            # to /<project>/alb-hostname-<region> in the correct region (#139),
            # instead of defaulting to /gco/ and colliding with another
            # deployment in the same account+region.
            - name: PROJECT_NAME
              value: "{{PROJECT_NAME}}"
            - name: GLOBAL_REGION
              value: "{{GLOBAL_REGION}}"
            - name: AWS_ROLE_ARN
              value: "{{HEALTH_MONITOR_ROLE_ARN}}"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
            - name: CPU_THRESHOLD
              value: "{{CPU_THRESHOLD}}"
            - name: MEMORY_THRESHOLD
              value: "{{MEMORY_THRESHOLD}}"
            - name: GPU_THRESHOLD
              value: "{{GPU_THRESHOLD}}"
            - name: PENDING_PODS_THRESHOLD
              value: "{{PENDING_PODS_THRESHOLD}}"
            - name: PENDING_REQUESTED_CPU_VCPUS
              value: "{{PENDING_REQUESTED_CPU_VCPUS}}"
            - name: PENDING_REQUESTED_MEMORY_GB
              value: "{{PENDING_REQUESTED_MEMORY_GB}}"
            - name: PENDING_REQUESTED_GPUS
              value: "{{PENDING_REQUESTED_GPUS}}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=3).read()"]
            initialDelaySeconds: 5
            periodSeconds: 5
            # timeoutSeconds is NOT optional here. The kubelet default is 1s,
            # and this probe has to fork a CPython interpreter, import
            # urllib.request, and complete an HTTP round trip inside that
            # budget. On a CPU-contended node it cannot, so the probe reports
            # "command timed out after 1s" while the process underneath is
            # perfectly healthy, and the kubelet kills a container that was
            # about to serve. Keep this at the same 5s the liveness probe on
            # this container already uses.
            timeoutSeconds: 5
            # 24 attempts x 5s period = a 120-240s window (each attempt can
            # itself burn up to timeoutSeconds). A cold start on a saturated
            # node was measured at ~80s, which the previous 12-attempt budget
            # could not cover even once the timeout above was correct.
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=3).read()"]
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/readyz', timeout=3).read()"]
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # The distroless image has no shell; python is the only
                # executable, so the drain sleep runs through it.
                command: ["python", "-c", "import time; time.sleep(5)"]
          volumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
            - name: kubernetes-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: api-tls-proxy
          image: {{HEALTH_MONITOR_IMAGE}}
          imagePullPolicy: Always
          command: ["python", "-m", "gco.services.tls_proxy"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: GCO_TLS_CERT_FILE
              value: /var/run/gco/tls/tls.crt
            - name: GCO_TLS_KEY_FILE
              value: /var/run/gco/tls/tls.key
            - name: TLS_PROXY_UPSTREAM_PORT
              value: "9000"
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
              value: "20"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Keep the TLS acceptor open while endpoint removal reaches ALB.
                command: ["python", "-c", "import time; time.sleep(5)"]
          volumeMounts:
            - name: api-tls
              mountPath: /var/run/gco/tls
              readOnly: true
      volumes:
        - name: api-tls
          secret:
            secretName: health-monitor-tls
            defaultMode: 288
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
        - name: kubernetes-api-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: health-monitor-pdb
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: health-monitor
---
apiVersion: v1
kind: Service
metadata:
  name: health-monitor
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app: health-monitor
