# Health Monitor — monitors cluster resource utilization and exposes /api/v1/health
# Deployment + PodDisruptionBudget + Service consolidated in one file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  namespace: gco-system
  labels:
    app: health-monitor
    component: api
    project: gco
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # A new pod counts as available only after staying Ready this long, so a
  # container that passes its readiness probe and then crashes cannot let
  # the rollout retire a healthy old pod.
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: health-monitor
  template:
    metadata:
      labels:
        app: health-monitor
        component: api
        project: gco
      annotations:
        gco.aws/deployment-timestamp: "{{DEPLOYMENT_TIMESTAMP}}"
        eks.amazonaws.com/skip-containers: "api-tls-proxy"
    spec:
      serviceAccountName: gco-health-monitor-sa
      priorityClassName: gco-platform-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: health-monitor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: health-monitor
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: health-monitor
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: health-monitor
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: health-monitor
          image: {{HEALTH_MONITOR_IMAGE}}
          # CDK publishes every service image under a content-hash tag, so a
          # cached layer is always the right layer; IfNotPresent lets a pod
          # restart even while the registry is unreachable.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: app-http
              containerPort: 9000
              protocol: TCP
          env:
            - name: HOST
              value: "127.0.0.1"
            - name: PORT
              value: "9000"
            # Uvicorn drains in-flight requests for this long after SIGTERM;
            # the sidecar uses the same budget and the pod grace period covers
            # preStop + this value.
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
              value: "20"
            - name: CLUSTER_NAME
              value: "{{CLUSTER_NAME}}"
            - name: REGION
              value: "{{REGION}}"
            # Stable, replica-unique identity and namespace for Kubernetes
            # Lease leader election. Followers continue serving health checks.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ALB_SYNC_LEASE_NAME
              value: "gco-health-monitor-alb-sync"
            - name: ALB_SYNC_LEASE_DURATION
              value: "90"
            # Webhook deliverer election: one replica delivers, the other stands
            # by (gco.services.webhook_dispatcher). Same pre-created Lease pattern.
            - name: WEBHOOK_LEASE_NAME
              value: "gco-health-monitor-webhooks"
            - name: WEBHOOK_LEASE_DURATION
              value: "90"
            - name: AUTH_SECRET_ARN
              value: "{{AUTH_SECRET_ARN}}"
            - name: DYNAMODB_REGION
              value: "{{DYNAMODB_REGION}}"
            # Deployment prefix + global region so the ALB-hostname sync writes
            # to /<project>/alb-hostname-<region> in the correct region (#139),
            # instead of defaulting to /gco/ and colliding with another
            # deployment in the same account+region.
            - name: PROJECT_NAME
              value: "{{PROJECT_NAME}}"
            - name: GLOBAL_REGION
              value: "{{GLOBAL_REGION}}"
            # The webhook dispatcher reads job events for the namespaces the
            # submission policy admits and looks registrations up in the
            # project-scoped table; both come from the same placeholders the
            # manifest processor renders, so a non-default project_name and a
            # custom namespace policy reach this service too.
            - name: WEBHOOKS_TABLE_NAME
              value: "{{WEBHOOKS_TABLE_NAME}}"
            - name: ALLOWED_NAMESPACES
              value: "{{MP_ALLOWED_NAMESPACES}}"
            - name: AWS_ROLE_ARN
              value: "{{HEALTH_MONITOR_ROLE_ARN}}"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
            - name: CPU_THRESHOLD
              value: "{{CPU_THRESHOLD}}"
            - name: MEMORY_THRESHOLD
              value: "{{MEMORY_THRESHOLD}}"
            - name: GPU_THRESHOLD
              value: "{{GPU_THRESHOLD}}"
            - name: PENDING_PODS_THRESHOLD
              value: "{{PENDING_PODS_THRESHOLD}}"
            - name: PENDING_REQUESTED_CPU_VCPUS
              value: "{{PENDING_REQUESTED_CPU_VCPUS}}"
            - name: PENDING_REQUESTED_MEMORY_GB
              value: "{{PENDING_REQUESTED_MEMORY_GB}}"
            - name: PENDING_REQUESTED_GPUS
              value: "{{PENDING_REQUESTED_GPUS}}"
          resources:
            requests:
              # The leader replica (webhook deliverer plus job watcher) was
              # measured live at 85-125m with peaks over 200m; a 100m request
              # gave it the smallest CPU weight of every API container on the
              # node, so under node-wide contention it was starved first and
              # its probes were the ones that timed out.
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The three probes below fork the interpreter because the distroless
          # image has no shell and the listener is loopback-only (the kubelet
          # cannot reach 127.0.0.1 inside the pod). That fork is the hazard:
          # a probe is a process competing for the container's CPU quota, and
          # on a contended node a slow probe kills a healthy server. So the
          # probe starts lean (-I -S: no site-packages scan, no environment)
          # and speaks HTTP over a bare socket instead of importing
          # urllib.request and its ~130 modules, which cut the work per probe
          # about fivefold, and the liveness budget below is wide enough that
          # only a process that is actually stuck for a minute gets restarted.
          # A live run (2026-09-13) saw the previous urllib probes time out
          # 190 times in 25 minutes on one node and restart this container
          # five times while it was answering every request that reached it.
          startupProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9000),3);
                  s.settimeout(3);
                  s.sendall(b'GET /healthz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 5
            periodSeconds: 5
            # timeoutSeconds is NOT optional here. The kubelet default is 1s,
            # and this probe has to fork a CPython interpreter and complete
            # an HTTP round trip inside that budget. On a CPU-contended node
            # it cannot, so the probe reports "command timed out after 1s"
            # while the process underneath is perfectly healthy, and the
            # kubelet kills a container that was about to serve. Startup gets
            # the same budget as liveness: it runs when the process is
            # slowest.
            timeoutSeconds: 10
            # 24 attempts x 5s period = a 120-360s window (each attempt can
            # itself burn up to timeoutSeconds). A cold start on a saturated
            # node was measured at ~80s, which the previous 12-attempt budget
            # could not cover even once the timeout above was correct.
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9000),3);
                  s.settimeout(3);
                  s.sendall(b'GET /healthz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 0
            periodSeconds: 15
            # A liveness probe exists to catch a stuck process, and a minute
            # is a fine detection latency for that; 4 x 15s of continuous
            # failure, each attempt allowed 10s, is what it takes to restart.
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9000),3);
                  s.settimeout(3);
                  s.sendall(b'GET /readyz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # The distroless image has no shell; python is the only
                # executable, so the drain sleep runs through it.
                command: ["python", "-c", "import time; time.sleep(5)"]
          volumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
            - name: kubernetes-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: api-tls-proxy
          image: {{HEALTH_MONITOR_IMAGE}}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "gco.services.tls_proxy"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: GCO_TLS_CERT_FILE
              value: /var/run/gco/tls/tls.crt
            - name: GCO_TLS_KEY_FILE
              value: /var/run/gco/tls/tls.key
            - name: TLS_PROXY_UPSTREAM_PORT
              value: "9000"
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
              value: "20"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Keep the TLS acceptor open while endpoint removal reaches ALB.
                command: ["python", "-c", "import time; time.sleep(5)"]
          volumeMounts:
            - name: api-tls
              mountPath: /var/run/gco/tls
              readOnly: true
      volumes:
        - name: api-tls
          secret:
            secretName: health-monitor-tls
            defaultMode: 288
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
        - name: kubernetes-api-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
---
# maxUnavailable rather than minAvailable: one voluntary disruption at a
# time whatever the replica count, so a larger replica count (operator-chosen
# or HPA-driven) never widens the eviction window.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: health-monitor-pdb
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: health-monitor
---
apiVersion: v1
kind: Service
metadata:
  name: health-monitor
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app: health-monitor
