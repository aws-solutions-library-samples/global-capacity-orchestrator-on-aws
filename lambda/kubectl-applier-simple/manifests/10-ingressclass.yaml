# ALB IngressClass and IngressClassParams for EKS Auto Mode
#
# The platform Ingress and its authenticated inference proxy share one internal
# ALB through the 'gco' group. Global Accelerator and the optional regional VPC
# Lambda are the only supported ingress paths; model servers never receive a
# direct per-endpoint Ingress.
#
# Note: EKS Auto Mode requires both the scheme and group.name to be set here in
# IngressClassParams, not via annotations on individual Ingress objects.

---
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internal
  group:
    name: gco
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
