# ─── The fence: what any Application in gco-tenants may deploy ──────
#
#   * sourceRepos — cdk.json helm.argocd.source_repos, rendered as JSON (a YAML
#     flow sequence); "*" by default. The fence is on destinations and kinds.
#   * destinations — the two tenant namespaces on this cluster and nothing
#     else; the chart's cluster Secret registers exactly the same pair.
#   * clusterResourceWhitelist: [] — no cluster-scoped kind may be synced, so a
#     tenant repository cannot create CRDs, ClusterRoles, NodePools or
#     Namespaces.
#   * namespaceResourceBlacklist — the guardrail kinds, refused here AND left
#     out of gco-argocd-deploy above.
#
# Readiness is exact existence only: a tenant repository that fails to sync
# must never fail a GCO deployment.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gco-tenants
  namespace: argocd
  labels:
    project: gco
    gco.io/argocd-enabled: "{{ARGOCD_ENABLED}}"
spec:
  description: GCO tenant workloads reconciled from Git; fenced to the tenant namespaces
  sourceRepos: {{ARGOCD_SOURCE_REPOS}}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: gco-jobs
    - server: https://kubernetes.default.svc
      namespace: gco-inference
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
