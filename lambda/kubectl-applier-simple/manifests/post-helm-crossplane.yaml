# ─── Crossview: a read-only view ─────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gco-crossview-crossplane-view
  labels:
    project: gco
    gco.io/crossplane-enabled: "{{CROSSPLANE_ENABLED}}"
subjects:
  - kind: ServiceAccount
    name: crossview
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: crossplane-view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gco-crossview-read
  labels:
    project: gco
    gco.io/crossplane-enabled: "{{CROSSPLANE_ENABLED}}"
rules:
  # Discovering composite and managed resource types.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # The composed tenant kinds the relationship graph draws (never Secrets).
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts", "services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gco-crossview-read
  labels:
    project: gco
    gco.io/crossplane-enabled: "{{CROSSPLANE_ENABLED}}"
subjects:
  - kind: ServiceAccount
    name: crossview
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: gco-crossview-read
  apiGroup: rbac.authorization.k8s.io
