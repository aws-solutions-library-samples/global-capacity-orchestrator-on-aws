# Mooncake shared KV store control plane — one master per regional cluster.
# A single StatefulSet runs the mooncake_master daemon with its built-in HTTP
# metadata server, so master RPC and metadata are served by the same object —
# there is no separate metadata Deployment. All vLLM pods in gco-inference reach
# this shared master and metadata endpoint.
#
# Skipped automatically when the master image placeholder is left unreplaced
# (the same conditional-enable mechanism the other optional storage tiers use).
---
apiVersion: v1
kind: Service
metadata:
  name: mooncake-master
  namespace: gco-inference
  labels:
    app: mooncake-master
    project: gco
spec:
  clusterIP: None
  selector:
    app: mooncake-master
  ports:
    - name: rpc
      port: 50051
      targetPort: rpc
      protocol: TCP
    - name: metadata
      port: 8080
      targetPort: metadata
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mooncake-master
  namespace: gco-inference
  labels:
    app: mooncake-master
    project: gco
spec:
  serviceName: mooncake-master
  replicas: 1
  selector:
    matchLabels:
      app: mooncake-master
  template:
    metadata:
      labels:
        app: mooncake-master
        project: gco
    spec:
      serviceAccountName: gco-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mooncake-master
          image: {{MOONCAKE_MASTER_IMAGE}}
          command:
            - mooncake_master
          args:
            - --port=50051
            - --enable_http_metadata_server=true
            - --http_metadata_server_port=8080
          ports:
            - name: rpc
              containerPort: 50051
              protocol: TCP
            - name: metadata
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metadata
              port: metadata
            initialDelaySeconds: 10
            periodSeconds: 15
      restartPolicy: Always
