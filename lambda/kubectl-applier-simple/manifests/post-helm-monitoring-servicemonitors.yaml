---
# GCO's own services expose Prometheus /metrics (see gco/services/service_metrics
# .py). They run with multiple replicas, so PodMonitors scrape each pod directly
# rather than round-robining one pod through a Service. Every scrape is
# verified HTTPS: the ALB-facing APIs serve /metrics on the same TLS sidecar
# (port "https", 8443) that carries application traffic, and the inference
# monitor serves it through its metrics-tls-proxy sidecar (port
# "https-metrics", 9443) while the plaintext listener stays on the pod's
# loopback. Prometheus trusts only the GCO internal CA, read from the ca.crt
# key of gco-monitoring-trust (a leaf in this namespace, declared in
# post-helm-monitoring-tls.yaml under the same gate), and checks each pod's
# leaf against the Service DNS name it was issued for; it dials pod IPs, so
# serverName supplies that name.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gco-health-monitor
  namespace: monitoring
  labels:
    project: gco
    app: gco-observability
  annotations:
    gco.io/cluster-observability-enabled: "{{CLUSTER_OBSERVABILITY_ENABLED}}"
spec:
  namespaceSelector:
    matchNames:
      - gco-system
  selector:
    matchLabels:
      app: health-monitor
  podMetricsEndpoints:
    - port: https
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: gco-monitoring-trust
            key: ca.crt
        serverName: health-monitor.gco-system.svc
      interval: 30s
      path: /metrics
---
