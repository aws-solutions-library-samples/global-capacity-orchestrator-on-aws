# Network Policies — zero-trust networking for all GCO namespaces
# Default-deny ingress in gco-system and gco-jobs, with explicit allow rules
# for ALB traffic and DNS/HTTPS egress. gco-inference policies are included here
# alongside the other namespace policies for a single source of truth.
---
# Default deny all ingress in gco-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny all ingress in gco-jobs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Ray uses dynamically allocated worker/object-manager ports in addition to its
# well-known GCS, dashboard, and client ports. Permit all protocols only among
# pods in the shipped ray-cluster; no other gco-jobs pod is selected or admitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ray-cluster-internal
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      ray.io/cluster: ray-cluster
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              ray.io/cluster: ray-cluster
  egress:
    - to:
        - podSelector:
            matchLabels:
              ray.io/cluster: ray-cluster
---
# Allow ALB to reach health-monitor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-health-monitor
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: health-monitor
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# Allow ALB to reach manifest-processor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-manifest-processor
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: manifest-processor
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# Allow DNS egress in gco-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow DNS egress in gco-jobs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow AWS API egress (HTTPS) in gco-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aws-api-egress
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      project: gco
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow VPC endpoint egress in gco-jobs (image pulls, AWS APIs via VPC endpoints only)
# CIDR values are substituted by the kubectl-applier Lambda at deploy time
# from the vpc_endpoint_cidrs configuration in cdk.json.
# The CIDR placeholder below is replaced with one or more ipBlock entries
# generated from the vpc_endpoint_cidrs array.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vpc-endpoint-egress
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        {{VPC_ENDPOINT_CIDR_BLOCKS}}
      ports:
        - protocol: TCP
          port: 443
---
# Allow DNS egress in gco-inference
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow HTTPS egress in gco-inference (image pulls, AWS APIs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow the authenticated manifest API proxy to reach internal inference
# Services. No other gco-system pod is selected, and model endpoints are never
# exposed directly through the ALB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-manifest-proxy-to-inference
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: manifest-processor
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gco-inference
          podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
---
# Allow only the authenticated manifest API proxy into inference pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-manifest-proxy-ingress
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      gco.io/type: inference
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gco-system
          podSelector:
            matchLabels:
              app: manifest-processor
      ports:
        - protocol: TCP
---
# Permit TCP only among managed inference workloads. This covers the PD proxy,
# prefill/decode serving ports, canary backends, and KV-transfer bootstrap ports.
# The second egress rule permits inference clients to reach only the Mooncake
# master's RPC and metadata ports. Sources outside the namespace still need an
# explicit ingress rule, so ALB traffic cannot reach model pods directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference-internal
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      gco.io/type: inference
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: mooncake-master
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 8080
---
# Narrow, named Mooncake rules are also maintained dynamically by the inference
# monitor. They make the required master and bootstrap contracts explicit and
# preserve them for installations upgraded independently of this base manifest.
# Allow inference pods to reach the shared master RPC port (pod-to-master)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-to-master
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: mooncake-master
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
          port: 50051
---
# Allow inference pods to reach the shared metadata server (pod-to-metadata)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-to-metadata
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: mooncake-master
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
          port: 8080
---
# Allow KV-transfer bootstrap handshakes between inference pods (bootstrap ports)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rdma-bootstrap
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      gco.io/type: inference
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
          port: 8998
          endPort: 9098
