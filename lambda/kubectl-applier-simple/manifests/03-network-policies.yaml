# Network Policies — the network posture of every GCO namespace.
#
# One file, three namespaces, one model:
#
#   gco-system    default-deny ingress; each platform workload is admitted on
#                 exactly the port it serves (the TLS proxy sidecars on 8443
#                 for the ALB, the inference monitor's :9090 metrics endpoint);
#                 egress is DNS + HTTPS (AWS APIs, the Kubernetes API) plus the
#                 proxy's path into gco-inference and the cost monitor's path
#                 to OpenCost (34-cost-monitor.yaml).
#   gco-jobs      default-deny ingress from outside the namespace, everything
#                 allowed between job pods (distributed training, Ray, Volcano,
#                 Slurm and Kubeflow talk pod-to-pod on framework-chosen
#                 ports); egress is DNS, HTTPS anywhere (S3, DynamoDB, ECR,
#                 CloudWatch, Bedrock, Hugging Face, PyPI — the regional NAT
#                 gateways and S3/DynamoDB gateway endpoints carry it), the
#                 in-VPC ranges from cdk.json vpc_endpoint_cidrs on any port
#                 (Valkey, Aurora, EFS/FSx targets, VPC endpoints), the
#                 namespace itself, and the explicit opt-in rules other
#                 manifests add (MLflow clients, Slurm REST clients).
#   gco-inference model pods are isolated to the authenticated proxy and to
#                 each other; egress is DNS + HTTPS (model pulls, AWS APIs).
#
# DNS rules allow port 53 to any destination rather than to kube-system pods:
# EKS Auto Mode serves cluster DNS from a per-node system service (there are
# no CoreDNS pods to select), and kind/Calico CoreDNS pods match "anywhere"
# too, so the same rule holds on both.
#
# Ingress rules for probed ports omit `from` on purpose: the ALB's IPs are not
# pods, and the kubelet's health probes arrive from the node's host network,
# which no pod or namespace selector can name (see the mlflow-server policy in
# post-helm-mlflow-network.yaml for the live incident behind this).
#
# Enforcement: kind CI installs Calico so these rules are exercised for real;
# on EKS Auto Mode the built-in network policy controller is switched on by
# 05-network-policy-controller.yaml (cdk.json
# eks_cluster.network_policy_enforcement).
---
# Default deny all ingress in gco-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny all ingress in gco-jobs. Sources inside the namespace are
# re-admitted by allow-same-namespace below; anything from another namespace
# (including gco-system) needs an explicit rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Job pods may talk to each other on every port and protocol. Distributed
# training frameworks (torchrun/NCCL, Ray, Volcano, Slurm, Kubeflow TrainJob)
# pick their own ports, often dynamically, so the boundary is the namespace,
# not a port list. Cross-namespace traffic is still governed by the
# default-deny above and by the egress rules below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# Allow ALB HTTPS target traffic to reach health-monitor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-health-monitor
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: health-monitor
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
---
# Allow ALB HTTPS target traffic to reach manifest-processor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-manifest-processor
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: manifest-processor
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
---
# Allow ALB HTTPS target traffic to reach the dedicated inference proxy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-inference-proxy
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: inference-proxy
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
---
# The inference monitor has no request path; its one listener is the :9090
# Prometheus endpoint that the gco-inference-monitor PodMonitor scrapes and
# that its own startup/liveness/readiness probes hit. Without this rule the
# default-deny above drops both — the scrape silently (an absent target) and
# the probes fatally. Same shape as the 8443 rules: port only, any source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-to-inference-monitor
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: inference-monitor
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 9090
---
# Allow DNS egress in gco-system (any resolver: Auto Mode node-local CoreDNS
# is not a pod, see the header)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow DNS egress in gco-jobs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow AWS API egress (HTTPS) in gco-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aws-api-egress
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      project: gco
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow HTTPS egress in gco-jobs. Jobs reach AWS APIs (S3, DynamoDB, ECR,
# CloudWatch, Bedrock), model and dataset hubs and package indexes over 443;
# GCO's own data lives across regions (the cluster-shared bucket and the job
# tables sit in the global region), so a VPC-endpoint-only rule could never
# have carried the platform's own traffic. Non-HTTPS destinations inside the
# VPC are covered by allow-vpc-egress; anything else is an operator-added rule
# (NetworkPolicies are additive).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow egress from gco-jobs to the in-VPC ranges on any port: the Valkey and
# Aurora endpoints GCO provisions, EFS/FSx mount targets, VPC endpoints, and
# peered ranges an operator adds. The placeholder is expanded by the
# kubectl-applier Lambda into one ipBlock per cdk.json vpc_endpoint_cidrs
# entry (the same key MLflow's Host-header allow-list is derived from).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vpc-egress
  namespace: gco-jobs
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        {{VPC_ENDPOINT_CIDR_BLOCKS}}
---
# Allow DNS egress in gco-inference
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow HTTPS egress in gco-inference (model pulls, AWS APIs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow the authenticated inference proxy to reach internal model Services.
# No other gco-system pod is selected, and model endpoints are never exposed
# directly through the ALB.
#
# The proxy dials the endpoint's ClusterIP Service, and the VPC CNI evaluates
# egress before kube-proxy's DNAT: the peer podSelector below admits the model
# pods' addresses, while the Service's ClusterIP is admitted only because the
# inference monitor puts the same ``gco.io/type: inference`` label in every
# inference Service's spec.selector (the network policy controller adds a
# ClusterIP only when the Service selector matches the peer podSelector).
# Keep the two in step: a Service selected by ``app`` alone is unreachable
# through this rule even though its pods are.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference-proxy-to-inference
  namespace: gco-system
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: inference-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gco-inference
          podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
---
# Allow only the authenticated inference proxy into inference pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference-proxy-ingress
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      gco.io/type: inference
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gco-system
          podSelector:
            matchLabels:
              app: inference-proxy
      ports:
        - protocol: TCP
---
# Permit TCP only among managed inference workloads. This covers the PD proxy,
# prefill/decode serving ports, canary backends, and KV-transfer bootstrap ports.
# The second egress rule permits inference clients to reach only the Mooncake
# master's RPC and metadata ports. Sources outside the namespace still need an
# explicit ingress rule, so ALB traffic cannot reach model pods directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference-internal
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      gco.io/type: inference
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: mooncake-master
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 8080
---
# Narrow, named Mooncake rules are also maintained dynamically by the inference
# monitor. They make the required master and bootstrap contracts explicit and
# preserve them for installations upgraded independently of this base manifest.
# Allow inference pods to reach the shared master RPC port (pod-to-master)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-to-master
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: mooncake-master
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
          port: 50051
---
# Allow inference pods to reach the shared metadata server (pod-to-metadata)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-to-metadata
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      app: mooncake-master
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
          port: 8080
---
# Allow KV-transfer bootstrap handshakes between inference pods (bootstrap ports)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rdma-bootstrap
  namespace: gco-inference
  labels:
    project: gco
spec:
  podSelector:
    matchLabels:
      gco.io/type: inference
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gco.io/type: inference
      ports:
        - protocol: TCP
          port: 8998
          endPort: 9098
