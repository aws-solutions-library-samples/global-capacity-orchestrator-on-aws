# Argo CD EKS Capability — cluster registration and Kubernetes RBAC.
#
# Applied only when cdk.json eks_capabilities.argocd is enabled for this
# region: the regional stack resolves {{ARGOCD_CAPABILITY_ROLE_ARN}} to the
# capability IAM role it created, and the whole file is gated on that token.
# When the capability is disabled the token stays unreplaced, the applier skips
# this file and prunes exactly the objects below (see
# _FEATURE_RESOURCE_INVENTORY in ../handler.py). The argocd Namespace is the
# one object that is never pruned — it holds every operator-authored
# Application and AppProject.
#
# Why these objects exist (AWS docs, "Register target clusters"):
#
#   * The hosted Argo CD does NOT register the cluster it is attached to as a
#     deployment target. The local-cluster Secret does that. Its ``server``
#     field must be the EKS cluster ARN — the managed capability identifies
#     clusters by ARN, and kubernetes.default.svc is not supported.
#   * EKS creates an access entry for the capability role automatically but
#     grants it NO Kubernetes permissions. The access entry maps the role to
#     the group ``eks-access-entry:<role ARN>``, which is what the bindings
#     below name. Argo CD needs cluster-wide read (its cluster cache watches
#     every resource type for discovery, drift detection and health) and
#     write only where it deploys: the two tenant namespaces GCO ships,
#     gco-jobs and gco-inference. The platform namespace gco-system is
#     deliberately not writable, so a tenant repository can never touch
#     platform resources.
#   * The write grant is an explicit allow-list of the namespaced workload
#     kinds a tenant repository deploys (core, apps, batch, autoscaling,
#     policy, Ingress, Gateway API routes, and the namespaced kinds of the
#     operators GCO installs: Kueue, Kubeflow Trainer + JobSet, KubeRay, KEDA,
#     Volcano, Prometheus operator, cert-manager). The kinds GCO uses as
#     guardrails inside the tenant namespaces — ResourceQuota, LimitRange,
#     NetworkPolicy, Role, RoleBinding — are deliberately absent, and the
#     AppProject in 08-argocd-gitops.yaml blacklists the same five kinds, so
#     the Argo CD fence and the Kubernetes RBAC agree: nothing reconciled from
#     Git can widen a ceiling, open the network posture, or grant itself
#     permissions. A repository that ships a kind outside this list gets a
#     sync-time Forbidden, never a silent grant; to admit one, bind an extra
#     Role to the same access-entry group in the tenant namespace.
#
# The read-all ClusterRole is the documented minimum and includes Secrets: the
# Argo CD control plane is AWS-operated, and who may see a Secret's contents
# through the Argo CD UI/API is governed by the capability's rbac_role_mappings.

# ─── Namespace the hosted control plane reads from ──────────────────
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    project: gco
    app.kubernetes.io/part-of: argocd

# ─── Local cluster registration ─────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: local-cluster
  namespace: argocd
  labels:
    project: gco
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: local-cluster
  server: "{{EKS_CLUSTER_ARN}}"

# ─── Cluster-wide read: discovery, drift detection, health ──────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gco-argocd-read-all
  labels:
    project: gco
  annotations:
    checkov.io/skip1: CKV_K8S_49=Argo CD's cluster cache watches every API type; get/list/watch on all resources is the documented read-only minimum
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gco-argocd-read-all
  labels:
    project: gco
subjects:
  - kind: Group
    name: "eks-access-entry:{{ARGOCD_CAPABILITY_ROLE_ARN}}"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: gco-argocd-read-all
  apiGroup: rbac.authorization.k8s.io

# ─── Namespace write: the tenant namespaces only ────────────────────
#
# The two Roles below are identical by design (tests pin it); the RoleBindings
# are what scope them. Verbs are the apply/prune set Argo CD uses — create for
# new objects, get + patch/update for existing ones, delete for prune — with
# list/watch so a namespaced list works even if the cluster-read grant above is
# ever narrowed. Never ``*``, never ``bind``/``escalate``/``impersonate``.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gco-argocd-deploy
  namespace: gco-jobs
  labels:
    project: gco
rules:
  # Core workload kinds. resourcequotas / limitranges are deliberately absent:
  # 04-resource-quotas.yaml sets the tenant ceilings from cdk.json and nothing
  # reconciled from Git may widen its own guardrail.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "services", "persistentvolumeclaims", "pods"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # Ingress only — NetworkPolicy lives in this group too and is a guardrail
  # (03-network-policies.yaml, 06-network-policy-controller.yaml).
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # Route attachments to the shared GCO Gateway; the Gateway itself is
  # platform-owned in gco-system.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "grpcroutes"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # Namespaced kinds of the operators GCO installs (cdk.json helm; KEDA is
  # mandatory). Cluster-scoped siblings (ClusterQueue, ResourceFlavor,
  # ClusterTrainingRuntime, ClusterTriggerAuthentication, Volcano Queue) are
  # not grantable from a Role, and the AppProject refuses them anyway.
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["trainer.kubeflow.org"]
    resources: ["trainjobs", "trainingruntimes"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters", "rayjobs", "rayservices"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "scaledjobs", "triggerauthentications"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["flow.volcano.sh"]
    resources: ["jobflows", "jobtemplates"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gco-argocd-deploy
  namespace: gco-jobs
  labels:
    project: gco
subjects:
  - kind: Group
    name: "eks-access-entry:{{ARGOCD_CAPABILITY_ROLE_ARN}}"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gco-argocd-deploy
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gco-argocd-deploy
  namespace: gco-inference
  labels:
    project: gco
rules:
  # Identical to the gco-jobs Role above — see its comments.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "services", "persistentvolumeclaims", "pods"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "grpcroutes"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["trainer.kubeflow.org"]
    resources: ["trainjobs", "trainingruntimes"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters", "rayjobs", "rayservices"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "scaledjobs", "triggerauthentications"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["flow.volcano.sh"]
    resources: ["jobflows", "jobtemplates"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gco-argocd-deploy
  namespace: gco-inference
  labels:
    project: gco
subjects:
  - kind: Group
    name: "eks-access-entry:{{ARGOCD_CAPABILITY_ROLE_ARN}}"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gco-argocd-deploy
  apiGroup: rbac.authorization.k8s.io
