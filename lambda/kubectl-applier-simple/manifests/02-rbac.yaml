# GCO RBAC — Per-service roles following least-privilege principle
# Each platform service gets its own ServiceAccount and minimally-scoped role.
#
# Roles:
#   gco-health-monitor-role          (ClusterRole)  — read-only cluster-wide
#   gco-manifest-processor-role      (Role)         — write in gco-jobs namespace
#   gco-manifest-processor-cluster-read (ClusterRole) — read namespaces + CRDs
#   gco-inference-monitor-role       (Role)         — write in gco-inference namespace
#
# ServiceAccounts (all in gco-system):
#   gco-health-monitor-sa
#   gco-manifest-processor-sa
#   gco-inference-monitor-sa
#   gco-inference-proxy-sa (AWS-only permissions; no Kubernetes role binding)

# ─── ServiceAccounts ────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gco-health-monitor-sa
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
  annotations:
    eks.amazonaws.com/role-arn: "{{HEALTH_MONITOR_ROLE_ARN}}"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gco-manifest-processor-sa
  namespace: gco-system
  labels:
    app: manifest-processor
    project: gco
  annotations:
    eks.amazonaws.com/role-arn: "{{MANIFEST_PROCESSOR_ROLE_ARN}}"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gco-inference-monitor-sa
  namespace: gco-system
  labels:
    app: inference-monitor
    project: gco
  annotations:
    eks.amazonaws.com/role-arn: "{{SERVICE_ACCOUNT_ROLE_ARN}}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gco-inference-proxy-sa
  namespace: gco-system
  labels:
    app: inference-proxy
    project: gco
  annotations:
    eks.amazonaws.com/role-arn: "{{INFERENCE_PROXY_ROLE_ARN}}"
automountServiceAccountToken: false

# ─── Health Monitor: cluster-wide read-only ─────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gco-health-monitor-role
  labels:
    app: health-monitor
    project: gco
rules:
  # Core resources — read-only
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "events"]
    verbs: ["get", "list", "watch"]

  # Apps resources — read-only
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

  # Batch resources — read-only (webhook_dispatcher watches jobs to fire
  # lifecycle events; runs in-process inside the health-monitor pod)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]

  # Metrics — read-only
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gco-health-monitor-binding
  labels:
    app: health-monitor
    project: gco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gco-health-monitor-role
subjects:
  - kind: ServiceAccount
    name: gco-health-monitor-sa
    namespace: gco-system

# ─── Health Monitor: exact self-healing resources ───────────────────
# Pre-create the election Lease so the service account needs no broad
# `create leases` permission. Only the named Lease and platform Gateway are
# readable by the self-healing path; all replicas keep serving health endpoints.
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: gco-health-monitor-alb-sync
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
spec:
  leaseDurationSeconds: 90
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gco-health-monitor-self-healing
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    resourceNames: ["gco-gateway"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["gco-health-monitor-alb-sync"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gco-health-monitor-self-healing
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gco-health-monitor-self-healing
subjects:
  - kind: ServiceAccount
    name: gco-health-monitor-sa
    namespace: gco-system

# ─── Manifest Processor: namespace-scoped write in gco-jobs ────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gco-manifest-processor-role
  namespace: gco-jobs
  labels:
    app: manifest-processor
    project: gco
rules:
  # Core resources
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]

  # Pod logs (subresource) — required for GET /api/v1/jobs/.../logs endpoints
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]

  # Events — required for GET /api/v1/jobs/.../events endpoint
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # ResourceQuota + LimitRange — read-only, for GET /api/v1/policy.
  #
  # Three layers govern admission and a caller needs all three to answer "will
  # this job be admitted": the front-door per-manifest caps this service
  # enforces itself, the LimitRange per-container ceiling, and the namespace
  # ResourceQuota aggregate ceiling. A manifest can clear the front door and
  # still be rejected at pod creation by either of the other two, so reporting
  # only the caps would tell a caller a job is admissible when it is not — and
  # they may have provisioned a region on the strength of that answer.
  #
  # Caught live 2026-08-26: /api/v1/policy returned
  # cluster_enforcement.gco-jobs = {"status": "unavailable", "reason":
  # "403 Forbidden"} on a full release-validation run. The endpoint degrades
  # rather than failing, so the gap was silent in the response body.
  #
  # Read-only on purpose: these ceilings are set by 04-resource-quotas.yaml
  # from cdk.json at deploy time, and nothing at runtime may widen its own
  # guardrail.
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list"]

  # Apps resources
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]

  # Batch resources
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # Kubeflow Trainer v2 — TrainJob is the first CRD submitted through the
  # SQS path (the Ray/Volcano examples submit direct with the caller's own
  # credentials, so their groups only appear in the cluster-READ role).
  # The queue processor creates TrainJobs from queued manifests, and the
  # manifest processor's generic-manifest REST endpoints (the CLI's
  # status/logs/delete fallback for TrainJobs) need read + delete on the
  # same resources. Both services run as gco-manifest-processor-sa.
  # Caught live 2026-08-14: "TrainJob create failed: Forbidden".
  - apiGroups: ["trainer.kubeflow.org"]
    resources: ["trainjobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gco-manifest-processor-binding
  namespace: gco-jobs
  labels:
    app: manifest-processor
    project: gco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gco-manifest-processor-role
subjects:
  - kind: ServiceAccount
    name: gco-manifest-processor-sa
    namespace: gco-system

# ─── Manifest Processor: cluster-wide read for namespaces + CRDs ───
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gco-manifest-processor-cluster-read
  labels:
    app: manifest-processor
    project: gco
rules:
  # Namespace read — verify namespace existence before applying manifests
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

  # Node read — GET /api/v1/jobs/.../{name} and .../pods report which node a
  # pod landed on and that node's instance-type / capacity-type labels. Nodes
  # are cluster-scoped, so this cannot live in the namespaced Role.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

  # Metrics — required for GET /api/v1/jobs/.../metrics endpoint
  # (uses metrics.k8s.io/v1beta1 via custom_objects API)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

  # CRD read — Kueue resources
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["*"]
    verbs: ["get", "list"]

  # CRD read — KubeRay resources
  - apiGroups: ["ray.io"]
    resources: ["*"]
    verbs: ["get", "list"]

  # CRD read — Volcano resources
  - apiGroups: ["scheduling.volcano.sh", "batch.volcano.sh", "bus.volcano.sh"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gco-manifest-processor-cluster-read-binding
  labels:
    app: manifest-processor
    project: gco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gco-manifest-processor-cluster-read
subjects:
  - kind: ServiceAccount
    name: gco-manifest-processor-sa
    namespace: gco-system

# ─── Inference Monitor: namespace-scoped write in gco-inference ────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gco-inference-monitor-role
  namespace: gco-inference
  labels:
    app: inference-monitor
    project: gco
rules:
  # Apps resources — Deployments for endpoint role pods and StatefulSet for
  # the shared per-region Mooncake master are managed directly.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "statefulsets/status"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]

  # ReplicaSets are generated children and are inventory-only during stable
  # absence proof; the monitor never mutates or deletes them directly.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]

  # Services and ConfigMaps are managed endpoint parents.
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]

  # Pods and legacy Endpoints are generated children used only for terminal
  # inventory. Granting write/delete here would bypass parent UID fencing.
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]

  # EndpointSlices are generated from endpoint Services and must be absent
  # before regional deletion can be acknowledged.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]

  # Core resources — the PD proxy admin API key Secret. The monitor reads a
  # user-supplied Secret by reference (confirming it exists and is non-empty)
  # and, when an endpoint names none, provisions a per-endpoint {name}-admin
  # Secret create-if-absent with a generated key. The key reaches the proxy only
  # by Secret reference and is never written to the spec. Exact pre-v7
  # monitor-generated Secrets are safely migrated by patching only the
  # lifecycle annotation, so patch is required in addition to get/create/delete.
  # User-named or ambiguous Secrets are never patched or removed.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]

  # Temporary upgrade cleanup: terminal proof gets, provenance-patches, and
  # UID/resourceVersion-deletes historical endpoint-specific routes. List is
  # intentionally omitted because cleanup uses deterministic names.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "patch", "delete"]

  # Networking resources — NetworkPolicy allow rules that let inference pods
  # reach the shared Mooncake master RPC/metadata ports and each other on the
  # RDMA KV-transfer bootstrap port window. Create-if-absent only; the
  # default-deny policy in 03-network-policies.yaml is never read or modified.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list"]

  # Autoscaling — native HPAs plus KEDA ScaledObjects and generated HPAs.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]

  # Coordination — leader election leases
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gco-inference-monitor-binding
  namespace: gco-inference
  labels:
    app: inference-monitor
    project: gco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gco-inference-monitor-role
subjects:
  - kind: ServiceAccount
    name: gco-inference-monitor-sa
    namespace: gco-system
