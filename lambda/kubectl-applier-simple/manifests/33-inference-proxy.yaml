# Inference Proxy — authenticates and streams managed model traffic.
# Deployment + HorizontalPodAutoscaler + PodDisruptionBudget + Service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-proxy
  namespace: gco-system
  annotations:
    # The applier keeps replicas on create but omits it from update patches so
    # the HorizontalPodAutoscaler's scale-subresource value remains authoritative.
    gco.aws/hpa-controls-replicas: "true"
  labels:
    app: inference-proxy
    component: inference-data-plane
    project: gco
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inference-proxy
  template:
    metadata:
      labels:
        app: inference-proxy
        component: inference-data-plane
        project: gco
      annotations:
        gco.aws/deployment-timestamp: "{{DEPLOYMENT_TIMESTAMP}}"
    spec:
      serviceAccountName: gco-inference-proxy-sa
      automountServiceAccountToken: false
      # API Gateway response streams can run for 15 minutes. Allow Uvicorn to
      # drain an in-flight stream after this pod stops receiving new traffic.
      terminationGracePeriodSeconds: 930
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inference-proxy
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inference-proxy
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inference-proxy
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inference-proxy
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: inference-proxy
          image: {{INFERENCE_PROXY_IMAGE}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: REGION
              value: "{{REGION}}"
            - name: AUTH_SECRET_ARN
              value: "{{AUTH_SECRET_ARN}}"
            - name: AWS_ROLE_ARN
              value: "{{INFERENCE_PROXY_ROLE_ARN}}"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            - name: INFERENCE_ENDPOINTS_TABLE_NAME
              value: "{{INFERENCE_ENDPOINTS_TABLE_NAME}}"
            - name: DYNAMODB_REGION
              value: "{{DYNAMODB_REGION}}"
            - name: INFERENCE_NAMESPACE
              value: gco-inference
            - name: MAX_REQUEST_BODY_BYTES
              value: "{{INFERENCE_PROXY_MAX_REQUEST_BODY_BYTES}}"
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
              value: "900"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # The distroless image has no shell; python is the only
                # executable, so the drain sleep runs through it.
                command: ["python", "-c", "import time; time.sleep(10)"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-proxy-hpa
  namespace: gco-system
  labels:
    app: inference-proxy
    component: inference-data-plane
    project: gco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-proxy
  # Preserve the existing three-pod HA baseline and scale burst capacity.
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    # Streaming requests may live for 15 minutes. Avoid rapid scale-down churn;
    # pod termination independently drains accepted streams for the same window.
    scaleDown:
      stabilizationWindowSeconds: 900
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference-proxy-pdb
  namespace: gco-system
  labels:
    app: inference-proxy
    project: gco
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: inference-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: inference-proxy
  namespace: gco-system
  labels:
    app: inference-proxy
    project: gco
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: inference-proxy
