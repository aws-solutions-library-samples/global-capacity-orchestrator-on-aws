# GCO Gateway API entrypoint managed by AWS Load Balancer Controller v3.4.2.
# The ALB is internal and HTTPS-only. Global Accelerator and the regional VPC
# proxy remain the only supported callers. The ALB re-encrypts every request
# to hot-reloading TLS proxy sidecars on the API workload pods; request-bound
# HMAC proves possession of the trusted proxy key and request integrity on
# protected paths; original caller identity is authenticated by API Gateway IAM.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: gco-aws-alb
  labels:
    app: gco
    project: gco
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: gco-default-target-group
  namespace: gco-system
  labels:
    app: gco
    project: gco
spec:
  defaultConfiguration:
    targetType: ip
    protocol: HTTPS
    healthCheckConfig:
      # ALB encrypts target traffic but does not validate target certificates;
      # HMAC proves trusted-proxy key possession and request integrity on
      # protected paths after TLS termination.
      healthCheckProtocol: HTTPS
      healthCheckPath: /healthz
      # cdk.json gateway_health_check (defaults 15 / 5 / 2 / 2), rendered by
      # gco/gateway_health_check_config.py.
      healthCheckInterval: {{GATEWAY_HEALTH_CHECK_INTERVAL_SECONDS}}
      healthCheckTimeout: {{GATEWAY_HEALTH_CHECK_TIMEOUT_SECONDS}}
      healthyThresholdCount: {{GATEWAY_HEALTHY_THRESHOLD_COUNT}}
      unhealthyThresholdCount: {{GATEWAY_UNHEALTHY_THRESHOLD_COUNT}}
    targetGroupAttributes:
      # Keep draining targets alive for the maximum 15-minute inference stream.
      - key: deregistration_delay.timeout_seconds
        value: "900"
---
# Service-level configurations inherit the HTTPS/default attributes above and
# add an immutable backend identity that live validation can prove on AWS.
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: gco-health-monitor-target-group
  namespace: gco-system
  labels:
    app: health-monitor
    project: gco
spec:
  targetReference:
    name: health-monitor
  defaultConfiguration:
    tags:
      gco.aws/backend: health-monitor
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: gco-manifest-processor-target-group
  namespace: gco-system
  labels:
    app: manifest-processor
    project: gco
spec:
  targetReference:
    name: manifest-processor
  defaultConfiguration:
    tags:
      gco.aws/backend: manifest-processor
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: gco-inference-proxy-target-group
  namespace: gco-system
  labels:
    app: inference-proxy
    project: gco
spec:
  targetReference:
    name: inference-proxy
  defaultConfiguration:
    tags:
      gco.aws/backend: inference-proxy
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: gco-gateway-load-balancer
  namespace: gco-system
  labels:
    app: gco
    project: gco
spec:
  scheme: internal
  tags:
    # Runtime discovery requires this exact tag; cluster ownership alone is
    # deliberately insufficient to select a Global Accelerator endpoint.
    gco.aws/gateway: gco-system/gco-gateway
  loadBalancerAttributes:
    - key: idle_timeout.timeout_seconds
      value: "300"
  defaultTargetGroupConfiguration:
    name: gco-default-target-group
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: "{{BACKEND_TLS_CERTIFICATE_ARN}}"
      sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gco-gateway
  namespace: gco-system
  labels:
    app: gco
    project: gco
spec:
  gatewayClassName: gco-aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: gco-gateway-load-balancer
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gco-routes
  namespace: gco-system
  labels:
    app: gco
    project: gco
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gco-gateway
      sectionName: https
  # Ordered most-specific first, with the `/` catch-all last. Gateway API
  # awards precedence by path specificity rather than document order, so this
  # ordering is not what makes routing correct — it is kept so the file reads
  # the way traffic actually resolves, and so a controller that did consult
  # order would still behave.
  #
  # Every prefix here must be a path some backend Service actually serves.
  # `/api/v1/metrics` is served only by the health monitor, and without an
  # explicit rule the catch-all sent it to the manifest processor, which has no
  # such route — so the endpoint answered 404 through the ALB and both API
  # Gateways. tests/test_gateway_route_coverage.py now fails if any live path
  # ends up at a Service that does not serve it.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/health
      backendRefs:
        - group: ""
          kind: Service
          name: health-monitor
          port: 443
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/metrics
      backendRefs:
        - group: ""
          kind: Service
          name: health-monitor
          port: 443
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/manifests
      backendRefs:
        - group: ""
          kind: Service
          name: manifest-processor
          port: 443
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /inference
      backendRefs:
        - group: ""
          kind: Service
          name: inference-proxy
          port: 443
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - group: ""
          kind: Service
          name: health-monitor
          port: 443
          weight: 1
    # Catch-all. Everything not matched above reaches the manifest processor,
    # which owns the bulk of /api/v1.
    #
    # This is also what resolves the one path both services implement:
    # /api/v1/status. Do not add a rule sending it to the health monitor. A
    # PathPrefix cannot be split across two Services, and the manifest
    # processor's response is the one with external consumers — the
    # cross-region aggregator's /api/v1/global/status fans out to this path and
    # reads templates_count, webhooks_count, resource_limits, and
    # allowed_namespaces from it (lambda/cross-region-aggregator/handler.py,
    # aggregate_metrics). The health monitor returns none of those fields, so
    # repointing the prefix would leave global status reporting zeros rather
    # than failing loudly. The health monitor's own /api/v1/status stays
    # in-cluster, reachable by addressing the health-monitor Service directly.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: manifest-processor
          port: 443
          weight: 1
