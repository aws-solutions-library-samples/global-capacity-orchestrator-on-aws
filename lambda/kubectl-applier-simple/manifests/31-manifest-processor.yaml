# Manifest Processor — validates and applies Kubernetes manifests submitted via API
# Deployment + PodDisruptionBudget + Service consolidated in one file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest-processor
  namespace: gco-system
  labels:
    app: manifest-processor
    component: api
    project: gco
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: manifest-processor
  template:
    metadata:
      labels:
        app: manifest-processor
        component: api
        project: gco
      annotations:
        gco.aws/deployment-timestamp: "{{DEPLOYMENT_TIMESTAMP}}"
    spec:
      serviceAccountName: gco-manifest-processor-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: manifest-processor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: manifest-processor
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: manifest-processor
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: manifest-processor
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: manifest-processor
          image: {{MANIFEST_PROCESSOR_IMAGE}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTER_NAME
              value: "{{CLUSTER_NAME}}"
            - name: REGION
              value: "{{REGION}}"
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: AUTH_SECRET_ARN
              value: "{{AUTH_SECRET_ARN}}"
            - name: AWS_ROLE_ARN
              value: "{{MANIFEST_PROCESSOR_ROLE_ARN}}"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
            - name: CPU_THRESHOLD
              value: "{{CPU_THRESHOLD}}"
            - name: MEMORY_THRESHOLD
              value: "{{MEMORY_THRESHOLD}}"
            - name: GPU_THRESHOLD
              value: "{{GPU_THRESHOLD}}"
            - name: PENDING_PODS_THRESHOLD
              value: "{{PENDING_PODS_THRESHOLD}}"
            - name: PENDING_REQUESTED_CPU_VCPUS
              value: "{{PENDING_REQUESTED_CPU_VCPUS}}"
            - name: PENDING_REQUESTED_MEMORY_GB
              value: "{{PENDING_REQUESTED_MEMORY_GB}}"
            - name: PENDING_REQUESTED_GPUS
              value: "{{PENDING_REQUESTED_GPUS}}"
            - name: TEMPLATES_TABLE_NAME
              value: "{{TEMPLATES_TABLE_NAME}}"
            - name: WEBHOOKS_TABLE_NAME
              value: "{{WEBHOOKS_TABLE_NAME}}"
            - name: JOBS_TABLE_NAME
              value: "{{JOBS_TABLE_NAME}}"
            - name: DYNAMODB_REGION
              value: "{{DYNAMODB_REGION}}"
            # The regional worker activates DynamoDB-queued jobs and reconciles
            # their Kubernetes lifecycle back to terminal queue states.
            - name: CENTRAL_QUEUE_WORKER_ENABLED
              value: "{{CENTRAL_QUEUE_WORKER_ENABLED}}"
            - name: CENTRAL_QUEUE_POLL_INTERVAL_SECONDS
              value: "{{CENTRAL_QUEUE_POLL_INTERVAL_SECONDS}}"
            - name: CENTRAL_QUEUE_BATCH_SIZE
              value: "{{CENTRAL_QUEUE_BATCH_SIZE}}"
            - name: CENTRAL_QUEUE_RECONCILE_LIMIT
              value: "{{CENTRAL_QUEUE_RECONCILE_LIMIT}}"
            - name: CENTRAL_QUEUE_LEASE_SECONDS
              value: "{{CENTRAL_QUEUE_LEASE_SECONDS}}"
            - name: CENTRAL_QUEUE_LEASE_RENEWAL_SECONDS
              value: "{{CENTRAL_QUEUE_LEASE_RENEWAL_SECONDS}}"
            - name: QUEUE_TARGET_REGIONS
              value: "{{QUEUE_TARGET_REGIONS}}"
            - name: MAX_CPU_PER_MANIFEST
              value: "{{MP_MAX_CPU_PER_MANIFEST}}"
            - name: MAX_MEMORY_PER_MANIFEST
              value: "{{MP_MAX_MEMORY_PER_MANIFEST}}"
            - name: MAX_GPU_PER_MANIFEST
              value: "{{MP_MAX_GPU_PER_MANIFEST}}"
            # Require accelerator jobs to carry a matching toleration — shared
            # with the queue processor via
            # cdk.json::job_validation_policy.require_accelerator_toleration.
            - name: REQUIRE_ACCELERATOR_TOLERATION
              value: "{{MP_REQUIRE_ACCELERATOR_TOLERATION}}"
            - name: MAX_REQUEST_BODY_BYTES
              value: "{{MP_MAX_REQUEST_BODY_BYTES}}"
            - name: VALIDATION_ENABLED
              value: "{{MP_VALIDATION_ENABLED}}"
            - name: YAML_MAX_DEPTH
              value: "{{MP_YAML_MAX_DEPTH}}"
            # Namespace allowlist — shared with the queue processor via
            # cdk.json::job_validation_policy.allowed_namespaces.
            - name: ALLOWED_NAMESPACES
              value: "{{MP_ALLOWED_NAMESPACES}}"
            - name: ALLOWED_KINDS
              value: "{{MP_ALLOWED_KINDS}}"
            # Image registry allowlist — shared with the queue processor via
            # cdk.json::job_validation_policy.{trusted_registries,trusted_dockerhub_orgs}.
            # Must include the project's own ECR registry hostnames so jobs
            # built via `gco images build` aren't rejected as untrusted.
            - name: TRUSTED_REGISTRIES
              value: "{{MP_TRUSTED_REGISTRIES}}"
            - name: TRUSTED_DOCKERHUB_ORGS
              value: "{{MP_TRUSTED_DOCKERHUB_ORGS}}"
            # Security policy toggles — sourced from the same shared policy as
            # the SQS worker so neither submission path is weaker.
            - name: BLOCK_PRIVILEGED
              value: "{{MP_BLOCK_PRIVILEGED}}"
            - name: BLOCK_PRIVILEGE_ESCALATION
              value: "{{MP_BLOCK_PRIVILEGE_ESCALATION}}"
            - name: BLOCK_HOST_NETWORK
              value: "{{MP_BLOCK_HOST_NETWORK}}"
            - name: BLOCK_HOST_PID
              value: "{{MP_BLOCK_HOST_PID}}"
            - name: BLOCK_HOST_IPC
              value: "{{MP_BLOCK_HOST_IPC}}"
            - name: BLOCK_HOST_PATH
              value: "{{MP_BLOCK_HOST_PATH}}"
            - name: BLOCK_ADDED_CAPABILITIES
              value: "{{MP_BLOCK_ADDED_CAPABILITIES}}"
            - name: BLOCK_RUN_AS_ROOT
              value: "{{MP_BLOCK_RUN_AS_ROOT}}"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # The distroless image has no shell; python is the only
                # executable, so the drain sleep runs through it.
                command: ["python", "-c", "import time; time.sleep(10)"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: manifest-processor-pdb
  namespace: gco-system
  labels:
    app: manifest-processor
    project: gco
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: manifest-processor
---
apiVersion: v1
kind: Service
metadata:
  name: manifest-processor
  namespace: gco-system
  labels:
    app: manifest-processor
    project: gco
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: manifest-processor
