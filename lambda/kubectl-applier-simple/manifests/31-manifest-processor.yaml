# Manifest Processor — validates and applies Kubernetes manifests submitted via API
# Deployment + PodDisruptionBudget + Service consolidated in one file.
#
# Sizing comes from cdk.json manifest_processor (replicas, resource_limits);
# the optional CPU autoscaler lives in 35-manifest-processor-hpa.yaml. Every
# replica also runs the central queue worker — DynamoDB conditional claims make
# that safe, so replicas add API capacity without duplicating work.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest-processor
  namespace: gco-system
  annotations:
    # "true" only when manifest_processor.autoscaling.enabled: the applier then
    # keeps replicas on create but omits it from update patches so the
    # HorizontalPodAutoscaler's scale value remains authoritative.
    gco.aws/hpa-controls-replicas: "{{MP_HPA_CONTROLS_REPLICAS}}"
  labels:
    app: manifest-processor
    component: api
    project: gco
spec:
  replicas: {{MP_REPLICAS}}
  revisionHistoryLimit: 3
  # A new pod counts as available only after staying Ready this long, so a
  # container that passes its readiness probe and then crashes cannot let
  # the rollout retire a healthy old pod.
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: manifest-processor
  template:
    metadata:
      labels:
        app: manifest-processor
        component: api
        project: gco
      annotations:
        gco.aws/deployment-timestamp: "{{DEPLOYMENT_TIMESTAMP}}"
        eks.amazonaws.com/skip-containers: "api-tls-proxy"
    spec:
      serviceAccountName: gco-manifest-processor-sa
      priorityClassName: gco-platform-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: manifest-processor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: manifest-processor
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: manifest-processor
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: manifest-processor
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: manifest-processor
          image: {{MANIFEST_PROCESSOR_IMAGE}}
          # CDK publishes every service image under a content-hash tag, so a
          # cached layer is always the right layer; IfNotPresent lets a pod
          # restart even while the registry is unreachable.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: app-http
              containerPort: 9000
              protocol: TCP
          env:
            - name: HOST
              value: "127.0.0.1"
            - name: PORT
              value: "9000"
            # Uvicorn drains in-flight requests for this long after SIGTERM;
            # the sidecar uses the same budget and the pod grace period covers
            # preStop + this value.
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
              value: "50"
            - name: CLUSTER_NAME
              value: "{{CLUSTER_NAME}}"
            - name: REGION
              value: "{{REGION}}"
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: AUTH_SECRET_ARN
              value: "{{AUTH_SECRET_ARN}}"
            - name: AWS_ROLE_ARN
              value: "{{MANIFEST_PROCESSOR_ROLE_ARN}}"
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
            - name: TEMPLATES_TABLE_NAME
              value: "{{TEMPLATES_TABLE_NAME}}"
            - name: WEBHOOKS_TABLE_NAME
              value: "{{WEBHOOKS_TABLE_NAME}}"
            - name: JOBS_TABLE_NAME
              value: "{{JOBS_TABLE_NAME}}"
            - name: DYNAMODB_REGION
              value: "{{DYNAMODB_REGION}}"
            # The regional worker activates DynamoDB-queued jobs and reconciles
            # their Kubernetes lifecycle back to terminal queue states.
            - name: CENTRAL_QUEUE_WORKER_ENABLED
              value: "{{CENTRAL_QUEUE_WORKER_ENABLED}}"
            - name: CENTRAL_QUEUE_POLL_INTERVAL_SECONDS
              value: "{{CENTRAL_QUEUE_POLL_INTERVAL_SECONDS}}"
            - name: CENTRAL_QUEUE_BATCH_SIZE
              value: "{{CENTRAL_QUEUE_BATCH_SIZE}}"
            - name: CENTRAL_QUEUE_RECONCILE_LIMIT
              value: "{{CENTRAL_QUEUE_RECONCILE_LIMIT}}"
            - name: CENTRAL_QUEUE_LEASE_SECONDS
              value: "{{CENTRAL_QUEUE_LEASE_SECONDS}}"
            - name: CENTRAL_QUEUE_LEASE_RENEWAL_SECONDS
              value: "{{CENTRAL_QUEUE_LEASE_RENEWAL_SECONDS}}"
            - name: QUEUE_TARGET_REGIONS
              value: "{{QUEUE_TARGET_REGIONS}}"
            - name: MAX_CPU_PER_MANIFEST
              value: "{{MP_MAX_CPU_PER_MANIFEST}}"
            - name: MAX_MEMORY_PER_MANIFEST
              value: "{{MP_MAX_MEMORY_PER_MANIFEST}}"
            - name: MAX_GPU_PER_MANIFEST
              value: "{{MP_MAX_GPU_PER_MANIFEST}}"
            # Require accelerator jobs to carry a matching toleration — shared
            # with the queue processor via
            # cdk.json::job_validation_policy.require_accelerator_toleration.
            - name: REQUIRE_ACCELERATOR_TOLERATION
              value: "{{MP_REQUIRE_ACCELERATOR_TOLERATION}}"
            - name: MAX_REQUEST_BODY_BYTES
              value: "{{MP_MAX_REQUEST_BODY_BYTES}}"
            - name: VALIDATION_ENABLED
              value: "{{MP_VALIDATION_ENABLED}}"
            - name: YAML_MAX_DEPTH
              value: "{{MP_YAML_MAX_DEPTH}}"
            # Namespace allowlist — shared with the queue processor via
            # cdk.json::job_validation_policy.allowed_namespaces.
            - name: ALLOWED_NAMESPACES
              value: "{{MP_ALLOWED_NAMESPACES}}"
            - name: ALLOWED_KINDS
              value: "{{MP_ALLOWED_KINDS}}"
            # Image registry allowlist — shared with the queue processor via
            # cdk.json::job_validation_policy.{trusted_registries,trusted_dockerhub_orgs}.
            # Must include the project's own ECR registry hostnames so jobs
            # built via `gco images build` aren't rejected as untrusted.
            - name: TRUSTED_REGISTRIES
              value: "{{MP_TRUSTED_REGISTRIES}}"
            - name: TRUSTED_DOCKERHUB_ORGS
              value: "{{MP_TRUSTED_DOCKERHUB_ORGS}}"
            # Security policy toggles — sourced from the same shared policy as
            # the SQS worker so neither submission path is weaker.
            - name: BLOCK_PRIVILEGED
              value: "{{MP_BLOCK_PRIVILEGED}}"
            - name: BLOCK_PRIVILEGE_ESCALATION
              value: "{{MP_BLOCK_PRIVILEGE_ESCALATION}}"
            - name: BLOCK_HOST_NETWORK
              value: "{{MP_BLOCK_HOST_NETWORK}}"
            - name: BLOCK_HOST_PID
              value: "{{MP_BLOCK_HOST_PID}}"
            - name: BLOCK_HOST_IPC
              value: "{{MP_BLOCK_HOST_IPC}}"
            - name: BLOCK_HOST_PATH
              value: "{{MP_BLOCK_HOST_PATH}}"
            - name: BLOCK_ADDED_CAPABILITIES
              value: "{{MP_BLOCK_ADDED_CAPABILITIES}}"
            - name: BLOCK_RUN_AS_ROOT
              value: "{{MP_BLOCK_RUN_AS_ROOT}}"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # Rendered from cdk.json manifest_processor.resource_limits;
              # quoted because the values are Kubernetes quantity strings.
              cpu: "{{MP_CPU_LIMIT}}"
              memory: "{{MP_MEMORY_LIMIT}}"
          # Probe design and budgets are explained in 30-health-monitor.yaml: the
          # exec probes fork the interpreter, so they start lean (-I -S, bare
          # socket) and liveness restarts only after a minute of failures.
          startupProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9000),3);
                  s.settimeout(3);
                  s.sendall(b'GET /healthz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9000),3);
                  s.settimeout(3);
                  s.sendall(b'GET /healthz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            exec:
              command:
                - python
                - -I
                - -S
                - -c
                - >-
                  import socket,sys;
                  s=socket.create_connection(('127.0.0.1',9000),3);
                  s.settimeout(3);
                  s.sendall(b'GET /readyz HTTP/1.0\r\n\r\n');
                  sys.exit(0 if s.makefile('rb').readline().split(b' ')[1:2]==[b'200'] else 1)
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # The distroless image has no shell; python is the only
                # executable, so the drain sleep runs through it.
                command: ["python", "-c", "import time; time.sleep(10)"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
            - name: kubernetes-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: api-tls-proxy
          image: {{MANIFEST_PROCESSOR_IMAGE}}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "gco.services.tls_proxy"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: GCO_TLS_CERT_FILE
              value: /var/run/gco/tls/tls.crt
            - name: GCO_TLS_KEY_FILE
              value: /var/run/gco/tls/tls.key
            - name: TLS_PROXY_UPSTREAM_PORT
              value: "9000"
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS
              value: "50"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Keep the TLS acceptor open while endpoint removal reaches ALB.
                command: ["python", "-c", "import time; time.sleep(10)"]
          volumeMounts:
            - name: api-tls
              mountPath: /var/run/gco/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: api-tls
          secret:
            secretName: manifest-processor-tls
            defaultMode: 288
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
        - name: kubernetes-api-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
---
# maxUnavailable rather than minAvailable: one voluntary disruption at a
# time whatever the replica count, so a larger replica count (operator-chosen
# or HPA-driven) never widens the eviction window.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: manifest-processor-pdb
  namespace: gco-system
  labels:
    app: manifest-processor
    project: gco
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: manifest-processor
---
apiVersion: v1
kind: Service
metadata:
  name: manifest-processor
  namespace: gco-system
  labels:
    app: manifest-processor
    project: gco
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app: manifest-processor
