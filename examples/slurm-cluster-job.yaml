# Slurm Job Example
#
# Submits a batch job to the GCO-hosted Slurm cluster through slurmrestd from
# inside the cluster, waits for it to complete on an autoscaled worker, and
# checks its accounting record. Fails (non-zero exit) on any step that does
# not happen, so the example doubles as a release check.
#
# The pod authenticates with the in-cluster client token the slurm-operator
# mints and rotates for it (Secret slinky-slurm-client-token, from the Token
# in post-helm-slurm-api-access.yaml) — never with the cluster's JWT signing
# key. From outside the cluster use the GCO API instead:
#
#   gco slurm submit hello.sbatch -r REGION      # sbatch through the API
#   gco slurm queue -r REGION                    # squeue
#   gco slurm accounting -r REGION --since 1d    # sacct
#   gco slurm shell -r REGION --via-ssm auto -y  # a shell on the login pod
#
# Prerequisites:
#   - Slurm enabled in cdk.json:
#       "helm": { "slurm": { "enabled": true } }
#   - Deploy: gco stacks deploy-all -y
#   - Verify: gco slurm status -r REGION
#
# Usage:
#   kubectl apply -f examples/slurm-cluster-job.yaml
#   kubectl logs job/slurm-test -n gco-jobs -f
#
# The default cpu partition scales from zero: the first submission waits for
# KEDA to add a worker and Karpenter to provision its node (two to four
# minutes), which this example allows for.
#
# Docs: ../docs/SLURM_OPERATOR.md
apiVersion: batch/v1
kind: Job
metadata:
  name: slurm-test
  namespace: gco-jobs
  labels:
    project: gco
    # Grants this pod NetworkPolicy access to the Slurm REST API port
    # (see allow-slurm-client-* in the cluster-managed policies).
    gco.aws/slurm-client: "true"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        gco.aws/slurm-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: slurm-test
        image: python:3.14.8-slim
        command: ["python3", "-c"]
        args:
        - |
          import json, sys, time
          import urllib.request, urllib.error
          RESTAPI = "http://slinky-slurm-restapi.gco-jobs.svc.cluster.local:6820"
          API_VER = "v0.0.44"
          WAIT_SECONDS = 720
          print("=== GCO Slurm Integration Test ===")
          print(f"Date: {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}")
          with open("/etc/slurm-client/auth-token") as f:
              token = f.read().strip()
          headers = {
              "X-SLURM-USER-NAME": "slurm",
              "X-SLURM-USER-TOKEN": token,
              "Content-Type": "application/json",
          }
          def api(path, data=None, method="GET", base="slurm"):
              req = urllib.request.Request(
                  f"{RESTAPI}/{base}/{API_VER}/{path}", data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read())
              if payload.get("errors"):
                  raise RuntimeError(f"{path}: {payload['errors']}")
              return payload
          def fail(message):
              print(f"FAIL: {message}")
              sys.exit(1)
          # 1. The controller answers.
          ping = api("ping")
          up = [p for p in ping.get("pings", []) if p.get("responding") or p.get("pinged") == "UP"]
          if not up:
              fail(f"no responding controller: {ping.get('pings')}")
          print(f"controller: {[p.get('hostname') for p in up]} (Slurm {ping['meta']['slurm']['release']})")
          partitions = [p["name"] for p in api("partitions").get("partitions", [])]
          print(f"partitions: {partitions}")
          # 2. Submit to the default partition. The job writes to /home/slurm,
          #    the shared home every worker and the login pod mount.
          submitted = api("job/submit", method="POST", data=json.dumps({
              "job": {
                  "name": "gco-example",
                  "current_working_directory": "/home/slurm",
                  "environment": ["PATH=/usr/local/bin:/usr/bin:/bin"],
                  "time_limit": {"set": True, "number": 10},
                  "comment": "gco:examples/slurm-cluster-job",
              },
              "script": "#!/bin/bash\necho 'Hello from Slurm on GCO!'\nhostname\ndate\nnproc\necho 'Job completed'\n",
          }).encode())
          job_id = submitted.get("job_id")
          if not job_id:
              fail(f"submit returned no job id: {submitted}")
          print(f"submitted job {job_id}")
          # 3. Wait for it: the worker may have to be created first.
          deadline = time.monotonic() + WAIT_SECONDS
          state, reason, node = [], "", ""
          while time.monotonic() < deadline:
              job = api(f"job/{job_id}")["jobs"][0]
              state = job.get("job_state", [])
              reason = job.get("state_reason", "")
              node = job.get("nodes", "")
              print(f"  {int(deadline - time.monotonic()):4d}s left  state={state} reason={reason} nodes={node or '-'}")
              if {"COMPLETED", "FAILED", "CANCELLED", "TIMEOUT", "NODE_FAIL", "OUT_OF_MEMORY"} & set(state):
                  break
              time.sleep(15)
          if "COMPLETED" not in state:
              fail(f"job {job_id} ended in {state} (reason {reason!r}) on {node or 'no node'}")
          job = api(f"job/{job_id}")["jobs"][0]
          rc = job.get("exit_code", {}).get("return_code", {}).get("number")
          if rc != 0:
              fail(f"job {job_id} exit code {rc}")
          print(f"job {job_id} COMPLETED on {node} rc=0 tres={job.get('tres_alloc_str')}")
          # 4. Accounting recorded it (slurmdbd), with the comment intact.
          record = None
          for _ in range(12):
              rows = api("jobs", base="slurmdb").get("jobs", [])
              record = next((r for r in rows if r.get("job_id") == job_id), None)
              if record and "COMPLETED" in record.get("state", {}).get("current", []):
                  break
              time.sleep(5)
          if record is None:
              fail(f"job {job_id} has no accounting record")
          comment = record.get("comment", {}).get("job", "")
          if comment != "gco:examples/slurm-cluster-job":
              fail(f"accounting comment is {comment!r}")
          print(f"accounting: state={record['state']['current']} elapsed={record['time']['elapsed']}s comment={comment!r}")
          print("=== Test Complete ===")
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        volumeMounts:
        - name: slurm-client-token
          mountPath: /etc/slurm-client
          readOnly: true
      volumes:
      - name: slurm-client-token
        secret:
          secretName: slinky-slurm-client-token
      restartPolicy: Never
