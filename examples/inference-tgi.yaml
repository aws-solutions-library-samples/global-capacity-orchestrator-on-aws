# Text Generation Inference (TGI) Endpoint Example
#
# HuggingFace's optimized LLM inference server. Deploys a Mistral 7B endpoint
# reachable through the authenticated API Gateway.
#
# Prerequisites:
#   - GPU node with enough memory for the model (1x 24GB+ for Mistral-7B)
#   - HF_TOKEN env var if the model is gated
#
# Usage (recommended, multi-region aware):
#   gco inference deploy tgi-mistral \
#     -i ghcr.io/huggingface/text-generation-inference:3.3.7 \
#     --gpu-count 1 --replicas 1 \
#     -e MODEL_ID=mistralai/Mistral-7B-Instruct-v0.3 \
#     -e MAX_INPUT_TOKENS=2048 \
#     -e MAX_TOTAL_TOKENS=4096
#
# Usage (single region, deploy this manifest directly):
#   gco jobs submit-direct examples/inference-tgi.yaml -r us-east-1
#
# Test the endpoint (SigV4-authenticated via API Gateway; see docs/INFERENCE.md):
#   curl https://<API-Gateway-endpoint>/inference/tgi-mistral/generate \
#     -H "Content-Type: application/json" \
#     -d '{"inputs": "What is deep learning?", "parameters": {"max_new_tokens": 100}}'
#
# Docs: ../docs/INFERENCE.md

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgi-mistral
  namespace: gco-inference
  labels:
    app: tgi-mistral
    project: gco
    gco.io/type: inference
    framework: tgi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tgi-mistral
  template:
    metadata:
      labels:
        app: tgi-mistral
        project: gco
        gco.io/type: inference
    spec:
      # The TGI container runs as the image's default user (root): its
      # startup refreshes the dynamic-linker cache for the bundled conda
      # libraries, and as an unprivileged user the launcher dies unable to
      # load libpython ("error while loading shared libraries") — observed
      # live in run ex241-4bf01801.
      containers:
      - name: tgi
        image: ghcr.io/huggingface/text-generation-inference:3.3.7
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8080
        env:
        - name: MODEL_ID
          value: "mistralai/Mistral-7B-Instruct-v0.3"
        # The TGI launcher reads every flag from the environment (exactly
        # how MODEL_ID is injected); serve on 8080 rather than the image
        # default of 80 so nothing depends on binding a privileged port.
        - name: PORT
          value: "8080"
        # Keep the model cache on the pod-lifetime volume below rather than
        # the container's writable layer.
        - name: HUGGINGFACE_HUB_CACHE
          value: "/data"
        - name: MAX_INPUT_TOKENS
          value: "2048"
        - name: MAX_TOTAL_TOKENS
          value: "4096"
        - name: QUANTIZE
          value: "awq"
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: model-cache
          mountPath: /data
        # Model download + load can take many minutes for Mistral-7B; the
        # startup probe owns that window (up to 20 min) so the liveness
        # probe never kills a pod that is still fetching weights.
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 15
          failureThreshold: 80
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
      volumes:
      - name: model-cache
        emptyDir: {}
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      nodeSelector:
        eks.amazonaws.com/instance-gpu-manufacturer: nvidia
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: tgi-mistral
  namespace: gco-inference
  labels:
    app: tgi-mistral
    project: gco
spec:
  selector:
    app: tgi-mistral
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
