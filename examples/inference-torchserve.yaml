# TorchServe Inference Endpoint Example
#
# PyTorch's native model serving framework. Deploys a ResNet50 endpoint
# reachable through the authenticated API Gateway.
#
# Prerequisites:
#   - GPU node
#   - Model packaged as a .mar file on EFS:
#       torch-model-archiver --model-name resnet50 \
#         --version 1.0 --serialized-file model.pt \
#         --handler image_classifier \
#         --export-path /mnt/gco/models/torchserve/model-store
#
# Usage (recommended, multi-region aware):
#   gco inference deploy torchserve-resnet \
#     -i pytorch/torchserve:0.12.0-gpu \
#     --gpu-count 1 --replicas 1 \
#     --model-path /mnt/gco/models/torchserve \
#     --health-path /ping \
#     --port 8080
#
# Usage (single region, deploy this manifest directly):
#   gco jobs submit-direct examples/inference-torchserve.yaml -r us-east-1
#
# Test the endpoint (SigV4-authenticated via API Gateway; see docs/INFERENCE.md):
#   curl https://<API-Gateway-endpoint>/inference/torchserve-resnet/predictions/resnet50 \
#     -T image.jpg
#
# Docs: ../docs/INFERENCE.md

apiVersion: apps/v1
kind: Deployment
metadata:
  name: torchserve-resnet
  namespace: gco-inference
  labels:
    app: torchserve-resnet
    project: gco
    gco.io/type: inference
    framework: torchserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: torchserve-resnet
  template:
    metadata:
      labels:
        app: torchserve-resnet
        project: gco
        gco.io/type: inference
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Materialize the TorchServe config and (possibly empty) model store
      # on the EFS volume. Without the config TorchServe exits immediately
      # ("--ts-config file not found"), and its built-in defaults bind
      # 127.0.0.1, which kubelet probes against the pod IP can never reach —
      # the explicit 0.0.0.0 binds are what make readiness observable.
      # Serving an empty model store is the documented initial state; archive
      # models with torch-model-archiver (see header) to register them.
      initContainers:
      - name: torchserve-config
        image: python:3.14.7-slim
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        command:
        - python
        - -c
        - |
          import os
          os.makedirs("/models/model-store", exist_ok=True)
          config = "\n".join([
              "inference_address=http://0.0.0.0:8080",
              "management_address=http://0.0.0.0:8081",
              "metrics_address=http://0.0.0.0:8082",
              "model_store=/models/model-store",
              "",
          ])
          path = "/models/config.properties"
          if not os.path.exists(path):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(config)
              print(f"wrote {path}")
          else:
              print(f"{path} already present, leaving it untouched")
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: model-storage
          mountPath: /models
          subPath: torchserve
      containers:
      - name: torchserve
        image: pytorch/torchserve:0.12.0-gpu
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8080
          name: inference
        - containerPort: 8081
          name: management
        - containerPort: 8082
          name: metrics
        args:
        - "torchserve"
        - "--start"
        - "--foreground"
        - "--model-store=/models/model-store"
        - "--ts-config=/models/config.properties"
        - "--ncs"
        # TorchServe's built-in token authorization (default-on) rejects
        # unauthenticated requests with HTTP 400 — including kubelet's
        # /ping probes, so the pod restarts forever while the server is
        # healthy (live run ex241-ace8e651). AuthN/AuthZ for the endpoint
        # is the API Gateway's job (SigV4, see docs/INFERENCE.md); the
        # in-pod token adds nothing behind it.
        - "--disable-token-auth"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: model-storage
          mountPath: /models
          subPath: torchserve
        livenessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      nodeSelector:
        eks.amazonaws.com/instance-gpu-manufacturer: nvidia
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: efs-claim
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: torchserve-resnet
  namespace: gco-inference
  labels:
    app: torchserve-resnet
    project: gco
spec:
  selector:
    app: torchserve-resnet
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: inference
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: management
  type: ClusterIP
