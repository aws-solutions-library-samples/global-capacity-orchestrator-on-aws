# Model Download Job
#
# Downloads model weights from Hugging Face to the gco-jobs shared EFS volume,
# where training and batch jobs can read them without downloading again.
# Defaults to Qwen/Qwen2.5-0.5B-Instruct (about 1 GB, public, no token
# needed) — change MODEL_ID for other models, or uncomment HF_TOKEN for gated
# models. The download keeps the safetensors weights and skips the duplicate
# .bin and the TensorFlow/Flax copies some repositories also carry, so pick a
# model that ships safetensors.
#
# Prerequisites:
#   - Shared EFS PVC (gco-shared-storage, default)
#   - HF_TOKEN env var if the model is gated
#
# Usage:
#   kubectl apply -f examples/model-download-job.yaml
#   # After completion, every job in gco-jobs that mounts gco-shared-storage
#   # reads the weights from /mnt/gco/models/<model name>.
#
# Inference endpoints don't see this volume: gco-inference has its own EFS
# volume (each PVC gets its own access point). To serve the weights, upload
# them to the model registry and let each Region's init container sync them:
#   gco models upload ./Qwen2.5-0.5B-Instruct --name qwen-0-5b
#   gco inference deploy my-model \
#     -i vllm/vllm-openai:v0.31.0 \
#     --model-source $(gco models uri qwen-0-5b) \
#     -e MODEL=/models/my-model
#
# Notes:
#   - To pull from S3 instead of HuggingFace, swap the command for:
#       aws s3 sync s3://my-bucket/models/llama3 /mnt/gco/models/llama3
#
# Docs: ../docs/INFERENCE.md
apiVersion: batch/v1
kind: Job
metadata:
  name: download-model
  namespace: gco-jobs
  labels:
    app: model-download
    project: gco
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: downloader
        image: python:3.14.8-slim
        command:
        - python
        - -c
        - |
          import subprocess, sys, os
          subprocess.check_call([sys.executable, "-m", "pip", "install",
                                 "--target", "/tmp/pylib", "huggingface_hub", "-q"])
          sys.path.insert(0, "/tmp/pylib")
          from huggingface_hub import snapshot_download

          model_id = os.environ.get("MODEL_ID", "Qwen/Qwen2.5-0.5B-Instruct")
          model_name = model_id.split("/")[-1]
          local_dir = f"/mnt/gco/models/{model_name}"

          print(f"Downloading {model_id} to {local_dir}...")
          snapshot_download(
              repo_id=model_id,
              local_dir=local_dir,
              ignore_patterns=["*.gguf", "*.ggml", "*.bin", "*.h5", "*.msgpack"],
          )
          print(f"Download complete! Model saved to {local_dir}")

          # List downloaded files
          for root, dirs, files in os.walk(local_dir):
              for f in files:
                  path = os.path.join(root, f)
                  size_mb = os.path.getsize(path) / (1024 * 1024)
                  print(f"  {os.path.relpath(path, local_dir)} ({size_mb:.1f} MB)")
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        env:
        - name: MODEL_ID
          value: "Qwen/Qwen2.5-0.5B-Instruct"
        - name: HF_HOME
          value: "/tmp/hf_cache"
        # Uncomment for gated models (Llama, Mistral, etc.)
        # - name: HF_TOKEN
        #   value: "hf_your_token_here"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/gco
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: gco-shared-storage
      restartPolicy: Never
  backoffLimit: 2
