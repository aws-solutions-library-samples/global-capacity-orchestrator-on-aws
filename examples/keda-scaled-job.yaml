# KEDA ScaledJob Example — Safe SQS Scaling Demonstration
#
# This example demonstrates only how KEDA turns SQS queue depth into Kubernetes
# Jobs. The worker intentionally has no AWS credentials and never calls
# ReceiveMessage or DeleteMessage, so it cannot consume or acknowledge messages.
#
# IMPORTANT: use a disposable demo queue. Do NOT set queueURL to GCO's
# JobQueueUrl: this non-consuming observer would repeatedly scale while real job
# submissions remained queued. GCO's built-in, validated consumer is defined in
# lambda/kubectl-applier-simple/manifests/post-helm-sqs-consumer.yaml.
#
# Prerequisites:
#   - KEDA (enabled by default)
#   - A disposable SQS queue containing synthetic messages
#   - KEDA operator read-only queue-metric permission for that demo queue
#
# Usage:
#   1. Replace the obvious demo queue URL and region below.
#   2. Apply this manifest and observe Jobs scale from queue depth.
#   3. Delete the ScaledJob when finished; this example never drains the queue.
#
# Docs:
#   - KEDA SQS scaler: https://keda.sh/docs/latest/scalers/aws-sqs/
#   - GCO guide: ../docs/KEDA.md

---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: sqs-scaling-observer
  namespace: gco-jobs
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    template:
      metadata:
        labels:
          app: sqs-scaling-observer
          gco.io/job-type: safe-scaling-demo
      spec:
        # The observer neither calls AWS nor Kubernetes APIs.
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: observer
            image: python:3.14.7-slim
            command: ["python", "-c"]
            args:
              - >-
                print("KEDA created this Job from demo queue depth. "
                "This safe observer does not receive or delete SQS messages.")
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
        restartPolicy: Never

  pollingInterval: 15
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  maxReplicaCount: 5
  minReplicaCount: 0

  # The KEDA operator reads queue depth with its own identity. queueLength is the
  # target number of queued messages per active Job, not a number this worker
  # receives or drains.
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "https://sqs.us-east-1.amazonaws.com/111122223333/REPLACE-WITH-DISPOSABLE-DEMO-QUEUE"
        queueLength: "5"
        awsRegion: "us-east-1"
        identityOwner: operator
