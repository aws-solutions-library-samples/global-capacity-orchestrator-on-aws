# NVIDIA Triton Inference Server Example
#
# Multi-framework model serving (TensorRT, ONNX, PyTorch, TensorFlow).
#
# Prerequisites:
#   - GPU node
#   - A Triton model repository: one directory per model, each holding a
#     config.pbtxt and numbered version directories
#
# Usage (recommended, multi-region aware). Upload the repository to the model
# registry; each Region's init container syncs it to /models/<endpoint name>.
# The image doesn't start the server on its own, so the --extra-args run
# tritonserver against that directory:
#   gco models upload ./triton-repo --name triton-repo
#   gco inference deploy triton-models \
#     -i nvcr.io/nvidia/tritonserver:26.09-py3 \
#     --gpu-count 1 --replicas 2 \
#     --health-path /v2/health/ready \
#     --model-source $(gco models uri triton-repo) \
#     --extra-args tritonserver \
#     --extra-args=--model-repository=/models/triton-models
#
# Triton takes input tensors rather than a prompt, so name the model and send a
# KServe v2 inference request:
#   gco inference models triton-models
#   gco inference invoke triton-models --path /v2/models/<model>/infer \
#     -d '{"inputs": [{"name": "INPUT0", "shape": [3], "datatype": "FP32", "data": [1, 2, 3]}]}'
#
# Usage (single region, deploy this manifest directly):
#   gco jobs submit-direct examples/inference-triton.yaml -r us-east-1
# This applies a plain Deployment and Service with the same name as the
# managed endpoint above, so use one or the other in a Region. It serves the
# triton-repo/ directory of the inference namespace's EFS volume (efs-claim);
# while that is empty the server starts with no models. Nothing registers the
# manifest with the inference monitor: `gco inference` doesn't manage it and
# the /inference/ route doesn't reach it. Test it from your machine through the
# cluster tunnel (`gco cluster tunnel --via-ssm auto` prints the kubectl flags
# to use):
#   kubectl port-forward -n gco-inference svc/triton-models 8000:80
#   curl http://localhost:8000/v2/health/ready
#
# Docs: ../docs/INFERENCE.md

apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-models
  namespace: gco-inference
  labels:
    # No gco.io/type: inference here: on an object in gco-inference that label
    # marks it as the inference monitor's own, and only the monitor may set it
    # (09-tenant-write-fence.yaml). The pods below keep it, so they get the
    # model pods' network rules.
    app: triton-models
    project: gco
    framework: triton
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triton-models
  template:
    metadata:
      labels:
        app: triton-models
        project: gco
        gco.io/type: inference
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: triton
        image: nvcr.io/nvidia/tritonserver:26.09-py3
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: grpc
        - containerPort: 8002
          name: metrics
        args:
        - "tritonserver"
        - "--model-repository=/models"
        - "--strict-model-config=false"
        - "--log-verbose=0"
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: model-storage
          mountPath: /models
          subPath: triton-repo
        # Triton listens only after it has loaded every model in the
        # repository, so the startup probe holds liveness off for up to 20
        # minutes while large models load (the inference monitor's budget for
        # a managed endpoint).
        startupProbe:
          httpGet:
            path: /v2/health/live
            port: 8000
          periodSeconds: 15
          failureThreshold: 80
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /v2/health/live
            port: 8000
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      nodeSelector:
        eks.amazonaws.com/instance-gpu-manufacturer: nvidia
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: efs-claim
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: triton-models
  namespace: gco-inference
  labels:
    app: triton-models
    project: gco
spec:
  selector:
    app: triton-models
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: grpc
  type: ClusterIP
