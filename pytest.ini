[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output configuration
addopts = -v --tb=short

# Markers
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test
    mission_e2e: mark test as a Mission end-to-end test (full session through the engine)
    mooncake_image: mark test as a Mooncake vLLM image contract test (opt-in via GCO_MOONCAKE_IMAGE_TEST=1; pulls/runs the ~9GB image)
    helm_online: mark test as a Helm chart resolve/render check (opt-in via GCO_HELM_CHART_VALIDATION=1; needs helm + network)
