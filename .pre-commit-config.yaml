repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Formatter. Run before ``ruff`` so the check sees formatter output.
      - id: ruff-format
        exclude: '/(\.venv|cdk\.out|lambda/kubectl-applier-simple-build|lambda/helm-installer-build)/'
      # Linter, including isort-style import sorting via the ``I`` rule
      # selected in pyproject.toml.
      - id: ruff
        args: [--fix, --exclude, lambda/kubectl-applier-simple-build, --exclude, lambda/helm-installer-build]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        # The mirror environment intentionally installs only typing helpers,
        # not the full runtime graph. Keep substantive strict checks here but
        # leave decorator/base typing to CI, which installs the real packages.
        args:
          [
            --ignore-missing-imports,
            --no-error-summary,
            --allow-untyped-decorators,
            --allow-subclassing-any,
            gco/config,
            gco/models,
            gco/services,
            cli,
          ]
        # gco/stacks/ excluded here because CDK type stubs aren't installed in pre-commit.
        # Stacks are type-checked in CI via the lint:typecheck-stacks job.
        files: ^(gco/(config|models|services)/|cli/)
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .github/config/.yamllint.yml]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      # Configuration (rule set, globs, ignores) lives in
      # .github/config/.markdownlint-cli2.yaml. See CONTRIBUTING.md for
      # how to install the locked root graph and run `npm run lint:markdown`.
      - id: markdownlint-cli2
        args: ["--config", ".github/config/.markdownlint-cli2.yaml"]
