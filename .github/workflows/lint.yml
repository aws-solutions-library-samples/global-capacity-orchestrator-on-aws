# =============================================================================
# lint.yml — Linting & static style checks
# =============================================================================
#
# Maps to the "Linting" row of the README badge table.
#
# Triggers:
#   - push to main
#   - pull_request
#   - workflow_dispatch (manual)
#
# Jobs (display names are colon-delimited, job IDs are hyphen-delimited):
#   - lint:actionlint:workflows   — validates .github/workflows/*.yml
#   - lint:actions:pinning        — every action SHA-pinned, comment matches upstream
#   - lint:hadolint:dockerfile    — hadolint on every Dockerfile
#   - lint:markdownlint:md        — markdownlint-cli2 across all Markdown files
#   - lint:mkdocs:strict          — strict MkDocs build of the wiki (wiki/ + mkdocs.yml)
#   - lint:mypy:strict            — mypy on gco/ (excluding stacks), cli/, gco_mcp/, scripts/
#   - lint:mypy:stacks            — mypy on gco/stacks/ + app.py (requires CDK)
#   - lint:mypy:lambda            — mypy on each lambda/ subdir independently
#   - lint:ruff:python            — ruff format --check + ruff check (via astral-sh/ruff-action)
#   - lint:shellcheck:shell       — strict ShellCheck on every tracked *.sh file
#   - lint:yamllint:yaml          — yamllint --strict across the repo
#
# Every job has `timeout-minutes` to cap runaway runs.
# Concurrency control cancels in-flight runs when a newer commit lands on the
# same ref (safe for CI, off for release.yml).
#
# =============================================================================

name: Linting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-actionlint-workflows:
    name: "lint:actionlint:workflows"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The monthly dependency scan tracks this version against upstream.
      # Bump the version and reviewed release-asset checksum together.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint-install"
          curl --fail --show-error --location --retry 3 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" --no-same-owner actionlint
          install -m 0755 "${install_dir}/actionlint" ./actionlint
          rm -f "${archive}" "${install_dir}/actionlint"
          rmdir "${install_dir}"
          ./actionlint -version
      - name: Run actionlint
        run: ./actionlint -color

  lint-actions-pinning:
    name: "lint:actions:pinning"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
      # Stdlib only, so no dependency install: this job must keep working even
      # when the lockfile is mid-bump, since a bad action pin is exactly the
      # kind of thing a dependency PR introduces.
      #
      # --verify-upstream resolves each `# vX.Y.Z` comment against
      # api.github.com and fails if the tag does not point at the pinned SHA.
      # That catches both a wrong comment and a tag the publisher has since
      # moved. github.token raises the API allowance to 1,000 requests/hour;
      # only ~15 calls are made (one per action repository), and a lookup that
      # cannot be completed is reported without failing the job so an API blip
      # never blocks a pull request.
      - name: Verify every action is SHA-pinned and its version comment is true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_action_pins.py --verify-upstream

  lint-yamllint-yaml:
    name: "lint:yamllint:yaml"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install yamllint
        run: pip install -e ".[lint]"
      - name: yamllint --strict .
        run: yamllint -c .github/config/.yamllint.yml --strict .

  lint-ruff-python:
    name: "lint:ruff:python"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: ruff format --check
        # astral-sh/ruff-action ships a prebuilt ruff binary, so this job
        # skips the ~30-40s setup-python + pip-install-e-[lint] overhead
        # the other lint jobs pay. The version is pinned to match the exact
        # ruff entry in pyproject.toml's [project.optional-dependencies]
        # lint group so the pre-commit hook, developer installs, and CI
        # stay in lockstep. Bump all three together.
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: "0.16.5"
          args: "format --check --diff"
          src: >-
            gco/
            cli/
            gco_mcp/
            tests/
            lambda/
            scripts/
            diagrams/
      - name: ruff check
        # Includes pycodestyle (E/W), Pyflakes (F), bugbear (B),
        # comprehensions (C4), pyupgrade (UP), unused-arguments (ARG),
        # simplify (SIM), and isort-style import sorting (I). Exclusions
        # target build-staged Lambda package directories that contain
        # third-party wheels we don't own.
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: "0.16.5"
          args: "check --exclude lambda/kubectl-applier-simple-build --exclude lambda/helm-installer-build"
          src: >-
            gco/
            cli/
            gco_mcp/
            tests/
            lambda/
            scripts/
            diagrams/

  lint-markdownlint-md:
    name: "lint:markdownlint:md"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - name: Install locked repository Node tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run markdownlint-cli2
        # The exact CLI and transitive graph come from package-lock.json so
        # local runs and CI execute the same dependency set.
        run: npm run lint:markdown

  # The identical build pages.yml runs at deploy time. workflow_run always
  # executes the default-branch workflow definition, so the deploy itself
  # cannot be exercised from a PR branch — this job is what makes a broken
  # wiki (dead internal link, nav entry without a file, config error) a
  # pre-merge failure instead of a post-merge "Deploy Pages" surprise.
  # `strict: true` in mkdocs.yml promotes every build warning to an error.
  lint-mkdocs-strict:
    name: "lint:mkdocs:strict"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install the docs toolchain
        run: pip install -e ".[docs]"
      - name: Strict MkDocs build of the wiki
        run: mkdocs build --strict

  lint-hadolint-dockerfile:
    name: "lint:hadolint:dockerfile"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Pre-pull hadolint image
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: hadolint/hadolint:v2.14.0-debian
      - name: Run hadolint on every Dockerfile
        # DL3008 (apt pin) and DL3013 (pip pin) are ignored to match the
        # policy inherited from the GitLab pipeline. Revisit once all base
        # images switch to pip-tools-style pinning.
        run: |
          set -euo pipefail
          # The image entrypoint is hadolint; override it so this shell loop
          # executes instead of being parsed as hadolint file arguments.
          docker run --rm --entrypoint bash -v "$PWD":/repo -w /repo \
            hadolint/hadolint:v2.14.0-debian \
            -c '
              set -euo pipefail
              FOUND=0
              while IFS= read -r df; do
                FOUND=1
                echo "=== Linting $df ==="
                hadolint "$df" --ignore DL3008 --ignore DL3013
              done < <(find . -type f \( -name "Dockerfile*" -o -name "*dockerfile" -o -name "*Dockerfile" \) \
                -not -path "./.git/*" \
                -not -path "./cdk.out/*" \
                -not -path "./.venv/*" \
                -not -path "./lambda/kubectl-applier-simple-build/*" \
                -not -path "./lambda/helm-installer-build/*")
              if [ "$FOUND" -eq 0 ]; then
                echo "No Dockerfiles found — failing to avoid silent pass."
                exit 1
              fi
            '

  lint-shellcheck-shell:
    name: "lint:shellcheck:shell"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Exact release tag shared by pre-pull and execution.
      SHELLCHECK_IMAGE: "koalaman/shellcheck-alpine:v0.11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Pre-pull shellcheck image
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: ${{ env.SHELLCHECK_IMAGE }}
      - name: Run strict ShellCheck on every tracked shell script
        # The Git index is the policy boundary: every tracked *.sh path is
        # checked, independent of its directory. NUL delimiters preserve every
        # valid pathname; an empty set fails instead of silently passing.
        run: |
          set -euo pipefail
          targets="${RUNNER_TEMP}/shellcheck-files.z"
          trap 'rm -f "$targets"' EXIT

          git ls-files -z -- '*.sh' > "$targets"
          if [[ ! -s "$targets" ]]; then
            echo '::error::No tracked *.sh files found; refusing to pass.' >&2
            exit 1
          fi

          xargs -0 -r -- \
            docker run --rm \
              --entrypoint /bin/shellcheck \
              -v "${PWD}:/repo:ro" \
              -w /repo \
              "$SHELLCHECK_IMAGE" \
              --severity=style \
              --external-sources \
              -- < "$targets"

  lint-mypy-strict:
    name: "lint:mypy:strict"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install typecheck dependencies
        run: |
          # Install full project + mcp extras so mypy can resolve real types
          # for boto3, kubernetes, fastapi, click, fastmcp. CDK is intentionally
          # NOT installed here — gco/stacks/ is checked in lint-mypy-stacks.
          pip install -e ".[typecheck,mcp]"
      - name: Cache mypy results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-strict-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
      - name: Run mypy
        run: mypy gco/ cli/ gco_mcp/ scripts/ --exclude 'gco/stacks/'

  lint-mypy-stacks:
    name: "lint:mypy:stacks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install typecheck + cdk dependencies
        run: |
          pip install -e ".[cdk,typecheck]"
      - name: Cache mypy results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-stacks-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
      - name: Run mypy on stacks + app.py
        run: mypy gco/stacks/ app.py

  lint-mypy-lambda:
    name: "lint:mypy:lambda"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install typecheck dependencies
        run: |
          pip install -e ".[typecheck]"
      - name: Cache mypy results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-lambda-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
      - name: Run mypy on each Lambda dir
        # Each Lambda ships its own handler.py; check them one at a time so
        # mypy's module resolver doesn't treat them as duplicates.
        run: |
          set -uo pipefail
          FAILED=0
          for d in lambda/analytics-cleanup lambda/analytics-presigned-url \
                   lambda/api-gateway-proxy lambda/capacity-poller \
                   lambda/cross-region-aggregator lambda/drift-detection \
                   lambda/ga-registration lambda/helm-installer \
                   lambda/helm-orchestrator lambda/image-lookup \
                   lambda/kubectl-applier-simple lambda/proxy-shared \
                   lambda/regional-api-proxy lambda/secret-rotation \
                   lambda/tls-certificate-manager lambda/tls-shared; do
            echo "=== typecheck: $d ==="
            if ! mypy "$d"; then
              FAILED=1
            fi
          done
          exit "$FAILED"
