# =============================================================================
# lint.yml — Linting & static style checks
# =============================================================================
#
# Maps to the "Linting" row of the README badge table.
#
# Triggers:
#   - push to main
#   - pull_request
#   - workflow_dispatch (manual)
#
# Jobs (display names are colon-delimited, job IDs are hyphen-delimited):
#   - lint:actionlint:workflows   — validates .github/workflows/*.yml
#   - lint:hadolint:dockerfile    — hadolint on every Dockerfile
#   - lint:markdownlint:md        — markdownlint-cli2 across all Markdown files
#   - lint:mypy:strict            — mypy on gco/ (excluding stacks), cli/, gco_mcp/, scripts/
#   - lint:mypy:stacks            — mypy on gco/stacks/ + app.py (requires CDK)
#   - lint:mypy:lambda            — mypy on each lambda/ subdir independently
#   - lint:ruff:python            — ruff format --check + ruff check (via astral-sh/ruff-action)
#   - lint:shellcheck:shell       — shellcheck -x on every .sh file
#   - lint:yamllint:yaml          — yamllint --strict across the repo
#
# Every job has `timeout-minutes` to cap runaway runs.
# Concurrency control cancels in-flight runs when a newer commit lands on the
# same ref (safe for CI, off for release.yml).
#
# =============================================================================

name: Linting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-actionlint-workflows:
    name: "lint:actionlint:workflows"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        # Invoke the upstream install script directly — the third-party
        # `raven-actions/actionlint` action had compatibility issues with
        # the current `@actions/tool-cache` runtime.
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -version
      - name: Run actionlint
        run: ./actionlint -color

  lint-yamllint-yaml:
    name: "lint:yamllint:yaml"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install yamllint
        run: pip install -e ".[lint]"
      - name: yamllint --strict .
        run: yamllint -c .github/config/.yamllint.yml --strict .

  lint-ruff-python:
    name: "lint:ruff:python"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ruff format --check
        # astral-sh/ruff-action ships a prebuilt ruff binary, so this job
        # skips the ~30-40s setup-python + pip-install-e-[lint] overhead
        # the other lint jobs pay. The version is pinned to match the
        # ruff==0.15.21 entry in pyproject.toml's [project.optional-dependencies]
        # lint group so the pre-commit hook, developer installs, and CI
        # stay in lockstep. Bump both together.
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.0"
          args: "format --check --diff"
          src: >-
            gco/
            cli/
            gco_mcp/
            tests/
            lambda/
            scripts/
            diagrams/
      - name: ruff check
        # Includes pycodestyle (E/W), Pyflakes (F), bugbear (B),
        # comprehensions (C4), pyupgrade (UP), unused-arguments (ARG),
        # simplify (SIM), and isort-style import sorting (I). Exclusions
        # target build-staged Lambda package directories that contain
        # third-party wheels we don't own.
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.0"
          args: "check --exclude lambda/kubectl-applier-simple-build --exclude lambda/helm-installer-build"
          src: >-
            gco/
            cli/
            gco_mcp/
            tests/
            lambda/
            scripts/
            diagrams/

  lint-markdownlint-md:
    name: "lint:markdownlint:md"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - name: Install locked repository Node tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run markdownlint-cli2
        # The exact CLI and transitive graph come from package-lock.json so
        # local runs and CI execute the same dependency set.
        run: npm run lint:markdown

  lint-hadolint-dockerfile:
    name: "lint:hadolint:dockerfile"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pre-pull hadolint image
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: hadolint/hadolint:v2.14.0-debian
      - name: Run hadolint on every Dockerfile
        # DL3008 (apt pin) and DL3013 (pip pin) are ignored to match the
        # policy inherited from the GitLab pipeline. Revisit once all base
        # images switch to pip-tools-style pinning.
        run: |
          set -euo pipefail
          # The image entrypoint is hadolint; override it so this shell loop
          # executes instead of being parsed as hadolint file arguments.
          docker run --rm --entrypoint bash -v "$PWD":/repo -w /repo \
            hadolint/hadolint:v2.14.0-debian \
            -c '
              set -euo pipefail
              FOUND=0
              while IFS= read -r df; do
                FOUND=1
                echo "=== Linting $df ==="
                hadolint "$df" --ignore DL3008 --ignore DL3013
              done < <(find . -type f \( -name "Dockerfile*" -o -name "*dockerfile" -o -name "*Dockerfile" \) \
                -not -path "./.git/*" \
                -not -path "./cdk.out/*" \
                -not -path "./.venv/*" \
                -not -path "./lambda/kubectl-applier-simple-build/*" \
                -not -path "./lambda/helm-installer-build/*")
              if [ "$FOUND" -eq 0 ]; then
                echo "No Dockerfiles found — failing to avoid silent pass."
                exit 1
              fi
            '

  lint-shellcheck-shell:
    name: "lint:shellcheck:shell"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pre-pull shellcheck image
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: koalaman/shellcheck-alpine:v0.11.0
      - name: Run shellcheck
        # -x follows source directives so sourced files are resolved.
        run: |
          set -euo pipefail
          # The image entrypoint is shellcheck; override it so this shell loop
          # executes instead of being parsed as shellcheck file arguments.
          docker run --rm --entrypoint sh -v "$PWD":/repo -w /repo \
            koalaman/shellcheck-alpine:v0.11.0 \
            -c '
              set -eu
              FOUND=0
              find . -name "*.sh" \
                -not -path "./.git/*" \
                -not -path "./cdk.out/*" \
                -not -path "./.venv/*" \
                -not -path "./lambda/kubectl-applier-simple-build/*" \
                -not -path "./lambda/helm-installer-build/*" \
                > /tmp/shellfiles
              while IFS= read -r sh; do
                FOUND=1
                echo "=== Checking $sh ==="
                shellcheck -x "$sh"
              done < /tmp/shellfiles
              if [ "$FOUND" -eq 0 ]; then
                echo "No shell scripts found — failing to avoid silent pass."
                exit 1
              fi
            '

  lint-mypy-strict:
    name: "lint:mypy:strict"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install typecheck dependencies
        run: |
          # Install full project + mcp extras so mypy can resolve real types
          # for boto3, kubernetes, fastapi, click, fastmcp. CDK is intentionally
          # NOT installed here — gco/stacks/ is checked in lint-mypy-stacks.
          pip install -e ".[typecheck,mcp]"
      - name: Cache mypy results
        uses: actions/cache@v6.1.0
        with:
          path: .mypy_cache
          key: mypy-strict-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
      - name: Run mypy
        run: mypy gco/ cli/ gco_mcp/ scripts/ --exclude 'gco/stacks/'

  lint-mypy-stacks:
    name: "lint:mypy:stacks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install typecheck + cdk dependencies
        run: |
          pip install -e ".[cdk,typecheck]"
      - name: Cache mypy results
        uses: actions/cache@v6.1.0
        with:
          path: .mypy_cache
          key: mypy-stacks-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
      - name: Run mypy on stacks + app.py
        run: mypy gco/stacks/ app.py

  lint-mypy-lambda:
    name: "lint:mypy:lambda"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install typecheck dependencies
        run: |
          pip install -e ".[typecheck]"
      - name: Cache mypy results
        uses: actions/cache@v6.1.0
        with:
          path: .mypy_cache
          key: mypy-lambda-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
      - name: Run mypy on each Lambda dir
        # Each Lambda ships its own handler.py; check them one at a time so
        # mypy's module resolver doesn't treat them as duplicates.
        run: |
          set -uo pipefail
          FAILED=0
          for d in lambda/analytics-cleanup lambda/analytics-presigned-url \
                   lambda/api-gateway-proxy lambda/capacity-poller \
                   lambda/cross-region-aggregator lambda/drift-detection \
                   lambda/ga-registration lambda/helm-installer \
                   lambda/helm-orchestrator lambda/image-lookup \
                   lambda/kubectl-applier-simple lambda/proxy-shared \
                   lambda/regional-api-proxy lambda/secret-rotation \
                   lambda/tls-certificate-manager lambda/tls-shared; do
            echo "=== typecheck: $d ==="
            if ! mypy "$d"; then
              FAILED=1
            fi
          done
          exit "$FAILED"
