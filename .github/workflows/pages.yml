# =============================================================================
# pages.yml — Publish the wiki + the three coverage reports to GitHub Pages
# =============================================================================
#
# Deploys ONE Pages artifact containing:
#   /                    — the orientation wiki, built with MkDocs from wiki/
#                          and mkdocs.yml at the exact commit the triggering
#                          Unit Tests run measured (workflow_run.head_sha)
#   /python-coverage/    — coverage.py's HTML report (htmlcov/) from that run,
#                          copied as-is (no pytest re-run, no regeneration)
#   /bash-coverage/      — the statement-level shell report that
#                          check_bash_coverage.py --report wrote in the same
#                          run (the corrected view the gate enforces, not
#                          SimpleCov's raw line count)
#   /nodejs-coverage/    — the genhtml rendering of Node's lcov tracefile from
#                          the "Inference Streaming Proxy" run for the same
#                          commit (that suite lives in its own workflow)
#   /coverage/           — a redirect to /python-coverage/, the report's old
#                          address, so links published before the split keep
#                          resolving
#   /python-coverage-badge.json, /bash-coverage-badge.json,
#   /nodejs-coverage-badge.json
#                        — the shields.io endpoint documents the README's
#                          three coverage badges read, rendered by
#                          .github/scripts/render_coverage_badges.py from the
#                          three reports above and kept at the site ROOT so
#                          the badges' percent-encoded shields URLs never
#                          change
# served at https://aws-solutions-library-samples.github.io/global-capacity-orchestrator-on-aws/.
# GitHub Pages via Actions supports exactly one deployment per repository,
# which is why the wiki and the reports ship together.
#
# Why a separate workflow (not a job inside unit-tests.yml)?
#   Publishing the site is best-effort infrastructure, not a test.
#   When the GitHub Pages backend stalls — the submitted deployment sits in
#   `deployment_queued` / `in_progress` and never finalizes — a deploy job
#   living inside "Unit Tests" drags that whole workflow red even though every
#   test passed. Giving the deploy its own workflow gives it an independent
#   status: a Pages outage (or a wiki build failure) surfaces here, on
#   "Deploy Pages", and the "Unit Tests" gate keeps reporting purely on tests.
#
# How it gets the reports:
#   `workflow_run` fires when "Unit Tests" finishes on main. This job then
#   downloads the `pytest-coverage` and `bash-coverage-report` artifacts from
#   that run (via actions/download-artifact with run-id + github-token — the
#   documented way to pull an artifact from another run), locates the
#   "Inference Streaming Proxy" run for the same commit and downloads its
#   `node-inference-streaming-proxy-coverage` artifact, builds the wiki from
#   the same commit, renders the three badges, merges everything into one
#   site tree, and deploys it. Every report describes the one commit.
#
# Note: workflow_run always uses the workflow definition from the default
# branch, so edits here only take effect once merged to main (they can't be
# exercised from a PR branch). The PR-side `lint:mkdocs:strict` job in
# lint.yml runs the identical wiki build, so a broken wiki fails pre-merge,
# and each report is produced — and its shape verified — by the test job
# that measures it; the packaging steps below (the sibling-run lookup, the
# mv's, the redirect stub and the badge paths) are the only deploy-exclusive
# logic.
# =============================================================================

name: Deploy Pages

on:
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]
    branches: [main]

# Serialize Pages deployments and never cancel an in-flight real deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: "pages:deploy"
    # workflow_run is privileged: it uses the default-branch workflow and can
    # write to Pages. Require a successful push from this repository's actual
    # default branch; the trigger's branch filter remains defense in depth.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Job-level permissions replace the top-level block for this job:
    #   contents: read — checkout of the triggering commit, so the wiki is
    #                    built from the exact code the published coverage
    #                    measured
    #   pages: write    — actions/deploy-pages finalizes the deployment
    #   id-token: write — OIDC token the deploy action authenticates with
    #   actions: read   — download-artifact reads an artifact from another
    #                    run, and `gh run list` finds the sibling run
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - name: Check out the commit the Unit Tests run measured
        # The pwn-request pattern this rule targets is checking out ATTACKER
        # code (a fork PR's head) into a privileged workflow_run context. The
        # job-level `if:` above admits only successful `push` events from
        # THIS repository's own default branch — never pull_request events,
        # never fork heads — so head_sha here is always a commit already
        # merged to main. Reviewed as a false positive.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install the docs toolchain
        run: pip install -e ".[docs]"
      - name: Build the wiki (strict)
        # Identical build to the PR-side lint:mkdocs:strict job. strict mode
        # fails the deploy on any broken link or nav entry rather than
        # publishing a damaged site; the previous deployment keeps serving.
        run: mkdocs build --strict
      - name: Download the Python coverage artifact from the Unit Tests run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pytest-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: python-coverage-data
      - name: Download the shell coverage artifact from the Unit Tests run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bash-coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: bash-coverage-data
      - name: Locate the Inference Streaming Proxy run for the same commit
        # The Node suite runs in its own workflow, triggered by the same push.
        # It takes a minute or two against Unit Tests' ten-plus, so it has
        # normally finished long before this job starts; the loop covers a
        # run that queued late. A missing or failed sibling run fails the
        # deploy on purpose — the site describes one commit, and publishing
        # two reports with a stale third would say otherwise — and the
        # previous deployment keeps serving.
        id: node_run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            run_json="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow inference-streaming-proxy.yml --commit "$HEAD_SHA" --event push \
              --limit 1 --json databaseId,status,conclusion)"
            status="$(jq -r '.[0].status // "absent"' <<< "$run_json")"
            if [ "$status" = "completed" ]; then
              conclusion="$(jq -r '.[0].conclusion' <<< "$run_json")"
              run_id="$(jq -r '.[0].databaseId' <<< "$run_json")"
              if [ "$conclusion" != "success" ]; then
                echo "::error::Inference Streaming Proxy run ${run_id} for ${HEAD_SHA} concluded" \
                  "'${conclusion}'; not publishing a site with a stale Node.js report"
                exit 1
              fi
              echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
              echo "Inference Streaming Proxy run ${run_id} succeeded for ${HEAD_SHA}"
              exit 0
            fi
            echo "attempt ${attempt}/40: Inference Streaming Proxy run for ${HEAD_SHA} is ${status}; waiting 15s"
            sleep 15
          done
          echo "::error::no completed Inference Streaming Proxy run for ${HEAD_SHA} after 10 minutes"
          exit 1
      - name: Download the Node.js coverage artifact from that run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-inference-streaming-proxy-coverage
          run-id: ${{ steps.node_run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: node-coverage-data
      - name: Merge the three reports into the site
        # Each report tree is moved unmodified: htmlcov/index.html becomes
        # /python-coverage/index.html, the checker's report/index.html becomes
        # /bash-coverage/index.html, and genhtml's coverage/index.html becomes
        # /nodejs-coverage/index.html. `mv` fails loudly if a side is missing,
        # which is the desired behavior. /coverage/ was the Python report's
        # address before the reports were split by stack; a redirect stub
        # keeps every link published under that address resolving.
        run: |
          set -euo pipefail
          mv python-coverage-data/htmlcov site/python-coverage
          mv bash-coverage-data/report site/bash-coverage
          mv node-coverage-data/coverage site/nodejs-coverage
          mkdir site/coverage
          cat > site/coverage/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../python-coverage/">
          <link rel="canonical" href="../python-coverage/">
          <title>Moved to /python-coverage/</title></head>
          <body><p>The Python coverage report now lives at <a href="../python-coverage/">/python-coverage/</a>.
          The shell and Node.js reports are at <a href="../bash-coverage/">/bash-coverage/</a> and
          <a href="../nodejs-coverage/">/nodejs-coverage/</a>.</p></body></html>
          HTML
      - name: Render the shields.io badge endpoint JSON
        # One badge per report, from the number each gate enforces: coverage.py's
        # totals.percent_covered, the shell checker's summary.json (statements
        # after its lexer corrections), and Node's lcov.info (lines and
        # branches together). Bright green at exactly 100% — the floor every
        # test job enforces — and red below it, so the badges never introduce
        # a second threshold. The files stay at the SITE ROOT: the README
        # badges percent-encode those exact root URLs, so keeping them there
        # means the shields URLs — and their fork-migration rewrite rule —
        # never change.
        run: |
          set -euo pipefail
          python3 .github/scripts/render_coverage_badges.py \
            --python python-coverage-data/coverage.json \
            --bash site/bash-coverage/summary.json \
            --node node-coverage-data/lcov.info \
            --out site
      - name: Package the merged site as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          # site/ holds the built wiki at the root, the three reports under
          # python-coverage/, bash-coverage/ and nodejs-coverage/, the
          # /coverage/ redirect, and the three badge JSONs at the root — the
          # single deployment GitHub Pages serves.
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          # Give up after 3 minutes rather than the action's 10-minute
          # default, so a stuck Pages deployment ends the step cleanly inside
          # this job's timeout-minutes backstop.
          timeout: 180000
