  integration-docker-dev-container:
    name: "integration:docker:dev-container (${{ matrix.arch }})"
    # Matrix over the two supported Dockerfile.dev target architectures.
    # Each runner builds natively for its own arch — no QEMU emulation.
    # GitHub provides ubuntu-24.04-arm as a standard public runner, so
    # both paths run on native kernels instead of translating every RUN
    # step through binfmt.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            expected-uname: x86_64
            # AWS CLI v2 build identifier contains the GNU arch tag —
            # grepping for it proves we downloaded the right tarball, not
            # just that the binary happens to run.
            awscli-arch-grep: "x86_64\\|amd64"
            # ELF e_machine magic number for this architecture.
            # 0x3E = EM_X86_64, 0xB7 = EM_AARCH64.
            elf-e-machine: "0x3E"
          - arch: arm64
            runner: ubuntu-24.04-arm
            expected-uname: aarch64
            awscli-arch-grep: "aarch64"
            elf-e-machine: "0xB7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build dev container
        # Native build on the matching host arch — no --platform or QEMU.
        # Dockerfile.dev is parameterized on BuildKit's $TARGETARCH, which
        # resolves to the host's arch by default. The retry wrapper absorbs
        # Docker Hub registry timeouts while resolving base-image metadata;
        # this stays a plain `docker build` (daemon default builder), exactly
        # what a contributor runs.
        uses: ./.github/actions/docker-build-with-retry
        with:
          dockerfile: Dockerfile.dev
          tag: gco-dev
      - name: Exercise CLI inside dev container
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace gco-dev gco --help
          docker run --rm -v "$PWD":/workspace -w /workspace gco-dev gco capacity --help
          docker run --rm -v "$PWD":/workspace -w /workspace gco-dev gco stacks --help
      - name: Verify pinned toolchain versions
        # The verifier reads all eight reviewed Dockerfile ARG pins and fails
        # when any installed tool reports a different runtime version.
        run: >-
          python3 .github/scripts/verify_container_tool_versions.py
          dev --image gco-dev
      - name: Exercise gco autopilot inside the dev container
        # The dev container is the recommended autopilot front door (via the
        # setup-dev-alias.sh shell function), so prove the pieces the image
        # contributes without needing AWS credentials or Claude Code:
        #   1. the runtime npm prefix that the function's gco-dev-tools
        #      volume mounts over (where the pinned Claude Code install
        #      persists), and its PATH wiring;
        #   2. full launch-plan resolution in-container;
        #   3. MCP config generation with a feature flag, running the GCO
        #      server from the mounted checkout.
        run: |
          set -euo pipefail
          docker run --rm gco-dev bash -c '
            set -euo pipefail
            [ "$(npm config get prefix)" = "/root/.npm-global" ]
            case ":$PATH:" in
              *":/root/.npm-global/bin:"*) ;;
              *) echo "/root/.npm-global/bin missing from PATH" >&2; exit 1 ;;
            esac
          '
          docker run --rm -v "$PWD":/workspace -w /workspace gco-dev \
            gco autopilot --dry-run
          docker run --rm -v "$PWD":/workspace -w /workspace gco-dev \
            gco autopilot -e all-tools --print-config > /tmp/autopilot-config.json
          # Shared autopilot CI contract: full server-set/shape/env checks
          # from the same single source unit:cli:autopilot and the boot
          # probe use; --gco-args additionally proves the gco server runs
          # from the mounted checkout, the assertion specific to this step.
          # Runs inside the image (the contract imports the cli package,
          # and the dev container ships the project environment).
          docker run --rm -v "$PWD":/workspace -w /workspace \
            -v /tmp/autopilot-config.json:/tmp/autopilot-config.json:ro gco-dev \
            python3 .github/scripts/autopilot_ci_contract.py \
              verify-config /tmp/autopilot-config.json \
              --expect-gco-env GCO_ENABLE_ALL_TOOLS=true \
              --gco-args /workspace/gco_mcp/run_mcp.py
      - name: Verify image contains native ${{ matrix.arch }} binaries
        # Two layers of verification:
        #   1. `uname -m` inside the container reports the expected arch.
        #   2. AWS CLI v2 build identifier contains the GNU arch tag,
        #      proving we downloaded the right tarball rather than one
        #      that just happens to run.
        #   3. ELF e_machine header on kubectl + docker binaries confirms
        #      we have architecture-native binaries end-to-end. This
        #      catches Dockerfile regressions where a tool URL gets pinned
        #      back to the wrong arch, or where the GNU-arch derivation
        #      in the Dockerfile breaks for one side of the matrix.
        run: |
          set -euo pipefail
          arch=$(docker run --rm gco-dev uname -m)
          [ "$arch" = "${{ matrix.expected-uname }}" ] || {
            echo "Expected ${{ matrix.expected-uname }}, got: $arch"
            exit 1
          }
          docker run --rm gco-dev aws --version | grep -q "${{ matrix.awscli-arch-grep }}"
          # `gco --version` actually loading proves no Python dependency
          # fell back to an arch-incompatible sdist.
          docker run --rm gco-dev gco --version
          # `-i` attaches stdin so the heredoc reaches `python3 -` inside
          # the container. Without it Docker drops stdin and the script
          # runs with empty input → silent no-op (no failure, no output).
          docker run --rm -i -e EXPECTED_E_MACHINE='${{ matrix.elf-e-machine }}' \
            gco-dev python3 - <<'PY'
          import os
          import pathlib
          import struct
          import sys

          expected = int(os.environ["EXPECTED_E_MACHINE"], 16)
          for binary in ("/usr/local/bin/kubectl", "/usr/local/bin/docker", "/usr/local/bin/uv"):
              with pathlib.Path(binary).open("rb") as f:
                  f.seek(0x12)  # ELF e_machine offset
                  e_machine = struct.unpack("<H", f.read(2))[0]
              if e_machine != expected:
                  print(
                      f"FAIL: {binary} e_machine=0x{e_machine:X} "
                      f"(expected 0x{expected:X})",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print(f"OK: {binary} e_machine=0x{e_machine:X}")
          PY
      - name: Pre-pull the DinD probe base image (with retry)
        # The inner build below is FROM alpine:3.24.1; warming the host
        # daemon's cache here (the inner build talks to that same daemon
        # over the socket) keeps a registry blip from failing the probe.
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: alpine:3.24.1
      - name: Verify Docker-in-Docker via host socket pass-through
        # `gco stacks deploy-all` drives `cdk deploy`, which shells out to
        # Docker to bundle Lambda assets. The dev container ships only the
        # Docker CLI (no daemon); it talks to the host daemon through the
        # bind-mounted socket documented in Dockerfile.dev's header. This
        # step proves the pass-through works end-to-end by building a
        # minimal throwaway image inside the container.
        run: |
          set -euo pipefail
          # Sanity: the host daemon we will pass through is reachable.
          docker info >/dev/null

          # Prepare a trivial build context on the runner filesystem so
          # the container can see it via the workspace bind mount.
          mkdir -p /tmp/dind-probe
          cat > /tmp/dind-probe/Dockerfile <<'DOCKERFILE'
          FROM alpine:3.24.1
          RUN echo "dind-probe" > /ok
          CMD ["cat", "/ok"]
          DOCKERFILE

          # Build from inside the dev container over the socket.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/dind-probe:/build \
            -w /build \
            gco-dev docker build -t dind-probe:ci .

          # Prove the image the inner build produced is visible to the
          # host daemon (the whole point of the pass-through).
          docker image inspect dind-probe:ci >/dev/null
          docker run --rm dind-probe:ci | grep -q '^dind-probe$'

          # Clean up the probe image so this job leaves the runner tidy.
          docker image rm dind-probe:ci alpine:3.24.1 >/dev/null 2>&1 || true

  # --------------------------------------------------------------------------
  # Kind cluster E2E — verifies the Kubernetes manifests apply cleanly to a
  # real API server with Calico installed so NetworkPolicy is enforced (not
  # silently dropped by kindnet). Scope is "manifests apply, resources are
  # created by the apiserver, NetworkPolicy validates" — not full readiness.
  #
  # The service Deployments depend on production-only infrastructure (IRSA
  # tokens from Pod Identity, Secrets Manager ARNs, cross-region DynamoDB)
  # that would need substantial stubbing to run Ready in CI. The image-level
  # "integration:docker:*" jobs above cover module-import correctness; this
  # job covers the manifest/apiserver path.
  # --------------------------------------------------------------------------

  integration-kind-cluster-e2e:
    name: "integration:kind:cluster-e2e"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # kind does not provide the EKS managed add-on used in production. Pin
      # upstream test-cluster components, authenticate their manifests, and
      # expose their versions to the monthly dependency drift scan. The kind
      # and Calico pins shared with examples-smoke live in the workflow-level
      # env block at the top of this file.
      METRICS_SERVER_VERSION: "v0.9.0"
      METRICS_SERVER_SHA256: "1cec29a5267809306a2c6ec74a3e449abbb705b4a8beed0c8a1963910f72c79b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Reclaim runner disk space before Kind image builds
        uses: ./.github/actions/free-disk-space
      - name: Create kind cluster (no default CNI)
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          version: "${{ env.KIND_VERSION }}"
          node_image: "${{ env.KIND_NODE_IMAGE }}"
          cluster_name: "gco-ci"
          config: ".github/kind/kind-calico.yaml"
          # Default CNI is disabled in the kind config so Calico can take
          # over NetworkPolicy enforcement. Skip the Ready wait here since
          # the control-plane cannot go Ready without a CNI; the next step
          # installs Calico and waits for Ready via `kubectl rollout status`.
          wait: "0s"
      - name: Install Calico for NetworkPolicy enforcement
        # kind's default kindnet does not enforce NetworkPolicy. Calico does,
        # so 03-network-policies.yaml is actually exercised here.
        #
        # Use `rollout status` rather than `kubectl wait --for=condition=Ready
        # pods -l …` because wait returns "no matching resources found" if
        # the pods haven't been scheduled yet by the apiserver — a race that
        # fires within a second of the apply. rollout status waits for the
        # workload to exist first, then waits for it to become Ready.
        #
        # The rollout wait is wrapped in a retry loop because calico-node
        # readiness is a known CI flake: the DaemonSet pod pulls its image
        # from quay.io and runs the install-cni / mount-bpffs init containers,
        # which can exceed a single timeout window under runner image-pull
        # latency or resource contention. The apply is idempotent, so each
        # attempt re-applies (a no-op once the objects exist) and re-waits;
        # transient slowness converges on a later attempt. On the final
        # failure we dump pod/event diagnostics so a genuine (non-transient)
        # break is debuggable from the log rather than just "timed out".
        #
        # Budget: 3 attempts x (4m node + 2m controllers) = 18m worst case,
        # inside the job's 30m timeout-minutes.
        run: |
          set -euo pipefail
          calico_manifest="${RUNNER_TEMP}/calico.yaml"
          curl --fail --show-error --location --retry 3 \
            --output "${calico_manifest}" \
            "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml"
          echo "${CALICO_SHA256}  ${calico_manifest}" | sha256sum -c -
          kubectl apply -f "${calico_manifest}"

          attempts=3
          for i in $(seq 1 "${attempts}"); do
            echo "::group::Calico rollout attempt ${i}/${attempts}"
            # Re-apply is idempotent; nudges anything that failed to schedule.
            kubectl apply -f "${calico_manifest}"
            if kubectl -n kube-system rollout status daemonset/calico-node --timeout=4m \
               && kubectl -n kube-system rollout status deployment/calico-kube-controllers --timeout=2m; then
              echo "Calico is ready."
              echo "::endgroup::"
              exit 0
            fi
            echo "Calico not ready on attempt ${i}/${attempts}."
            echo "::endgroup::"
            if [ "${i}" -lt "${attempts}" ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done

          echo "::error::Calico did not become ready after ${attempts} attempts."
          echo "===== Diagnostics: calico pods ====="
          kubectl -n kube-system get pods -l k8s-app=calico-node -o wide || true
          kubectl -n kube-system get pods -l k8s-app=calico-kube-controllers -o wide || true
          echo "===== Diagnostics: describe calico-node ====="
          kubectl -n kube-system describe daemonset/calico-node || true
          kubectl -n kube-system describe pods -l k8s-app=calico-node || true
          echo "===== Diagnostics: recent kube-system events ====="
          kubectl -n kube-system get events --sort-by=.lastTimestamp | tail -50 || true
          exit 1
      - name: Install Metrics Server for HPA reconciliation
        # Production uses the EKS managed metrics-server add-on. kind needs the
        # upstream component plus insecure kubelet TLS because its node serving
        # certificate is not signed for the container's InternalIP.
        run: |
          set -euo pipefail
          metrics_manifest="${RUNNER_TEMP}/metrics-server.yaml"
          curl --fail --show-error --location --retry 3 \
            --output "${metrics_manifest}" \
            "https://github.com/kubernetes-sigs/metrics-server/releases/download/${METRICS_SERVER_VERSION}/components.yaml"
          echo "${METRICS_SERVER_SHA256}  ${metrics_manifest}" | sha256sum -c -
          kubectl apply -f "${metrics_manifest}"
          kubectl -n kube-system patch deployment metrics-server --type=json \
            --patch='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=3m
          kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=2m
      - name: Set up Buildx (enables shared GHA layer cache)
        uses: ./.github/actions/setup-buildx-with-retry
      - name: Build health-monitor image
        # Shares the same GHA cache scope as integration:docker:health-monitor
        # and security:trivy:container-scan. All three build the same image
        # from the same Dockerfile + context, so layer reuse is automatic.
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/health-monitor-dockerfile
          tags: health-monitor:ci
          load: true
          cache-from: type=gha,scope=health-monitor
          cache-to: type=gha,mode=max,scope=health-monitor,ignore-error=true
      - name: Build cost-monitor image
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/cost-monitor-dockerfile
          tags: cost-monitor:ci
          load: true
          cache-from: type=gha,scope=cost-monitor
          cache-to: type=gha,mode=max,scope=cost-monitor,ignore-error=true
      - name: Build manifest-processor image
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/manifest-processor-dockerfile
          tags: manifest-processor:ci
          load: true
          cache-from: type=gha,scope=manifest-processor
          cache-to: type=gha,mode=max,scope=manifest-processor,ignore-error=true
      - name: Build inference-monitor image
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/inference-monitor-dockerfile
          tags: inference-monitor:ci
          load: true
          cache-from: type=gha,scope=inference-monitor
          cache-to: type=gha,mode=max,scope=inference-monitor,ignore-error=true
      - name: Build inference-proxy image
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/inference-proxy-dockerfile
          tags: inference-proxy:ci
          load: true
          cache-from: type=gha,scope=inference-proxy
          cache-to: type=gha,mode=max,scope=inference-proxy,ignore-error=true
      - name: Load images into kind
        run: |
          kind load docker-image health-monitor:ci --name gco-ci
          kind load docker-image cost-monitor:ci --name gco-ci
          kind load docker-image manifest-processor:ci --name gco-ci
          kind load docker-image inference-monitor:ci --name gco-ci
          kind load docker-image inference-proxy:ci --name gco-ci
      - name: Apply namespaces + RBAC
        run: |
          kubectl apply -f lambda/kubectl-applier-simple/manifests/00-namespaces.yaml
          kubectl apply -f lambda/kubectl-applier-simple/manifests/01-serviceaccounts.yaml
          kubectl apply -f lambda/kubectl-applier-simple/manifests/02-rbac.yaml
      - name: Apply NetworkPolicies (Calico-enforced)
        # The whole point of the Calico CNI install is that kindnet silently
        # accepts NetworkPolicy but does not enforce it. Apply the policies
        # so the apiserver validates their schema against real CRDs.
        #
        # 03-network-policies.yaml contains one list-valued placeholder
        # ({{VPC_ENDPOINT_CIDR_BLOCKS}}) that the production kubectl-applier
        # expands into a sequence of ipBlock entries at deploy time. For CI
        # we replace it with an empty list so the apiserver accepts the
        # object — Calico treats an empty `to:` as "allow nothing", which
        # is both schema-valid and the strictest possible behavior.
        run: |
          set -euo pipefail
          sed 's|{{VPC_ENDPOINT_CIDR_BLOCKS}}|[]|g' \
            lambda/kubectl-applier-simple/manifests/03-network-policies.yaml \
            | kubectl apply -f -
      - name: Render and apply deployments
        # Substitute image placeholders. Pod readiness depends on production
        # IRSA / Secrets Manager wiring that isn't present in kind, so we
        # assert "apiserver accepts the manifest + the Deployment object
        # exists" rather than waiting for pods to go Ready.
        run: |
          set -euo pipefail
          for manifest in \
              lambda/kubectl-applier-simple/manifests/30-health-monitor.yaml \
              lambda/kubectl-applier-simple/manifests/31-manifest-processor.yaml \
              lambda/kubectl-applier-simple/manifests/32-inference-monitor.yaml \
              lambda/kubectl-applier-simple/manifests/33-inference-proxy.yaml \
              lambda/kubectl-applier-simple/manifests/34-cost-monitor.yaml; do
            case "$manifest" in
              *30-health-monitor*)     image="health-monitor:ci"; key="HEALTH_MONITOR_IMAGE" ;;
              *31-manifest-processor*) image="manifest-processor:ci"; key="MANIFEST_PROCESSOR_IMAGE" ;;
              *32-inference-monitor*)  image="inference-monitor:ci"; key="INFERENCE_MONITOR_IMAGE" ;;
              *33-inference-proxy*)    image="inference-proxy:ci"; key="INFERENCE_PROXY_IMAGE" ;;
              *34-cost-monitor*)       image="cost-monitor:ci"; key="COST_MONITOR_IMAGE" ;;
            esac
            # Stub out every remaining {{PLACEHOLDER}} with a safe literal.
            # These tags were loaded into kind rather than pushed to a registry,
            # so the CI-only render must not retain production's Always policy.
            sed -e "s|{{${key}}}|${image}|g" \
                -e "s|{{DEPLOYMENT_TIMESTAMP}}|$(date +%s)|g" \
                -e 's|{{INFERENCE_PROXY_MAX_REQUEST_BODY_BYTES}}|1048576|g' \
                -e 's|{{COST_REPORT_INTERVAL_MINUTES}}|60|g' \
                -e 's|{{COST_MONITORING_ENABLED}}|true|g' \
                -e "s|{{[A-Z_]*}}|ci-stub|g" \
                -e 's|imagePullPolicy: Always|imagePullPolicy: IfNotPresent|g' \
                "$manifest" \
              | kubectl apply -f -
          done
      - name: Verify apiserver accepted all resources
        run: |
          set -euo pipefail
          # Deployments exist (regardless of Ready state).
          kubectl -n gco-system get deploy health-monitor
          kubectl -n gco-system get deploy manifest-processor
          kubectl -n gco-system get deploy inference-monitor
          kubectl -n gco-system get deploy inference-proxy
          kubectl -n gco-system get deploy cost-monitor
          kubectl -n gco-system get service cost-monitor
          # The shared streaming proxy scales independently while retaining its
          # three-pod HA floor. Exact readback guards against partial file apply.
          kubectl -n gco-system get hpa inference-proxy-hpa
          test "$(kubectl -n gco-system get hpa inference-proxy-hpa -o jsonpath='{.spec.minReplicas}')" = "3"
          test "$(kubectl -n gco-system get hpa inference-proxy-hpa -o jsonpath='{.spec.maxReplicas}')" = "10"
          test "$(kubectl -n gco-system get hpa inference-proxy-hpa -o jsonpath='{.spec.scaleTargetRef.name}')" = "inference-proxy"
          # At least one pod got scheduled for each — confirms the apiserver
          # admitted the PodSpec and the scheduler found the nodes.
          for _ in $(seq 1 30); do
            hm=$(kubectl -n gco-system get pods -l app=health-monitor -o json \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)['items']))")
            mp=$(kubectl -n gco-system get pods -l app=manifest-processor -o json \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)['items']))")
            im=$(kubectl -n gco-system get pods -l app=inference-monitor -o json \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)['items']))")
            ip=$(kubectl -n gco-system get pods -l app=inference-proxy -o json \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)['items']))")
            cm=$(kubectl -n gco-system get pods -l app=cost-monitor -o json \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)['items']))")
            if [ "$hm" -gt 0 ] && [ "$mp" -gt 0 ] && [ "$im" -gt 0 ] \
                && [ "$ip" -gt 0 ] && [ "$cm" -gt 0 ]; then
              echo "Pods created: health-monitor=$hm manifest-processor=$mp inference-monitor=$im inference-proxy=$ip cost-monitor=$cm"
              exit 0
            fi
            sleep 2
          done
          echo "Pods never appeared within 60s"
          kubectl -n gco-system get pods -o wide
          kubectl -n gco-system describe deploy health-monitor manifest-processor inference-monitor inference-proxy cost-monitor
          exit 1
      - name: Verify inference proxy HPA is actively computing replicas
        # Admission/readback alone does not prove autoscaling works. Wait for
        # Metrics Server samples and require the controller's ScalingActive
        # condition for the real autoscaling/v2 resource.
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            active="$(kubectl -n gco-system get hpa inference-proxy-hpa \
              -o jsonpath='{.status.conditions[?(@.type=="ScalingActive")].status}')"
            if [ "$active" = "True" ]; then
              kubectl -n gco-system get hpa inference-proxy-hpa
              exit 0
            fi
            sleep 2
          done
          echo "::error::inference-proxy-hpa never reported ScalingActive=True"
          kubectl -n gco-system describe hpa inference-proxy-hpa || true
          kubectl top nodes || true
          kubectl -n gco-system top pods -l app=inference-proxy || true
          kubectl -n kube-system logs deployment/metrics-server --tail=100 || true
          exit 1
      - name: Verify NetworkPolicies validated
        # Calico's admission webhooks would reject malformed policies, so
        # successful apply + readback confirms the manifest is schema-valid
        # end-to-end (not just YAML-valid).
        run: |
          kubectl get networkpolicy -A
          count=$(kubectl get networkpolicy -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No NetworkPolicies present — 03-network-policies.yaml did not apply"
            exit 1
          fi
          echo "NetworkPolicies accepted by apiserver: $count"
      - name: Verify PodDisruptionBudgets exist
        # Assert every PDB shipped by the four deployment manifests. A count
        # greater than zero can hide a partially applied policy set.
        run: |
          set -euo pipefail
          for pdb in \
              health-monitor-pdb \
              manifest-processor-pdb \
              inference-monitor-pdb \
              inference-proxy-pdb; do
            kubectl -n gco-system get pdb "$pdb"
          done
          echo "All expected PodDisruptionBudgets exist"
      - name: Verify RBAC restricts unauthorized access
        # Use impersonation to verify both sides of the RBAC boundary. Capture
        # output as well as status so an API/transport error cannot masquerade
        # as the expected denial.
        run: |
          set -euo pipefail
          denied_status=0
          denied_output=$(kubectl auth can-i list pods -n gco-jobs \
            --as=system:serviceaccount:gco-jobs:gco-service-account 2>&1) \
            || denied_status=$?
          if [ "$denied_status" -eq 1 ] && [ "$denied_output" = "no" ]; then
            echo "PASS: gco-service-account correctly denied pod listing"
          else
            echo "FAIL: expected an explicit RBAC denial; status=$denied_status output=$denied_output"
            exit 1
          fi

          allowed_output=$(kubectl auth can-i get pods -n gco-system \
            --as=system:serviceaccount:gco-system:gco-health-monitor-sa 2>&1) || {
            echo "FAIL: RBAC allow probe errored: $allowed_output"
            exit 1
          }
          if [ "$allowed_output" = "yes" ]; then
            echo "PASS: gco-health-monitor-sa can get pods in gco-system"
          else
            echo "FAIL: expected an explicit RBAC allow; output=$allowed_output"
            exit 1
          fi
      - name: Verify NetworkPolicy enforcement blocks cross-namespace traffic
        # Probe a dedicated HTTP pod whose listener is verified locally first.
        # This avoids treating an absent Service, an unready application, or a
        # kubectl error as evidence that Calico enforced the deny policy.
        run: |
          set -euo pipefail
          kubectl run netpol-target \
            --image=busybox:1.38.0 \
            --namespace=gco-system \
            --labels=app=netpol-probe \
            --restart=Never \
            --command -- sh -c '
              mkdir -p /www
              printf "netpol-target-ready\n" > /www/index.html
              exec httpd -f -p 8080 -h /www
            '
          kubectl -n gco-system wait --for=condition=Ready pod/netpol-target --timeout=60s

          target_body=""
          for _ in $(seq 1 10); do
            if target_body=$(kubectl -n gco-system exec netpol-target -- \
              wget -qO- -T 5 http://127.0.0.1:8080); then
              [ "$target_body" = "netpol-target-ready" ] && break
            fi
            sleep 1
          done
          if [ "$target_body" != "netpol-target-ready" ]; then
            echo "FAIL: NetworkPolicy target was not serving the control response"
            exit 1
          fi

          target_ip=$(kubectl -n gco-system get pod netpol-target \
            -o jsonpath='{.status.podIP}')
          if [ -z "$target_ip" ]; then
            echo "FAIL: NetworkPolicy target has no pod IP"
            exit 1
          fi

          # Exit 42 only for the expected connection failure. Pod scheduling,
          # image-pull, and kubectl failures produce a different state/status
          # and therefore fail the assertion instead of being accepted as deny.
          kubectl run netpol-test \
            --image=busybox:1.38.0 \
            --namespace=gco-jobs \
            --labels=app=netpol-probe-client \
            --restart=Never \
            --command -- sh -c "
              if wget -qO- -T 5 \"http://${target_ip}:8080\"; then
                echo NETPOL_REACHABLE
                exit 0
              fi
              echo NETPOL_BLOCKED
              exit 42
            "

          phase=""
          for _ in $(seq 1 60); do
            phase=$(kubectl -n gco-jobs get pod netpol-test \
              -o jsonpath='{.status.phase}')
            case "$phase" in
              Succeeded|Failed) break ;;
            esac
            sleep 1
          done

          probe_output=$(kubectl -n gco-jobs logs netpol-test 2>&1)
          exit_code=$(kubectl -n gco-jobs get pod netpol-test \
            -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}')
          printf '%s\n' "$probe_output"
          if [ "$phase" = "Failed" ] && [ "$exit_code" = "42" ] \
              && printf '%s\n' "$probe_output" | grep -qx NETPOL_BLOCKED; then
            echo "PASS: Cross-namespace traffic blocked by NetworkPolicy"
          else
            echo "FAIL: NetworkPolicy probe phase=$phase exit=$exit_code"
            kubectl -n gco-jobs describe pod netpol-test
            exit 1
          fi

          kubectl -n gco-jobs delete pod netpol-test --wait=false
          kubectl -n gco-system delete pod netpol-target --wait=false
      - name: Apply ResourceQuotas and LimitRanges
        # Apply governance only after the synthetic NetworkPolicy client exits.
        # Otherwise this LimitRange injects a 100m CPU request into that probe,
        # which can make it unschedulable on Kind's already-loaded single node.
        # The gco-service-account SA it governs is already created by the
        # "Apply namespaces + RBAC" step (01-serviceaccounts.yaml).
        run: |
          set -euo pipefail
          sed -e 's|{{QUOTA_MAX_CPU}}|100|g' \
              -e 's|{{QUOTA_MAX_MEMORY}}|200Gi|g' \
              -e 's|{{QUOTA_MAX_GPU}}|8|g' \
              -e 's|{{QUOTA_MAX_PODS}}|100|g' \
              -e 's|{{LIMIT_MAX_CPU}}|16|g' \
              -e 's|{{LIMIT_MAX_MEMORY}}|64Gi|g' \
              -e 's|{{LIMIT_MAX_GPU}}|4|g' \
            lambda/kubectl-applier-simple/manifests/04-resource-quotas.yaml \
            | kubectl apply -f -
          kubectl -n gco-jobs get resourcequota gco-jobs-quota
          kubectl -n gco-jobs get limitrange gco-jobs-limits

          # Exercise mutating admission without scheduling another pod on the
          # capacity-constrained Kind node. Server-side dry run must receive
          # every LimitRange default before ResourceQuota evaluates the pod.
          defaulted_pod="$(
            kubectl -n gco-jobs run limitrange-default-probe \
              --image=busybox:1.38.0 \
              --restart=Never \
              --dry-run=server \
              -o json \
              --command -- true
          )"
          DEFAULTED_POD="$defaulted_pod" python3 - <<'PY'
          import json
          import os

          resources = json.loads(os.environ["DEFAULTED_POD"])["spec"]["containers"][0][
              "resources"
          ]
          expected = {
              "limits": {"cpu": "1", "memory": "4Gi", "nvidia.com/gpu": "0"},
              "requests": {"cpu": "100m", "memory": "256Mi", "nvidia.com/gpu": "0"},
          }
          if resources != expected:
              raise SystemExit(
                  f"LimitRange admission defaults mismatch: expected={expected}, actual={resources}"
              )
          PY
          echo "ResourceQuota and LimitRange admission defaults verified"
      - name: Verify all namespaces exist
        run: |
          set -euo pipefail
          for ns in gco-system gco-jobs gco-inference; do
            if kubectl get namespace "$ns" >/dev/null 2>&1; then
              echo "PASS: namespace $ns exists"
            else
              echo "FAIL: namespace $ns missing"
              exit 1
            fi
          done
      - name: Summary
        run: |
          echo "=== Kind E2E Test Summary ==="
          echo "Namespaces:"
          kubectl get namespaces --no-headers | grep gco
          echo ""
          echo "Deployments:"
          kubectl -n gco-system get deploy --no-headers 2>/dev/null || echo "  (none)"
          echo ""
          echo "Pods:"
          kubectl -n gco-system get pods --no-headers 2>/dev/null || echo "  (none)"
          echo ""
          echo "NetworkPolicies:"
          kubectl get networkpolicy -A --no-headers 2>/dev/null || echo "  (none)"
          echo ""
          echo "ResourceQuotas:"
          kubectl -n gco-jobs get resourcequota --no-headers 2>/dev/null || echo "  (none)"
          echo ""
          echo "LimitRanges:"
          kubectl -n gco-jobs get limitrange --no-headers 2>/dev/null || echo "  (none)"
          echo ""
          echo "PodDisruptionBudgets:"
          kubectl -n gco-system get pdb --no-headers 2>/dev/null || echo "  (none)"
          echo ""
          echo "ServiceAccounts:"
          kubectl -n gco-jobs get sa --no-headers 2>/dev/null || echo "  (none)"
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n gco-system describe deploy health-monitor manifest-processor inference-monitor inference-proxy cost-monitor || true
          kubectl -n gco-system get events --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n gco-system logs deploy/health-monitor --tail=200 || true
          kubectl -n gco-system logs deploy/manifest-processor --tail=200 || true
          kubectl -n gco-system logs deploy/inference-monitor --tail=200 || true
          kubectl -n gco-system logs deploy/inference-proxy --tail=200 || true
          kubectl -n gco-system logs deploy/cost-monitor --tail=200 || true

  integration-kind-examples-smoke:
    name: "integration:kind:examples-smoke"
    # Simulates the live example-validation harness inside kind, closing the
    # gap between static checks and a real deployment. Every bug the 2026-08
    # live shakeouts caught was Kubernetes-level, not AWS-level — this job
    # would have caught all of them:
    #
    #   1. TrainJob schema 400 (numProcPerNode string vs int32) — the REAL
    #      example manifest is applied against the REAL CRDs from the pinned
    #      trainer chart.
    #   2. TrainJob RBAC Forbidden — the example is applied AS the
    #      manifest-processor ServiceAccount, plus a can-i sweep derived from
    #      the submission allowlist (the apiserver half of
    #      tests/test_rbac_manifest.py::TestSubmittableKindsRbacLockstep).
    #   3. mlflow ServiceMonitor null-path — installing the pinned mlflow
    #      chart with the shipped values against the ServiceMonitor CRD from
    #      the pinned kube-prometheus-stack rejects a bad render at install.
    #   4. mlflow OOM at startup — the shipped memory limits are enforced by
    #      real cgroups; the rollout gate fails on an OOM crash-loop.
    #   5. mlflow host-validation 403s — probed with explicit Host headers
    #      (allowed DNS 200 / arbitrary DNS 403 / exempt /health 200).
    #   6. mlflow probes dropped by the chart's own NetworkPolicy — the
    #      policy admits only pod sources, so kubelet probes (host network)
    #      were discarded and the pod restarted forever. This needs a CNI
    #      that ENFORCES NetworkPolicy, which is why this job installs
    #      Calico: the first version of this job ran on kind's default
    #      kindnet, which accepts policies without enforcing them, and it
    #      passed green while that bug was live (caught live 2026-08-15
    #      instead, one full deploy cycle later). The rollout gate below is
    #      only meaningful with enforcement on.
    #
    # What stays live-only (the harness in scripts/example_job_validation):
    # IRSA/S3 artifact writes, Bedrock vector search, Karpenter/GPU capacity,
    # the Global Accelerator -> ALB path, and the SQS -> KEDA loop (floci
    # owns that orchestration logic in ci-floci-tests).
    #
    # Chart refs, versions, namespaces, and values are read from
    # lambda/helm-installer/charts.yaml at run time via
    # validate_helm_charts.py --emit-ref / --emit-values, so this job can
    # never drift from what the installer Lambda deploys.
    #
    # Disk: the example's pytorch image is ~3.5GB compressed (~7.5GB in the
    # store) and transits the runner docker daemon AND the kind node, so the
    # job starts with the free-disk-space reclaim and drops the runner-side
    # copy right after `kind load`.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Helm pin (version + checksum) is derived at runtime from
      # lambda/helm-installer/Dockerfile by the derive step below — the same
      # single source integration:helm:charts-valid and deps-scan.yml use.
      # The ServiceAccount the queue/manifest processors run as in
      # production, and the identity that applies the example here.
      PROCESSOR_SA: "system:serviceaccount:gco-system:gco-manifest-processor-sa"
      # The kind and Calico pins shared with cluster-e2e live in the
      # workflow-level env block at the top of this file — one declaration.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Reclaim runner disk space before large image pulls
        uses: ./.github/actions/free-disk-space
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install project (chart emit helper + allowlist derivation)
        # -e . provides PyYAML for validate_helm_charts.py --emit-* and makes
        # gco.services.manifest_processor importable so the can-i sweep
        # derives (group, plural) pairs from the SAME constants production
        # enforces — no hardcoded copy to drift.
        run: pip install -e .
      - name: Derive the Helm pin from the production installer Dockerfile
        # Single source: lambda/helm-installer/Dockerfile (see the
        # charts-valid job for the full rationale).
        run: |
          set -euo pipefail
          source .github/scripts/lib_dependency_scan.sh
          extract_helm_installer_pins lambda/helm-installer/Dockerfile | grep '^HELM_' | tr '|' '=' | tee -a "$GITHUB_ENV"
          grep -q '^HELM_VERSION=' "$GITHUB_ENV" && grep -q '^HELM_SHA256=' "$GITHUB_ENV"
      - name: Install Helm
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/helm.tar.gz"
          install_dir="${RUNNER_TEMP}/helm-install"
          curl --fail --show-error --location --retry 3 \
            --output "${archive}" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" \
            --strip-components=1 --no-same-owner linux-amd64/helm
          sudo install -m 0755 "${install_dir}/helm" /usr/local/bin/helm
          rm -f "${archive}" "${install_dir}/helm"
          rmdir "${install_dir}"
          helm version --short
      - name: Create kind cluster (no default CNI)
        # kind/node pins come from the workflow-level env block (shared with
        # integration:kind:cluster-e2e; tracked by the dependency drift
        # scan). The default CNI is disabled so Calico can take over:
        # kindnet accepts NetworkPolicy objects without enforcing them, and
        # the mlflow leg of this job is only a real test when the chart's
        # own policy is actually enforced.
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          version: "${{ env.KIND_VERSION }}"
          node_image: "${{ env.KIND_NODE_IMAGE }}"
          cluster_name: "gco-examples-smoke"
          config: ".github/kind/kind-calico.yaml"
          # The control plane cannot go Ready without a CNI; the next step
          # installs Calico and waits via rollout status.
          wait: "0s"
      - name: Install Calico for NetworkPolicy enforcement
        # Mirrors the proven step in integration:kind:cluster-e2e, including
        # the retry loop: calico-node readiness is a known CI flake because
        # it pulls from quay.io and runs install-cni / mount-bpffs init
        # containers, which can exceed one timeout window under runner
        # image-pull latency. The apply is idempotent, so each attempt
        # re-applies and re-waits.
        run: |
          set -euo pipefail
          calico_manifest="${RUNNER_TEMP}/calico.yaml"
          curl --fail --show-error --location --retry 3 \
            --output "${calico_manifest}" \
            "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml"
          echo "${CALICO_SHA256}  ${calico_manifest}" | sha256sum -c -
          kubectl apply -f "${calico_manifest}"

          attempts=3
          for i in $(seq 1 "${attempts}"); do
            echo "::group::Calico rollout attempt ${i}/${attempts}"
            kubectl apply -f "${calico_manifest}"
            if kubectl -n kube-system rollout status daemonset/calico-node --timeout=4m \
               && kubectl -n kube-system rollout status deployment/calico-kube-controllers --timeout=2m; then
              echo "Calico is ready."
              echo "::endgroup::"
              exit 0
            fi
            echo "Calico not ready on attempt ${i}/${attempts}."
            echo "::endgroup::"
            if [ "${i}" -lt "${attempts}" ]; then
              sleep 15
            fi
          done

          echo "::error::Calico did not become ready after ${attempts} attempts."
          kubectl -n kube-system get pods -o wide || true
          kubectl -n kube-system get events --sort-by=.lastTimestamp | tail -50 || true
          exit 1
      - name: Apply platform namespaces + RBAC
        # 01-serviceaccounts / 02-rbac carry {{...ROLE_ARN}} IRSA annotation
        # tokens; annotations are opaque strings to the apiserver, so the
        # raw apply is valid (same approach as cluster-e2e).
        run: |
          kubectl apply -f lambda/kubectl-applier-simple/manifests/00-namespaces.yaml
          kubectl apply -f lambda/kubectl-applier-simple/manifests/01-serviceaccounts.yaml
          kubectl apply -f lambda/kubectl-applier-simple/manifests/02-rbac.yaml
      - name: Verify submission allowlist is writable by the processor SA (SubjectAccessReview sweep)
        # Real-apiserver half of the kinds<->RBAC lockstep: for every kind
        # users can submit (DEFAULT_ALLOWED_KINDS x RESOURCE_API_VERSIONS),
        # ask the authorizer whether the processor SA holds every lifecycle
        # verb in gco-jobs.
        #
        # SAR = SubjectAccessReview, the authorization.k8s.io object you POST
        # to ask the apiserver "may this user <verb> this resource?" —
        # answered in .status.allowed. It is the same API `kubectl auth
        # can-i` calls under the hood; the difference is that can-i derives
        # the request's resourceAttributes from discovery first, while a
        # hand-built body states them outright.
        #
        # Deliberately NOT `kubectl auth can-i`: can-i
        # resolves its resource argument through client-side discovery, and
        # for a CRD kind whose chart isn't installed yet it silently
        # degrades to an empty-group query that always answers "no" (caught
        # on this job's first run — the sweep reported TrainJob denied while
        # the RBAC grant was present and correct). Explicit
        # SubjectAccessReview bodies carry group/resource verbatim and hit
        # the exact authorizer path production requests hit, which keeps
        # this step independent of chart install order — a missing grant
        # fails here in seconds, before the first helm pull. The negative
        # probe proves the role stays namespace-scoped.
        run: |
          set -euo pipefail
          pairs=$(python3 -c '
          from gco.services.manifest_processor import (
              DEFAULT_ALLOWED_KINDS,
              RESOURCE_API_VERSIONS,
          )
          for kind in DEFAULT_ALLOWED_KINDS:
              (api_version,) = {
                  av.rsplit("/", 1)[0] if "/" in av else ""
                  for av in RESOURCE_API_VERSIONS[kind]
              }
              print(f"{kind.lower()}s {api_version}")
          ')
          sar() {
            # SubjectAccessReview probe.
            # sar <namespace> <verb> <group> <plural> -> "true" / "false"
            jq -cn --arg user "$PROCESSOR_SA" --arg ns "$1" --arg verb "$2" \
              --arg group "$3" --arg plural "$4" \
              '{apiVersion: "authorization.k8s.io/v1",
                kind: "SubjectAccessReview",
                spec: {user: $user, resourceAttributes: {
                  namespace: $ns, verb: $verb,
                  group: $group, resource: $plural}}}' \
              | kubectl create --raw /apis/authorization.k8s.io/v1/subjectaccessreviews -f - \
              | jq -r '.status.allowed'
          }
          failed=0
          while read -r plural group; do
            group="${group:-}"
            resource_ok=1
            for verb in create get list watch patch update delete; do
              allowed=$(sar gco-jobs "$verb" "$group" "$plural")
              if [ "$allowed" != "true" ]; then
                echo "FAIL: authorizer denies $verb ${plural}${group:+.$group} in gco-jobs to the processor SA"
                resource_ok=0
                failed=1
              fi
            done
            if [ "$resource_ok" -eq 1 ]; then
              echo "PASS: full lifecycle verbs on ${plural}${group:+.$group} in gco-jobs"
            fi
          done <<< "$pairs"
          denied=$(sar gco-system create "" pods)
          if [ "$denied" != "false" ]; then
            echo "FAIL: processor SA must NOT create pods outside gco-jobs (allowed=$denied)"
            failed=1
          else
            echo "PASS: write access correctly denied outside gco-jobs"
          fi
          exit "$failed"
      - name: Install ServiceMonitor CRD from the pinned kube-prometheus-stack
        # The mlflow values enable a ServiceMonitor, and in production the
        # mlflow conjunction guarantees kube-prometheus-stack is present. Its
        # CRD is what rejects a bad ServiceMonitor render (the chart-0.1.0
        # null-path bug), so install the CRD at the exact pinned chart
        # version. --server-side: prometheus-operator CRDs overflow the
        # client-side last-applied annotation.
        run: |
          set -euo pipefail
          read -r _ref version _namespace repo_url < <(
            python3 .github/scripts/validate_helm_charts.py --emit-ref kube-prometheus-stack
          )
          pull_dir="${RUNNER_TEMP}/kps-chart"
          mkdir -p "${pull_dir}"
          helm pull kube-prometheus-stack --repo "${repo_url}" \
            --version "${version}" --destination "${pull_dir}"
          tar -xzf "${pull_dir}"/kube-prometheus-stack-*.tgz -C "${pull_dir}"
          crd=$(find "${pull_dir}/kube-prometheus-stack" -name 'crd-servicemonitors*' -print -quit)
          if [ -z "${crd}" ]; then
            echo "::error::ServiceMonitor CRD not found in kube-prometheus-stack ${version}"
            exit 1
          fi
          kubectl apply --server-side -f "${crd}"
          kubectl wait --for=condition=Established \
            crd/servicemonitors.monitoring.coreos.com --timeout=60s
          rm -rf "${pull_dir}"
      - name: Provide the observability StorageClass
        # The mlflow values pin storageClassName gco-observability-gp3 (an
        # EBS gp3 class the regional stack ships). kind has no EBS driver, so
        # alias the name to kind's local-path provisioner — the PVC binds and
        # the SQLite store mounts exactly as it would in production.
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: gco-observability-gp3
          provisioner: rancher.io/local-path
          volumeBindingMode: WaitForFirstConsumer
          EOF
      - name: Install pinned cert-manager (the trainer chart's cert dependency)
        # charts.yaml sets jobset.certManager.enable, so the trainer chart
        # renders a Certificate + Issuer instead of a controller-managed
        # Secret — that needs cert-manager's CRDs and controller present
        # first. Production gets this from charts.yaml install order
        # (cert-manager appears earlier in the file, and the installer walks
        # it in order); CI installs it explicitly for the same reason. Pins
        # and values come from charts.yaml like every other chart here.
        run: |
          set -euo pipefail
          read -r ref version namespace repo_url < <(
            python3 .github/scripts/validate_helm_charts.py --emit-ref cert-manager
          )
          python3 .github/scripts/validate_helm_charts.py --emit-values cert-manager \
            > "${RUNNER_TEMP}/cert-manager-values.yaml"
          helm repo add jetstack "${repo_url}"
          helm repo update jetstack
          helm install cert-manager "${ref}" --version "${version}" \
            --namespace "${namespace}" --create-namespace \
            --values "${RUNNER_TEMP}/cert-manager-values.yaml" \
            --wait --timeout 5m
          kubectl wait --for=condition=Established \
            crd/certificates.cert-manager.io --timeout=60s
      - name: Install pinned kubeflow-trainer chart with shipped values
        # Exactly what the installer Lambda does for this chart: the OCI ref,
        # version, namespace, values, and the blocking wait all come from
        # charts.yaml (wait: true / 8m for this entry).
        run: |
          set -euo pipefail
          read -r ref version namespace _repo_url < <(
            python3 .github/scripts/validate_helm_charts.py --emit-ref kubeflow-trainer
          )
          python3 .github/scripts/validate_helm_charts.py --emit-values kubeflow-trainer \
            > "${RUNNER_TEMP}/trainer-values.yaml"
          helm install kubeflow-trainer "${ref}" --version "${version}" \
            --namespace "${namespace}" --create-namespace \
            --values "${RUNNER_TEMP}/trainer-values.yaml" \
            --wait --timeout 8m
          kubectl get crd trainjobs.trainer.kubeflow.org \
            clustertrainingruntimes.trainer.kubeflow.org
      - name: Re-run the trainer install as an upgrade (idempotency contract)
        # Deploying twice must work. Helm 4 applies server-side, so any
        # resource the chart templates EMPTY and a controller then fills in
        # becomes a field-ownership conflict on the second apply. JobSet's
        # webhook cert Secret did exactly that: the second `gco stacks
        # deploy` of an existing cluster failed the chart task with
        #   conflicts with "jobset" using v1: .data.ca.crt .data.ca.key ...
        # which stalls the convergence state machine before its post-Helm
        # apply, so every post-Helm manifest silently stops being applied
        # too (caught live 2026-08-15; fresh deploys never reproduce it,
        # which is why the live shakeouts missed it).
        #
        # The fix is jobset.certManager.enable in charts.yaml. This step is
        # the regression gate: it repeats the exact install the installer
        # Lambda performs, which is an upgrade the second time around.
        run: |
          set -euo pipefail
          read -r ref version namespace _repo_url < <(
            python3 .github/scripts/validate_helm_charts.py --emit-ref kubeflow-trainer
          )
          if ! helm upgrade kubeflow-trainer "${ref}" --version "${version}" \
              --namespace "${namespace}" \
              --values "${RUNNER_TEMP}/trainer-values.yaml" \
              --wait --timeout 8m; then
            echo "::error::helm upgrade of kubeflow-trainer failed — the chart is not"
            echo "::error::idempotent, so a second deploy of an existing cluster breaks."
            kubectl -n "${namespace}" get secrets -o json \
              | python3 -c "
          import json, sys
          for item in json.load(sys.stdin)['items']:
              managers = sorted(
                  entry.get('manager', '?') for entry in item['metadata'].get('managedFields', [])
              )
              print(item['metadata']['name'], '-> field managers:', managers)
          "
            exit 1
          fi
          # cert-manager owns the JobSet cert now: helm must not be
          # templating the Secret it used to fight over.
          if kubectl -n "${namespace}" get secret jobset-webhook-server-cert \
              -o jsonpath='{.metadata.managedFields[*].manager}' 2>/dev/null \
              | tr ' ' '\n' | grep -qx helm; then
            echo "::error::helm still manages jobset-webhook-server-cert"
            exit 1
          fi
          kubectl -n "${namespace}" get certificate jobset-cert
          echo "Trainer chart upgrade is idempotent."
      - name: Apply the shipped torch-distributed runtime
        # The platform delivers this runtime through the post-Helm kubectl
        # pass (chart hook Jobs stay disabled — see charts.yaml). Applying it
        # against the chart's real CRDs validates the extracted manifest the
        # same way the applier Lambda's apply does. The enabled-gate token is
        # a label value in production; substitute its enabled state.
        run: |
          set -euo pipefail
          sed 's|{{KUBEFLOW_TRAINER_ENABLED}}|true|g' \
            lambda/kubectl-applier-simple/manifests/post-helm-kubeflow-trainer-runtimes.yaml \
            | kubectl apply -f -
          kubectl get clustertrainingruntime torch-distributed
      - name: Install pinned mlflow chart with shipped values
        # charts.yaml sets wait: false for mlflow (installer-side cold-pull
        # rationale), so the readiness gate is the next step's rollout wait —
        # same shape as production, where the deployment converges after helm
        # returns. Namespace comes from the emit (monitoring); production
        # gets it from kube-prometheus-stack's create_namespace, so create it
        # here.
        run: |
          set -euo pipefail
          read -r ref version namespace _repo_url < <(
            python3 .github/scripts/validate_helm_charts.py --emit-ref mlflow
          )
          python3 .github/scripts/validate_helm_charts.py --emit-values mlflow \
            > "${RUNNER_TEMP}/mlflow-values.yaml"
          helm install mlflow "${ref}" --version "${version}" \
            --namespace "${namespace}" --create-namespace \
            --values "${RUNNER_TEMP}/mlflow-values.yaml"
      - name: Apply the post-Helm mlflow network policies
        # GCO owns the server's NetworkPolicy (the chart's is disabled in the
        # shipped values because its ingress admits only POD sources and so
        # drops kubelet probes, which arrive from the node's host network).
        # With Calico enforcing, this step plus the rollout gate below is a
        # real test of that policy: the probes have to traverse it.
        #
        # Scope note: Calico re-programs pods when policies change, so the
        # ORDERING hazard that made a supplemental policy insufficient in
        # production is not reproducible here — the VPC CNI resolves a pod's
        # policies at pod start and never revisits them, which is how a pod
        # created 2s after a permissive policy was applied stayed stranded
        # with only the restrictive one (live 2026-08-15). What this job can
        # and does guard is the invariant that removes the hazard: exactly one
        # policy, owned by GCO, selecting the server pod.
        #
        # {{VPC_ENDPOINT_CIDR_BLOCKS}} is a deployment token that production
        # fills from cdk.json vpc_endpoint_cidrs — the CIDR range containing
        # the nodes. The faithful CI analogue is kind's own node CIDR, so it
        # is derived from the live node addresses rather than hardcoded (kind
        # runs on a docker network, typically 172.18.0.0/16, NOT the 10.0/16
        # production default — hardcoding the production value here would
        # "pass" while proving nothing).
        run: |
          set -euo pipefail
          node_ip="$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')"
          node_cidr="$(echo "${node_ip}" | awk -F. '{print $1"."$2".0.0/16"}')"
          echo "kind node ${node_ip} -> allowing ${node_cidr}"
          python3 - "${node_cidr}" <<'PY' > "${RUNNER_TEMP}/mlflow-network.yaml"
          import sys
          from pathlib import Path

          cidr = sys.argv[1]
          path = Path("lambda/kubectl-applier-simple/manifests/post-helm-mlflow-network.yaml")
          text = path.read_text(encoding="utf-8")
          # Same substitution GCORegionalStack performs: the first ipBlock
          # entry carries no indent (the manifest supplies it).
          block = f'- ipBlock:\n            cidr: "{cidr}"'
          text = text.replace("{{VPC_ENDPOINT_CIDR_BLOCKS}}", block)
          text = text.replace("{{MLFLOW_ENABLED}}", "true")
          if "{{" in text:
              raise SystemExit(f"unsubstituted token(s) remain: {text}")
          print(text)
          PY
          kubectl apply -f "${RUNNER_TEMP}/mlflow-network.yaml"
          kubectl -n monitoring get networkpolicy mlflow-server
          kubectl -n gco-jobs get networkpolicy allow-mlflow-clients
          # GCO's policy must be the ONLY one selecting the server pod. A
          # chart-shipped policy reappearing here would re-introduce the
          # startup race that crash-looped the pod live on 2026-08-15: a
          # restrictive rule programmed without the permissive one.
          kubectl -n monitoring get networkpolicy -o json \
            | python3 -c "
          import json, sys
          names = sorted(i['metadata']['name'] for i in json.load(sys.stdin)['items'])
          print('monitoring NetworkPolicies:', names)
          if names != ['mlflow-server']:
              raise SystemExit(f'expected exactly [mlflow-server], got {names}')
          "
      - name: Wait for mlflow to become Available (real probes, real cgroups)
        # This is the gate that catches the OOM and probe-window classes: the
        # shipped requests/limits are enforced by the node's cgroups and the
        # chart's fixed liveness window runs against the real server startup.
        run: |
          set -euo pipefail
          if ! kubectl -n monitoring rollout status deployment/mlflow --timeout=8m; then
            echo "::error::mlflow deployment never became Available"
            kubectl -n monitoring get pods -o wide || true
            kubectl -n monitoring describe deployment/mlflow || true
            kubectl -n monitoring describe pods -l app.kubernetes.io/name=mlflow || true
            kubectl -n monitoring get events --sort-by=.lastTimestamp | tail -40 || true
            kubectl -n monitoring logs deployment/mlflow --tail=200 --all-containers || true
            exit 1
          fi
          # The ServiceMonitor rendered with a REAL path (the null-path class):
          # readback proves the apiserver admitted it with the endpoint intact.
          kubectl -n monitoring get servicemonitors -o yaml > "${RUNNER_TEMP}/smons.yaml"
          grep -q "path: /metrics" "${RUNNER_TEMP}/smons.yaml"
          echo "ServiceMonitor admitted with endpoint path /metrics"
      - name: Probe mlflow host validation (allowed 200 / arbitrary 403 / health exempt)
        # MLflow 3.x host-validation middleware 403s unknown Host headers and
        # --allowed-hosts REPLACES the built-in private-IP allowance (both
        # caught live 2026-08-14). Probe through a port-forward with explicit
        # Host headers against the values charts.yaml ships. The pod-IP
        # wildcard variant is deploy-time injected (vpc_endpoint_cidrs ->
        # _mlflow_allowed_hosts) and is pinned by
        # tests/test_regional_stack_feature_gap_coverage.py instead.
        run: |
          set -euo pipefail
          kubectl -n monitoring port-forward svc/mlflow 5000:5000 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:5000/health"; then
              break
            fi
            sleep 2
          done
          health=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: anything.invalid" "http://127.0.0.1:5000/health")
          allowed=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: mlflow.monitoring:5000" "http://127.0.0.1:5000/")
          rejected=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: rebind.attacker.example" "http://127.0.0.1:5000/")
          echo "health(exempt)=$health allowed-host=$allowed arbitrary-host=$rejected"
          test "$health" = "200"
          test "$allowed" = "200"
          test "$rejected" = "403"
      - name: Pre-pull the example's training image into kind
        # The kubelet would pull this ~3.5GB docker.io image itself, but an
        # explicit pull-with-retry gives Docker Hub blips bounded, attributed
        # retries (the shellcheck lesson) instead of opaque ImagePullBackOff
        # minutes. Image ref comes from the example manifest itself — the
        # trainer-runtime lockstep already pins example == runtime == chart.
        # The runner-side copy is dropped immediately; only kind's containerd
        # keeps the bytes.
        id: trainjob-image
        run: |
          set -euo pipefail
          image=$(python3 -c '
          import yaml
          with open("examples/kubeflow-trainjob.yaml", encoding="utf-8") as fh:
              doc = yaml.safe_load(fh)
          print(doc["spec"]["trainer"]["image"])
          ')
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docker-pull-with-retry
        with:
          images: ${{ steps.trainjob-image.outputs.image }}
      - name: Load training image into kind and drop the runner-side copy
        run: |
          set -euo pipefail
          kind load docker-image "${{ steps.trainjob-image.outputs.image }}" \
            --name gco-examples-smoke
          docker image rm "${{ steps.trainjob-image.outputs.image }}"
          df -h / | tail -1
      - name: Run the REAL TrainJob example as the processor SA
        # The exact file users submit, applied with the exact production
        # identity. Schema (real CRD), RBAC (impersonation), runtime
        # reference, and the gang rendezvous all get exercised; Complete only
        # flips when every node of the JobSet succeeded.
        run: |
          set -euo pipefail
          kubectl apply --as="$PROCESSOR_SA" -f examples/kubeflow-trainjob.yaml
          deadline=$(( $(date +%s) + 720 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            complete=$(kubectl -n gco-jobs get trainjob kubeflow-trainjob-example \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl -n gco-jobs get trainjob kubeflow-trainjob-example \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            if [ "$failed" = "True" ]; then
              echo "::error::TrainJob reached condition Failed"
              break
            fi
            if [ "$complete" = "True" ]; then
              echo "TrainJob Complete."
              kubectl -n gco-jobs get trainjob kubeflow-trainjob-example \
                -o jsonpath='{.status.jobsStatus}' | python3 -m json.tool
              exit 0
            fi
            sleep 10
          done
          echo "::error::TrainJob did not reach Complete within 12m"
          kubectl -n gco-jobs get trainjob kubeflow-trainjob-example -o yaml || true
          kubectl -n gco-jobs get pods -o wide || true
          kubectl -n gco-jobs describe pods || true
          kubectl -n gco-jobs get events --sort-by=.lastTimestamp | tail -40 || true
          exit 1
      - name: Verify the all-reduce actually spanned the gang
        # Completion proves exit codes; this proves the collective. Rank 0
        # prints the sentinel only after asserting the summed tensor equals
        # the world size on its side of the rendezvous.
        run: |
          set -euo pipefail
          logs=$(kubectl -n gco-jobs logs \
            -l jobset.sigs.k8s.io/jobset-name=kubeflow-trainjob-example \
            --tail=-1 --prefix)
          echo "$logs"
          echo "$logs" | grep -q "distributed all-reduce verified across the gang"
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n kubeflow-trainer logs deployment/kubeflow-trainer-controller-manager --tail=200 || true
          kubectl -n monitoring logs deployment/mlflow --tail=200 --all-containers || true
          kubectl -n gco-jobs get trainjob -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true

  # --------------------------------------------------------------------------
  # Dev-onboarding alias live proofs. Each job installs the latest version of a
  # container runtime, then runs scripts/setup-dev-alias.sh end to end — proving
  # it builds the gco-dev image AND that the `gco` shell function it emits
  # actually launches the runtime and runs the real CLI — closing the gap left
  # by the mocked tests/BATS/test_setup_dev_alias.bats suite. Logic lives in
  # .github/scripts/dev_alias_live.sh so it can be run locally too.
  # --------------------------------------------------------------------------

  integration-dev-alias-docker:
    name: "integration:dev-alias:docker"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify the preinstalled Docker runtime
        # GitHub-hosted runners include Docker. Verify that trusted runner
        # surface instead of executing a mutable internet script as root.
        run: |
          set -euo pipefail
          docker version
      - name: Live-prove the generated gco function against Docker
        # Runner user is in the docker group, so the emitted `docker run`
        # (no sudo) works as-is.
        run: .github/scripts/dev_alias_live.sh docker

  integration-dev-alias-podman:
    name: "integration:dev-alias:podman"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install the latest Podman (with retry)
        uses: ./.github/actions/apt-install-with-retry
        with:
          packages: podman
      - name: Configure rootless Podman for CI
        run: |
          set -euo pipefail
          podman version
          # Rootless podman in CI has no systemd user session, so crun's sd-bus
          # calls fail ("Interactive authentication required") during build/run.
          # Enable lingering and pin cgroupfs + the file events logger so the
          # container runtime does not need a systemd session.
          sudo loginctl enable-linger "$(id -un)" 2>/dev/null || true
          mkdir -p "$HOME/.config/containers"
          # The default configuration, written by .github/scripts/podman_ci_config.sh
          # so the live step can rewrite it for the fallback attempt using the
          # same code path. See that script for why two configurations exist.
          .github/scripts/podman_ci_config.sh crun
      - name: Live-prove the generated gco function against Podman
        run: |
          set -euo pipefail
          # The emitted podman function bind-mounts the rootless API socket
          # ($XDG_RUNTIME_DIR/podman/podman.sock) onto /var/run/docker.sock.
          # Pin XDG_RUNTIME_DIR to a writable dir and start the API service so
          # the bind-mount source exists (the test image never uses it, but
          # `podman run` needs the source path present).
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          chmod 700 "$XDG_RUNTIME_DIR"
          nohup podman system service --time=0 \
            "unix://$XDG_RUNTIME_DIR/podman/podman.sock" >"$RUNNER_TEMP/podman-api.log" 2>&1 &
          for _ in $(seq 1 15); do
            [ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ] && break
            sleep 1
          done
          # Fallback so the bind-mount source always exists.
          [ -e "$XDG_RUNTIME_DIR/podman/podman.sock" ] || : >"$XDG_RUNTIME_DIR/podman/podman.sock"

          # Two OCI runtime configurations are viable here and each fails in a
          # way the other survives, so try both rather than depending on which
          # podman/crun pairing the runner image shipped. See
          # .github/scripts/podman_ci_config.sh for both failure modes.
          #
          # This is a genuine alternative configuration, not a blind retry: the
          # crun failure is deterministic inside a given runner, so re-running
          # the same setup could never clear it.
          for runtime in crun runc; do
            echo "::group::podman dev-alias attempt with ${runtime}"
            .github/scripts/podman_ci_config.sh "${runtime}"
            if .github/scripts/dev_alias_live.sh podman; then
              echo "::endgroup::"
              echo "dev-alias succeeded with the ${runtime} configuration"
              exit 0
            fi
            echo "::endgroup::"
            echo "dev-alias failed with the ${runtime} configuration" >&2
          done

          echo "dev-alias failed with every OCI runtime configuration" >&2
          exit 1

  integration-dev-alias-finch:
    name: "integration:dev-alias:finch"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Prepare the runfinch APT repo
        run: |
          set -euo pipefail
          # runfinch-finch depends on the distro `containerd` (+ runc >= 1.1.5),
          # which conflicts with the Docker `containerd.io` preinstalled on the
          # runner. Remove the Docker/containerd stack so finch's deps resolve.
          sudo systemctl stop docker.socket docker.service 2>/dev/null || true
          sudo apt-get remove -y --purge \
            containerd.io docker-ce docker-ce-cli docker-buildx-plugin docker-compose-plugin \
            moby-engine moby-cli moby-containerd moby-runc moby-buildx moby-compose 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          finch_key="${RUNNER_TEMP}/runfinch-key.pub"
          curl --fail --show-error --location --retry 3 \
            --output "${finch_key}" \
            https://artifact.runfinch.com/deb/GPG_KEY.pub
          mapfile -t primary_fingerprints < <(
            gpg --batch --show-keys --with-colons "${finch_key}" \
              | awk -F: '$1 == "pub" { want_fingerprint = 1; next }
                           want_fingerprint && $1 == "fpr" { print $10; want_fingerprint = 0 }'
          )
          expected_fingerprint="C97195B13509CD7BD64D7F085E9EEE296292ACB8"
          if [ "${#primary_fingerprints[@]}" -ne 1 ] \
             || [ "${primary_fingerprints[0]}" != "${expected_fingerprint}" ]; then
            echo "::error::Unexpected Finch repository signing-key fingerprint" >&2
            printf 'Observed primary fingerprints: %s\n' "${primary_fingerprints[*]:-none}" >&2
            exit 1
          fi
          sudo gpg --batch --yes --dearmor \
            --output /usr/share/keyrings/runfinch-finch-archive-keyring.gpg \
            "${finch_key}"
          rm -f "${finch_key}"
          echo "deb [signed-by=/usr/share/keyrings/runfinch-finch-archive-keyring.gpg arch=amd64] https://artifact.runfinch.com/deb noble main" \
            | sudo tee /etc/apt/sources.list.d/runfinch-finch.list
      - name: Install the latest Finch (with retry)
        uses: ./.github/actions/apt-install-with-retry
        with:
          packages: runfinch-finch
      - name: Verify the Finch CLI
        run: sudo finch --version
      - name: Start the Finch daemon stack and wait for it
        run: |
          set -uo pipefail
          # The runfinch package ships systemd units for the daemon stack.
          # Start them best-effort, then gate on `finch info` answering.
          sudo systemctl daemon-reload || true
          for unit in containerd buildkit finch-buildkit finch-daemon finch; do
            sudo systemctl enable --now "$unit" 2>/dev/null \
              || sudo systemctl start "$unit" 2>/dev/null || true
          done
          ok=0
          for _ in $(seq 1 20); do
            if sudo finch info >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::finch daemon did not become ready"
            systemctl list-unit-files 2>/dev/null | grep -iE 'finch|containerd|buildkit' || true
            sudo systemctl --no-pager status containerd buildkit finch-buildkit finch-daemon finch 2>&1 | tail -80 || true
            sudo finch info || true
            exit 1
          fi
          sudo finch info
      - name: Live-prove the generated gco function against Finch
        # Linux finch talks to a root-owned daemon, so the whole script runs as
        # root. setup-dev-alias.sh emits a plain `finch run` (no sudo); running
        # the generated function as root is what makes it work on Linux.
        run: sudo --preserve-env=PATH .github/scripts/dev_alias_live.sh finch

  integration-dev-alias-none:
    name: "integration:dev-alias:none"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Prove setup-dev-alias.sh refuses when no runtime answers
        # Docker is preinstalled on the runner, so the script masks all three
        # runtimes with stubs that fail `<rt> info` to exercise the refusal
        # path deterministically.
        run: .github/scripts/dev_alias_live.sh --no-runtime
