# =============================================================================
# integration-tests.yml — Integration tests
# =============================================================================
#
# Maps to the "Integration Tests" row of the README badge table.
#
# Triggers: push: main, pull_request, workflow_dispatch.
#
# Jobs (alphabetical by display name):
#   - integration:autopilot:boot                  — `gco autopilot` installs pinned Claude Code + boots the MCP/Bedrock stack to the cred boundary
#   - integration:dev-alias:docker                — verify runner Docker, build gco-dev, prove the generated `gco` alias runs
#   - integration:dev-alias:finch                 — install latest Finch (rootful), build gco-dev, prove the generated `gco` alias runs
#   - integration:dev-alias:none                  — prove setup-dev-alias.sh refuses cleanly when no runtime is installed
#   - integration:dev-alias:podman                — install latest Podman, build gco-dev, prove the generated `gco` alias runs
#   - integration:docker:cost-monitor             — build + import smoke + functional boot/probe/shutdown contract
#   - integration:docker:dev-container            — Dockerfile.dev native-arch matrix (amd64 + arm64 runners)
#   - integration:docker:health-monitor           — build + import smoke + functional boot/probe/shutdown contract
#   - integration:docker:helm-installer           — build + `helm version`/`kubectl version`
#   - integration:docker:inference-monitor        — build + import smoke + functional metrics/resilience/shutdown contract
#   - integration:docker:inference-proxy          — build + import smoke + functional boot/probe/shutdown contract
#   - integration:docker:manifest-processor       — build + import smoke + functional boot/probe/shutdown contract
#   - integration:docker:queue-processor          — build + import smoke + moto-SQS consume/reject/exit-code contract
#   - integration:docker:tls-certificate-manager  — build + Lambda handler import
#   - integration:helm:charts-valid               — every charts.yaml (chart,version) resolves + renders with helm
#   - integration:k8s:manifest-schema             — kubeconform schema validation + YAML/required-kinds/DAG checks
#   - integration:kind:cluster-e2e                — kind + Calico + Metrics Server + HPA + services + policy/RBAC
#   - integration:kind:examples-smoke             — kind + pinned trainer/mlflow charts + real TrainJob e2e + SubjectAccessReview sweep + mlflow probe
#   - integration:lambda:imports                  — import each Lambda handler
#   - integration:mcp:server                      — pytest tests/test_mcp_integration.py
#   - integration:pytest:cross-module             — pytest tests/test_integration.py
#
# =============================================================================

name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Single declarations for tooling installed by MORE than one job in this
# file — both kind jobs (cluster-e2e, examples-smoke) build the same cluster
# shape, and two jobs on different Calico builds would enforce NetworkPolicy
# with two different engines. Workflow-level env inherits into every job, so
# run-blocks interpolate ${CALICO_VERSION} directly and `with:` blocks use
# ${{ env.KIND_VERSION }}. Tracked for drift by the "CI tooling" section of
# dependency-scan.sh; single-job pins (METRICS_SERVER_*, KUBECONFORM_*) stay
# scoped to their one job on purpose.
env:
  KIND_VERSION: "v0.32.0"
  KIND_NODE_IMAGE: "kindest/node:v1.36.1"
  CALICO_VERSION: "v3.32.1"
  CALICO_SHA256: "a1df919d9721cf667accdc3e72848911b0cb25cfab7d2478ad0c996302c95744"

jobs:
  integration-helm-charts-valid:
    name: "integration:helm:charts-valid"
    # Proves every (chart, version) pinned in lambda/helm-installer/charts.yaml
    # is a real, installable Helm chart. The helm-installer Lambda trusts these
    # pins blindly at deploy time, so a typo'd chart name or a version that
    # never shipped would otherwise only surface as a failed
    # `helm upgrade --install` mid-deploy. `--mode online` resolves each chart
    # at its exact pinned version (`helm show chart`) and renders it to
    # manifests (`helm template`) with the values charts.yaml ships — no
    # cluster required. Every entry is checked, including enabled: false charts
    # (those are toggled on via cdk.json, so their pins must be valid too).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install project (provides PyYAML for the validator)
        run: pip install -e .
      - name: Derive the Helm pin from the production installer Dockerfile
        # lambda/helm-installer/Dockerfile is the single source for the Helm
        # version + checksum: this step loads HELM_VERSION / HELM_SHA256 from
        # its authenticated RUN line, so CI installs the exact binary the
        # installer Lambda ships and a bump edits one file only.
        run: |
          set -euo pipefail
          source .github/scripts/lib_dependency_scan.sh
          extract_helm_installer_pins lambda/helm-installer/Dockerfile | grep '^HELM_' | tr '|' '=' | tee -a "$GITHUB_ENV"
          grep -q '^HELM_VERSION=' "$GITHUB_ENV" && grep -q '^HELM_SHA256=' "$GITHUB_ENV"
      - name: Install Helm
        # The pin (version + checksum) was derived from the installer
        # Dockerfile in the previous step, so this validates against the
        # exact authenticated binary that performs the real install.
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/helm.tar.gz"
          install_dir="${RUNNER_TEMP}/helm-install"
          curl --fail --show-error --location --retry 3 \
            --output "${archive}" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" \
            --strip-components=1 --no-same-owner linux-amd64/helm
          sudo install -m 0755 "${install_dir}/helm" /usr/local/bin/helm
          rm -f "${archive}" "${install_dir}/helm"
          rmdir "${install_dir}"
          helm version --short
      - name: Validate charts.yaml (resolve + render every pinned chart)
        run: python3 .github/scripts/validate_helm_charts.py --mode online --verbose

  integration-k8s-manifest-schema:
    name: "integration:k8s:manifest-schema"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Scoped to this job: kubeconform is a lint-time-only tool, used
      # exclusively by the schema-validation step below, so it's installed
      # and pinned here rather than globally. Tracked for drift by the
      # "CI tooling" section of dependency-scan.sh, the same way
      # HELM_VERSION and the install-trivy action default are.
      KUBECONFORM_VERSION: "v0.8.0"
      KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install project
        run: |
          pip install -e .
      - name: Install pinned kubeconform
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/kubeconform.tar.gz"
          install_dir="${RUNNER_TEMP}/kubeconform-install"
          curl --fail --show-error --location --retry 3 \
            --output "${archive}" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" --no-same-owner kubeconform
          sudo install -m 0755 "${install_dir}/kubeconform" /usr/local/bin/kubeconform
          rm -f "${archive}" "${install_dir}/kubeconform"
          rmdir "${install_dir}"
          kubeconform -v
      - name: Validate Kubernetes manifest schemas (kubeconform)
        # Schema-level validation, not just YAML syntax: renders {{PLACEHOLDER}}
        # template tokens to schema-shaped stubs, then runs kubeconform -strict
        # against lambda/kubectl-applier-simple/manifests/ and examples/ with
        # the community CRD catalog as a schema-location fallback for Karpenter
        # NodePool, AWS Load Balancer Controller Gateway API, Kueue, and KEDA CRDs.
        # See .github/scripts/validate_k8s_manifests.py for the full rationale
        # (including the two CRDs — KubeRay RayCluster, Volcano Job — that
        # catalog doesn't cover yet, and are intentionally -skip'd by GVK).
        run: |
          python3 .github/scripts/validate_k8s_manifests.py --verbose
      - name: Validate Kubernetes manifest YAML syntax
        # Port of integration:k8s from the retired GitLab pipeline.
        # Files containing `{{ template }}` placeholders are skipped because
        # they aren't valid YAML until the kubectl-applier substitutes values.
        run: |
          set -uo pipefail
          FAILED=0
          echo "=== Validating Kubernetes manifest YAML syntax ==="
          for f in lambda/kubectl-applier-simple/manifests/*.yaml; do
            echo "Validating $f..."
            if grep -q '{{' "$f"; then
              echo "  Skipping (contains template variables)"
              continue
            fi
            if ! python -c "import yaml, sys; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"; then
              echo "  FAILED: $f"
              FAILED=1
            else
              echo "  OK"
            fi
          done
          echo "=== Validating example manifest YAML syntax ==="
          for f in examples/*.yaml; do
            echo "Validating $f..."
            if ! python -c "import yaml, sys; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"; then
              echo "  FAILED: $f"
              FAILED=1
            else
              echo "  OK"
            fi
          done
          echo "=== Checking for required Kubernetes resources ==="
          REQUIRED_KINDS="Namespace ServiceAccount ClusterRole ClusterRoleBinding Deployment"
          for kind in $REQUIRED_KINDS; do
            if grep -r "kind: $kind" lambda/kubectl-applier-simple/manifests/ > /dev/null; then
              echo "  Found $kind"
            else
              echo "  MISSING: $kind"
              FAILED=1
            fi
          done
          exit "$FAILED"
      - name: Validate DAG pipeline definitions
        run: |
          set -uo pipefail
          FAILED=0
          for f in examples/*dag*.yaml examples/*pipeline*.yaml; do
            [ -f "$f" ] || continue
            echo "Validating DAG $f..."
            python - "$f" <<'PY' || FAILED=1
          import sys, yaml
          path = sys.argv[1]
          with open(path) as fh:
              data = yaml.safe_load(fh)
          if 'steps' not in data:
              print('  Not a DAG file, skipping')
              sys.exit(0)
          all_names = {s['name'] for s in data['steps']}
          names = set()
          for step in data['steps']:
              if 'name' not in step or 'manifest' not in step:
                  print('  FAILED: step missing name or manifest')
                  sys.exit(1)
              if step['name'] in names:
                  print(f"  FAILED: duplicate step name {step['name']}")
                  sys.exit(1)
              names.add(step['name'])
              for dep in step.get('depends_on', []):
                  if dep not in all_names:
                      print(f'  FAILED: unknown dependency {dep}')
                      sys.exit(1)
          print(f"  OK ({len(data['steps'])} steps)")
          PY
          done
          exit "$FAILED"
      - name: Check manifest structure
        run: |
          python - <<'PY'
          import os
          import sys
          import yaml

          failed = False
          root_dir = 'lambda/kubectl-applier-simple/manifests'
          for root, _dirs, files in os.walk(root_dir):
              for f in files:
                  if not f.endswith('.yaml'):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fh:
                      content = fh.read()
                  if '{{' in content:
                      print(f"  {path}: skipping (contains template variables)")
                      continue
                  try:
                      for doc in yaml.safe_load_all(content):
                          if doc is None:
                              continue
                          if 'kind' not in doc:
                              print(f"  {path}: missing 'kind' field")
                              failed = True
                          if 'apiVersion' not in doc:
                              print(f"  {path}: missing 'apiVersion' field")
                              failed = True
                  except Exception as e:
                      print(f"  {path}: {e}")
                      failed = True
          if failed:
              sys.exit(1)
          print("  All manifests have required fields")
          PY

  integration-lambda-imports:
    name: "integration:lambda:imports"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Several Lambda modules (notably lambda/api-gateway-proxy/proxy_utils.py)
    # instantiate boto3 clients at module import time, so boto3 needs a
    # region even though no AWS calls are made. Matches the top-level
    # AWS_DEFAULT_REGION=us-east-1 variable from the retired GitLab pipeline.
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install project
        run: |
          pip install -e .
      - name: Import each Lambda handler
        run: python3 .github/scripts/verify_lambda_imports.py

  integration-pytest-cross-module:
    name: "integration:pytest:cross-module"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tests/test_integration.py imports every Lambda handler, including
    # modules that instantiate boto3 clients at import time. Set a default
    # region so those imports succeed without real AWS calls.
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install test dependencies
        run: |
          pip install -e ".[test]"
      - name: Run integration pytest
        run: |
          pytest tests/test_integration.py -v --tb=short \
            --junitxml=test-integration-report.xml
      - name: Upload report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: integration-pytest-report
          path: test-integration-report.xml
          retention-days: 7

  integration-mcp-server:
    name: "integration:mcp:server"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install dev + mcp
        run: |
          pip install -e ".[dev,mcp]"
      - name: Run MCP integration tests
        run: |
          pytest tests/test_mcp_integration.py -v --tb=short \
            --junitxml=test-mcp-integration-report.xml
      - name: Upload report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: integration-mcp-report
          path: test-mcp-integration-report.xml
          retention-days: 7

  # --------------------------------------------------------------------------
  # integration:autopilot:boot — `gco autopilot` boots the real Claude Code
  # stack on a bare runner, exactly like a first-time user: autopilot
  # npm-installs the pinned Claude Code release itself (`claude` is absent
  # on purpose), writes the session MCP config, and execs claude, which
  # connects the in-tree gco MCP server plus every curated companion
  # (uvx + npx recipes run for real) and dispatches to Amazon Bedrock with
  # the shipped default model. Fabricated fail-closed credentials stop the
  # launch at the exact credential boundary — AWS answering 403 to the
  # signed request is the success condition, and the only part of the
  # session a credential-less runner cannot reach. Complements
  # unit:cli:autopilot (plan/config/pin-install, no boot) with the boot
  # itself; assertions and marker contract live in the probe script.
  # --------------------------------------------------------------------------

  integration-autopilot-boot:
    name: "integration:autopilot:boot"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install the CLI and the in-tree MCP server dependencies
        # [mcp] brings fastmcp so the gco server entry in the generated
        # config (python3 gco_mcp/run_mcp.py, straight off this checkout)
        # can actually boot under claude.
        run: pip install -e ".[mcp]"
      - name: Install uv (uvx launches the PyPI companion MCP servers)
        run: pip install uv
      - name: Boot the autopilot session to the credential boundary
        run: bash .github/scripts/autopilot_boot_probe.sh
      - name: Upload session evidence
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: autopilot-boot-evidence
          path: ${{ runner.temp }}/autopilot-boot-probe/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Per-Dockerfile build + healthcheck integration tests.
  # One job per image. Each job builds from scratch, runs the container,
  # probes the health endpoint (or exec equivalent), then tears down.
  # --------------------------------------------------------------------------

  integration-docker-cost-monitor:
    name: "integration:docker:cost-monitor"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-buildx-with-retry
      - name: Build image
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/cost-monitor-dockerfile
          tags: cost-monitor:ci
          load: true
          cache-from: type=gha,scope=cost-monitor
          cache-to: type=gha,mode=max,scope=cost-monitor,ignore-error=true
      - name: Verify image boots the module
        # Crisp early signal: distinguishes "cannot even import" from a boot
        # failure in the functional test below.
        run: |
          docker run --rm cost-monitor:ci \
            python -c "import gco.services.cost_api as m; print('cost-monitor import OK:', m.__name__)"
      - name: Functional container test
        # Boots the image under the deployment manifest's pod-equivalent
        # constraints (read-only root, tmpfs /tmp, uid 1000, all caps
        # dropped) and asserts the serving contract: /healthz + /readyz
        # (readiness must hold with OpenCost/S3 unreachable — the scheduled
        # reporter degrades instead of dying), Prometheus /metrics, the
        # manifest's preStop ["python","-c",...] exec shape against the live
        # shell-less container, 10s stability, and graceful SIGTERM exit 0.
        # OpenCost/S3 round-trips stay deployed-environment concerns.
        run: |
          .github/scripts/functional_container_test.sh \
            --image cost-monitor:ci --name cost-monitor-fn --host-port 18080 \
            --env "COST_REPORT_BUCKET=gco-ci-fn-bucket" \
            --env "AWS_REGION=us-east-1" \
            --probe "/healthz=200" \
            --probe "/readyz=200=ready" \
            --probe "/metrics=200" \
            --exec-python "import time; time.sleep(0)" \
            --min-uptime 10 \
            --expect-stop-exit 0

  integration-docker-health-monitor:
    name: "integration:docker:health-monitor"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-buildx-with-retry
      - name: Build image
        # Shared GHA layer cache (scope: health-monitor). Populated and
        # reused by this job, integration:kind:cluster-e2e, and
        # security:trivy:container-scan — all three build the same image
        # from the same Dockerfile + context.
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/health-monitor-dockerfile
          tags: health-monitor:ci
          load: true
          cache-from: type=gha,scope=health-monitor
          cache-to: type=gha,mode=max,scope=health-monitor,ignore-error=true
      - name: Verify image boots the module
        # Crisp early signal: distinguishes "cannot even import" from a boot
        # failure in the functional test below.
        run: |
          docker run --rm health-monitor:ci \
            python -c "import gco.services.health_api as m; print('health-monitor import OK:', m.__name__)"
      - name: Write stub kubeconfig
        # lifespan() requires a loadable Kubernetes config. A static
        # kubeconfig pointing at an unreachable apiserver (port 9, discard —
        # refuses instantly) parses without connecting, which is exactly what
        # lets the service reach its serving state outside a cluster. Live
        # cluster behavior belongs to integration:kind:cluster-e2e.
        run: |
          cat > "${RUNNER_TEMP}/kubeconfig" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - name: ci-stub
              cluster:
                server: https://127.0.0.1:9
                insecure-skip-tls-verify: true
          contexts:
            - name: ci-stub
              context:
                cluster: ci-stub
                user: ci-stub
          current-context: ci-stub
          users:
            - name: ci-stub
              user:
                token: ci-stub-token
          EOF
      - name: Functional container test
        # Boots the image under the deployment manifest's pod-equivalent
        # constraints (read-only root, tmpfs /tmp, uid 1000, all caps
        # dropped) and asserts the serving contract: probe endpoints, the
        # auth-exempt /api/v1/health honestly reporting 503/unhealthy while
        # the apiserver is unreachable, auth fail-closed (503, no
        # AUTH_SECRET_ARN and no GCO_DEV_MODE), the manifest's preStop
        # ["python","-c",...] exec shape against the live shell-less
        # container, 10s stability, and graceful SIGTERM exit 0. The final
        # exec payload pins the shipped artifact's side of the ClusterHealthy
        # contract the traffic-dial controller consumes (namespace +
        # dimension injection; tests/test_health_metric_contract.py pins the
        # full query shape at the unit layer).
        run: |
          .github/scripts/functional_container_test.sh \
            --image health-monitor:ci --name health-monitor-fn --host-port 18080 \
            --kubeconfig "${RUNNER_TEMP}/kubeconfig" \
            --probe "/healthz=200" \
            --probe "/readyz=200=ready" \
            --probe "/metrics=200" \
            --probe "/api/v1/health=503=unhealthy" \
            --probe "/api/v1/status=503=authentication not configured" \
            --exec-python "import time; time.sleep(0)" \
            --exec-python "import gco.services.metrics_publisher as mp; p = mp.HealthMonitorMetrics(cluster_name='ci-cluster', region='us-east-1'); assert p.namespace == 'GCO/HealthMonitor', p.namespace; assert p.cluster_name == 'ci-cluster'" \
            --min-uptime 10 \
            --expect-stop-exit 0

  integration-docker-manifest-processor:
    name: "integration:docker:manifest-processor"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-buildx-with-retry
      - name: Build image
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/manifest-processor-dockerfile
          tags: manifest-processor:ci
          load: true
          cache-from: type=gha,scope=manifest-processor
          cache-to: type=gha,mode=max,scope=manifest-processor,ignore-error=true
      - name: Verify image boots the module
        # Crisp early signal: distinguishes "cannot even import" from a boot
        # failure in the functional test below.
        run: |
          docker run --rm manifest-processor:ci \
            python -c "import gco.services.manifest_api as m; print('manifest-processor import OK:', m.__name__)"
      - name: Write stub kubeconfig
        # Same rationale as integration:docker:health-monitor — parseable
        # config, unreachable apiserver, no connection at load time.
        run: |
          cat > "${RUNNER_TEMP}/kubeconfig" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - name: ci-stub
              cluster:
                server: https://127.0.0.1:9
                insecure-skip-tls-verify: true
          contexts:
            - name: ci-stub
              context:
                cluster: ci-stub
                user: ci-stub
          current-context: ci-stub
          users:
            - name: ci-stub
              user:
                token: ci-stub-token
          EOF
      - name: Functional container test
        # Boots the image under the deployment manifest's pod-equivalent
        # constraints and asserts the serving contract: /readyz 200 once the
        # lifespan completes, the auth-exempt /api/v1/health performing a
        # LIVE apiserver check and honestly reporting 503/disconnected, auth
        # fail-closed 503 on a guarded route (no AUTH_SECRET_ARN and no
        # GCO_DEV_MODE), the manifest's preStop ["python","-c",...] exec
        # shape, and graceful SIGTERM exit 0 (queue-worker drain included).
        run: |
          .github/scripts/functional_container_test.sh \
            --image manifest-processor:ci --name manifest-processor-fn --host-port 18080 \
            --kubeconfig "${RUNNER_TEMP}/kubeconfig" \
            --probe "/healthz=200" \
            --probe "/readyz=200=ready" \
            --probe "/metrics=200" \
            --probe "/api/v1/health=503=disconnected" \
            --probe "/api/v1/templates=503=authentication not configured" \
            --exec-python "import time; time.sleep(0)" \
            --expect-stop-exit 0

