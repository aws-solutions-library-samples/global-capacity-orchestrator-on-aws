  integration-docker-queue-processor:
    name: "integration:docker:queue-processor"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-buildx-with-retry
      - name: Build image
        uses: ./.github/actions/build-image-with-retry
        with:
          context: .
          file: dockerfiles/queue-processor-dockerfile
          tags: queue-processor:ci
          load: true
          cache-from: type=gha,scope=queue-processor
          cache-to: type=gha,mode=max,scope=queue-processor,ignore-error=true
      - name: Verify image boots the module
        # Crisp early signal: distinguishes "cannot even import" from a
        # behavioral failure in the SQS contract tests below.
        run: |
          docker run --rm \
            -e AWS_REGION=us-east-1 \
            queue-processor:ci \
            python -c "import gco.services.queue_processor as m; print('queue-processor import OK:', m.__name__)"
      - name: Write stub kubeconfig
        # main() loads a Kubernetes config before touching SQS. A parseable
        # kubeconfig pointing at an unreachable apiserver satisfies the load
        # without a cluster; the policy-rejection case below never reaches
        # the apply step, so no live apiserver is needed.
        run: |
          cat > "${RUNNER_TEMP}/kubeconfig" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - name: ci-stub
              cluster:
                server: https://127.0.0.1:9
                insecure-skip-tls-verify: true
          contexts:
            - name: ci-stub
              context:
                cluster: ci-stub
                user: ci-stub
          current-context: ci-stub
          users:
            - name: ci-stub
              user:
                token: ci-stub-token
          EOF
      - name: Start moto SQS and create the job queue
        # moto (the same 5.2.2 the test suite pins in requirements-lock.txt,
        # installed with the lock as a constraint) provides a real SQS wire
        # API on the runner. botocore honors AWS_ENDPOINT_URL_SQS, so the
        # container talks to it with zero code changes — the KEDA ScaledJob
        # consume path runs for real: receive, validate, delete/retain.
        run: |
          set -euo pipefail
          pip install --constraint requirements-lock.txt "moto[server]==5.2.2"
          nohup moto_server -H 127.0.0.1 -p 5000 > "${RUNNER_TEMP}/moto.log" 2>&1 &
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/moto-api/data.json || true)
            [ "${code}" = "200" ] && break
            sleep 1
          done
          if [ "${code}" != "200" ]; then
            echo "::error::moto server never became ready"
            cat "${RUNNER_TEMP}/moto.log"
            exit 1
          fi
          aws sqs create-queue \
            --queue-name gco-ci-jobs \
            --endpoint-url http://127.0.0.1:5000 \
            --query QueueUrl --output text
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: us-east-1
      - name: Consume from an empty queue (exit 0)
        # One pod per SQS message is the ScaledJob contract; an empty poll
        # must exit 0 so KEDA scale-downs don't register as job failures.
        # --network host lets the container reach moto on the runner's
        # loopback; the pod-equivalent hardening flags stay on.
        run: |
          set -euo pipefail
          set +e
          output=$(docker run --rm --network host \
            --read-only --tmpfs /tmp --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "${RUNNER_TEMP}/kubeconfig:/kubeconfig:ro" \
            -e KUBECONFIG=/kubeconfig \
            -e JOB_QUEUE_URL="http://127.0.0.1:5000/123456789012/gco-ci-jobs" \
            -e AWS_ENDPOINT_URL_SQS=http://127.0.0.1:5000 \
            -e AWS_ACCESS_KEY_ID=testing \
            -e AWS_SECRET_ACCESS_KEY=testing \
            -e AWS_REGION=us-east-1 \
            queue-processor:ci 2>&1)
          rc=$?
          set -e
          printf '%s\n' "${output}"
          if [ "${rc}" -ne 0 ] || ! printf '%s\n' "${output}" | grep -q "No messages in queue"; then
            echo "::error::expected clean empty-queue exit 0, got rc=${rc}"
            exit 1
          fi
      - name: Reject a policy-violating job (exit 1, message retained)
        # The security-critical behavior: a privileged-container manifest
        # must fail prevalidation, exit 1, and stay in the queue for the
        # visibility-timeout retry / DLQ redrive — never be acknowledged.
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/privileged-job.json" <<'EOF'
          {
            "job_id": "ci-privileged-reject",
            "manifests": [
              {
                "apiVersion": "v1",
                "kind": "Pod",
                "metadata": {"name": "evil", "namespace": "gco-jobs"},
                "spec": {
                  "containers": [
                    {
                      "name": "c",
                      "image": "busybox",
                      "securityContext": {"privileged": true}
                    }
                  ]
                }
              }
            ]
          }
          EOF
          aws sqs send-message \
            --endpoint-url http://127.0.0.1:5000 \
            --queue-url "http://127.0.0.1:5000/123456789012/gco-ci-jobs" \
            --message-body "file://${RUNNER_TEMP}/privileged-job.json" \
            --query MessageId --output text
          set +e
          output=$(docker run --rm --network host \
            --read-only --tmpfs /tmp --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "${RUNNER_TEMP}/kubeconfig:/kubeconfig:ro" \
            -e KUBECONFIG=/kubeconfig \
            -e JOB_QUEUE_URL="http://127.0.0.1:5000/123456789012/gco-ci-jobs" \
            -e AWS_ENDPOINT_URL_SQS=http://127.0.0.1:5000 \
            -e AWS_ACCESS_KEY_ID=testing \
            -e AWS_SECRET_ACCESS_KEY=testing \
            -e AWS_REGION=us-east-1 \
            queue-processor:ci 2>&1)
          rc=$?
          set -e
          printf '%s\n' "${output}"
          if [ "${rc}" -ne 1 ]; then
            echo "::error::expected exit 1 for a policy-violating job, got ${rc}"
            exit 1
          fi
          printf '%s\n' "${output}" | grep -q "privileged containers are not permitted"
          printf '%s\n' "${output}" | grep -q "failed prevalidation"
          # The unacknowledged message must still exist (in flight until the
          # visibility timeout, then retried and eventually DLQ'd).
          attrs=$(aws sqs get-queue-attributes \
            --endpoint-url http://127.0.0.1:5000 \
            --queue-url "http://127.0.0.1:5000/123456789012/gco-ci-jobs" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
            --query 'Attributes' --output json)
          printf '%s\n' "${attrs}"
          total=$(printf '%s' "${attrs}" | python3 -c "
          import json, sys
          attrs = json.load(sys.stdin)
          visible = int(attrs['ApproximateNumberOfMessages'])
          in_flight = int(attrs['ApproximateNumberOfMessagesNotVisible'])
          print(visible + in_flight)
          ")
          if [ "${total}" -ne 1 ]; then
            echo "::error::rejected message was not retained in the queue (total=${total})"
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: us-east-1
      - name: Fail fast without JOB_QUEUE_URL (exit 1)
        # Misconfiguration must be loud: no queue URL means exit 1 with an
        # explicit log line, never a silent success.
        run: |
          set -euo pipefail
          set +e
          output=$(docker run --rm \
            --read-only --tmpfs /tmp --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "${RUNNER_TEMP}/kubeconfig:/kubeconfig:ro" \
            -e KUBECONFIG=/kubeconfig \
            -e AWS_REGION=us-east-1 \
            queue-processor:ci 2>&1)
          rc=$?
          set -e
          printf '%s\n' "${output}"
          if [ "${rc}" -ne 1 ] || ! printf '%s\n' "${output}" | grep -q "JOB_QUEUE_URL not set"; then
            echo "::error::expected exit 1 with 'JOB_QUEUE_URL not set', got rc=${rc}"
            exit 1
          fi

