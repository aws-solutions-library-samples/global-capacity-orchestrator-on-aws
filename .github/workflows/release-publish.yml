# =============================================================================
# release-publish.yml — Stage 2 of 2: tag the merged release and publish
# =============================================================================
#
# Fires when a push to main changes VERSION — normally the squash-merge of a
# release/vX.Y.Z pull request opened by release.yml (stage 1). It creates the
# annotated v-tag on the merge commit and publishes the GitHub Release with
# generated notes. Both actions are idempotent, so a failed run can be
# re-dispatched (workflow_dispatch) and it finishes whatever is missing.
#
# The release commit is the newest commit on main's first-parent history that
# changed VERSION, located from the run's commit rather than assumed to be it.
# A dispatch starts at whatever main points to by then, possibly several
# merges past the release; tagging that commit would release unreleased
# changes, and once the tag exists every resume would fail the immutability
# check.
#
# Guard rails:
#   * The version files must agree at the release commit (VERSION is the
#     source of truth; gco/_version.py and cli/__init__.py must mirror it) —
#     a drifted merge fails loudly instead of tagging an inconsistent tree.
#   * The release commit's subject must be `Release vX.Y.Z` (optionally with
#     the squash-merge `(#N)` suffix). A VERSION edit that arrives any other
#     way is deliberately NOT tagged: a push run skips it with a summary, and
#     a dispatch fails, since publishing it would release a commit nobody
#     cut as a release. Ship those changes by cutting the next release.
#   * A v-tag that already exists pointing at a different commit is an
#     immutability violation and fails the run; pointing at the release
#     commit is the resume case and skips tag creation.
#
# Concurrency:
#   Shares the `release` group with stage 1 so a publish never interleaves
#   with the next release's branch cut.
#
# Permissions model:
#   `contents: write` on the built-in GITHUB_TOKEN covers the tag push and
#   the release creation. The v* tag ruleset blocks update, deletion, and
#   force-push with no bypass actors, so a published tag is immutable for
#   everyone; creation stays open (enterprise policy prevents granting the
#   Actions app a ruleset bypass), and this workflow's existing-tag check is
#   what refuses to re-point a released version.
#
# =============================================================================

name: Release Publish

on:
  push:
    branches: [main]
    paths:
      - VERSION
  # Manual re-publish for a merged release whose publish run failed midway.
  # Every step is idempotent, so re-running completes only the missing half;
  # a dispatch publishes the newest release commit on main.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: "release:publish"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Keep temporary files on the work disk
        # /tmp is a quota-limited tmpfs on Ubuntu 26.04 runners; see .github/CI.md.
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags: the immutability check compares any existing
          # v-tag against the commit being published, and the annotated tag
          # needs an authenticated push.
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Locate the release commit
        id: release
        # First-parent only, so the commit found is one main's own history
        # records (the squash-merge), never a commit inside a merged branch.
        # Every later step verifies and tags this commit's tree.
        run: |
          set -euo pipefail
          release_sha=$(git log -1 --first-parent --format=%H -- VERSION)
          if [ -z "$release_sha" ]; then
            echo "No commit in the history of ${GITHUB_SHA} changed VERSION; nothing to publish" >&2
            exit 1
          fi
          git checkout --quiet --detach "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Release commit: $release_sha (run started at $GITHUB_SHA)"
      - name: Resolve and verify the version
        id: version
        run: |
          set -euo pipefail
          new_version=$(tr -d '[:space:]' < VERSION)
          mirrored=$(python3 -c "from gco._version import __version__; print(__version__)")
          if [ "$new_version" != "$mirrored" ]; then
            echo "VERSION ($new_version) and gco/_version.py ($mirrored) disagree; refusing to tag" >&2
            exit 1
          fi
          # cli/__init__.py's literal fallback assignment (used when gco is
          # not importable) must mirror VERSION too.
          cli_mirrored=$(sed -n 's/^ *__version__ = "\(.*\)"$/\1/p' cli/__init__.py | head -1)
          if [ "$new_version" != "$cli_mirrored" ]; then
            echo "VERSION ($new_version) and cli/__init__.py ($cli_mirrored) disagree; refusing to tag" >&2
            exit 1
          fi
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$new_version"
      - name: Require a release commit subject
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          pattern="^Release v${NEW_VERSION//./\\.}( \(#[0-9]+\))?$"
          if printf '%s\n' "$subject" | grep -qE "$pattern"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A dispatch asked for a publish that cannot happen; a green run
          # would read as success.
          if [ "$EVENT_NAME" != "push" ]; then
            echo "The newest VERSION change on main is not a release commit: ${subject}" >&2
            echo "Only \`Release v${NEW_VERSION}\` commits are published; cut a new release instead." >&2
            exit 1
          fi
          echo "publish=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Release publish skipped"
            echo ""
            echo "VERSION changed on main, but the commit subject is:"
            echo ""
            echo "    ${subject}"
            echo ""
            echo "not \`Release v${NEW_VERSION}\`, so this was not a release PR merge."
            echo "Only release commits are published; ship these changes by cutting the next release."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create and push the annotated tag (idempotent)
        if: steps.gate.outputs.publish == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${NEW_VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-parse "${tag}^{commit}")
            if [ "$tagged_commit" != "$RELEASE_SHA" ]; then
              echo "Tag ${tag} already exists at ${tagged_commit}, not ${RELEASE_SHA}." >&2
              echo "Released tags are immutable; bump the version again instead." >&2
              exit 1
            fi
            echo "Tag ${tag} already points at ${RELEASE_SHA}; skipping tag creation"
          else
            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}" "$RELEASE_SHA"
            git push origin "refs/tags/v${NEW_VERSION}"
          fi
      - name: Create GitHub Release with generated notes (idempotent)
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        # Release notes are categorized by PR label per .github/release.yml.
        run: |
          set -euo pipefail
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Release v${NEW_VERSION} already exists; skipping creation"
            exit 0
          fi
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --verify-tag \
            --generate-notes
