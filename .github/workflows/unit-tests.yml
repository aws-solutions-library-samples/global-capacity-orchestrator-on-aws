# =============================================================================
# unit-tests.yml — Unit tests & fast smoke tests
# =============================================================================
#
# Maps to the "Unit Tests" row of the README badge table.
#
# Triggers: push: main, pull_request, workflow_dispatch.
#
# Jobs (alphabetical by display name):
#   - unit:bats:shell               — BATS shell tests
#   - unit:cdk:config-matrix        — tests/test_cdk_synthesis_matrix.py (in-process, -n auto)
#   - unit:cdk:nag-compliance       — cdk-nag compliance across full config matrix
#   - unit:cdk:project-name-scoping — #139: per-project_name name-collision + gco backward-compat synth checks
#   - unit:cdk:synth                — cdk synth of the default config
#   - unit:cli:smoke                — gco --help and all subcommand help pages
#   - unit:cli:smoke:windows        — native Windows cli.stacks/app import + file-lock smoke
#   - unit:fresh-install            — pip install from scratch, verify imports
#   - unit:lockfile:freshness       — requirements-lock.txt matches pyproject.toml
#   - unit:mcp:install              — uv-installs gco-mcp from source, then launches the server
#   - unit:pytest:core              — combines shard coverage, enforces the 90% floor, publishes the coverage artifact
#   - unit:pytest:core (shard N/M)  — one balanced slice of the core suite; shard
#                                     count is set by matrix.shard on
#                                     unit-pytest-core-shard and the slices are
#                                     computed at run time by scripts/split_tests.py
#   - unit:workload:imports         — K8s service import + circular-import detection
#
# The HTML coverage report is published to GitHub Pages by a separate
# workflow — pages.yml ("Deploy Pages") — triggered via workflow_run after
# this workflow completes on main. Keeping the deploy out of this file means a
# GitHub Pages outage can't turn this test gate red.
#
# =============================================================================

name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Path filter used by the lockfile / fresh-install jobs below. Both of those
  # only exercise pyproject.toml + requirements-lock.txt (plus the workflow
  # file itself), so running them on every docs- or code-only PR is waste —
  # especially unit:fresh-install, which intentionally disables the pip cache.
  #
  # On push to main and workflow_dispatch the filter is skipped and the
  # dependent jobs always run: we want at least one guaranteed green run per
  # merge. On PRs, compare the checked-out head directly with the event's
  # immutable base SHA. This avoids GitHub's paginated PR-files API, which can
  # fail on large PRs, while retaining the same three-path gate.
  # --------------------------------------------------------------------------
  changes:
    name: "changes"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Fetch pull request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Detect dependency changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            pyproject.toml \
            requirements-lock.txt \
            .github/workflows/unit-tests.yml; then
            echo "deps=false" >> "$GITHUB_OUTPUT"
          else
            echo "deps=true" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------
  # The core suite is sharded across parallel jobs, then coverage from every
  # shard is combined in one place so the 90% floor is still enforced against
  # the whole codebase rather than against a fraction of it.
  #
  # TO CHANGE THE SHARD COUNT, edit `matrix.shard` below and nothing else:
  # adding `3` to the list produces three shards. `--of` is derived from
  # `strategy.job-total`, the shard list is computed at run time by
  # scripts/split_tests.py, and tests/test_split_tests.py asserts the matrix and
  # the script agree — so a half-finished change fails CI instead of silently
  # dropping tests.
  # --------------------------------------------------------------------------
  unit-pytest-core-shard:
    name: "unit:pytest:core (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Run every shard even when one fails, so a contributor sees all the
      # failures in the suite rather than only those in the first shard to break.
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Several tests import Lambda handler modules that construct boto3
    # clients at module scope (lambda/api-gateway-proxy/proxy_utils.py,
    # lambda/cross-region-aggregator/handler.py). boto3 requires a region
    # even for imports, so set a default for the whole job. Matches the
    # AWS_DEFAULT_REGION=us-east-1 env from the retired GitLab pipeline.
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      # Reclaim ~20-30 GB before the coverage run. Without this the runner's
      # ~14 GB root volume can fill mid-test, and coverage.py's SQLite flush
      # then raises "database or disk is full", which xdist reports as an
      # INTERNALERROR / KeyError: <WorkerController gwN> — a false failure.
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,mcp]"
      - uses: ./.github/actions/build-lambda-package
      - name: Validate accelerator catalog and NodePools
        # Deterministic and credential-free: the mutable EC2 catalog is checked
        # only by the monthly deps scan, while PRs validate the reviewed catalog,
        # Karpenter families, the exact capacity-history watch list, and the
        # Spot Placement Score instance pools.
        #
        # Runs on one shard only: it is a whole-repo policy check, not part of
        # the sharded suite, so repeating it per shard would only add minutes.
        if: matrix.shard == 1
        run: |
          python scripts/accelerator_catalog.py validate
          pytest tests/test_accelerator_catalog.py tests/test_accelerator_pools.py -q
      - name: Run pytest with coverage
        # -n auto distributes tests across all available CPU cores via
        # pytest-xdist. The production asset publisher now uses per-asset
        # interprocess locks, staging trees, full-tree completion manifests,
        # and atomic rename publication. The session guard still patches
        # StackManager._ensure_lambda_build for the real checkout so tests do
        # not repeat pip/npm installs; tests using a tmp_path exercise the
        # production publisher unchanged.
        #
        # --dist=load (xdist's default) round-robins individual test items
        # across workers. --maxfail=1 matches the previous -x "stop at
        # first failure" behavior — `-x` itself isn't compatible with xdist.
        # Concise output avoids thousands of per-test log writes; report.xml
        # retains individual test names, timings, and failure details.
        #
        # A shard exercises only part of the codebase, so its own coverage
        # percentage is meaningless: the floor is enforced once, against the
        # combined data, by unit:pytest:core.
        #
        # --cov-fail-under=0 is required, not redundant. pytest-cov reads
        # fail_under from [tool.coverage.report] in pyproject and enforces it
        # even when --cov-report= suppresses all reports, so without this every
        # shard fails with "Required test coverage of 90.0% not reached".
        # --cov-report= then leaves just the raw data file to combine.
        #
        # --durations prints the slowest tests (setup+call+teardown) in every
        # shard log, so a test whose wall time balloons is visible in the run
        # that slowed down rather than only by downloading JUnit artifacts.
        # --faulthandler-timeout is a stall alarm, not a budget: shard JUnit
        # history shows otherwise-instant tests (a --help invocation, a fully
        # mocked unit test) intermittently billing 200-500s on a runner while
        # neighbouring workers stream normally, and nothing in the log says
        # where the time went. pytest's built-in faulthandler dumps every
        # thread's stack into the log when a single test exceeds the limit —
        # naming the stall at the moment it happens — without failing the test
        # or adding a dependency (pytest 9 exposes it as the
        # faulthandler_timeout ini option, hence -o). 240s sits above the
        # slowest legitimate work observed: under aws-cdk-lib 2.262 a
        # property-based synth call (~99s) can land on the same worker as
        # the session-scoped Lambda-asset build (~93s, billed as that
        # test's setup), ~191s combined — while still dumping on the
        # multi-minute runner stalls this exists to catch.
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          python scripts/split_tests.py --of "$SHARDS" --summary
          mapfile -t SHARD_FILES < <(python scripts/split_tests.py --shard "$SHARD" --of "$SHARDS")
          echo "shard $SHARD/$SHARDS: ${#SHARD_FILES[@]} test files"
          pytest "${SHARD_FILES[@]}" -q \
            --cov=gco --cov=cli --cov=gco_mcp \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml="report-shard-${SHARD}.xml" \
            --durations=25 --durations-min=5 \
            -o faulthandler_timeout=240 \
            -n auto --maxfail=1
          # Renamed off the leading dot so the upload does not need
          # include-hidden-files, and so each shard's data file is distinct.
          mv .coverage "coverage-data-shard-${SHARD}"
      - name: Upload shard coverage data
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: pytest-coverage-shard-${{ matrix.shard }}
          path: |
            coverage-data-shard-${{ matrix.shard }}
            report-shard-${{ matrix.shard }}.xml
          retention-days: 7

  # --------------------------------------------------------------------------
  # Combines every shard's coverage and enforces the floor. Keeping the display
  # name `unit:pytest:core` means any branch protection rule that already
  # requires this check keeps working, and the check still means "the whole core
  # suite passed and the codebase is at or above the coverage floor".
  # --------------------------------------------------------------------------
  unit-pytest-core:
    name: "unit:pytest:core"
    needs: unit-pytest-core-shard
    # A skipped required check can be treated as non-blocking. Always schedule
    # this stable aggregate check, then fail it explicitly unless every matrix
    # shard succeeded.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every core test shard to pass
        env:
          SHARD_RESULT: ${{ needs.unit-pytest-core-shard.result }}
        run: |
          set -euo pipefail
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Core pytest shard result was ${SHARD_RESULT}; refusing a successful aggregate check."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install coverage (same pin as the shards)
        # This job only runs the `coverage` CLI over the shards' data files
        # and the checked-out source — it never imports the project — so the
        # full editable install the shards need (CDK, boto3, the pytest
        # stack, ...) is dead weight here. Install the coverage pin from
        # requirements-lock.txt: the shards get coverage transitively from
        # pyproject's pytest-cov pin, which is what the lock resolved, so
        # this matches the writer exactly while the lock is current (the
        # unit:lockfile:freshness job keeps it so) and stays within the
        # same data-compatible major even across a lock refresh. If the
        # lockfile ever stops pinning coverage, the grep comes back empty
        # and the install fails loudly instead of drifting.
        run: |
          set -euo pipefail
          pin="$(grep -E '^coverage==' requirements-lock.txt)"
          test -n "$pin"
          pip install "$pin"
      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: pytest-coverage-shard-*
          path: shard-artifacts
          merge-multiple: true
      - name: Combine coverage and enforce the floor
        # `coverage combine` maps each shard's data onto the checkout, which sits
        # at the same absolute path on every runner. fail_under = 90 comes from
        # pyproject's [tool.coverage.report], so the floor lives in one place.
        run: |
          set -euo pipefail
          ls -l shard-artifacts
          coverage combine shard-artifacts/coverage-data-shard-*
          # Write every report before enforcing the floor, so a coverage
          # regression still publishes an HTML report and the badge input to
          # look at. These generators honour fail_under too, so each is given
          # --fail-under=0 to report on its own exit code rather than the
          # threshold; using `|| true` instead would also swallow real errors
          # like a corrupt data file.
          coverage xml --fail-under=0
          coverage json --fail-under=0
          coverage html --fail-under=0
          # Enforce the floor from pyproject's [tool.coverage.report]. This is
          # the last command, so it decides the job result.
          coverage report --show-missing
      - name: Upload coverage artifacts
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: pytest-coverage
          path: |
            htmlcov/
            coverage.xml
            coverage.json
            shard-artifacts/
          retention-days: 7

  unit-bats-shell:
    name: "unit:bats:shell"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install bats + deps (with retry)
        uses: ./.github/actions/apt-install-with-retry
        with:
          packages: bats jq python3 python3-yaml bash
      - name: Run BATS suite
        run: bats tests/BATS/

  unit-recorder-macos-bash32:
    name: "unit:recorder:macos-bash32"
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify recorder syntax and guards with macOS system Bash
        run: |
          set -euo pipefail
          bash_version=$(/bin/bash -c 'printf "%s" "$BASH_VERSION"')
          case "$bash_version" in
            3.2.*) ;;
            *) echo "Expected macOS Bash 3.2, found $bash_version" >&2; exit 1 ;;
          esac
          /bin/bash -n demo/lib_demo.sh demo/record_deploy.sh demo/record_destroy.sh demo/record_autopilot.sh
          /bin/bash -eu <<'BASH32'
          source demo/lib_demo.sh
          GCO_EXPECTED_GIT_SHA=$(git rev-parse HEAD)
          export GCO_EXPECTED_GIT_SHA
          verify_recording_git_state "$PWD"
          temp_dir=$(mktemp -d "${TMPDIR:-/tmp}/gco-recorder.XXXXXX")
          trap 'rm -rf "$temp_dir"' EXIT
          cast_file="$temp_dir/test.cast"
          access_key="AKIA""ABCDEFGHIJKLMNOP"
          printf '{"version":2}\n[0.1,"o","account 123456789012 key %s"]\n' \
            "$access_key" > "$cast_file"
          sanitize_cast "$cast_file"
          verify_cast_sanitized "$cast_file"
          grep -q '000000000000' "$cast_file"
          grep -q 'REDACTED_AWS_ACCESS_KEY_ID' "$cast_file"
          BASH32

  unit-cli-smoke:
    name: "unit:cli:smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install CLI
        run: |
          pip install -e .
      - name: Exercise CLI surface
        run: |
          python -c "from cli import GCOConfig, JobManager, CapacityChecker; print('CLI imports OK')"
          gco --help
          gco jobs --help
          gco capacity --help
          gco stacks --help
          gco costs --help
          gco dag --help
          gco inference --help
          gco autopilot --help

  unit-cli-smoke-windows:
    name: "unit:cli:smoke:windows"
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install CLI with CDK and test dependencies
        run: pip install -e ".[cdk,test]"
      - name: Exercise native Windows imports and asset locks
        shell: pwsh
        run: |
          @'
          import tempfile
          from pathlib import Path

          import app
          import cli.stacks as stacks

          with tempfile.TemporaryDirectory() as temporary_directory:
              build_dir = Path(temporary_directory) / "asset-build"
              with stacks._lambda_asset_lock(build_dir, exclusive=False):
                  pass
              with stacks._lambda_asset_lock(build_dir, exclusive=True):
                  pass
          print("Windows CDK imports and asset locks OK")
          '@ | python -
          gco stacks --help
      - name: Verify native Windows configuration-lock exclusion
        # This item only exercises cli.managed_config/cli.stacks against a
        # temporary cdk.json. Exclude the repository-wide autouse conftest,
        # which prepares every CDK Lambda asset and would make this focused
        # Windows lock test depend on the unrelated Node/npm packaging stack.
        run: >-
          python -m pytest --noconftest -q
          tests/test_managed_config.py::TestEngineWriteMechanics::test_process_update_waits_for_shared_lock

  # End-to-end smoke for `gco autopilot`: the launch plan resolves without
  # Claude Code present, the generated MCP config is valid and matches the
  # companion registry, and the pinned @anthropic-ai/claude-code release
  # actually installs from npm and is then detected. Complements the mocked
  # pytest coverage (tests/test_cli_autopilot.py) with the one thing mocks
  # can't prove — that the pin is installable.
  unit-cli-autopilot:
    name: "unit:cli:autopilot"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Install CLI
        run: |
          pip install -e .
      - name: Resolve the launch plan without Claude Code installed
        run: |
          gco autopilot --help
          gco autopilot --dry-run
          gco -o json autopilot --dry-run > /tmp/autopilot-plan.json
          # Assertions live in the shared autopilot CI contract — the same
          # checks the dev-container step and the boot probe consume, so
          # the expected server set / model / pin are asserted from ONE
          # place (.github/scripts/autopilot_ci_contract.py).
          python3 .github/scripts/autopilot_ci_contract.py \
            verify-plan /tmp/autopilot-plan.json --claude-binary absent
      - name: Validate the generated MCP config
        run: |
          gco autopilot --print-config > /tmp/autopilot-mcp.json
          python3 .github/scripts/autopilot_ci_contract.py \
            verify-config /tmp/autopilot-mcp.json
      - name: Validate feature-flag and resume-flag handling
        run: |
          # Feature flags land on the gco server entry only (the contract's
          # --expect-gco-env also asserts the pair leaks onto no companion).
          gco autopilot -e all-tools --print-config > /tmp/autopilot-flags.json
          python3 .github/scripts/autopilot_ci_contract.py \
            verify-config /tmp/autopilot-flags.json \
            --expect-gco-env GCO_ENABLE_ALL_TOOLS=true
          # Bad inputs fail loudly instead of launching a wrong session.
          if gco autopilot -e bogus-flag --print-config; then
            echo "unknown feature flag was accepted" >&2; exit 1
          fi
          if gco autopilot --mcp-env NOEQUALS --print-config; then
            echo "malformed --mcp-env was accepted" >&2; exit 1
          fi
          if gco autopilot --continue --resume abc --dry-run; then
            echo "--continue with --resume was accepted" >&2; exit 1
          fi
          echo "invalid-input handling OK"
      - name: Validate skills/agents/plugin imports
        run: |
          mkdir -p /tmp/imports/skills/capacity-planner /tmp/imports/agents /tmp/imports/plugin
          printf -- '---\nname: capacity-planner\ndescription: d\n---\nbody\n' \
            > /tmp/imports/skills/capacity-planner/SKILL.md
          printf -- '---\nname: cost-reviewer\ndescription: d\n---\nbody\n' \
            > /tmp/imports/agents/cost-reviewer.md
          gco autopilot --dry-run \
            --skills /tmp/imports/skills \
            --agents /tmp/imports/agents \
            --plugin /tmp/imports/plugin | tee /tmp/imports/dry-run.txt
          grep -q "Imports:" /tmp/imports/dry-run.txt
          grep -q "Plugins:" /tmp/imports/dry-run.txt
          # Typo'd paths fail instead of silently launching without tools.
          if gco autopilot --dry-run --skills /tmp/imports/does-not-exist; then
            echo "missing --skills path was accepted" >&2; exit 1
          fi
          echo "imports handling OK"
      - name: Install the pinned Claude Code release and re-resolve
        # Runs the exact command autopilot itself executes (including the
        # scoped --allow-scripts: npm >= 12 blocks the postinstall that
        # fetches the platform-native binary, leaving a broken shim).
        run: |
          python3 -c 'from cli.autopilot import claude_install_command; import subprocess; subprocess.run(claude_install_command(), check=True)'
          claude --version | grep -qF "$(python3 .github/scripts/autopilot_ci_contract.py pin)"
          gco -o json autopilot --dry-run > /tmp/autopilot-plan-installed.json
          python3 .github/scripts/autopilot_ci_contract.py \
            verify-plan /tmp/autopilot-plan-installed.json --claude-binary present

  unit-cdk-synth:
    name: "unit:cdk:synth"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install locked CDK + Python dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          pip install -e ".[cdk]"
      - uses: ./.github/actions/build-lambda-package
      - name: Verify synth and diff repair the real inference streaming bundle
        run: python .github/scripts/verify_inference_streaming_bundle_freshness.py
      - name: cdk synth
        run: npm exec -- cdk synth --quiet
      - name: Upload cdk.out
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: cdk-synth-output
          path: cdk.out/
          retention-days: 7

  unit-cdk-config-matrix:
    name: "unit:cdk:config-matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: "fake"
      AWS_SECRET_ACCESS_KEY: "fake"
      AWS_DEFAULT_REGION: "us-east-1"
      CDK_DEFAULT_REGION: "us-east-1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install CDK + test dependencies
        run: pip install -e ".[cdk,test]"
      - uses: ./.github/actions/build-lambda-package
      - name: Run config matrix
        # tests/test_cdk_synthesis_matrix.py parametrizes across every
        # entry in tests/_cdk_config_matrix.CONFIGS and runs ``app.synth()``
        # in-process per config — no ``cdk synth`` subprocess, no cdk.json
        # mutation. The Node.js/CDK CLI is no longer required, so the
        # ``npm install -g aws-cdk`` step was dropped alongside the
        # subprocess loop.
        #
        # Runs serially (no ``-n auto``) for the same reason as
        # unit:pytest:core: every parametrized case stages the same
        # ``lambda/kubectl-applier-simple-build`` tree into
        # ``cdk.out/asset.<hash>/`` and CDK's in-process asset-staging
        # cache races under xdist. The bulk of CDK-config parallelism
        # lives in the sibling unit:cdk:nag-compliance job, which fans
        # out one GitHub runner per config.
        run: pytest tests/test_cdk_synthesis_matrix.py -v

  unit-cdk-project-name-scoping:
    name: "unit:cdk:project-name-scoping"
    # Issue #139: two GCO deployments must coexist in the same account+region
    # using a different ``project_name`` alone. This job synthesizes the full
    # app once per ``project_name`` permutation and asserts:
    #   (a) the default ``project_name="gco"`` still renders the exact
    #       pre-#139 physical names — upgrading an existing deployment
    #       replaces no (stateful) resource; and
    #   (b) two deployments with different ``project_name`` values share
    #       ZERO unique physical names (buckets, CFN exports, WAF, secret,
    #       log groups, SSM params, DynamoDB tables, SageMaker domain, EMR
    #       app, Cognito domain), plus every unique name embeds its project
    #       name.
    # It also checks ``ConfigLoader`` rejects malformed ``project_name`` up
    # front, so a bad value fails at synth rather than mid-deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: "fake"
      AWS_SECRET_ACCESS_KEY: "fake"
      AWS_DEFAULT_REGION: "us-east-1"
      CDK_DEFAULT_REGION: "us-east-1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install CDK + test dependencies
        run: pip install -e ".[cdk,test]"
      - uses: ./.github/actions/build-lambda-package
      - name: Verify project_name scoping (#139)
        # Runs serially (no ``-n auto``) for the same reason as
        # unit:cdk:config-matrix — each permutation stages the same
        # lambda/kubectl-applier-simple-build tree into cdk.out/asset.<hash>/
        # and CDK's in-process asset-staging cache races under xdist.
        run: pytest tests/test_project_name_scoping.py -v --junitxml=report-project-name-scoping.xml
      - name: Upload project-name-scoping report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: project-name-scoping-report
          path: report-project-name-scoping.xml
          retention-days: 7

  unit-cdk-nag-compliance-matrix:
    name: "unit:cdk:nag-compliance:list"
    # Emits the NAG_CONFIGS list as a JSON array for the fan-out matrix
    # below. Reading the Python list here (rather than hard-coding config
    # names in YAML) keeps the workflow in lockstep with
    # ``tests/_cdk_config_matrix.NAG_CONFIGS`` — add an entry there and
    # the matrix automatically picks it up on the next run.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, '.')
          from tests._cdk_config_matrix import NAG_CONFIGS
          names = [name for name, _ in NAG_CONFIGS]
          print(f'configs={json.dumps(names)}')
          " >> "$GITHUB_OUTPUT"

  unit-cdk-nag-compliance:
    name: "unit:cdk:nag-compliance (${{ matrix.config }})"
    # Fan out across ``NAG_CONFIGS`` so each configuration synthesizes
    # and runs cdk-nag in its own runner — the per-config work (build
    # global + API gateway + regional(s) + monitoring + optionally
    # analytics, then walk five rule packs across the resource tree)
    # is heavy enough that GitHub's free 4-vCPU arm64 runner beats
    # cramming every config onto a 2-vCPU amd64 runner under xdist.
    #
    # Each matrix cell invokes pytest with ``-k <config_name>`` so it
    # runs exactly the parametrized case matching that config. This is
    # the same hard gate as before against shipping an IAM-wildcard or
    # similar cdk-nag error to a user's ``cdk deploy``: if every matrix
    # cell is green, every configuration the user can pick from cdk.json
    # has been validated against AwsSolutions, HIPAA Security, NIST
    # 800-53 R5, PCI DSS 3.2.1, and Serverless rule packs in the same
    # process that ``app.py`` uses for real deploys.
    needs: unit-cdk-nag-compliance-matrix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.unit-cdk-nag-compliance-matrix.outputs.configs) }}
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"
      - uses: ./.github/actions/build-lambda-package
      - name: Run cdk-nag compliance for ${{ matrix.config }}
        # Select the exact parametrized test case by test ID. The
        # parametrize call in tests/test_nag_compliance.py uses
        # ``ids=[c[0] for c in CONFIGS]``, so the config name *is* the
        # test ID — ``::`` rather than ``-k`` avoids substring
        # collisions (e.g. ``analytics-enabled`` matching both
        # ``analytics-enabled`` and ``analytics-enabled-hyperpod-canvas``).
        run: |
          pytest -v \
            "tests/test_nag_compliance.py::TestCdkNagCompliance::test_no_unsuppressed_findings[${{ matrix.config }}]" \
            --junitxml=report-nag-compliance-${{ matrix.config }}.xml
      - name: Upload nag compliance report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: nag-compliance-report-${{ matrix.config }}
          path: report-nag-compliance-${{ matrix.config }}.xml
          retention-days: 7

  unit-lockfile-freshness:
    name: "unit:lockfile:freshness"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on PRs that don't touch pyproject.toml or the lockfile. The
    # `needs: changes` only applies on pull_request (where the `changes`
    # job itself runs) — on push/dispatch `changes` is skipped and this
    # condition short-circuits to true so the job always runs.
    needs: changes
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.deps == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install pip-tools
        run: |
          pip install pip-tools
      - name: Verify lockfile is up to date
        # Pre-seed the candidate lockfile with the committed one so pip-compile
        # treats the existing pins as the current resolution state. Without
        # this, an unrelated transitive release between a local pip-compile
        # and the CI run would falsely flag drift.
        #
        # ``--all-extras`` pins every optional-dependency group (dev, test,
        # cdk, mcp, typecheck, lint, security, and all five image groups). Without
        # it, only the runtime ``dependencies`` list gets resolved and CI's
        # own toolchain (pytest, pytest-xdist, moto, ruff, mypy, aws-cdk-lib,
        # etc.) installs against live PyPI on every run. That means a
        # transitive bump to pluggy or coverage between PR runs could
        # silently change test behavior. Locking everything keeps every job
        # reproducible against a known pinned tree.
        env:
          # pip-compile invokes pip, which can hit interactive keyring prompts
          # on CI ("Unhandled exception: EOF when reading a line"). Disabling
          # the keyring backend lets pip resolve without touching it.
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          set -euo pipefail
          cp requirements-lock.txt /tmp/requirements-lock-fresh.txt
          pip-compile --all-extras --no-emit-index-url --strip-extras -o /tmp/requirements-lock-fresh.txt pyproject.toml -q
          grep -vE '^\s*#' requirements-lock.txt | grep -v '^gco-cli @ file' > /tmp/lock-no-comments.txt
          grep -vE '^\s*#' /tmp/requirements-lock-fresh.txt | grep -v '^gco-cli @ file' > /tmp/fresh-no-comments.txt
          if ! diff /tmp/lock-no-comments.txt /tmp/fresh-no-comments.txt; then
            echo ""
            echo "ERROR: requirements-lock.txt is stale."
            echo "Regenerate using the Docker workflow documented in CONTRIBUTING.md"
            echo "(Dependency Management → Regenerating the Lockfile)."
            echo "Do not run pip-compile directly on the host — the result depends"
            echo "on your OS and will diverge from the Linux-targeted lockfile CI expects."
            echo "Then commit the updated lockfile."
            exit 1
          fi
          echo "Lockfile is up to date"

  unit-fresh-install:
    name: "unit:fresh-install"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same path-filter gate as unit:lockfile:freshness — the fresh install
    # verifies a cold `pip install -e ".[cdk]"` succeeds and imports the
    # expected modules. Only dependency/packaging changes can break it,
    # and it's the most expensive small job in the workflow (no pip cache
    # by design). Always runs on push to main / workflow_dispatch.
    needs: changes
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.deps == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          # Intentionally no pip cache — this job verifies a cold install.
      - name: Fresh install
        run: |
          pip install -e ".[cdk]"
      - name: Verify imports
        run: |
          python3 -c "import aws_cdk; import cdk_nag; import aws_cdk.aws_eks_v2; print('All CDK imports OK')"
          python3 -c "import click; import boto3; import requests; import yaml; print('All runtime imports OK')"
          python3 -c "from cli.main import cli; print('CLI entry point OK')"
          python3 -c "from gco.stacks.regional_stack import GCORegionalStack; print('Regional stack import OK')"

  unit-workload-imports:
    name: "unit:workload:imports"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install core + inference-monitor image dependencies
        run: |
          pip install -e .
          pip install -e ".[image-inference-monitor]"
      - name: Import health-monitor + manifest-processor
        run: |
          python -c "from gco.services.health_api import app; print('health-monitor OK')"
          python -c "from gco.services.manifest_api import app; print('manifest-processor OK')"
      - name: Import inference-monitor
        run: |
          python -c "from gco.services.inference_monitor import InferenceMonitor; print('inference-monitor OK')"
      - name: Import cost-monitor
        # cost_api pulls in cost_monitor; pyarrow is deliberately absent here
        # (it ships only in the image-cost-monitor group), which proves the
        # lazy Parquet import keeps the module importable without it.
        run: |
          python -c "from gco.services.cost_api import app; print('cost-monitor OK')"
      - name: Detect circular imports via importlib
        # importlib.import_module executes all module-level code including
        # deferred router imports; plain `import` can paper over cycles.
        run: |
          python -c "import importlib; importlib.import_module('gco.services.manifest_api'); print('manifest-api full import OK')"
          python -c "import importlib; importlib.import_module('gco.services.health_api'); print('health-api full import OK')"
          python -c "import importlib; importlib.import_module('gco.services.inference_monitor'); print('inference-monitor full import OK')"
          python -c "import importlib; importlib.import_module('gco.services.cost_api'); print('cost-api full import OK')"
          python -c "from gco.services.api_routes import cost, jobs, manifests, queue, templates, webhooks; print('all api_routes OK')"


  # ----------------------------------------------------------------------
  # unit:mcp:install -- the GCO MCP server installs via the two install
  # forms gco_mcp/README.md documents, run verbatim against this checkout:
  #
  #   1. `uvx --python <min> --from "gco-cli @ <spec>" gco-mcp` — the ad hoc
  #      form every MCP client config executes on launch.
  #   2. `uv tool install --python <min> "gco-cli[cdk] @ <spec>"` — the
  #      deploy-capable PATH-install form (Option 2), including the [cdk]
  #      extra whose larger dependency graph is where resolver conflicts
  #      have historically surfaced.
  #
  # `<min>` is read from pyproject's requires-python at job runtime, the
  # same source the docs-coverage guard pins the README snippets to, so
  # a Python bump cannot leave CI exercising a stale interpreter request.
  # A PEP 508 `file://` direct reference to the checkout stands in for the
  # documented `git+https` release-tag URL — a pull request's code is not
  # on any tag, and the substitution changes only the fetch transport, not
  # the resolver, build, or console-script path under test. The smoke
  # script asserts the gco and gco-mcp console scripts ship from the one
  # gco-cli package, the gco_mcp namespace package keeps the PyPI mcp SDK
  # unshadowed, and the server resolves its OWN bundled gco CLI.
  # ----------------------------------------------------------------------
  unit-mcp-install:
    name: "unit:mcp:install"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Install uv
        run: pip install uv
      - name: Derive the documented --python value from requires-python
        run: |
          set -euo pipefail
          MIN_PY="$(python3 - <<'PY'
          import re, sys, tomllib
          with open("pyproject.toml", "rb") as fh:
              requires = tomllib.load(fh)["project"]["requires-python"]
          match = re.fullmatch(r">=\s*(\d+\.\d+)", requires.strip())
          if not match:
              sys.exit(f"unexpected requires-python shape: {requires!r}")
          print(match.group(1))
          PY
          )"
          echo "MIN_PY=$MIN_PY" >> "$GITHUB_ENV"
          echo "Documented --python value: $MIN_PY"
      - name: "Form 1: ad hoc uvx run launches the MCP server over stdio"
        # Exactly what an MCP client executes from its JSON config, with the
        # checkout substituted for the release-tag URL.
        run: |
          set -euo pipefail
          timeout 300 uvx --python "$MIN_PY" \
            --from "gco-cli @ file://$GITHUB_WORKSPACE" gco-mcp \
            </dev/null >"$RUNNER_TEMP/uvx-mcp.log" 2>&1 || true
          grep -q "Starting MCP server" "$RUNNER_TEMP/uvx-mcp.log" || {
            echo "uvx form failed to start the MCP server; log follows:"
            cat "$RUNNER_TEMP/uvx-mcp.log"
            exit 1
          }
      - name: "Form 2: uv tool install exposes gco + gco-mcp on PATH"
        run: |
          set -euo pipefail
          uv tool install --python "$MIN_PY" "gco-cli[cdk] @ file://$GITHUB_WORKSPACE"
          TOOL_BIN="$(uv tool dir --bin)"
          test -x "$TOOL_BIN/gco"
          test -x "$TOOL_BIN/gco-mcp"
      - name: Installed tool imports and resolves its bundled gco
        run: |
          set -euo pipefail
          "$(uv tool dir)/gco-cli/bin/python" "$GITHUB_WORKSPACE/scripts/mcp_install_smoke.py"
      - name: Installed gco-mcp launches the MCP server over stdio
        run: |
          set -euo pipefail
          TOOL_BIN="$(uv tool dir --bin)"
          timeout 30 "$TOOL_BIN/gco-mcp" </dev/null >"$RUNNER_TEMP/tool-mcp.log" 2>&1 || true
          grep -q "Starting MCP server" "$RUNNER_TEMP/tool-mcp.log" || {
            echo "uv tool install form failed to start the MCP server; log follows:"
            cat "$RUNNER_TEMP/tool-mcp.log"
            exit 1
          }
