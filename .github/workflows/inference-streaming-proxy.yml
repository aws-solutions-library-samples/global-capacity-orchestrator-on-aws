# =============================================================================
# inference-streaming-proxy.yml — Native Node.js tests for Lambda streaming
# =============================================================================

name: Inference Streaming Proxy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-node-inference-streaming-proxy:
    name: "unit:node:inference-streaming-proxy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: lambda/inference-streaming-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "lambda/inference-streaming-proxy/package-lock.json"
      - name: Install and verify the declared npm version
        run: bash ../../.github/scripts/use-pinned-npm.sh package.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      # The floor itself lives in package.json's `test` script (exact 100% for
      # lines, functions, and branches over index.mjs alone), so it is written
      # once and enforced identically here and on a developer's machine. The
      # output is teed to a file — with pipefail so the tee never masks a
      # non-zero node exit — and uploaded below, giving a reviewer the V8
      # per-file table without re-running the job.
      - name: Run native Node.js unit tests at an exact 100% V8 coverage floor
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-coverage.txt
      - name: Upload the V8 coverage output
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: node-inference-streaming-proxy-coverage
          path: lambda/inference-streaming-proxy/node-coverage.txt
          retention-days: 7
          if-no-files-found: error
