# =============================================================================
# security.yml — Security & compliance scans
# =============================================================================
#
# Maps to the "Security" row of the README badge table.
#
# Triggers: push: main, pull_request, workflow_dispatch.
#
# Jobs (alphabetical by display name):
#   - security:bandit:sast               — bandit on gco/, cli/
#   - security:checkov:iac               — checkov against the whole repo
#   - security:codeql:python-code-analysis
#                                        — CodeQL security-and-quality pack on Python
#   - security:gitleaks:secrets          — gitleaks on current files (no git history)
#   - security:kics:iac                  — KICS on cdk.out (needs CDK synth first)
#   - security:pip-audit:deps            — pip-audit on requirements-lock.txt
#   - security:semgrep:sast              — semgrep scan --config auto
#   - security:trivy:filesystem          — trivy fs on the source tree
#   - security:trivy:container-scan      — trivy image on each built image
#                                          (4 service images + helm-installer
#                                          + Dockerfile.dev)
#   - security:trufflehog:secrets        — trufflehog filesystem scan
#
# All scans are strict: if a scan finds issues the job fails. Fix the code,
# don't silence the tool — policy inherited from the retired GitLab pipeline.
#
# =============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-bandit-sast:
    name: "security:bandit:sast"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install security tooling
        run: |
          pip install -e ".[security]"
      - name: Run bandit
        run: |
          bandit -r gco/ cli/ -c pyproject.toml --severity-level medium \
            -f json -o bandit-report.json
      - name: Upload bandit report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  security-pip-audit-deps:
    name: "security:pip-audit:deps"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install pip-audit
        run: |
          pip install pip-audit
      - name: Validate .pip-audit-ignore expirations
        # Every entry in .pip-audit-ignore must carry an `exp:YYYY-MM-DD`
        # marker (per the file's own rules). The script fails the job when:
        #   - any entry's exp: date is on-or-before today, or
        #   - any entry is missing an `exp:` marker entirely.
        # That way a stale suppression can't quietly hide a CVE forever —
        # whoever added it has to come back, re-evaluate, and either remove
        # it or extend the date with fresh rationale (mirroring how we treat
        # .trivyignore today). Logic and tests live in
        # .github/scripts/check_pip_audit_ignore.py +
        # tests/test_pip_audit_ignore_validator.py.
        run: python3 .github/scripts/check_pip_audit_ignore.py .github/config/.pip-audit-ignore
      - name: Run pip-audit
        # First invocation writes the artifact even on failure; the second
        # fails the job when vulnerabilities are present. Mirrors the
        # retired GitLab pipeline.
        #
        # IGNORE_FLAGS expands the project-local .pip-audit-ignore file
        # into repeated `--ignore-vuln ID` flags. pip-audit has no native
        # ignore-file format — this is our convention (same shape as
        # .trivyignore, with expiration dates and rationale). Lines that
        # start with `#` and blank lines are skipped; anything after the
        # first whitespace token (e.g. `exp:YYYY-MM-DD`) is treated as a
        # human comment and dropped before the ID is passed to pip-audit.
        run: |
          set -uo pipefail
          IGNORE_FLAGS=()
          if [ -f .github/config/.pip-audit-ignore ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              IGNORE_FLAGS+=(--ignore-vuln "$id")
            done < <(grep -vE '^[[:space:]]*(#|$)' .github/config/.pip-audit-ignore | awk '{print $1}')
          fi
          pip-audit -r requirements-lock.txt --format json \
            --output pip-audit-report.json --desc \
            "${IGNORE_FLAGS[@]}" || true
          pip-audit -r requirements-lock.txt --desc \
            "${IGNORE_FLAGS[@]}"
      - name: Upload pip-audit report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  security-trivy-filesystem:
    name: "security:trivy:filesystem"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pin in lockstep with TRIVY_VERSION in cve-scan.yml.
      TRIVY_VERSION: "v0.70.0"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Trivy
        uses: ./.github/actions/install-trivy
        with:
          version: "${{ env.TRIVY_VERSION }}"
          github-token: "${{ github.token }}"
      - name: Trivy filesystem scan
        run: |
          set -euo pipefail
          # Table to the job log + JSON to the artifact.
          # --ignorefile points at .trivyignore (dated CVE suppressions).
          trivy fs \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --scanners vuln \
            --skip-version-check \
            --ignorefile .github/config/.trivyignore \
            --format json \
            --output trivy-fs-report.json \
            .
          trivy fs \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --scanners vuln \
            --skip-version-check \
            --ignorefile .github/config/.trivyignore \
            .
      - name: Upload trivy report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          retention-days: 30

  security-trivy-container-scan:
    name: "security:trivy:container-scan"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Rebuild the service images locally and scan each with Trivy. Fills a
    # gap the AWS GitLab runner couldn't handle (docker builds were flaky).
    # We rebuild here rather than passing images between workflows via
    # `workflow_call` — simpler and the build time is modest.
    env:
      TRIVY_VERSION: "v0.70.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: health-monitor
            dockerfile: dockerfiles/health-monitor-dockerfile
          - image: manifest-processor
            dockerfile: dockerfiles/manifest-processor-dockerfile
          - image: inference-monitor
            dockerfile: dockerfiles/inference-monitor-dockerfile
          - image: queue-processor
            dockerfile: dockerfiles/queue-processor-dockerfile
          - image: helm-installer
            dockerfile: lambda/helm-installer/Dockerfile
            context: lambda/helm-installer
          # Dev container — never deployed, but contributors run host-side
          # gco/cdk/kubectl commands inside it. Scanning here means a CVE
          # in the dev image surfaces on the same PR that introduced the
          # bump (rather than waiting for the next weekly cve-scan run).
          - image: dev
            dockerfile: Dockerfile.dev
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.1.0
      - name: Install pinned Trivy
        uses: ./.github/actions/install-trivy
        with:
          version: "${{ env.TRIVY_VERSION }}"
          github-token: "${{ github.token }}"
      - name: Build image
        # Shared GHA layer cache (scope: ${{ matrix.image }}). Same scope
        # is used by the integration:docker:* jobs and the kind E2E build,
        # so each image's layers are built exactly once per commit and
        # reused everywhere.
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:scan
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
      - name: Trivy image scan
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # Scan twice: once in table format so the failure is human-readable
          # in the job log, once in JSON so the artifact upload captures
          # machine-readable output. --scanners=vuln narrows the scan to
          # CVEs (gitleaks + trufflehog cover secrets in their own jobs).
          # --ignorefile points at .trivyignore (dated CVE suppressions).
          trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --skip-version-check \
            --ignorefile .github/config/.trivyignore \
            --format json \
            --output "trivy-${IMAGE}-report.json" \
            "${IMAGE}:scan"
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --skip-version-check \
            --ignorefile .github/config/.trivyignore \
            "${IMAGE}:scan"
      - name: Upload trivy report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: trivy-image-${{ matrix.image }}
          path: trivy-${{ matrix.image }}-report.json
          retention-days: 30

  security-trufflehog-secrets:
    name: "security:trufflehog:secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run TruffleHog
        run: |
          docker run --rm -v "$PWD":/repo \
            trufflesecurity/trufflehog:3.95.2 \
            filesystem /repo --only-verified --fail --json > trufflehog-report.json 2>&1
      - name: Upload trufflehog report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          retention-days: 30

  security-gitleaks-secrets:
    name: "security:gitleaks:secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source . --no-git \
            --config .github/config/.gitleaks.toml \
            --report-format json --report-path gitleaks-report.json
      - name: Upload gitleaks report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  security-semgrep-sast:
    name: "security:semgrep:sast"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.168.0
    steps:
      - uses: actions/checkout@v7
      - name: Run semgrep
        # Suppressed rules live in .github/config/semgrep-excluded-rules.txt;
        # run-semgrep.sh expands them into --exclude-rule flags. shell: sh is
        # set because the semgrep container image is not guaranteed to ship bash.
        shell: sh
        run: sh .github/scripts/run-semgrep.sh
      - name: Upload semgrep report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30

  security-checkov-iac:
    name: "security:checkov:iac"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run checkov
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            bridgecrew/checkov:3.2.524 \
            -d . --config-file .github/config/.checkov.yaml -o json > checkov-report.json
      - name: Upload checkov report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: checkov-report
          path: checkov-report.json
          retention-days: 30

  security-kics-iac:
    name: "security:kics:iac"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install CDK + deps and synthesize
        run: |
          pip install -e ".[cdk]"
          npm install -g aws-cdk
      - uses: ./.github/actions/build-lambda-package
      - name: cdk synth
        run: cdk synth --quiet
      - name: Run KICS
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            checkmarx/kics:v2.1.20 \
            scan -p cdk.out -o . \
            --report-formats json,html \
            --output-name kics-report \
            --config .github/config/.kics.yaml --fail-on high
      - name: Upload KICS report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: kics-report
          path: |
            kics-report.json
            kics-report.html
          retention-days: 30
  security-codeql-python-code-analysis:
    name: "security:codeql:python-code-analysis"
    # CodeQL is strict like every other job in this file: if a query in the
    # security-and-quality pack raises a finding that isn't filtered by
    # .github/codeql/codeql-config.yml, the analyze step fails the job.
    #
    # Why a workflow-file scan (Advanced Setup) rather than GitHub's
    # Default Setup: Default Setup ignores the YAML config file on disk
    # and stores its filters in repo Settings instead. That hides the
    # allow-list / paths-ignore choices from code review and from this
    # file's reviewers. Advanced Setup loads the config via the action's
    # ``config-file`` input so every suppression is pinned in git.
    #
    # To swap back to Default Setup: disable this job (comment it out)
    # and re-enable Default Setup in Settings → Code security → CodeQL.
    # The config file has no effect under Default Setup.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Needed to upload SARIF to the Code Scanning API. Overrides the
      # top-level ``permissions: contents: read`` for this job only.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Pins paths, paths-ignore, and query-filters used by the scan.
          # See the file itself for the rationale behind each filter.
          config-file: ./.github/codeql/codeql-config.yml
      # No build step — the Python extractor reads the source tree
      # directly. The autobuilder is a no-op for Python and has a bug
      # (``NotADirectoryError`` on single-file ``paths:`` entries) so
      # we avoid invoking it.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
