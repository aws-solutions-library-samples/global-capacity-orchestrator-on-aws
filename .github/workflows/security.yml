# =============================================================================
# security.yml — Security & compliance scans
# =============================================================================
#
# Maps to the "Security" row of the README badge table.
#
# Triggers: push: main, pull_request, workflow_dispatch.
#
# Draft PRs run nothing here: every job is gated on
# `pull_request.draft == false`, and `ready_for_review` is in the trigger
# types so the suite fires the moment a PR leaves draft.
#
# Jobs (alphabetical by display name):
#   - security:bandit:sast               — bandit on gco/, cli/ + demo GIF validation
#   - security:checkov:iac               — checkov against the whole repo
#   - security:codeql:javascript-code-analysis
#                                        — CodeQL security-and-quality pack on JavaScript
#   - security:codeql:python-code-analysis
#                                        — CodeQL security-and-quality pack on Python
#   - security:gitleaks:secrets          — gitleaks on current files (no git history)
#   - security:kics:iac                  — KICS on cdk.out (needs CDK synth first)
#   - security:npm-audit:all-packages    — npm audit on every locked npm graph
#   - security:pip-audit:deps            — pip-audit on requirements-lock.txt
#   - security:semgrep:sast              — semgrep scan --config auto
#   - security:trivy:filesystem          — trivy fs on the source tree
#   - security:trivy:container-scan      — trivy image on each built image
#                                          (six service images + two Lambda images
#                                          + Dockerfile.dev)
#   - security:trufflehog:secrets        — trufflehog filesystem scan
#
# Scanner command failures fail their jobs. CodeQL analysis uploads SARIF to
# GitHub Code Scanning; finding-based merge enforcement belongs to repository
# rules/branch protection rather than the analyze action's process exit code.
# Fix findings at their source instead of weakening scanner configuration.
#
# =============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-bandit-sast:
    name: "security:bandit:sast"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install security tooling
        run: |
          pip install -e ".[security]"
      - name: Validate tracked demo GIFs
        # Decode untrusted media only in this ephemeral, read-only job. The
        # script also bounds file size, canvas dimensions, and frame count.
        run: timeout 120s python .github/scripts/validate_demo_gifs.py
      - name: Run bandit
        run: |
          bandit -r gco/ cli/ -c pyproject.toml --severity-level medium \
            -f json -o bandit-report.json
      - name: Upload bandit report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  security-pip-audit-deps:
    name: "security:pip-audit:deps"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install pip-audit
        run: |
          pip install pip-audit
      - name: Validate .pip-audit-ignore expirations
        # Every entry in .pip-audit-ignore must carry an `exp:YYYY-MM-DD`
        # marker (per the file's own rules). The script fails the job when:
        #   - any entry's exp: date is on-or-before today, or
        #   - any entry is missing an `exp:` marker entirely.
        # That way a stale suppression can't quietly hide a CVE forever —
        # whoever added it has to come back, re-evaluate, and either remove
        # it or extend the date with fresh rationale (mirroring how we treat
        # .trivyignore today). Logic and tests live in
        # .github/scripts/check_pip_audit_ignore.py +
        # tests/test_pip_audit_ignore_validator.py.
        run: python3 .github/scripts/check_pip_audit_ignore.py .github/config/.pip-audit-ignore
      - name: Run pip-audit
        # First invocation writes the artifact even on failure; the second
        # fails the job when vulnerabilities are present. Mirrors the
        # retired GitLab pipeline.
        #
        # IGNORE_FLAGS expands the project-local .pip-audit-ignore file
        # into repeated `--ignore-vuln ID` flags. pip-audit has no native
        # ignore-file format — this is our convention (same shape as
        # .trivyignore, with expiration dates and rationale). Lines that
        # start with `#` and blank lines are skipped; anything after the
        # first whitespace token (e.g. `exp:YYYY-MM-DD`) is treated as a
        # human comment and dropped before the ID is passed to pip-audit.
        run: |
          set -uo pipefail
          IGNORE_FLAGS=()
          if [ -f .github/config/.pip-audit-ignore ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              IGNORE_FLAGS+=(--ignore-vuln "$id")
            done < <(grep -vE '^[[:space:]]*(#|$)' .github/config/.pip-audit-ignore | awk '{print $1}')
          fi
          pip-audit -r requirements-lock.txt --format json \
            --output pip-audit-report.json --desc \
            "${IGNORE_FLAGS[@]}" || true
          pip-audit -r requirements-lock.txt --desc \
            "${IGNORE_FLAGS[@]}"
      - name: Upload pip-audit report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  security-npm-audit:
    name: "security:npm-audit:all-packages"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            lambda/inference-streaming-proxy/package-lock.json
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - name: Verify every npm graph is locked and Dependabot-managed
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/lib_dependency_scan.sh
          source .github/scripts/lib_dependency_scan.sh
          problems="$(check_npm_package_management . .github/dependabot.yml)"
          if [ -n "$problems" ]; then
            printf '%s\n' "$problems" >&2
            exit 1
          fi
      - name: Install and audit every locked npm graph
        shell: bash
        env:
          AUDIT_ATTEMPTS: "3"
          AUDIT_RETRY_DELAY: "15"
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/lib_dependency_scan.sh
          source .github/scripts/lib_dependency_scan.sh
          mkdir -p npm-audit-reports
          audit_status=0
          while IFS= read -r package_dir; do
            [ -n "$package_dir" ] || continue
            report_name="${package_dir#./}"
            [ "$report_name" = "." ] && report_name="root"
            report_name="${report_name//\//-}"
            echo "=== Auditing ${package_dir} ==="
            npm ci --prefix "$package_dir" --ignore-scripts --no-audit --no-fund
            # registry.npmjs.org's advisory-bulk endpoint intermittently answers
            # 503 (observed in CI), which npm surfaces as a report shaped
            # {"error": {...}} instead of the real {"vulnerabilities": {...}}
            # document. That is a transient fault on an endpoint we don't
            # control, not a finding, so the fetch itself is retried; a
            # genuine vulnerability report never has this shape and is used
            # on the first attempt.
            attempt=1
            while true; do
              npm audit --prefix "$package_dir" --audit-level=high \
                --json > "npm-audit-reports/${report_name}.json" || true
              is_operational_error=0
              python3 -c "
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          sys.exit(1 if isinstance(data.get('error'), dict) else 0)
          " "npm-audit-reports/${report_name}.json" || is_operational_error=1
              if [ "$is_operational_error" -eq 0 ]; then
                break
              fi
              if [ "$attempt" -ge "$AUDIT_ATTEMPTS" ]; then
                echo "::warning::npm audit for ${package_dir} kept returning an" \
                  "operational error after ${AUDIT_ATTEMPTS} attempt(s); the" \
                  "checker below will fail loudly on the error report."
                break
              fi
              echo "::warning::npm audit for ${package_dir} returned an" \
                "operational error (attempt ${attempt}/${AUDIT_ATTEMPTS});" \
                "retrying in ${AUDIT_RETRY_DELAY}s. Usually a transient" \
                "registry.npmjs.org outage."
              sleep "$AUDIT_RETRY_DELAY"
              attempt=$((attempt + 1))
            done
            if ! python3 .github/scripts/check_npm_audit.py \
              --report "npm-audit-reports/${report_name}.json" \
              --package-dir "$package_dir" \
              --ignore-file .github/config/.npm-audit-ignore; then
              audit_status=1
            fi
            npm audit --prefix "$package_dir" --audit-level=high || true
          done < <(list_npm_package_dirs .)
          exit "$audit_status"
      - name: Upload npm audit reports
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: npm-audit-reports
          path: npm-audit-reports/
          retention-days: 30

  security-trivy-filesystem:
    name: "security:trivy:filesystem"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned Trivy
        # The Trivy pin lives in the composite action's `version` default —
        # one place for security.yml and cve-scan.yml alike.
        uses: ./.github/actions/install-trivy
        with:
          github-token: "${{ github.token }}"
      - name: Trivy filesystem scan
        run: |
          set -euo pipefail
          # Table to the job log + JSON to the artifact.
          # --ignorefile points at .trivyignore (dated CVE suppressions).
          trivy fs \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --scanners vuln \
            --skip-version-check \
            --ignorefile .github/config/.trivyignore \
            --format json \
            --output trivy-fs-report.json \
            .
          trivy fs \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --scanners vuln \
            --skip-version-check \
            --ignorefile .github/config/.trivyignore \
            .
      - name: Upload trivy report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          retention-days: 30

  security-trivy-container-scan:
    name: "security:trivy:container-scan"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Rebuild the service images locally and scan each with Trivy. Fills a
    # gap the AWS GitLab runner couldn't handle (docker builds were flaky).
    # We rebuild here rather than passing images between workflows via
    # `workflow_call` — simpler and the build time is modest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: health-monitor
            dockerfile: dockerfiles/health-monitor-dockerfile
          - image: cost-monitor
            dockerfile: dockerfiles/cost-monitor-dockerfile
          - image: manifest-processor
            dockerfile: dockerfiles/manifest-processor-dockerfile
          - image: inference-monitor
            dockerfile: dockerfiles/inference-monitor-dockerfile
          - image: inference-proxy
            dockerfile: dockerfiles/inference-proxy-dockerfile
          - image: queue-processor
            dockerfile: dockerfiles/queue-processor-dockerfile
          - image: helm-installer
            dockerfile: lambda/helm-installer/Dockerfile
            context: lambda/helm-installer
          - image: tls-certificate-manager
            dockerfile: lambda/tls-certificate-manager/Dockerfile
            context: lambda/tls-certificate-manager
          # Dev container — never deployed, but contributors run host-side
          # gco/cdk/kubectl commands inside it. Scanning here means a CVE
          # in the dev image surfaces on the same PR that introduced the
          # bump (rather than waiting for the next weekly cve-scan run).
          - image: dev
            dockerfile: Dockerfile.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-buildx-with-retry
      - name: Install pinned Trivy
        # Pin lives in the composite action's `version` default.
        uses: ./.github/actions/install-trivy
        with:
          github-token: "${{ github.token }}"
      - name: Build image
        # Shared GHA layer cache (scope: ${{ matrix.image }}). Same scope
        # is used by the integration:docker:* jobs and the kind E2E build,
        # so each image's layers are built exactly once per commit and
        # reused everywhere.
        uses: ./.github/actions/build-image-with-retry
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:scan
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
      - name: Trivy image scan
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # Scan twice: once in table format so the failure is human-readable
          # in the job log, once in JSON so the artifact upload captures
          # machine-readable output. --scanners=vuln narrows the scan to
          # CVEs (gitleaks + trufflehog cover secrets in their own jobs).
          # --ignorefile points at .trivyignore (dated CVE suppressions).
          trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --skip-version-check \
            --ignorefile .github/config/.trivyignore \
            --format json \
            --output "trivy-${IMAGE}-report.json" \
            "${IMAGE}:scan"
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --skip-version-check \
            --ignorefile .github/config/.trivyignore \
            "${IMAGE}:scan"
      - name: Upload trivy report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: trivy-image-${{ matrix.image }}
          path: trivy-${{ matrix.image }}-report.json
          retention-days: 30

  security-trufflehog-secrets:
    name: "security:trufflehog:secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Pre-pull TruffleHog image (with retry)
        # A plain `docker run` pulls implicitly with no retry; pre-pulling
        # keeps a Docker Hub blip from failing the scan before it starts.
        # Keep the tag in lockstep with the run step below.
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: trufflesecurity/trufflehog:3.96.0
      - name: Run TruffleHog
        # --exclude-detectors=lob: Lob's key-verification endpoint began
        # accepting arbitrary strings, so with --only-verified every ordinary
        # identifier in the repo — 1,500+ test function names — comes back
        # Verified:true. Confirmed 2026-08-07 on both 3.95.2 and the 3.96.0
        # bump (latest); re-check on the next version bump and drop the
        # exclusion once upstream's Lob verifier discriminates again.
        #
        # Retry semantics: TruffleHog exits 183 when verified secrets are
        # found under --fail — a real finding, failed immediately and never
        # retried. Any other non-zero exit (verifier network flap, container
        # runtime hiccup) is transient and retried; the uploaded report
        # reflects the final attempt.
        run: |
          set -euo pipefail
          attempts=3
          for i in $(seq 1 "${attempts}"); do
            set +e
            docker run --rm -v "$PWD":/repo \
              trufflesecurity/trufflehog:3.96.0 \
              filesystem /repo --only-verified --fail --exclude-detectors=lob \
              --json > trufflehog-report.json 2>&1
            rc=$?
            set -e
            if [ "${rc}" -eq 0 ]; then
              echo "TruffleHog passed on attempt ${i}/${attempts}."
              exit 0
            fi
            if [ "${rc}" -eq 183 ]; then
              echo "::error::TruffleHog found verified secrets (exit 183)."
              exit 183
            fi
            echo "TruffleHog attempt ${i}/${attempts} failed transiently (exit ${rc})."
            if [ "${i}" -lt "${attempts}" ]; then
              sleep 15
            fi
          done
          echo "::error::TruffleHog did not complete after ${attempts} attempts."
          exit 1
      - name: Upload trufflehog report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          retention-days: 30

  security-gitleaks-secrets:
    name: "security:gitleaks:secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Pre-pull Gitleaks image (with retry)
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: zricethezav/gitleaks:v8.30.1
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source . --no-git \
            --config .github/config/.gitleaks.toml \
            --report-format json --report-path gitleaks-report.json
      - name: Upload gitleaks report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  security-semgrep-sast:
    name: "security:semgrep:sast"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run semgrep
        # Suppressed rules live in .github/config/semgrep-excluded-rules.txt;
        # run-semgrep.sh expands them into --exclude-rule flags. shell: sh is
        # set because the semgrep container image is not guaranteed to ship bash.
        shell: sh
        run: sh .github/scripts/run-semgrep.sh
      - name: Upload semgrep report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30

  security-checkov-iac:
    name: "security:checkov:iac"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Pre-pull Checkov image (with retry)
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: bridgecrew/checkov:3.2.524
      - name: Run checkov
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            bridgecrew/checkov:3.2.524 \
            -d . --config-file .github/config/.checkov.yaml -o json > checkov-report.json
      - name: Upload checkov report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: checkov-report
          path: checkov-report.json
          retention-days: 30

  security-kics-iac:
    name: "security:kics:iac"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install locked CDK + Python dependencies and synthesize
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          pip install -e ".[cdk]"
      - uses: ./.github/actions/build-lambda-package
      - name: cdk synth
        run: npm exec -- cdk synth --quiet
      - name: Pre-pull KICS image (with retry)
        uses: ./.github/actions/docker-pull-with-retry
        with:
          images: checkmarx/kics:v2.1.20
      - name: Run KICS
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            checkmarx/kics:v2.1.20 \
            scan -p cdk.out -o . \
            --report-formats json,html \
            --output-name kics-report \
            --config .github/config/.kics.yaml --fail-on high
      - name: Upload KICS report
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: kics-report
          path: |
            kics-report.json
            kics-report.html
          retention-days: 30
  security-codeql-python-code-analysis:
    name: "security:codeql:python-code-analysis"
    # CodeQL analyzes the configured source and uploads findings to GitHub Code
    # Scanning. A finding does not itself make the analyze process exit non-zero;
    # finding-based merge enforcement belongs to repository rules/settings.
    #
    # Why a workflow-file scan (Advanced Setup) rather than GitHub's
    # Default Setup: Default Setup ignores the YAML config file on disk
    # and stores its filters in repo Settings instead. That hides the
    # allow-list / paths-ignore choices from code review and from this
    # file's reviewers. Advanced Setup loads the config via the action's
    # ``config-file`` input so every suppression is pinned in git.
    #
    # To swap back to Default Setup: disable this job (comment it out)
    # and re-enable Default Setup in Settings → Code security → CodeQL.
    # The config file has no effect under Default Setup.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      # Needed to upload SARIF to the Code Scanning API. Overrides the
      # top-level ``permissions: contents: read`` for this job only.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # Pins paths, paths-ignore, and query-filters used by the scan.
          # See the file itself for the rationale behind each filter.
          config-file: ./.github/codeql/codeql-config.yml
      # No build step — the Python extractor reads the source tree
      # directly. The autobuilder is a no-op for Python and has a bug
      # (``NotADirectoryError`` on single-file ``paths:`` entries) so
      # we avoid invoking it.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  security-codeql-javascript-code-analysis:
    name: "security:codeql:javascript-code-analysis"
    # The streaming Lambda is production JavaScript and needs CodeQL in
    # addition to the repository-wide Semgrep scan. JavaScript extraction is
    # buildless, so the committed source is analyzed without npm lifecycle
    # scripts or synthesized assets.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:javascript-typescript"
