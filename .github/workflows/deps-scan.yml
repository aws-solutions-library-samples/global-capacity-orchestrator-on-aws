# =============================================================================
# deps-scan.yml — Monthly dependency scan
# =============================================================================
#
# Schedule: 09:00 UTC on the 1st of each month. Replaces
# `dependency-scan:monthly` from the retired GitLab pipeline.
#
# Checks for outdated versions of:
#   - Python packages pinned in pyproject.toml, including the exact-pinned
#     [build-system] build backend (resolved by pip inside build isolation,
#     so it is invisible to pip list --outdated)
#   - Docker images referenced from .github/workflows/*, K8s manifests, examples,
#     and Helm chart values in lambda/helm-installer/charts.yaml
#   - Helm chart versions from charts.yaml
#   - EKS add-on versions from gco/stacks/regional_stack.py (requires AWS creds
#     via OIDC; falls back gracefully when no creds are configured)
#   - Aurora PostgreSQL engine versions (AWS creds via OIDC)
#   - ElastiCache Valkey major engine version (AWS creds via OIDC)
#   - EMR Serverless release labels (AWS creds via OIDC)
#   - Bedrock default model ids from cdk.json context.bedrock
#     (mission_default_model_id, capacity_advisor_default_model_id,
#     claude_code_default_model_id, codex_default_model_id,
#     opencode_default_model_id, embedding_model_id)
#     plus context.vector_store.embedding_model_id, each compared against the
#     newest same-family release — inference profiles for the generation
#     keys, EMBEDDING foundation models for the embedding keys (AWS creds
#     via OIDC)
#   - AWS PCS Slurm versions: PCS_SUPPORTED_SLURM_VERSIONS and the managed
#     default in gco/pcs_config.py against the supported/EOL tables of the PCS
#     User Guide (public page, no AWS creds)
#   - AWS PCS node lifecycle script pins in gco/stacks/pcs_cluster.py against
#     the public aws-pcs-repo-<region> bucket, and the AMI families
#     lambda/pcs-lookup/handler.py resolves against the public SSM tree and
#     Amazon's sample AMIs (AWS creds via OIDC)
#   - Accelerator catalog and Karpenter NodePool policy (offline), plus live
#     NVIDIA GPU / AWS Neuron EC2 catalog drift across enabled Regions (OIDC)
#   - Dockerfile.dev ARG pins (NODE_VERSION, NPM_VERSION, CDK_VERSION,
#     KUBECTL_VERSION, AWSCLI_VERSION, DOCKER_VERSION, BUILDX_VERSION,
#     UV_VERSION, SESSION_MANAGER_PLUGIN_VERSION) — public endpoints, no
#     AWS creds needed
#   - GCO Autopilot pins from cli/autopilot.py (CLAUDE_CODE_VERSION,
#     CODEX_VERSION and OPENCODE_VERSION vs their npm latest dist-tags, plus
#     companion MCP server liveness on npm/PyPI) — public endpoints, no AWS
#     creds needed
#   - Pre-commit hook revisions in .pre-commit-config.yaml compared against
#     the latest tag from the upstream Git host (unauthenticated; one call
#     per hook well below the 60 req/h limit)
#   - CDK enum constants in gco/stacks/constants.py compared against the
#     latest aws-cdk-lib (LAMBDA_PYTHON_RUNTIME, LAMBDA_NODEJS_RUNTIME,
#     AURORA_POSTGRES_VERSION)
#   - Latest stable Python release from endoflife.date
#   - CI tooling installed by hand across the workflows (Trivy, actionlint,
#     Helm, kubectl, kubeconform, Calico, Metrics Server, kind + node image) and
#     the digest-pinned runtime AWS CLI image — public endpoints, no AWS creds
#   - Version consistency: pins and package surfaces that must move together
#     (ruff, Python + Node runtimes, npm + CDK CLI, every package.json's
#     lockfile/Dependabot entry, and duplicated *_VERSION workflow env)
#   - Base-image security epochs, suppression expiries, and lockfile freshness
#     (all offline hygiene checks)
#
# If any are outdated, opens (or refreshes) a single rolling GitHub issue with
# the details and mirrors the report into the workflow run's job summary. Once
# a complete scan is clean (no skipped checks), comments on and closes that
# issue. Uses the built-in GITHUB_TOKEN throughout — as a bearer token on the
# scan's own api.github.com release/tag lookups, to stay off the shared
# anonymous rate-limit bucket, and for the issue writes. No long-lived PAT
# needed.
#
# Two jobs, so each credential reaches only the code that needs it. The scan
# job installs latest-PyPI packages and runs the scan with `contents: read`
# plus `id-token: write` (the OIDC role for the AWS-backed reads). The issue
# job holds `issues: write` alone, checks nothing out, and acts on the scan
# job's outputs and uploaded report, so neither the issue-writing token nor
# the AWS credentials ever share a job with the scan's third-party code.
#
# =============================================================================

name: Deps scan

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: "0 9 1 * *"
  workflow_dispatch:

# Scoped per ref so two manual dispatches on different branches don't
# serialize behind one queue. Scheduled runs always carry the default
# branch ref, so their serialization is unchanged.
# cancel-in-progress stays false: never cancel a dependency scan in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Helm/kubectl pins (version + checksum) are derived at runtime from
  # lambda/helm-installer/Dockerfile — the production single source — by the
  # derive step below.
  # All AWS CLI reads are sequential, and adaptive retries absorb transient
  # account-level contention without increasing the monthly request rate.
  AWS_RETRY_MODE: adaptive
  AWS_MAX_ATTEMPTS: "10"
  # Bound every cache restore (setup-python's pip cache, setup-node's npm cache,
  # actions/cache). A segment download that has not finished in this many minutes
  # is abandoned and the job falls back to a fresh install. The default is ten
  # minutes, and @actions/cache leaves that timer running after a download has
  # already *failed*, so a restore GitHub's storage refused ("Egress is over the
  # account limit", 2026-10-30) held the action's process for the full ten
  # minutes and two jobs were cancelled by their timeouts without a test failing.
  # One minute is far above a healthy restore (~120 MB in about a second) and far
  # below any job's timeout. The whole account is in .github/CI.md ("Caches").
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
  deps-scan:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication to AWS
    outputs:
      has_drift: ${{ steps.scan.outputs.has_drift }}
      scan_complete: ${{ steps.scan.outputs.scan_complete }}
    steps:
      - name: Keep temporary files on the work disk
        # /tmp is a quota-limited tmpfs on Ubuntu 26.04 runners; see .github/CI.md.
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: ".nvmrc"
          # No `npm ci` here at all, so the npm cache setup-node restores by default
          # (package.json names npm as the package manager) would download ~90 MB
          # keyed on the root lockfile for nothing this job uses, and a restore
          # GitHub's storage refuses stalls the job (see
          # SEGMENT_DOWNLOAD_TIMEOUT_MINS above).
          package-manager-cache: false
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install system tooling (with retry)
        uses: ./.github/actions/apt-install-with-retry
        with:
          packages: jq skopeo curl
          no-install-recommends: "true"
      - name: Install Python security tooling
        # The AWS-backed checks use the runner image's AWS CLI v2, the major
        # Dockerfile.dev pins. `pip install awscli` would put CLI v1 first on
        # PATH (setup-python's bin directory) and, since awscli pins botocore
        # exactly, move botocore off the project's boto3 pin.
        run: |
          pip install -e ".[security]"
      - name: Install latest aws-cdk-lib (for CDK enum drift check)
        # The CDK-enum section of dependency-scan.sh introspects
        # ``aws_cdk.aws_lambda.Runtime`` (the Python and Node.js managed
        # runtimes) to find the newest enum members shipped by the library,
        # then compares them against the constants pinned in
        # ``gco/stacks/constants.py``. We install the latest release (no
        # version pin) on purpose so the check reflects the absolute latest
        # enums available, even when ``aws-cdk-lib`` itself is also drifting
        # (which is reported separately by the Python-deps section).
        #
        # In a virtualenv of its own, named to the scan by CDK_ENUM_PYTHON:
        # the scan's project install pins aws-cdk-lib exactly, so a latest
        # copy in the scan's environment is downgraded before the enum
        # section reads it. CDK_ENUM_PYTHON is exported before the install,
        # so a failed install (a PyPI blip) leaves the enum check skipped
        # with a one-line note, never reading the pinned library instead;
        # continue-on-error keeps that failure from skipping the scan, and
        # the rest of the surfaces still report drift.
        continue-on-error: true
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/cdk-latest"
          echo "CDK_ENUM_PYTHON=${venv}/bin/python" >> "$GITHUB_ENV"
          python -m venv "$venv"
          "${venv}/bin/pip" install --quiet aws-cdk-lib
      - name: Derive Helm/kubectl pins from the production installer Dockerfile
        # lambda/helm-installer/Dockerfile is the single source for both
        # pins: this loads HELM_VERSION / HELM_SHA256 / KUBECTL_VERSION /
        # KUBECTL_SHA256 from its authenticated RUN lines, so the scan runs
        # the exact binaries the installer Lambda ships and a bump edits one
        # file only.
        run: |
          set -euo pipefail
          source .github/scripts/lib_dependency_scan.sh
          extract_helm_installer_pins lambda/helm-installer/Dockerfile | tr '|' '=' | tee -a "$GITHUB_ENV"
          for pin in HELM_VERSION HELM_SHA256 KUBECTL_VERSION KUBECTL_SHA256; do
            grep -q "^${pin}=" "$GITHUB_ENV"
          done
      - name: Install pinned Helm
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/helm.tar.gz"
          install_dir="${RUNNER_TEMP}/helm-install"
          curl --fail --show-error --location --retry 3 \
            --output "${archive}" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" \
            --strip-components=1 --no-same-owner linux-amd64/helm
          sudo install -m 0755 "${install_dir}/helm" /usr/local/bin/helm
          rm -f "${archive}" "${install_dir}/helm"
          rmdir "${install_dir}"
          helm version --short
      - name: Install pinned kubectl
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/kubectl"
          curl --fail --show-error --location --retry 3 \
            --output "${binary}" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${binary}" | sha256sum -c -
          sudo install -m 0755 "${binary}" /usr/local/bin/kubectl
          rm -f "${binary}"
          kubectl version --client --output=yaml | head -5
      - name: Configure AWS credentials (OIDC)
        if: env.GCO_CI_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        env:
          GCO_CI_ROLE_ARN: ${{ secrets.GCO_CI_ROLE_ARN }}
        with:
          role-to-assume: ${{ secrets.GCO_CI_ROLE_ARN }}
          aws-region: us-east-2
      - name: Run dependency scan
        id: scan
        env:
          WORKFLOWS_DIR: .github/workflows
          # The scan's release/tag lookups for the CI tooling, the pre-commit
          # hooks and the Dockerfile.dev pins all read api.github.com. Sent
          # anonymously they draw from a 60 req/h bucket keyed on the runner's
          # egress IP, which is shared with every other tenant's job on that
          # host — a run can start with the bucket already empty and lose all
          # fifteen GitHub lookups at once while PyPI, npm and the OCI
          # registries succeed (the shape of a partial monthly report). The
          # job's own token moves those reads to the 5 000 req/h per-token
          # bucket; this job's `contents: read` is all it needs, since every
          # repo queried is public. Nothing else in the scan step uses the
          # token, and it cannot write issues: that grant lives in drift-issue.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/dependency-scan.sh
      - name: Upload the machine-readable findings
        # The same findings as JSON, written on every run. The drift issue
        # embeds a copy, but an issue body is capped at 64 KiB and the issue
        # does not exist on a clean run, so the artifact is the durable copy
        # a consumer can read either way.
        if: always() && steps.scan.outcome == 'success'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: dependency-scan-findings
          path: ${{ steps.scan.outputs.findings_path }}
          retention-days: 90
          if-no-files-found: error
      - name: Stage the drift report for the issue job
        # A fixed name, so drift-issue can address the file it downloads.
        if: always() && steps.scan.outcome == 'success' && steps.scan.outputs.has_drift == 'true'
        env:
          REPORT_PATH: ${{ steps.scan.outputs.report_path }}
        run: cp "$REPORT_PATH" "${RUNNER_TEMP}/dependency-drift-report.md"
      - name: Upload the drift report
        if: always() && steps.scan.outcome == 'success' && steps.scan.outputs.has_drift == 'true'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: dependency-drift-report
          path: ${{ runner.temp }}/dependency-drift-report.md
          retention-days: 90
          if-no-files-found: error
      - name: Fail an incomplete dependency scan
        if: >-
          always() &&
          steps.scan.outcome == 'success' &&
          steps.scan.outputs.scan_complete != 'true'
        run: |
          echo "::error::Dependency scan was incomplete; see the job summary and INCOMPLETE log entries."
          exit 1

  drift-issue:
    name: "deps-scan:drift-issue"
    needs: deps-scan
    # always(): an incomplete scan fails the scan job on purpose, and its
    # partial report must still refresh the issue. The outputs are set only
    # when the scan step ran, so a skipped or crashed scan does nothing here.
    if: >-
      always() &&
      (needs.deps-scan.outputs.has_drift == 'true' ||
       (needs.deps-scan.outputs.has_drift == 'false' &&
        needs.deps-scan.outputs.scan_complete == 'true'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Keep temporary files on the work disk
        # /tmp is a quota-limited tmpfs on Ubuntu 26.04 runners; see .github/CI.md.
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Download the drift report
        if: needs.deps-scan.outputs.has_drift == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dependency-drift-report
          path: ${{ runner.temp }}/drift-report
      - name: Open or refresh the drift issue
        if: needs.deps-scan.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          REPORT_PATH: ${{ runner.temp }}/drift-report/dependency-drift-report.md
          SCAN_COMPLETE: ${{ needs.deps-scan.outputs.scan_complete }}
        run: |
          set -euo pipefail
          # Self-provision the labels we use so `gh issue create --label`
          # doesn't fail on a fresh repo where no one has set them up.
          # `gh label create --force` creates-or-updates idempotently.
          gh label create dependencies --color "0366d6" --description "Dependency updates" --force
          gh label create automated    --color "ededed" --description "Opened by an automated workflow" --force

          # Use a stable, date-free title so we keep ONE rolling issue rather
          # than accumulating a fresh one every month. Look for an existing
          # open issue with this exact title carrying both labels: refresh its
          # body (and drop a dated comment) if found, otherwise open it. The
          # jq exact-title match guards against a partial server-side search.
          title="[Automated] Dependency updates available"
          today="$(date -u +%Y-%m-%d)"
          existing="$(gh issue list \
            --state open --label dependencies --label automated --limit 100 \
            --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$REPORT_PATH"
            if [ "$SCAN_COMPLETE" = "true" ]; then
              refresh_message="Refreshed by the scheduled deps-scan on ${today}. The report in the issue body above is now current."
            else
              refresh_message="Refreshed by the scheduled deps-scan on ${today}."
              refresh_message+=" The report is partial because one or more checks were incomplete; see the failed workflow run."
            fi
            gh issue comment "$existing" --body "$refresh_message"
            echo "Refreshed existing issue #${existing}"
          else
            gh issue create \
              --title "$title" \
              --label "dependencies,automated" \
              --body-file "$REPORT_PATH"
          fi
      - name: Close the resolved drift issue
        if: >-
          needs.deps-scan.outputs.has_drift == 'false' &&
          needs.deps-scan.outputs.scan_complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          existing="$(gh issue list \
            --state open --label dependencies --label automated --limit 100 \
            --json number,title,labels \
            --jq 'map(select(
              .title == "[Automated] Dependency updates available"
              and ([.labels[].name] | index("dependencies"))
              and ([.labels[].name] | index("automated"))
            )) | .[0].number // empty')"

          if [ -n "$existing" ]; then
            message="Resolved by the scheduled deps-scan on ${today}: "
            message+="no dependency drift was detected. Closing this rolling issue; "
            message+="a future scan will open a new issue if drift returns."
            gh issue comment "$existing" --body "$message"
            gh issue close "$existing"
            echo "Closed resolved dependency issue #${existing}"
          else
            echo "Complete dependency scan is clean and no matching rolling issue is open."
          fi
