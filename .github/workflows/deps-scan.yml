# =============================================================================
# deps-scan.yml — Monthly dependency scan
# =============================================================================
#
# Schedule: 09:00 UTC on the 1st of each month. Replaces
# `dependency-scan:monthly` from the retired GitLab pipeline.
#
# Checks for outdated versions of:
#   - Python packages pinned in pyproject.toml
#   - Docker images referenced from .github/workflows/*, K8s manifests, examples,
#     and Helm chart values in lambda/helm-installer/charts.yaml
#   - Helm chart versions from charts.yaml
#   - EKS add-on versions from gco/stacks/regional_stack.py (requires AWS creds
#     via OIDC; falls back gracefully when no creds are configured)
#   - Aurora PostgreSQL engine versions (AWS creds via OIDC)
#   - EMR Serverless release labels (AWS creds via OIDC)
#   - Bedrock default model id from gco_mcp/mission/sampling.py compared
#     against the newest system-defined inference profile in the same
#     model family (AWS creds via OIDC)
#   - Dockerfile.dev ARG pins (NODE_MAJOR, NPM_VERSION, CDK_VERSION,
#     KUBECTL_VERSION, AWSCLI_VERSION, DOCKER_VERSION, BUILDX_VERSION) — public endpoints,
#     no AWS creds needed
#   - Pre-commit hook revisions in .pre-commit-config.yaml compared against
#     the latest tag from the upstream Git host (unauthenticated; one call
#     per hook well below the 60 req/h limit)
#   - CDK enum constants in gco/stacks/constants.py compared against the
#     latest aws-cdk-lib (LAMBDA_PYTHON_RUNTIME, LAMBDA_NODEJS_RUNTIME,
#     AURORA_POSTGRES_VERSION)
#   - Latest stable Python release from endoflife.date
#   - CI tooling installed by hand across the workflows (Trivy, Helm, kubectl,
#     kind + node image) — public endpoints, no AWS creds
#   - Version consistency: pins and package surfaces that must move together
#     (ruff, Python + Node runtimes, npm + CDK CLI, every package.json's
#     lockfile/Dependabot entry, and duplicated *_VERSION workflow env)
#   - Base-image security epochs, suppression expiries, and lockfile freshness
#     (all offline hygiene checks)
#
# If any are outdated, opens (or refreshes) a single rolling GitHub issue with
# the details and mirrors the report into the workflow run's job summary. Uses
# the built-in GITHUB_TOKEN with `issues: write` — no long-lived PAT needed.
#
# =============================================================================

name: Deps scan

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: "0 9 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write  # Required for OIDC authentication to AWS

env:
  HELM_VERSION: "v4.2.1"
  KUBECTL_VERSION: "v1.36.2"

jobs:
  deps-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ".nvmrc"
      - name: Install and verify the declared npm version
        run: bash .github/scripts/use-pinned-npm.sh package.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-lock.txt"
      - name: Install system tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq skopeo curl
      - name: Install Python security tooling + AWS CLI
        run: |
          pip install -e ".[security]"
          pip install awscli
      - name: Install latest aws-cdk-lib (for CDK enum drift check)
        # The CDK-enum section of dependency-scan.sh introspects
        # ``aws_cdk.aws_lambda.Runtime`` (Python and Node.js managed runtimes)
        # and ``aws_cdk.aws_rds.AuroraPostgresEngineVersion`` to find the
        # newest enum members shipped by the library, then compares them
        # against the constants pinned in ``gco/stacks/constants.py``.
        # We install ``--upgrade`` (no version pin) on purpose so the
        # check reflects the absolute latest enums available, even when
        # ``aws-cdk-lib`` itself is also drifting (which is reported
        # separately by the Python-deps section). When this step is
        # skipped or fails, the scan logs a one-line note and the rest
        # of the surfaces still report drift.
        run: |
          pip install --upgrade aws-cdk-lib
      - name: Install pinned Helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          rm -rf /tmp/linux-amd64
          helm version --short
      - name: Install pinned kubectl
        run: |
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client --output=yaml | head -5
      - name: Configure AWS credentials (OIDC)
        if: env.GCO_CI_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@6.2.2
        env:
          GCO_CI_ROLE_ARN: ${{ secrets.GCO_CI_ROLE_ARN }}
        with:
          role-to-assume: ${{ secrets.GCO_CI_ROLE_ARN }}
          aws-region: us-east-2
      - name: Run dependency scan
        id: scan
        env:
          WORKFLOWS_DIR: .github/workflows
        run: bash .github/scripts/dependency-scan.sh
      - name: Open or refresh the drift issue
        if: steps.scan.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.scan.outputs.report_path }}
        run: |
          set -euo pipefail
          # Self-provision the labels we use so `gh issue create --label`
          # doesn't fail on a fresh repo where no one has set them up.
          # `gh label create --force` creates-or-updates idempotently.
          gh label create dependencies --color "0366d6" --description "Dependency updates" --force
          gh label create automated    --color "ededed" --description "Opened by an automated workflow" --force

          # Use a stable, date-free title so we keep ONE rolling issue rather
          # than accumulating a fresh one every month. Look for an existing
          # open issue with this exact title carrying both labels: refresh its
          # body (and drop a dated comment) if found, otherwise open it. The
          # jq exact-title match guards against a partial server-side search.
          title="[Automated] Dependency updates available"
          today="$(date -u +%Y-%m-%d)"
          existing="$(gh issue list \
            --state open --label dependencies --label automated --limit 100 \
            --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$REPORT_PATH"
            gh issue comment "$existing" \
              --body "Refreshed by the scheduled deps-scan on ${today}. The report in the issue body above is now current."
            echo "Refreshed existing issue #${existing}"
          else
            gh issue create \
              --title "$title" \
              --label "dependencies,automated" \
              --body-file "$REPORT_PATH"
          fi
