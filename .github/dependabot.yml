# Dependabot scope is GitHub Actions, Docker, repository tooling, the
# deployable Node Lambda, and CI-only Ruby tooling. Python dependencies are
# intentionally NOT tracked here — they are pinned via `requirements-lock.txt`
# with `pip-compile` and reviewed intentionally.
# The monthly `deps-scan` workflow tracks language/runtime drift (including
# Lambda Python and Node.js), while weekly CVE scanning covers locked graphs.
#
# Two batches, split by blast radius:
#
#   * `ci-tooling` (weekly): GitHub Actions, the root npm tooling graph and the
#     CI-only Ruby graph. CI exercises everything in it, so the PR can merge on
#     green.
#   * `runtime` (monthly, on the 1st, the same day the deps-scan issue opens):
#     the inference streaming Lambda's npm graph and every Docker base image.
#     These ship in a deployment, so the PR carries the
#     `live-validation-required` label and is folded into the monthly
#     dependency PR and its one live release validation run
#     (docs/LIVE_RELEASE_VALIDATION.md) instead of merging on green.
#
# Inside each batch Dependabot opens a single PR across its ecosystems
# instead of one per dependency. `main` requires a branch to be up to date
# before it merges and each PR runs the full ~100-check suite, so N separate
# PRs cost N sequential CI runs plus a rebase of every sibling after each
# merge; the batch costs one. Batching also keeps lockstep pins atomic, which
# two contracts require: lint:actions:pinning wants every reference to one
# action repository on one SHA (`github/codeql-action/init` and `/analyze`
# once arrived as #287/#284), and tests/test_python_base_image_consistency.py
# wants one python tag across Dockerfile.dev and the service Dockerfiles (a
# bump used to arrive as one PR for "/" and another for "/dockerfiles"). Split
# across PRs, neither half can pass CI, which is why each ecosystem sits whole
# inside one group.
#
# The trade-off is that one bad update holds back the batch. Hold it back with
# an `ignore` entry here, where the rule stays reviewable; Dependabot re-runs
# as soon as this file changes on main. The `@dependabot ignore <dependency>
# [major|minor] version` comment on the grouped PR does the same job, but it
# closes the PR and stores the rule outside this file, out of reviewers' sight.
#
# Security updates do not wait for this schedule: Dependabot raises them as
# soon as an alert fires. The repository's "Grouped security updates" setting
# (Settings > Advanced Security) batches them into one PR per ecosystem,
# including Python, which this file deliberately leaves out. That setting lives
# outside this file, so a fork has to enable it, along with Dependabot version
# updates; see docs/FORKING.md. A security update to a runtime dependency keeps
# that urgency and merges on its own; it still needs a live run afterwards.

version: 2

multi-ecosystem-groups:
  ci-tooling:
    # Monday morning US Eastern, so the batch and its CI run are ready at the
    # start of the week.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    # Pin the conventional-commit title ("chore(deps): ...") instead of relying
    # on Dependabot inferring it from commit history.
    commit-message:
      prefix: "chore"
      include: "scope"
  runtime:
    # Monthly runs on the 1st, the day deps-scan.yml opens its drift issue, so
    # both land together and go out in one validated dependency PR.
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "live-validation-required"
    commit-message:
      prefix: "chore"
      include: "scope"

# Every entry joins one of the two groups, so each one needs `patterns` ("*" = all of its
# dependencies) and none sets its own `schedule` or `groups`. `cooldown` stays
# per entry: wait a week after a release before proposing it, so a freshly
# published (possibly compromised or broken) version isn't pulled in
# immediately. Satisfies the dependabot-missing-cooldown semgrep rule.
updates:
  # GitHub Actions, for the workflows and the composite actions together.
  #
  # Every third-party ref is pinned to a commit SHA with the tag in a trailing
  # comment; Dependabot rewrites both halves, which is what keeps SHA pinning
  # maintainable rather than a one-time freeze. See .github/CI.md#action-pinning.
  #
  # "/" scans .github/workflows plus an action.yml at the *repository root*
  # only, so the third-party refs inside .github/actions/*/action.yml need the
  # second, globbed directory; only the plural `directories` key supports `*`.
  # tests/test_workflow_security_contract.py asserts this coverage still
  # resolves to every composite action that names a third-party action.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    multi-ecosystem-group: "ci-tooling"
    patterns: ["*"]
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"

  # Locked repository tooling (cdk-dia, markdownlint-cli2, swagger-ui-dist).
  #
  # The AWS CDK CLI lives in this graph too, but it synthesizes and deploys
  # every stack, so it is held out of the weekly batch. Its pin moves together
  # with Dockerfile.dev's CDK_VERSION and the version-consistency check in
  # the monthly deps-scan report, as part of the validated dependency PR.
  #
  # The two npm graphs keep one entry each with a singular `directory`:
  # check_npm_package_management (.github/scripts/lib_dependency_scan.sh, run
  # by security.yml and deps-scan) requires a matching npm `directory:` entry
  # for every repository-owned package.json.
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "ci-tooling"
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "aws-cdk"
    labels:
      - "dependencies"

  # Bundled AWS SDK clients for the inference response-streaming Lambda. The
  # @aws-sdk/* clients version in lockstep from one monorepo release train, so
  # they belong in one PR (ungrouped they once arrived as #286/#285/#283, each
  # invalidating the others' package-lock.json).
  - package-ecosystem: "npm"
    directory: "/lambda/inference-streaming-proxy"
    multi-ecosystem-group: "runtime"
    patterns: ["*"]
    cooldown:
      default-days: 7
    # Repeated on the entry, not only the group: entry labels also reach the
    # security updates Dependabot raises for this graph outside the schedule.
    labels:
      - "dependencies"
      - "live-validation-required"

  # Base images: the service images, the dev container (Dockerfile.dev at the
  # repository root), and both Lambda container images.
  #
  # Only patch releases of the Python bases flow (3.14.8 -> 3.14.9). A new
  # series (3.14 -> 3.15) moves .python-version, pyproject's requires-python,
  # LAMBDA_PYTHON_RUNTIME in gco/stacks/constants.py, and every image together,
  # so it is a deliberate change made from the deps-scan report, not one line
  # in a weekly batch. Without this rule Dependabot also proposes the next
  # series' betas and release candidates (closed by hand as #228, #229, #248,
  # #249). Both Lambda images float on the `lambda/python:3.14` tag, so for
  # them the rule leaves nothing to propose today; they stay listed so a future
  # patch- or digest-pinned base is not invisible.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/dockerfiles"
      - "/lambda/helm-installer"
      - "/lambda/tls-certificate-manager"
    multi-ecosystem-group: "runtime"
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # public.ecr.aws/lambda/python; Dependabot drops the registry host.
      - dependency-name: "lambda/python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
      - "docker"
      - "live-validation-required"

  # CI-only Ruby tooling: bashcov (shell line coverage for the BATS suite) and
  # bundler-audit (advisory scanning for this graph). Nothing shipped depends
  # on Ruby — see the Gemfile header for why the gate needs it.
  #
  # Tracked here rather than left to manual bumps because RubyGems is a real
  # ecosystem Dependabot supports, and the exact pins in Gemfile plus the
  # CHECKSUMS block in Gemfile.lock would otherwise freeze silently.
  - package-ecosystem: "bundler"
    directory: "/"
    multi-ecosystem-group: "ci-tooling"
    patterns: ["*"]
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
