# Dependabot scope is GitHub Actions, Docker, repository tooling, and the
# deployable Node Lambda. Python dependencies are intentionally NOT tracked
# here — they are pinned via `requirements-lock.txt` with `pip-compile` and
# reviewed intentionally.
# The monthly `deps-scan` workflow tracks language/runtime drift (including
# Lambda Python and Node.js), while weekly CVE scanning covers locked graphs.

version: 2
updates:
  # Keep actions (actions/checkout, actions/setup-python, etc.) current.
  # Every third-party ref is pinned to a commit SHA with the tag in a trailing
  # comment; Dependabot rewrites both halves, which is what keeps SHA pinning
  # maintainable rather than a one-time freeze. See .github/CI.md#action-pinning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing an update, so a freshly
    # published (possibly compromised or broken) version isn't pulled in
    # immediately. Satisfies the dependabot-missing-cooldown semgrep rule.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Composite actions under .github/actions/*/action.yml.
  #
  # These need their own block: for the github-actions ecosystem a `directory`
  # of "/" scans .github/workflows plus an action.yml at the *repository root*
  # only, so the third-party refs inside our composite actions
  # (docker/build-push-action, actions/upload-artifact, aquasecurity/setup-trivy,
  # docker/setup-buildx-action) are invisible to the block above and would sit
  # frozen at whatever SHA they were pinned at.
  #
  # `directories` — not `directory` — because only the plural key supports the
  # `*` wildcard. Kept as a separate block so the proven "/" configuration above
  # is untouched, and because the ecosystem requires directory sets not to
  # overlap. tests/test_workflow_security_contract.py asserts this coverage
  # still resolves to every composite action that names a third-party action.
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Locked repository tooling (AWS CDK CLI, cdk-dia, markdownlint-cli2).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"

  # Bundled AWS SDK clients for the inference response-streaming Lambda.
  - package-ecosystem: "npm"
    directory: "/lambda/inference-streaming-proxy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"

  # Service image base layers.
  - package-ecosystem: "docker"
    directory: "/dockerfiles"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # Helm-installer Lambda container base image.
  - package-ecosystem: "docker"
    directory: "/lambda/helm-installer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"

  # Dev container base image (Dockerfile.dev lives at the repo root).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
