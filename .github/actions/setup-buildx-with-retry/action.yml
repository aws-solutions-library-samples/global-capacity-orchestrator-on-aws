name: "Setup Buildx (with retry)"
description: |
  Wraps `docker/setup-buildx-action@v4.2.0` with retry-on-failure.

  Creating a `docker-container` builder pulls the BuildKit image from Docker
  Hub, whose registry and token endpoints intermittently time out on GitHub
  runners. Observed in CI:

      ERROR: Error response from daemon: Head
      "https://registry-1.docker.io/v2/moby/buildkit/manifests/buildx-stable-1":
      Get "https://auth.docker.io/token?...": net/http: request canceled
      (Client.Timeout exceeded while awaiting headers)

  That failed a Trivy container scan before any image was built or scanned —
  a network fault on a public dependency, not a finding. The action has no
  retry of its own, so one blip fails the job.

  Retrying the whole action (rather than pre-pulling a hard-coded BuildKit tag)
  keeps this correct if the pinned buildx version changes the image or tag it
  resolves. Behaviour matches `docker/setup-buildx-action@v4.2.0` on every
  successful path; the only observable difference is on transient failures.

inputs:
  driver-opts:
    description: "Builder driver options (passed straight through)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Buildx (attempt 1 of 3)
      id: try1
      uses: docker/setup-buildx-action@v4.2.0
      continue-on-error: true
      with:
        driver-opts: ${{ inputs.driver-opts }}

    - name: Wait before retry 1
      if: steps.try1.outcome == 'failure'
      shell: bash
      run: sleep 15

    - name: Set up Buildx (attempt 2 of 3)
      id: try2
      if: steps.try1.outcome == 'failure'
      uses: docker/setup-buildx-action@v4.2.0
      continue-on-error: true
      with:
        driver-opts: ${{ inputs.driver-opts }}

    - name: Wait before retry 2
      if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
      shell: bash
      run: sleep 45

    - name: Set up Buildx (attempt 3 of 3 — final)
      if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
      uses: docker/setup-buildx-action@v4.2.0
      with:
        driver-opts: ${{ inputs.driver-opts }}
