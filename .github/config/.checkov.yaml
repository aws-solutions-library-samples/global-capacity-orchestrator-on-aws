# Checkov Configuration
# Security scanning configuration with documented exemptions

# Directories to skip
skip-path:
  - cdk.out
  - .venv
  - lambda/kubectl-applier-simple-build
  - lambda/helm-installer-build
  - htmlcov
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  # Example manifests are documentation/templates, not production code
  - examples

# Frameworks to scan
framework:
  - kubernetes
  - dockerfile

# Compact output
compact: true

# There is deliberately no global `skip-check` list.
#
# Every exemption is an inline `# checkov:skip=<CHECK>:<reason>` comment in the
# file it applies to, so the reason travels with the code and a new file gets
# no free pass. Two Dockerfile checks are exempted this way:
#
# - CKV_DOCKER_2 (HEALTHCHECK): the platform services are Kubernetes
#   Deployments whose liveness/readiness contracts live in their manifests, and
#   the Lambda/dev images are not long-running services. A Docker HEALTHCHECK
#   would be dead metadata in both cases.
# - CKV_DOCKER_3 (USER): claimed only by `Dockerfile.dev` and the
#   helm-installer Lambda image. Every deployed service image sets `USER`, so
#   the check stays live for them — a new service image that forgot to drop
#   root fails this scan.
#
# Kubernetes check skips for third-party GPU components are inline in the
# manifests too (e.g.
# lambda/kubectl-applier-simple/manifests/50-dcgm-exporter.yaml).
